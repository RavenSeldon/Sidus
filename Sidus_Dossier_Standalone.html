eport? How detailed should their reports be? Which reports help only when combined with others? Is it especially useful to monitor the department that decides where resources go?</p>\n<p>That is surprisingly close to the computational core of Sīdus.</p>\n<h2 id=\"the-prerequisite-ideas\">The prerequisite ideas</h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Idea</th>\n<th>High-school version</th>\n<th>Sīdus version</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Representation</strong></td>\n<td>Something stands in for something else. A map represents a city.</td>\n<td>A neural/computational state <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R</mi><annotation encoding=\"application/x-tex\">R</annotation></semantics></math> carries information about some target <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>X</mi><annotation encoding=\"application/x-tex\">X</annotation></semantics></math>.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Internal state</strong></td>\n<td>Something happening <em>inside</em> the system: “memory gate closed,” “camera 2 selected,” “attention pointed left.”</td>\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">C_t</annotation></semantics></math>, a controller/process state. It is not automatically a representation.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Metarepresentation</strong></td>\n<td>A representation <strong>about another representation</strong> or about how that representation was made.</td>\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">M_t</annotation></semantics></math>, potentially about reliability, source, correctness, or the process <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math> generating <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R</mi><annotation encoding=\"application/x-tex\">R</annotation></semantics></math>.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Metacognition</strong></td>\n<td>“Thinking about thinking,” broadly construed.</td>\n<td>Monitoring/evaluating cognition; it may or may not require strict metarepresentation.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Causal test</strong></td>\n<td>Don’t just notice two things occur together. Change one and see whether the other changes.</td>\n<td>Intervene on a message/state while holding appropriate alternatives fixed.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Entropy</strong></td>\n<td>A number for how uncertain you are.</td>\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>X</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">H(X)</annotation></semantics></math>, measured here in bits.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Mutual information</strong></td>\n<td>How much learning one thing reduces uncertainty about another.</td>\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>X</mi><mo>;</mo><mi>Y</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(X;Y)</annotation></semantics></math>. Conditional MI <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>X</mi><mo>;</mo><mi>Y</mi><mo>∣</mo><mi>Z</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(X;Y\\mid Z)</annotation></semantics></math> asks how much <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Y</mi><annotation encoding=\"application/x-tex\">Y</annotation></semantics></math> tells you after you already know <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math>.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Bandwidth / rate</strong></td>\n<td>A communication pipe can transmit only so much.</td>\n<td>Each monitoring channel spends rate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>r</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">r_v</annotation></semantics></math>; several channels may share a budget <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math>.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Optimization</strong></td>\n<td>Given limited resources, find the allocation giving the best outcome.</td>\n<td>Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathbf r^*(C)</annotation></semantics></math>, the rate allocation maximizing measured benefit under a budget.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Baseline</strong></td>\n<td>A simpler explanation you have to beat.</td>\n<td>Entropy alone, source identity, inferability, myopic value of computation, etc.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Generalization</strong></td>\n<td>Does your rule work somewhere you didn’t fit it?</td>\n<td>Held-out conditions, another architecture, eventually another domain.</td>\n</tr>\n</tbody>\n</table>\n<p>The crucial distinction is between <strong>monitoring an internal state</strong> and <strong>representing something about a representation</strong>. A message like “the sensory selector is pointing left” can be useful internal telemetry without being a strict metarepresentation. A message like “my current visual estimate is probably unreliable” is a much stronger candidate.</p>", "plain": "Sīdus in one sentence\n\nSīdus asks whether a mind—or an artificial system—has limited resources for knowing what is happening inside itself, and whether there are predictable rules governing what it monitors, how accurately it monitors it, and how those internal monitoring systems interact.\n\nImagine a huge company with dozens of departments. Each department has internal information the CEO cannot directly see. The company can afford only a few status reports at once. Which departments should report? How detailed should their reports be? Which reports help only when combined with others? Is it especially useful to monitor the department that decides where resources go?\n\nThat is surprisingly close to the computational core of Sīdus.\n\n The prerequisite ideas\n\n| Idea | High-school version | Sīdus version |\n|---|---|---|\n| Representation | Something stands in for something else. A map represents a city. | A neural/computational state (R) carries information about some target (X). |\n| Internal state | Something happening inside the system: “memory gate closed,” “camera 2 selected,” “attention pointed left.” | (Ct), a controller/process state. It is not automatically a representation. |\n| Metarepresentation | A representation about another representation or about how that representation was made. | (Mt), potentially about reliability, source, correctness, or the process (F) generating (R). |\n| Metacognition | “Thinking about thinking,” broadly construed. | Monitoring/evaluating cognition; it may or may not require strict metarepresentation. |\n| Causal test | Don’t just notice two things occur together. Change one and see whether the other changes. | Intervene on a message/state while holding appropriate alternatives fixed. |\n| Entropy | A number for how uncertain you are. | (H(X)), measured here in bits. |\n| Mutual information | How much learning one thing reduces uncertainty about another. | (I(X;Y)). Conditional MI (I(X;Ymid Z)) asks how much (Y) tells you after you already know (Z). |\n| Bandwidth / rate | A communication pipe can transmit only so much. | Each monitoring channel spends rate (rv); several channels may share a budget (C). |\n| Optimization | Given limited resources, find the allocation giving the best outcome. | Find (mathbf r^(C)), the rate allocation maximizing measured benefit under a budget. |\n| Baseline | A simpler explanation you have to beat. | Entropy alone, source identity, inferability, myopic value of computation, etc. |\n| Generalization | Does your rule work somewhere you didn’t fit it? | Held-out conditions, another architecture, eventually another domain. |\n\nThe crucial distinction is between monitoring an internal state and representing something about a representation. A message like “the sensory selector is pointing left” can be useful internal telemetry without being a strict metarepresentation. A message like “my current visual estimate is probably unreliable” is a much stronger candidate."}, {"id": "doc-i", "title": "Document I — Foundations", "html": "<h1 id=\"document-i-foundations\">Document I — Foundations</h1>\n<p>Think of Document I as the <strong>constitution</strong> of Sīdus. It decides what the words mean and what kinds of evidence are strong enough to justify using them.</p>\n<h2 id=\"first-order-representation-versus-metarepresentation\">First-order representation versus metarepresentation</h2>\n<p>Suppose a camera sees a cat. The system builds:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>→</mo><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\nX \\rightarrow R\n</annotation></semantics></math></p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>X</mi><annotation encoding=\"application/x-tex\">X</annotation></semantics></math> is the cat/environment and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R</mi><annotation encoding=\"application/x-tex\">R</annotation></semantics></math> is the system’s representation of it.</p>\n<p>Now suppose another system estimates:</p>\n<blockquote>\n<p>“That cat representation is probably unreliable because the camera is foggy.”</p>\n</blockquote>\n<p>Now we have something closer to:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mo>→</mo><mi>M</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nR \\rightarrow M.\n</annotation></semantics></math></p>\n<p><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math> is not mainly about the cat. It is about <strong>the representation of the cat</strong>.</p>\n<p>Sīdus refuses to call every later layer “meta” just because it comes later. Otherwise any chain</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>→</mo><mi>y</mi><mo>→</mo><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">\nx\\rightarrow y\\rightarrow z\n</annotation></semantics></math></p>\n<p>would make <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z</mi><annotation encoding=\"application/x-tex\">z</annotation></semantics></math> a metarepresentation of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math>, and the term would stop doing useful scientific work.</p>\n<h2 id=\"three-serious-ways-metarepresentation-might-mean-something\">Three serious ways “metarepresentation” might mean something</h2>\n<p><strong>Property representation.</strong> The system represents a property of another representation: “this visual estimate has a 70% chance of being correct.”</p>\n<p><strong>Representational redescription.</strong> Information that was merely <em>in</em> the system is represented again in a form the system can use more explicitly.</p>\n<p><strong>Process representation.</strong> The system represents <strong>how the first-order representation is being generated</strong>: “the process producing this visual estimate is currently in a high-noise regime.”</p>\n<p>Sīdus does not settle that dispute by decree. It asks which definitions survive discriminating experiments.</p>\n<h2 id=\"the-evidence-ladder\">The evidence ladder</h2>\n<p>At the weakest level, a candidate signal <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math> correlates with target <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>T</mi><annotation encoding=\"application/x-tex\">T</annotation></semantics></math>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>Z</mi><mo>;</mo><mi>T</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nI(Z;T)&gt;0.\n</annotation></semantics></math></p>\n<p>That only means knowing <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math> tells us something about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>T</mi><annotation encoding=\"application/x-tex\">T</annotation></semantics></math>. Umbrellas correlate with wet streets too; that does not mean umbrellas represent wet streets.</p>\n<p>So the evidence has to climb: <strong>decodable → conditionally specific → capable of being wrong → changes when its target changes → causally used by a consumer → generalizes beyond one implementation.</strong></p>\n<p>A particularly important idea is <strong>misrepresentation</strong>. If a system can estimate “high confidence” when the first-order answer is actually wrong, then its confidence state has some independence from simply echoing the answer.</p>\n<h2 id=\"what-ecology-means\">What “ecology” means</h2>\n<p>Three modules on a diagram do not make an ecology. The word earns content only if there are reproducible <strong>relations</strong> among independently validated systems: competition, complementarity, substitution, causal dependence, recursive regulation, fidelity dependence, or temporal niches.</p>\n<h2 id=\"the-first-important-calculation-uncertainty\">The first important calculation: uncertainty</h2>\n<p>Suppose <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math> can be in four equally likely states. Then</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><msub><mo>log</mo><mn>2</mn></msub><mn>4</mn><mo>=</mo><mn>2</mn><mrow><mspace width=\"0.333em\"></mspace><mtext mathvariant=\"normal\"> bits</mtext></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nH(C)=\\log_2 4=2\\text{ bits}.\n</annotation></semantics></math></p>\n<p>If ordinary public information <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math> narrows the possibilities from four to two, then</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>1</mn><mrow><mspace width=\"0.333em\"></mspace><mtext mathvariant=\"normal\"> bit</mtext></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nH(C\\mid\\mathcal I)=1\\text{ bit}.\n</annotation></semantics></math></p>\n<p>Sīdus uses normalized residual uncertainty:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mo>=</mo><mfrac><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nu_v=\\frac{H(C_v\\mid\\mathcal I)}{H(C_v)}.\n</annotation></semantics></math></p>\n<p>Here <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mo>=</mo><mn>1</mn><mi>/</mi><mn>2</mn><mo>=</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">u_v=1/2=0.5</annotation></semantics></math>: half of the original uncertainty remains after the coordinator uses everything it normally knows.</p>\n<h2 id=\"rate-spent-is-not-information-delivered\">Rate spent is not information delivered</h2>\n<p>A 100-character message can spend all 100 characters saying almost nothing useful. Sīdus keeps those two things separate:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>≠</mo><msub><mi>m</mi><mi>v</mi></msub></mrow></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{r_v\\neq m_v}\n</annotation></semantics></math></p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>r</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">r_v</annotation></semantics></math> is coding/rate cost and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math> is the additional information actually delivered about the target.</p>\n<p>In the variational construction:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><msub><mi>m</mi><mi>v</mi></msub><mo>+</mo><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v=m_v+\\Delta_v^{\\mathrm{prior}}.\n</annotation></semantics></math></p>\n<p>If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><mn>1.2</mn></mrow><annotation encoding=\"application/x-tex\">r_v=1.2</annotation></semantics></math> bits and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>=</mo><mn>0.8</mn></mrow><annotation encoding=\"application/x-tex\">m_v=0.8</annotation></semantics></math> bits, then <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mo>=</mo><mn>0.4</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}=0.4</annotation></semantics></math> bits of the coding cost is mismatch/inefficiency rather than useful new target information.</p>\n<h2 id=\"the-joint-benefit-surface\">The joint benefit surface</h2>\n<p>For an allocation <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>𝐫</mi><annotation encoding=\"application/x-tex\">\\mathbf r</annotation></semantics></math>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><mn>𝟎</mn><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathcal B(\\mathbf r)=\\mathbb E[J\\mid\\mathbf r]-\\mathbb E[J\\mid\\mathbf 0].\n</annotation></semantics></math></p>\n<p>Plain English: <strong>how much better does the whole system perform when monitoring resources are allocated this way, compared with giving no special monitoring bandwidth at all?</strong></p>\n<p>Then the experimenter can define a benchmark:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>arg</mo><munder><mo>max</mo><mrow><mi>𝐫</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mspace width=\"0.278em\"></mspace><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><mi>C</mi></mrow></munder><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathbf r^*(C)=\\arg\\max_{\\mathbf r\\ge0,\\;\\sum_v r_v\\le C}\\mathcal B(\\mathbf r).\n</annotation></semantics></math></p>\n<p>That means: among all legal ways of dividing total budget <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math>, which allocation gives the best measured outcome? It is an experimenter’s benchmark, not a claim that a brain literally computes an argmax.</p>", "plain": "Document I — Foundations\n\nThink of Document I as the constitution of Sīdus. It decides what the words mean and what kinds of evidence are strong enough to justify using them.\n\n First-order representation versus metarepresentation\n\nSuppose a camera sees a cat. The system builds:\n\n[\nX rightarrow R\n]\n\nwhere (X) is the cat/environment and (R) is the system’s representation of it.\n\nNow suppose another system estimates:\n\n “That cat representation is probably unreliable because the camera is foggy.”\n\nNow we have something closer to:\n\n[\nR rightarrow M.\n]\n\n(M) is not mainly about the cat. It is about the representation of the cat.\n\nSīdus refuses to call every later layer “meta” just because it comes later. Otherwise any chain\n\n[\nxrightarrow yrightarrow z\n]\n\nwould make (z) a metarepresentation of (y), and the term would stop doing useful scientific work.\n\n Three serious ways “metarepresentation” might mean something\n\nProperty representation. The system represents a property of another representation: “this visual estimate has a 70% chance of being correct.”\n\nRepresentational redescription. Information that was merely in the system is represented again in a form the system can use more explicitly.\n\nProcess representation. The system represents how the first-order representation is being generated: “the process producing this visual estimate is currently in a high-noise regime.”\n\nSīdus does not settle that dispute by decree. It asks which definitions survive discriminating experiments.\n\n The evidence ladder\n\nAt the weakest level, a candidate signal (Z) correlates with target (T):\n\n[\nI(Z;T)0.\n]\n\nThat only means knowing (Z) tells us something about (T). Umbrellas correlate with wet streets too; that does not mean umbrellas represent wet streets.\n\nSo the evidence has to climb: decodable → conditionally specific → capable of being wrong → changes when its target changes → causally used by a consumer → generalizes beyond one implementation.\n\nA particularly important idea is misrepresentation. If a system can estimate “high confidence” when the first-order answer is actually wrong, then its confidence state has some independence from simply echoing the answer.\n\n What “ecology” means\n\nThree modules on a diagram do not make an ecology. The word earns content only if there are reproducible relations among independently validated systems: competition, complementarity, substitution, causal dependence, recursive regulation, fidelity dependence, or temporal niches.\n\n The first important calculation: uncertainty\n\nSuppose (C) can be in four equally likely states. Then\n\n[\nH(C)=log2 4=2text{ bits}.\n]\n\nIf ordinary public information (mathcal I) narrows the possibilities from four to two, then\n\n[\nH(Cmidmathcal I)=1text{ bit}.\n]\n\nSīdus uses normalized residual uncertainty:\n\n[\nuv=frac{H(Cvmidmathcal I)}{H(Cv)}.\n]\n\nHere (uv=1/2=0.5): half of the original uncertainty remains after the coordinator uses everything it normally knows.\n\n Rate spent is not information delivered\n\nA 100-character message can spend all 100 characters saying almost nothing useful. Sīdus keeps those two things separate:\n\n[\nboxed{rvneq mv}\n]\n\nwhere (rv) is coding/rate cost and (mv) is the additional information actually delivered about the target.\n\nIn the variational construction:\n\n[\nrv=mv+Deltav^{mathrm{prior}}.\n]\n\nIf (rv=1.2) bits and (mv=0.8) bits, then (Deltav^{mathrm{prior}}=0.4) bits of the coding cost is mismatch/inefficiency rather than useful new target information.\n\n The joint benefit surface\n\nFor an allocation (mathbf r):\n\n[\nmathcal B(mathbf r)=mathbb E[Jmidmathbf r]-mathbb E[Jmidmathbf 0].\n]\n\nPlain English: how much better does the whole system perform when monitoring resources are allocated this way, compared with giving no special monitoring bandwidth at all?\n\nThen the experimenter can define a benchmark:\n\n[\nmathbf r^(C)=argmax{mathbf rge0,;sumv rvle C}mathcal B(mathbf r).\n]\n\nThat means: among all legal ways of dividing total budget (C), which allocation gives the best measured outcome? It is an experimenter’s benchmark, not a claim that a brain literally computes an argmax."}, {"id": "doc-ii", "title": "Document II — Research Programme", "html": "<h1 id=\"document-ii-research-programme\">Document II — Research Programme</h1>\n<p>If Document I is the constitution, Document II is the <strong>research roadmap</strong>. Its rule is simple:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">define</mtext><mo>→</mo><mtext mathvariant=\"normal\">test locally</mtext><mo>→</mo><mtext mathvariant=\"normal\">replicate</mtext><mo>→</mo><mtext mathvariant=\"normal\">only then generalize</mtext><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\text{define} \\rightarrow \\text{test locally} \\rightarrow \\text{replicate} \\rightarrow \\text{only then generalize}.\n</annotation></semantics></math></p>\n<h2 id=\"h1-scarcity\">H1 — Scarcity</h2>\n<p>Several useful internal states have to communicate through a genuinely limited shared channel. If the limit is real, giving more rate to one source should eventually leave less available for others.</p>\n<p>Think of three emergency services sharing one radio channel. Declaring “the radio is limited” is not evidence; the experiment must produce an actual, measurable trade-off.</p>\n<h2 id=\"h2-causal-topology\">H2 — Causal topology</h2>\n<p>Topology means <strong>where something sits in the causal network</strong>. A state that influences five later decisions may be more valuable to monitor than an equally complicated state that influences one trivial calculation.</p>\n<p>Sīdus therefore asks whether downstream reach, bottleneck position, persistence, or causal influence predict monitoring value after simpler explanations are controlled.</p>\n<h2 id=\"h3-monitoring-the-allocator-itself\">H3 — Monitoring the allocator itself</h2>\n<p>Suppose a controller issues a resource command: 70% vision, 20% memory, 10% sound. Noise and competing signals may make the realized allocation different. Monitoring <strong>what allocation actually happened</strong> can help correct the next decision.</p>\n<p>This turns an apparent infinite regress into a temporal feedback problem:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mtext mathvariant=\"normal\">allocate at </mtext><mspace width=\"0.333em\"></mspace></mrow><mi>t</mi><mo>→</mo><mtext mathvariant=\"normal\">monitor realized allocation</mtext><mo>→</mo><mrow><mtext mathvariant=\"normal\">correct at </mtext><mspace width=\"0.333em\"></mspace></mrow><mi>t</mi><mo>+</mo><mn>1</mn><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\text{allocate at }t \\rightarrow \\text{monitor realized allocation} \\rightarrow \\text{correct at }t+1.\n</annotation></semantics></math></p>\n<h2 id=\"the-experimental-ladder\">The experimental ladder</h2>\n<p><strong>E0:</strong> prove the supposed monitoring signal is real and causally used.</p>\n<p><strong>E1:</strong> place several internal-state monitors under scarcity and ask whether they compete predictably.</p>\n<p><strong>E2:</strong> repeat scarcity with stricter, definition-indexed metarepresentations.</p>\n<p><strong>E3:</strong> manipulate causal position.</p>\n<p><strong>E4:</strong> test recursive allocator monitoring.</p>\n<p><strong>E5:</strong> combine two independently validated meta-systems. This is the first point where “metarepresentational ecology” can become an empirical result rather than a programme name.</p>\n<p><strong>E6:</strong> only then translate outward to human cognition, neuroscience, artificial-system introspection, or clinical questions.</p>\n<h2 id=\"why-so-much-prior-art\">Why so much prior art?</h2>\n<p>Much of the mathematics already exists in neighbouring fields: bounded rationality, rational inattention, networked control, value of information, value of computation, constrained communication, precision weighting, and attention/resource models.</p>\n<p>That is not a defect. It tells Sīdus not to claim old mathematics as new. The narrower contribution is the <strong>application of established resource-allocation machinery to internally generated monitoring targets, with construct validity checked first and causal use required rather than mere decodability.</strong></p>\n<h2 id=\"myopic-value-of-computation\">Myopic value of computation</h2>\n<p>Suppose you can spend one unit of thought to answer one question before acting. The <strong>value of computation</strong> is how much you expect the decision to improve if you perform that computation. “Myopic” means looking one step ahead.</p>\n<p>For Sīdus this becomes a strong baseline: if “spend monitoring where one more bit would improve the next decision most” already predicts the allocation, then a richer ecological interaction model has not earned extra explanatory credit.</p>", "plain": "Document II — Research Programme\n\nIf Document I is the constitution, Document II is the research roadmap. Its rule is simple:\n\ndefine→test locally→replicate→only then generalize.\n\nH1 — Scarcity\n\nSeveral useful internal states have to communicate through a genuinely limited shared channel. If the limit is real, giving more rate to one source should eventually leave less available for others.\n\nThink of three emergency services sharing one radio channel. Declaring “the radio is limited” is not evidence; the experiment must produce an actual, measurable trade-off.\n\nH2 — Causal topology\n\nTopology means where something sits in the causal network. A state that influences five later decisions may be more valuable to monitor than an equally complicated state that influences one trivial calculation.\n\nSīdus therefore asks whether downstream reach, bottleneck position, persistence, or causal influence predict monitoring value after simpler explanations are controlled.\n\nH3 — Monitoring the allocator itself\n\nSuppose a controller issues a resource command: 70% vision, 20% memory, 10% sound. Noise and competing signals may make the realized allocation different. Monitoring what allocation actually happened can help correct the next decision.\n\nThis turns an apparent infinite regress into a temporal feedback problem:\n\nallocate at t→monitor realized allocation→correct at t+1.\n\nThe experimental ladder\n\nE0: prove the supposed monitoring signal is real and causally used.\n\nE1: place several internal-state monitors under scarcity and ask whether they compete predictably.\n\nE2: repeat scarcity with stricter, definition-indexed metarepresentations.\n\nE3: manipulate causal position.\n\nE4: test recursive allocator monitoring.\n\nE5: combine two independently validated meta-systems. This is the first point where “metarepresentational ecology” can become an empirical result rather than a programme name.\n\nE6: only then translate outward to human cognition, neuroscience, artificial-system introspection, or clinical questions.\n\nWhy so much prior art?\n\nMuch of the mathematics already exists in neighbouring fields: bounded rationality, rational inattention, networked control, value of information, value of computation, constrained communication, precision weighting, and attention/resource models.\n\nThat is not a defect. It tells Sīdus not to claim old mathematics as new. The narrower contribution is the application of established resource-allocation machinery to internally generated monitoring targets, with construct validity checked first and causal use required rather than mere decodability.\n\nMyopic value of computation\n\nSuppose you can spend one unit of thought to answer one question before acting. The value of computation is how much you expect the decision to improve if you perform that computation. “Myopic” means looking one step ahead.\n\nFor Sīdus this becomes a strong baseline: if “spend monitoring where one more bit would improve the next decision most” already predicts the allocation, then a richer ecological interaction model has not earned extra explanatory credit.\n"}, {"id": "doc-iii", "title": "Document III — The Tractable Horizon", "html": "<h1 id=\"document-iii-the-tractable-horizon\">Document III — The Tractable Horizon</h1>\n<p>Document III asks: <strong>what small piece of this programme can become a good Master’s thesis?</strong></p>\n<p>The answer is E1: internal-state monitoring under a shared information-rate constraint.</p>\n<p>No consciousness claim. No full ecology. No claim that every internal-state message is a strict metarepresentation.</p>\n<p>The project is portable across relevant AI, cognitive-science and computational-neuroscience programmes. Choose a host by methods, supervision and feasible thesis scope; no university or admissions pathway is a scientific premise.</p>\n<h2 id=\"the-artificial-system\">The artificial system</h2>\n<p>Imagine three specialist subsystems with private states:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mn>1</mn></msub><mo>,</mo><msub><mi>C</mi><mn>2</mn></msub><mo>,</mo><msub><mi>C</mi><mn>3</mn></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nC_1,C_2,C_3.\n</annotation></semantics></math></p>\n<p>A coordinating policy <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U</mi><annotation encoding=\"application/x-tex\">U</annotation></semantics></math> has ordinary public information <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math>, but cannot directly inspect those private states. Each specialist can send a compressed message:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>v</mi></msub><mo>→</mo><msub><mi>S</mi><mi>v</mi></msub><mo>→</mo><mi>U</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nC_v\\rightarrow S_v\\rightarrow U.\n</annotation></semantics></math></p>\n<p>All messages share a total budget:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\sum_v r_v\\le C_{\\mathrm{meta}}.\n</annotation></semantics></math></p>\n<p>The experimenter chooses which candidate internal states exist. The agent learns how much communication rate each one receives.</p>\n<h2 id=\"hiddenness\">1. Hiddenness</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mo>=</mo><mfrac><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nu_v=\\frac{H(C_v\\mid\\mathcal I)}{H(C_v)}.\n</annotation></semantics></math></p>\n<p>How much of the private state remains genuinely unknown after the coordinator uses all ordinary information?</p>\n<h2 id=\"causal-relevance\">2. Causal relevance</h2>\n<p>For a small valid corruption probability <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>δ</mi><annotation encoding=\"application/x-tex\">\\delta</annotation></semantics></math>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>c</mi><mi>v</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>δ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><msub><mi>p</mi><mi>v</mi></msub><mo>=</mo><mn>0</mn><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><msub><mi>p</mi><mi>v</mi></msub><mo>=</mo><mi>δ</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mrow><mi>δ</mi></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nc_v(\\delta)=\\frac{\\mathbb E[J\\mid p_v=0]-\\mathbb E[J\\mid p_v=\\delta]}{\\delta}.\n</annotation></semantics></math></p>\n<p>If performance falls quickly as a valid state is corrupted, that state has strong causal relevance to the task. The corruption must stay near states the system could actually encounter; nonsense perturbations do not tell us much.</p>\n<h2 id=\"learnability\">3. Learnability</h2>\n<p>An important state might be hard for an encoder to learn. A slightly less important state might be easy. Measure learnability separately so “the system allocated to this because it mattered” is not confused with “the system allocated to this because it was easier to learn.”</p>\n<h2 id=\"compressibility\">4. Compressibility</h2>\n<p>“Easy to learn” and “easy to communicate compactly” are different. A repetitive novel is easier to compress than a random string even if both are equally easy to read.</p>\n<h2 id=\"rate-spent\">5. Rate spent</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"false\" form=\"postfix\">‖</mo><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v=\\mathbb E\\left[D_{KL}\\left(q(S_v\\mid C_v,\\mathcal I)\\Vert p(S_v\\mid\\mathcal I)\\right)\\right].\n</annotation></semantics></math></p>\n<p>You can read this as a practical coding-cost measure: <strong>how much does access to the private state force the transmitted-message distribution away from what public context alone would predict?</strong></p>\n<h2 id=\"information-delivered\">6. Information delivered</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>=</mo><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nm_v=I(C_v;S_v\\mid\\mathcal I).\n</annotation></semantics></math></p>\n<p>An intuitive identity is:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo>;</mo><mi>S</mi><mo>∣</mo><mi>I</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo>∣</mo><mi>I</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo>∣</mo><mi>I</mi><mo>,</mo><mi>S</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nI(C;S\\mid I)=H(C\\mid I)-H(C\\mid I,S).\n</annotation></semantics></math></p>\n<p>If uncertainty is 1.5 bits before the message and 0.4 after it, the message delivered 1.1 bits of additional target information.</p>\n<h2 id=\"the-thesis-tests\">The thesis tests</h2>\n<p><strong>H1: Is scarcity real?</strong> Tightening the budget should create actual cross-source displacement.</p>\n<p><strong>H2: What predicts allocation?</strong> A measured joint resource model should beat simpler competitors on held-out conditions.</p>\n<p><strong>H3: Are messages causally used?</strong> Selectively scrambling <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">S_v</annotation></semantics></math> should damage the behavior that depends on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math>. If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math> is decodable from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">S_v</annotation></semantics></math> but removing <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">S_v</annotation></semantics></math> changes nothing relevant, the message has not earned the claimed control function.</p>", "plain": "Document III — The Tractable Horizon\n\nDocument III asks: what small piece of this programme can become a good Master’s thesis?\n\nThe answer is E1: internal-state monitoring under a shared information-rate constraint.\n\nNo consciousness claim. No full ecology. No claim that every internal-state message is a strict metarepresentation.\n\nThe project is portable across relevant AI, cognitive-science and computational-neuroscience programmes. Choose a host by methods, supervision and feasible thesis scope; no university or admissions pathway is a scientific premise.\n\nThe artificial system\n\nImagine three specialist subsystems with private states:\n\nC₁, C₂, C₃.\n\nA coordinating policy U has ordinary public information ℐ, but cannot directly inspect those private states. Each specialist can send a compressed message:\n\nC_(v)→S_(v)→U.\n\nAll messages share a total budget:\n\n$$\\sum\\limits_{v}r_{v} \\leq C_{meta}.$$\n\nThe experimenter chooses which candidate internal states exist. The agent learns how much communication rate each one receives.\n\n1. Hiddenness\n\n$$u_{v} = \\frac{H\\left( C_{v} \\mid \\mathcal{I} \\right)}{H\\left( C_{v} \\right)}.$$\n\nHow much of the private state remains genuinely unknown after the coordinator uses all ordinary information?\n\n2. Causal relevance\n\nFor a small valid corruption probability δ:\n\n$$c_{v}(\\delta) = \\frac{{\\mathbb{E}}\\left\\lbrack J \\mid p_{v} = 0 \\right\\rbrack - {\\mathbb{E}}\\left\\lbrack J \\mid p_{v} = \\delta \\right\\rbrack}{\\delta}.$$\n\nIf performance falls quickly as a valid state is corrupted, that state has strong causal relevance to the task. The corruption must stay near states the system could actually encounter; nonsense perturbations do not tell us much.\n\n3. Learnability\n\nAn important state might be hard for an encoder to learn. A slightly less important state might be easy. Measure learnability separately so “the system allocated to this because it mattered” is not confused with “the system allocated to this because it was easier to learn.”\n\n4. Compressibility\n\n“Easy to learn” and “easy to communicate compactly” are different. A repetitive novel is easier to compress than a random string even if both are equally easy to read.\n\n5. Rate spent\n\nr_(v) = 𝔼[D_(KL)(q(S_(v)∣C_(v),ℐ)∥p(S_(v)∣ℐ))].\n\nYou can read this as a practical coding-cost measure: how much does access to the private state force the transmitted-message distribution away from what public context alone would predict?\n\n6. Information delivered\n\nm_(v) = I(C_(v);S_(v)∣ℐ).\n\nAn intuitive identity is:\n\nI(C;S∣I) = H(C∣I) − H(C∣I,S).\n\nIf uncertainty is 1.5 bits before the message and 0.4 after it, the message delivered 1.1 bits of additional target information.\n\nThe thesis tests\n\nH1: Is scarcity real? Tightening the budget should create actual cross-source displacement.\n\nH2: What predicts allocation? A measured joint resource model should beat simpler competitors on held-out conditions.\n\nH3: Are messages causally used? Selectively scrambling S_(v) should damage the behavior that depends on C_(v). If C_(v) is decodable from S_(v) but removing S_(v) changes nothing relevant, the message has not earned the claimed control function.\n"}, {"id": "doc-iv", "title": "Document IV — E0 Protocol", "html": "<h1 id=\"document-iv-e0-construct-validity-protocol\">Document IV — E0 Construct-Validity Protocol</h1>\n<p>Document IV is the <strong>quality-control laboratory before the main experiments begin</strong>.</p>\n<p>Its philosophy is: before asking how several monitoring systems compete, prove that you actually built a monitoring system rather than an arbitrary extra wire.</p>\n<h2 id=\"e0-a-monitoring-substrate-validity\">E0-A — monitoring substrate validity</h2>\n<h3 id=\"gate-a1-is-something-genuinely-hidden-and-useful\">Gate A1 — Is something genuinely hidden and useful?</h3>\n<p>If the coordinator can already infer <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math> from ordinary public information, a special message about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math> solves no informational problem. And a state can be perfectly hidden yet useless. A secret random number is private; monitoring it does not help a decision.</p>\n<p>A1 therefore asks both: does residual uncertainty remain, and would direct access to the hidden state improve relevant behavior?</p>\n<h3 id=\"gate-a2-does-the-message-transmit-anything-new\">Gate A2 — Does the message transmit anything new?</h3>\n<p>Use exact probabilities in a small reference simulator to check hiddenness and message information. Better prediction by a limited decoder can reflect an easier computation rather than new information. Validate estimators and the complete gate evaluator before choosing pilot thresholds; matched decoder classes alone do not prevent false positives.</p>\n<h3 id=\"gate-a3-does-the-consumer-actually-use-the-message\">Gate A3 — Does the consumer actually use the message?</h3>\n<p>Intervene on the message with an <strong>on-support</strong> alternative—a message the network could legitimately have encountered with the other consumer inputs held fixed. Then ask whether the predicted downstream decision changes while unrelated channels stay intact in the proximal window.</p>\n<p>Decodability is not enough. A signal can contain information that the agent never uses.</p>\n<h3 id=\"gate-a4-does-the-channel-become-less-valuable-when-the-secret-becomes-public\">Gate A4 — Does the channel become less valuable when the “secret” becomes public?</h3>\n<p>Make the task-relevant information supplied by the message public. Revealing some unrelated part of the private state need not reduce message information or usefulness. Establish the predicted decline in the exact reference before testing the learned system.</p>\n<p>Measure incremental information, achievable message benefit and the existing consumer's dependence separately. Specify decline thresholds before confirmation and report uncertainty. Full observability remains an information/performance endpoint; if no conditionally reachable alternative state exists, its intervention is not applicable, not a zero effect or a pass.</p>\n<h2 id=\"cross-source-leakage\">Cross-source leakage</h2>\n<p>If Encoder 1 is only supposed to see <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mn>1</mn></msub><annotation encoding=\"application/x-tex\">C_1</annotation></semantics></math>, a coding mistake that lets it inspect <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mn>2</mn></msub><annotation encoding=\"application/x-tex\">C_2</annotation></semantics></math> can manufacture fake “ecological” structure. The strongest diagnostic conditions on everything encoder <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>v</mi><annotation encoding=\"application/x-tex\">v</annotation></semantics></math> is legitimately entitled to see:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>u</mi><mo>≠</mo><mi>v</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nI(C_u;S_v\\mid C_v,\\mathcal I),\\qquad u\\neq v.\n</annotation></semantics></math></p>\n<p>Under the intended wiring this should vanish absent another forbidden path. Better still: enforce the access restriction directly in the architecture and use the information statistic as a manipulation check.</p>\n<h2 id=\"e0-b-three-definitions-one-experimental-arena\">E0-B — three definitions, one experimental arena</h2>\n<p>Rather than forcing all theories of metarepresentation into one pass/fail box, E0-B is definition-indexed:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>E</mi><mn>0</mn><mspace width=\"-0.167em\"></mspace><mspace width=\"-0.167em\"></mspace><mo>−</mo><mspace width=\"-0.167em\"></mspace><msub><mi>B</mi><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">a</mi></mrow></msub><mo>,</mo><mspace width=\"0.278em\"></mspace><mi>E</mi><mn>0</mn><mspace width=\"-0.167em\"></mspace><mspace width=\"-0.167em\"></mspace><mo>−</mo><mspace width=\"-0.167em\"></mspace><msub><mi>B</mi><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">R</mi></mrow></msub><mo>,</mo><mspace width=\"0.278em\"></mspace><mi>E</mi><mn>0</mn><mspace width=\"-0.167em\"></mspace><mspace width=\"-0.167em\"></mspace><mo>−</mo><mspace width=\"-0.167em\"></mspace><msub><mi>B</mi><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\left(E0\\!\\! -\\! B_{\\mathrm{Shea}},\\;E0\\!\\! -\\! B_{\\mathrm{RR}},\\;E0\\!\\! -\\! B_{\\mathrm{Process}}\\right).\n</annotation></semantics></math></p>\n<p>The same architectures, manipulations, and evidence tiers can yield a vector such as:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>,</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n(1,0,1).\n</annotation></semantics></math></p>\n<p>That is not an embarrassment. It means the umbrella term was hiding distinctions. The surviving result should be named at the level actually supported: <strong>property monitoring</strong>, <strong>representational redescription</strong>, <strong>process representation</strong>, or whichever criterion survives.</p>\n<p>Each index still needs a distinct executable rule before confirmation. Redescription concerns accessibility to a bounded consumer, with explicit redescription and feature-transformation controls; it need not add Shannon information beyond its complete inputs. Report pass, fail or inconclusive only after those rules are validated.</p>\n<h2 id=\"why-misrepresentation-matters\">Why misrepresentation matters</h2>\n<p>E0-B does not pass merely because <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math> predicts a hidden process variable. The candidate must survive harder tests: hold the external target fixed while the representational process changes; allow the meta-state to be wrong; perturb the target process; perturb <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math> while preserving the first-order representation; and show appropriate causal use.</p>\n<p>The evidence ladder is:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">decodable</mtext><mo>&lt;</mo><mtext mathvariant=\"normal\">conditionally specific</mtext><mo>&lt;</mo><mtext mathvariant=\"normal\">misrepresentable</mtext><mo>&lt;</mo><mtext mathvariant=\"normal\">target-dependent</mtext><mo>&lt;</mo><mtext mathvariant=\"normal\">causally used</mtext><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\text{decodable}&lt;\\text{conditionally specific}&lt;\\text{misrepresentable}&lt;\\text{target-dependent}&lt;\\text{causally used}.\n</annotation></semantics></math></p>", "plain": "Document IV — E0 Construct-Validity Protocol\n\nDocument IV is the quality-control laboratory before the main experiments begin.\n\nIts philosophy is: before asking how several monitoring systems compete, prove that you actually built a monitoring system rather than an arbitrary extra wire.\n\nE0-A — monitoring substrate validity\n\nGate A1 — Is something genuinely hidden and useful?\n\nIf the coordinator can already infer C from ordinary public information, a special message about C solves no informational problem. And a state can be perfectly hidden yet useless. A secret random number is private; monitoring it does not help a decision.\n\nA1 therefore asks both: does residual uncertainty remain, and would direct access to the hidden state improve relevant behavior?\n\nGate A2 — Does the message transmit anything new?\n\nUse exact probabilities in a small reference simulator to check hiddenness and message information. Better prediction by a limited decoder can reflect an easier computation rather than new information. Validate estimators and the complete gate evaluator before choosing pilot thresholds; matched decoder classes alone do not prevent false positives.\n\nGate A3 — Does the consumer actually use the message?\n\nIntervene on the message with an on-support alternative—a message the network could legitimately have encountered with the other consumer inputs held fixed. Then ask whether the predicted downstream decision changes while unrelated channels stay intact in the proximal window.\n\nDecodability is not enough. A signal can contain information that the agent never uses.\n\nGate A4 — Does the channel become less valuable when the “secret” becomes public?\n\nMake the task-relevant information supplied by the message public. Revealing some unrelated part of the private state need not reduce message information or usefulness. Establish the predicted decline in the exact reference before testing the learned system.\n\nMeasure incremental information, achievable message benefit and the existing consumer's dependence separately. Specify decline thresholds before confirmation and report uncertainty. Full observability remains an information/performance endpoint; if no conditionally reachable alternative state exists, its intervention is not applicable, not a zero effect or a pass.\n\nCross-source leakage\n\nIf Encoder 1 is only supposed to see C₁, a coding mistake that lets it inspect C₂ can manufacture fake “ecological” structure. The strongest diagnostic conditions on everything encoder v is legitimately entitled to see:\n\nI(C_(u);S_(v)∣C_(v),ℐ),   u ≠ v.\n\nUnder the intended wiring this should vanish absent another forbidden path. Better still: enforce the access restriction directly in the architecture and use the information statistic as a manipulation check.\n\nE0-B — three definitions, one experimental arena\n\nRather than forcing all theories of metarepresentation into one pass/fail box, E0-B is definition-indexed:\n\n(E0  − B_(Shea), E0  − B_(RR), E0  − B_(Process)).\n\nThe same architectures, manipulations, and evidence tiers can yield a vector such as:\n\n(1,0,1).\n\nThat is not an embarrassment. It means the umbrella term was hiding distinctions. The surviving result should be named at the level actually supported: property monitoring, representational redescription, process representation, or whichever criterion survives.\n\nEach index still needs a distinct executable rule before confirmation. Redescription concerns accessibility to a bounded consumer, with explicit redescription and feature-transformation controls; it need not add Shannon information beyond its complete inputs. Report pass, fail or inconclusive only after those rules are validated.\n\nWhy misrepresentation matters\n\nE0-B does not pass merely because M predicts a hidden process variable. The candidate must survive harder tests: hold the external target fixed while the representational process changes; allow the meta-state to be wrong; perturb the target process; perturb M while preserving the first-order representation; and show appropriate causal use.\n\nThe evidence ladder is:\n\ndecodable < conditionally specific < misrepresentable < target-dependent < causally used.\n"}, {"id": "equations", "title": "Equation lab", "html": "<h1 id=\"equation-lab\">Equation lab</h1>\n<p>The notation looks harder than the underlying questions. Most of the core equations answer one of five ordinary-language questions.</p>\n<h2 id=\"how-much-uncertainty-remains\">1. How much uncertainty remains?</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mo>=</mo><mfrac><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nu_v=\\frac{H(C_v\\mid\\mathcal I)}{H(C_v)}.\n</annotation></semantics></math></p>\n<p><strong>Question:</strong> after the coordinator uses ordinary information, what fraction of its original uncertainty about the private state is still unresolved?</p>\n<h2 id=\"how-much-new-information-did-the-message-deliver\">2. How much new information did the message deliver?</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>=</mo><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo>,</mo><msub><mi>S</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nm_v=I(C_v;S_v\\mid\\mathcal I)=H(C_v\\mid\\mathcal I)-H(C_v\\mid\\mathcal I,S_v).\n</annotation></semantics></math></p>\n<p><strong>Question:</strong> how much uncertainty disappears because the special message arrived?</p>\n<h2 id=\"how-much-coding-cost-was-spent\">3. How much coding cost was spent?</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><mi>𝔼</mi><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"false\" form=\"postfix\">‖</mo><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v=\\mathbb E D_{KL}\\left(q(S_v\\mid C_v,\\mathcal I)\\Vert p(S_v\\mid\\mathcal I)\\right).\n</annotation></semantics></math></p>\n<p><strong>Question:</strong> how strongly does private-state access change what message the encoder has to send, relative to what public context alone predicts?</p>\n<h2 id=\"how-much-of-that-cost-was-useful-target-information\">4. How much of that cost was useful target information?</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><msub><mi>m</mi><mi>v</mi></msub><mo>+</mo><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v=m_v+\\Delta_v^{\\mathrm{prior}}.\n</annotation></semantics></math></p>\n<p><strong>Question:</strong> of the rate we spent, how much was actually new information about the target and how much was mismatch/inefficiency in the coding distribution?</p>\n<h2 id=\"how-should-a-fixed-total-budget-be-divided\">5. How should a fixed total budget be divided?</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>arg</mo><munder><mo>max</mo><mrow><mi>𝐫</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mspace width=\"0.278em\"></mspace><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><mi>C</mi></mrow></munder><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathbf r^*(C)=\\arg\\max_{\\mathbf r\\ge0,\\;\\sum_vr_v\\le C}\\mathcal B(\\mathbf r).\n</annotation></semantics></math></p>\n<p><strong>Question:</strong> among all legal ways to divide the budget, which allocation gives the best measured outcome?</p>\n<p>Use the interactive instruments below the text to change the numbers and watch these quantities move.</p>", "plain": "Equation lab\n\nThe notation looks harder than the underlying questions. Most of the core equations answer one of five ordinary-language questions.\n\n 1. How much uncertainty remains?\n\n[\nuv=frac{H(Cvmidmathcal I)}{H(Cv)}.\n]\n\nQuestion: after the coordinator uses ordinary information, what fraction of its original uncertainty about the private state is still unresolved?\n\n 2. How much new information did the message deliver?\n\n[\nmv=I(Cv;Svmidmathcal I)=H(Cvmidmathcal I)-H(Cvmidmathcal I,Sv).\n]\n\nQuestion: how much uncertainty disappears because the special message arrived?\n\n 3. How much coding cost was spent?\n\n[\nrv=mathbb E D{KL}left(q(Svmid Cv,mathcal I)Vert p(Svmidmathcal I)right).\n]\n\nQuestion: how strongly does private-state access change what message the encoder has to send, relative to what public context alone predicts?\n\n 4. How much of that cost was useful target information?\n\n[\nrv=mv+Deltav^{mathrm{prior}}.\n]\n\nQuestion: of the rate we spent, how much was actually new information about the target and how much was mismatch/inefficiency in the coding distribution?\n\n 5. How should a fixed total budget be divided?\n\n[\nmathbf r^(C)=argmax{mathbf rge0,;sumvrvle C}mathcal B(mathbf r).\n]\n\nQuestion: among all legal ways to divide the budget, which allocation gives the best measured outcome?\n\nUse the interactive instruments below the text to change the numbers and watch these quantities move."}]};

</script><script>
window.SIDUS_ATLAS=[{"id": "constructs", "title": "Two different targets", "subtitle": "Internal-state monitoring is not automatically metarepresentation", "svg": "<svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"Internal state model versus metarepresentation\">\n<g class=\"etched\">\n<circle cx=\"120\" cy=\"120\" r=\"44\"/><text x=\"120\" y=\"127\">C</text><path d=\"M165 120 H300\"/><polygon points=\"300,120 284,112 284,128\"/><circle cx=\"360\" cy=\"120\" r=\"44\"/><text x=\"360\" y=\"127\">S</text><text class=\"label\" x=\"240\" y=\"88\">internal-state model</text>\n<circle cx=\"120\" cy=\"310\" r=\"44\"/><text x=\"120\" y=\"317\">X</text><path d=\"M165 310 H300\"/><polygon points=\"300,310 284,302 284,318\"/><circle cx=\"360\" cy=\"310\" r=\"44\"/><text x=\"360\" y=\"317\">R</text><path d=\"M405 310 H540\"/><polygon points=\"540,310 524,302 524,318\"/><circle cx=\"600\" cy=\"310\" r=\"44\"/><text x=\"600\" y=\"317\">M</text><text class=\"label\" x=\"478\" y=\"278\">property / process model</text>\n<path class=\"thin\" d=\"M680 70 C770 140 770 300 680 370\"/><path class=\"thin\" d=\"M705 92 L760 65 M724 126 L790 114 M736 160 L812 162 M739 198 L824 214 M733 238 L804 265 M718 278 L780 316 M695 322 L747 359\"/>\n</g></svg>"}, {"id": "seam", "title": "The information seam", "subtitle": "Public context, private state, message, consumer", "svg": "<svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"Information seam architecture\">\n<g class=\"etched\"><rect x=\"72\" y=\"80\" width=\"180\" height=\"94\" rx=\"8\"/><text x=\"162\" y=\"122\">ℐ</text><text class=\"label\" x=\"162\" y=\"150\">public information</text>\n<rect x=\"72\" y=\"258\" width=\"180\" height=\"94\" rx=\"8\"/><text x=\"162\" y=\"300\">Cᵥ</text><text class=\"label\" x=\"162\" y=\"328\">private state</text>\n<path d=\"M252 127 H405\"/><path d=\"M252 305 C340 305 348 230 405 230\"/><rect x=\"405\" y=\"177\" width=\"155\" height=\"106\" rx=\"53\"/><text x=\"482\" y=\"221\">Eᵥ</text><text class=\"label\" x=\"482\" y=\"252\">encoder</text>\n<path d=\"M560 230 H680\"/><polygon points=\"680,230 663,222 663,238\"/><circle cx=\"726\" cy=\"230\" r=\"46\"/><text x=\"726\" y=\"237\">Sᵥ</text><path d=\"M772 230 H850\"/><text class=\"label\" x=\"811\" y=\"206\">to U</text>\n<path class=\"thin dash\" d=\"M330 40 V390\"/><text class=\"micro\" x=\"345\" y=\"56\">restricted access boundary</text></g></svg>"}, {"id": "rate-info", "title": "Rate spent ≠ information delivered", "subtitle": "A channel can spend capacity without delivering equally much target information", "svg": "<svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"Rate information decomposition\">\n<g class=\"etched\"><circle cx=\"250\" cy=\"215\" r=\"110\"/><text class=\"big\" x=\"250\" y=\"205\">rᵥ</text><text class=\"label\" x=\"250\" y=\"240\">rate spent</text>\n<path d=\"M366 215 H530\"/><polygon points=\"530,215 512,207 512,223\"/><circle cx=\"650\" cy=\"150\" r=\"78\"/><text class=\"big\" x=\"650\" y=\"160\">mᵥ</text><circle cx=\"650\" cy=\"305\" r=\"78\"/><text class=\"big\" x=\"650\" y=\"315\">Δ</text><text class=\"label\" x=\"450\" y=\"184\">decomposes into</text><text class=\"micro\" x=\"650\" y=\"248\">useful target information</text><text class=\"micro\" x=\"650\" y=\"397\">prior mismatch / excess rate</text></g></svg>"}, {"id": "budget", "title": "Shared budget", "subtitle": "Competition only exists if the constraint actually binds", "svg": "<svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"Shared monitoring budget\">\n<g class=\"etched\"><circle cx=\"110\" cy=\"90\" r=\"40\"/><text x=\"110\" y=\"97\">C₁</text><circle cx=\"110\" cy=\"215\" r=\"40\"/><text x=\"110\" y=\"222\">C₂</text><circle cx=\"110\" cy=\"340\" r=\"40\"/><text x=\"110\" y=\"347\">C₃</text>\n<path d=\"M150 90 C260 90 270 160 355 180\"/><path d=\"M150 215 H355\"/><path d=\"M150 340 C260 340 270 270 355 250\"/><rect x=\"355\" y=\"145\" width=\"210\" height=\"140\" rx=\"10\"/><text class=\"big\" x=\"460\" y=\"205\">Σ rᵥ ≤ C</text><text class=\"label\" x=\"460\" y=\"246\">shared constraint</text>\n<path d=\"M565 215 H690\"/><polygon points=\"690,215 673,207 673,223\"/><circle cx=\"760\" cy=\"215\" r=\"58\"/><text class=\"big\" x=\"760\" y=\"225\">U</text></g></svg>"}, {"id": "gates", "title": "E0-A gates", "subtitle": "A monitoring channel earns its interpretation one gate at a time", "svg": "<svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"E0-A gates\">\n<g class=\"etched gate\"><rect x=\"50\" y=\"140\" width=\"170\" height=\"145\" rx=\"8\"/><text class=\"big\" x=\"135\" y=\"190\">A1</text><text class=\"label\" x=\"135\" y=\"228\">hidden + useful</text><path d=\"M220 212 H275\"/><polygon points=\"275,212 260,204 260,220\"/>\n<rect x=\"275\" y=\"140\" width=\"170\" height=\"145\" rx=\"8\"/><text class=\"big\" x=\"360\" y=\"190\">A2</text><text class=\"label\" x=\"360\" y=\"228\">transmits new info</text><path d=\"M445 212 H500\"/><polygon points=\"500,212 485,204 485,220\"/>\n<rect x=\"500\" y=\"140\" width=\"170\" height=\"145\" rx=\"8\"/><text class=\"big\" x=\"585\" y=\"190\">A3</text><text class=\"label\" x=\"585\" y=\"228\">causally used</text><path d=\"M670 212 H725\"/><polygon points=\"725,212 710,204 710,220\"/>\n<rect x=\"725\" y=\"140\" width=\"140\" height=\"145\" rx=\"8\"/><text class=\"big\" x=\"795\" y=\"190\">A4</text><text class=\"label\" x=\"795\" y=\"228\">shortcut sensitive</text>\n<path class=\"thin\" d=\"M50 318 H865\"/><text class=\"micro\" x=\"457\" y=\"350\">failure at a gate blocks the next claim</text></g></svg>"}, {"id": "definition-index", "title": "Definition-indexed E0-B", "subtitle": "The same system can pass one metarepresentational criterion and fail another", "svg": "<svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"Definition indexed E0-B\">\n<g class=\"etched\"><circle cx=\"150\" cy=\"215\" r=\"65\"/><text class=\"big\" x=\"150\" y=\"225\">B2</text><path d=\"M215 215 H365\"/><circle cx=\"460\" cy=\"90\" r=\"62\"/><text x=\"460\" y=\"83\">Shea</text><text class=\"micro\" x=\"460\" y=\"109\">property</text><circle cx=\"460\" cy=\"215\" r=\"62\"/><text x=\"460\" y=\"208\">RR</text><text class=\"micro\" x=\"460\" y=\"234\">redescription</text><circle cx=\"460\" cy=\"340\" r=\"62\"/><text x=\"460\" y=\"333\">Process</text><text class=\"micro\" x=\"460\" y=\"359\">generative process</text>\n<path d=\"M365 215 C390 180 390 125 398 102\"/><path d=\"M365 215 H398\"/><path d=\"M365 215 C390 250 390 305 398 328\"/>\n<text class=\"big\" x=\"690\" y=\"190\">(1, 0, 1)</text><text class=\"label\" x=\"690\" y=\"230\">a split is a finding</text></g></svg>"}, {"id": "ladder", "title": "E0 → E6", "subtitle": "The large claim sits at the end of the programme, not at the beginning", "svg": "<svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"Experimental ladder E0 to E6\">\n<g class=\"etched\"><path class=\"thin\" d=\"M70 300 H830\"/><g class=\"nodes\"><circle cx=\"90\" cy=\"300\" r=\"29\"/><text x=\"90\" y=\"307\">E0</text><circle cx=\"200\" cy=\"300\" r=\"29\"/><text x=\"200\" y=\"307\">E1</text><circle cx=\"310\" cy=\"300\" r=\"29\"/><text x=\"310\" y=\"307\">E2</text><circle cx=\"420\" cy=\"300\" r=\"29\"/><text x=\"420\" y=\"307\">E3</text><circle cx=\"530\" cy=\"300\" r=\"29\"/><text x=\"530\" y=\"307\">E4</text><circle cx=\"640\" cy=\"300\" r=\"29\"/><text x=\"640\" y=\"307\">E5</text><circle cx=\"750\" cy=\"300\" r=\"29\"/><text x=\"750\" y=\"307\">E6</text></g>\n<text class=\"micro\" x=\"90\" y=\"355\">validate</text><text class=\"micro\" x=\"200\" y=\"355\">scarcity</text><text class=\"micro\" x=\"310\" y=\"355\">strict meta</text><text class=\"micro\" x=\"420\" y=\"355\">topology</text><text class=\"micro\" x=\"530\" y=\"355\">recursion</text><text class=\"micro\" x=\"640\" y=\"355\">interaction</text><text class=\"micro\" x=\"750\" y=\"355\">translate</text>\n<path d=\"M90 215 C255 85 485 85 640 215\"/><text class=\"label\" x=\"365\" y=\"80\">“ecology” is earned here →</text></g></svg>"}, {"id": "recursive", "title": "Recursive allocator monitoring", "subtitle": "A feedback problem through time, not an infinite regress", "svg": "<svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"Recursive allocator monitoring\">\n<g class=\"etched\"><rect x=\"85\" y=\"145\" width=\"190\" height=\"120\" rx=\"8\"/><text class=\"big\" x=\"180\" y=\"190\">Aₜ</text><text class=\"label\" x=\"180\" y=\"225\">allocation command</text><path d=\"M275 205 H390\"/><polygon points=\"390,205 374,197 374,213\"/><rect x=\"390\" y=\"145\" width=\"190\" height=\"120\" rx=\"8\"/><text class=\"big\" x=\"485\" y=\"190\">Âₜ</text><text class=\"label\" x=\"485\" y=\"225\">realized allocation</text><path d=\"M580 205 H695\"/><polygon points=\"695,205 679,197 679,213\"/><rect x=\"695\" y=\"145\" width=\"135\" height=\"120\" rx=\"8\"/><text class=\"big\" x=\"762\" y=\"190\">Sₐ</text><text class=\"label\" x=\"762\" y=\"225\">monitor</text><path d=\"M762 265 C762 360 180 360 180 265\"/><polygon points=\"180,265 172,281 188,281\"/><text class=\"micro\" x=\"470\" y=\"377\">feedback informs the next allocation</text></g></svg>"}];

</script><script>

const DATA=window.SIDUS_DATA, ATLAS=window.SIDUS_ATLAS;
const app=document.getElementById('app'),rail=document.getElementById('rail'),railNav=document.getElementById('railNav');
const esc=s=>String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
const route=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
function primerBody(p){
  const template=document.createElement('template');template.innerHTML=p.html;
  const first=template.content.firstElementChild;
  if(first?.tagName==='H1'&&first.textContent.trim()===p.title.trim())first.remove();
  return template.innerHTML;
}
function searchableText(html){
  const template=document.createElement('template');template.innerHTML=html;
  template.content.querySelectorAll('annotation').forEach(el=>el.remove());
  template.content.querySelectorAll('p,h1,h2,h3,h4,li,tr,th,td,blockquote').forEach(el=>el.append(' '));
  return template.content.textContent.replace(/\s+/g,' ').trim();
}
const topActive=(name)=>document.querySelectorAll('.topnav a,.mobile-tabs a').forEach(a=>a.classList.toggle('active',(a.getAttribute('href')||'').includes('/'+name)||((name==='home')&&a.getAttribute('href')==='#/home')));
function setRail(html){railNav.innerHTML=html}
function focusApp(){setTimeout(()=>app.focus({preventScroll:true}),0)}
function openMenu(){const on=!rail.classList.contains('open');rail.classList.toggle('open',on);document.getElementById('menuBtn').setAttribute('aria-expanded',on)}
function closeMenu(){rail.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
document.getElementById('menuBtn').onclick=openMenu;
rail.addEventListener('click',e=>{if(e.target.closest('a'))closeMenu()});

function home(){topActive('home');setRail(`<div class="rail-group">Dossier</div><a href="#/home" class="active">Opening</a><a href="#/primer">For Dummies</a><a href="#/atlas">Visual atlas</a><div class="rail-group">Documents</div>${DATA.docs.map((d,i)=>`<a href="#/document/${i}/frontpiece">${d.roman}. ${esc(d.short)}</a>`).join('')}`);
app.innerHTML=`<div class="content-wide"><section class="hero"><div class="hero-copy"><div class="hero-kicker">A research programme in bounded self-monitoring</div><h1 class="display">Sīdus<span style="color:var(--gold)">:</span><br><em>Towards<br><span class="longword">Metarepresentational</span><br>Ecology</em></h1><p class="lede">What happens when a cognitive system cannot inspect all of itself at once?</p><div class="hero-actions"><a class="btn primary" href="#/primer">Begin with the plain-language map</a><a class="btn" href="#/document/0/frontpiece">Read the documents</a><a class="btn" href="#/atlas">Open the atlas</a></div></div></section>
