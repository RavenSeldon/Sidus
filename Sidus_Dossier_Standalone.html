=\"normal\">r</mi></mrow></msubsup><mo>:=</mo><msub><mi>𝔼</mi><mi>ℐ</mi></msub><mspace width=\"0.167em\"></mspace><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mspace width=\"-0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mo stretchy=\"false\" form=\"postfix\">‖</mo><mspace width=\"0.167em\"></mspace><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≥</mo><mn>0</mn><mi>.</mi><mspace width=\"0.167em\"></mspace></mrow></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{\\,r_v=m_v+\\Delta_v^{\\mathrm{prior}},\\qquad\n\\Delta_v^{\\mathrm{prior}}:=\\mathbb E_{\\mathcal I}\\,D_{KL}\\!\\left(q(S_v\\mid\\mathcal I)\\,\\Vert\\,p(S_v\\mid\\mathcal I)\\right)\\ge0.\\,}\n</annotation></semantics></math></p>\n<p><strong>[Revised after release-candidate review.]</strong> The mismatch term is an expectation over <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math>, not a bare divergence. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"false\" form=\"postfix\">‖</mo><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">D_{KL}(q(S_v\\mid\\mathcal I)\\Vert p(S_v\\mid\\mathcal I))</annotation></semantics></math> is a function of the random variable <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math>; only its expectation is the scalar that completes the identity. Because this is stated as an identity it has to be exact, and an implementation that omits the average would compute a per-timestep quantity and mis-report it.</p>\n<p>Three things follow.</p>\n<ol type=\"1\">\n<li><strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>≥</mo><msub><mi>m</mi><mi>v</mi></msub></mrow><annotation encoding=\"application/x-tex\">r_v\\ge m_v</annotation></semantics></math> is robust, not an assumption.</strong> It holds for any prior, learned or fixed. Finite-sample estimates may still violate it; the population statement does not depend on the encoder having been trained well.</li>\n<li><strong>The Gate A4 signature decomposes exactly.</strong> The pattern <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>≈</mo><mn>0</mn><mo>,</mo><mspace width=\"0.278em\"></mspace><msub><mi>r</mi><mi>v</mi></msub><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">m_v\\approx0,\\;r_v&gt;0</annotation></semantics></math> — recorded there as “possible redundant coding, inefficient optimization, or target-metric mismatch” — separates cleanly: the rate is spent on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math>, i.e. mismatch between the aggregate posterior <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">q(S_v\\mid\\mathcal I)</annotation></semantics></math> and the prior, rather than on information about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math>. Estimate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math> directly and report it; do not infer it by subtraction alone.</li>\n<li><strong>It answers the “soft penalty with extra steps” objection.</strong> With a <em>learned</em> prior fitted to the aggregate posterior, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math> shrinks and the variational surrogate tightens toward the true conditional information. The surrogate’s looseness is therefore a measurable quantity rather than an unknown, which is what licenses using it as a rate meter at all. It does <strong>not</strong>, on its own, establish that a trained run satisfies the shared constraint — see Arm S’s realised-violation feasibility diagnostic in Document II, §10. The alphabet arm there is optional currency-sensitivity work, not a requirement for E1.</li>\n</ol>\n<h3 id=\"gate-a2\">3.4 Gate A2</h3>\n<p>Pass only if, under a non-binding communication condition:</p>\n<ol type=\"1\">\n<li>exact <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math>, or a validated estimate with approximation and sampling uncertainty accounted for, is meaningfully above zero;</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">r_v&gt;0</annotation></semantics></math> and the encoder has not collapsed;</li>\n<li>performance approaches the direct-read ceiling enough to show that the channel can solve the intended information problem.</li>\n</ol>\n<hr />\n", "plain": "3. Gate A2 - Incremental transmission\n\n3.1 Target quantity\n\nDefine the incremental information delivered by the monitoring message:\n\nm_(v) = I(C_(v, t);S_(v, t)∣ℐ_(t)).\n\nEquivalently,\n\nm_(v) = H(C_(v, t)∣ℐ_(t)) − H(C_(v, t)∣ℐ_(t),S_(v, t)).\n\n3.2 Practical log-loss estimator\n\nFit two matched auxiliary predictors on held-out data:\n\np̂₀(c∣ℐ_(t)),   p̂₁(c∣ℐ_(t),S_(v, t)).\n\nThen estimate:\n\n$$\n\\hat m_v\n=\n\\widehat{CE}_0-\n\\widehat{CE}_1.\n$$\n\nUse exact m_(v) as the initial simulator’s reference. The log-loss difference is a decoder-dependent proxy, not automatically conditional mutual information. At population level,\n\nCE₀ − CE₁ = m_(v) + ϵ₀ − ϵ₁,\n\nwhere ϵ_(i) ≥ 0 is decoder i’s expected conditional KL approximation error. Matching classes and nested features does not equalize those errors. For public fair bits A, B, target C = A ⊕ B, and message S = C, exact hiddenness and incremental information are zero, yet linear logistic decoders can report nearly one apparent bit because the added message makes XOR linearly readable. This can falsely support both A1 and A2; it does not establish a false pass of all four gates, since a correct A3 support check rejects the alternative-state construction.\n\nValidate the proxy against exact values across known-positive, public-shortcut and collapsed-channel controls, and report approximation error, calibration and cross-validation uncertainty before threshold selection. The complete evaluator must also reject informative-but-unused and forbidden-access controls and distinguish redundant consumer reliance from informational benefit.\n\n3.3 Rate spent\n\nFor a variational channel,\n\nr_(v) = 𝔼[D_(KL)(q(S_(v)∣C_(v),ℐ)‖p(S_(v)∣ℐ))].\n\nUnder the intended variational construction,\n\nI(C_(v);S_(v)∣ℐ) ≤ r_(v),\n\nbut finite-sample estimates need not obey the inequality exactly.\n\nThe central distinction remains:\n\n$$\n\\boxed{r_v\\neq m_v.}\n$$\n\nA channel may consume rate while adding little useful information.\n\n3.3a Decomposition of the rate–information gap\n\n[R2 · correction, August 2026 review pass]\n\nThe inequality m_(v) ≤ r_(v) was previously asserted as a property of “the intended variational construction.” It is in fact an identity plus a non-negative term, and writing it out converts a qualitative diagnostic into two estimable numbers.\n\nFor any q and p,\n\n$$\n\\begin{aligned}\n\\mathbb E_q\\!\\left[D_{KL}\\!\\left(q(S_v\\mid C_v,\\mathcal I)\\,\\Vert\\,p(S_v\\mid\\mathcal I)\\right)\\right]\n&=\\underbrace{I(C_v;S_v\\mid\\mathcal I)}_{m_v}\\\\[0.5em]\n&\\quad+\\underbrace{\\mathbb E_{\\mathcal I}\\,D_{KL}\\!\\left(q(S_v\\mid\\mathcal I)\\,\\Vert\\,p(S_v\\mid\\mathcal I)\\right)}_{\\Delta_v^{\\mathrm{prior}}\\;\\ge\\;0}.\n\\end{aligned}\n$$\n\nSo\n\n$$\n\\boxed{\\,r_v=m_v+\\Delta_v^{\\mathrm{prior}},\\qquad\n\\Delta_v^{\\mathrm{prior}}:=\\mathbb E_{\\mathcal I}\\,D_{KL}\\!\\left(q(S_v\\mid\\mathcal I)\\,\\Vert\\,p(S_v\\mid\\mathcal I)\\right)\\ge0.\\,}\n$$\n\n[Revised after release-candidate review.] The mismatch term is an expectation over ℐ, not a bare divergence. D_(KL)(q(S_(v)∣ℐ)‖p(S_(v)∣ℐ)) is a function of the random variable ℐ; only its expectation is the scalar that completes the identity. Because this is stated as an identity it has to be exact, and an implementation that omits the average would compute a per-timestep quantity and mis-report it.\n\nThree things follow.\n\n1.  r_(v) ≥ m_(v) is robust, not an assumption. It holds for any prior, learned or fixed. Finite-sample estimates may still violate it; the population statement does not depend on the encoder having been trained well.\n2.  The Gate A4 signature decomposes exactly. The pattern m_(v) ≈ 0, r_(v) > 0 — recorded there as “possible redundant coding, inefficient optimization, or target-metric mismatch” — separates cleanly: the rate is spent on Δ_(v)^(prior), i.e. mismatch between the aggregate posterior q(S_(v)∣ℐ) and the prior, rather than on information about C_(v). Estimate Δ_(v)^(prior) directly and report it; do not infer it by subtraction alone.\n3.  It answers the “soft penalty with extra steps” objection. With a learned prior fitted to the aggregate posterior, Δ_(v)^(prior) shrinks and the variational surrogate tightens toward the true conditional information. The surrogate’s looseness is therefore a measurable quantity rather than an unknown, which is what licenses using it as a rate meter at all. It does not, on its own, establish that a trained run satisfies the shared constraint — see Arm S’s realised-violation feasibility diagnostic in Document II, §10. The alphabet arm there is optional currency-sensitivity work, not a requirement for E1.\n\n3.4 Gate A2\n\nPass only if, under a non-binding communication condition:\n\n1.  exact m_(v), or a validated estimate with approximation and sampling uncertainty accounted for, is meaningfully above zero;\n2.  r_(v) > 0 and the encoder has not collapsed;\n3.  performance approaches the direct-read ceiling enough to show that the channel can solve the intended information problem.\n\n------------------------------------------------------------------------\n"}, {"id": "4-gate-a3-selective-causal-use", "title": "4. Gate A3 - Selective causal use", "part": null, "html": "<h2 id=\"gate-a3---selective-causal-use\">4. Gate A3 - Selective causal use</h2>\n<p>Decodability is not use.</p>\n<h3 id=\"on-support-counterfactual-scrambling\">4.1 On-support counterfactual scrambling</h3>\n<p>Replace the actual message with a valid message associated with an alternative reachable controller state:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>←</mo><mi>S</mi><msub><mi>′</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∼</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>C</mi><msub><mi>′</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>,</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>C</mi><msub><mi>′</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>≠</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nS_{v,t}\n\\leftarrow\nS&#39;_{v,t}\n\\sim\nq(S_v\\mid C&#39;_{v,t},\\mathcal I_t),\n\\qquad\nC&#39;_{v,t}\\neq C_{v,t}.\n</annotation></semantics></math></p>\n<p>Require <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><msub><mi>′</mi><mi>v</mi></msub></mrow><annotation encoding=\"application/x-tex\">C&#39;_v</annotation></semantics></math> to be reachable conditional on the same <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ℐ</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathcal I_t</annotation></semantics></math>, and verify replacement-message support conditional on all other inputs held fixed at the consumer, including non-target messages. Marginal familiarity of a message is insufficient. Record the eligible intervention population and use paired draws or replay with non-target state and randomness held fixed where appropriate. If no eligible alternative exists, report <strong>not applicable</strong> for that intervention; do not substitute a zero effect or count it as a pass. Avoid arbitrary zeroing unless zero is a trained, conditionally supported message state.</p>\n<h3 id=\"primary-outcome\">4.2 Primary outcome</h3>\n<p>Measure the <strong>proximal decision or policy variable</strong> predicted to depend on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math>, not only total episode return.</p>\n<p>Examples:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mi>π</mi><mi>v</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>Δ</mi><mi>P</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>a</mi><mi>t</mi></msub><mo>∣</mo><mo>⋅</mo><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>Δ</mi><msub><mi>J</mi><mi>v</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\Delta \\pi_v,\n\\qquad\n\\Delta P(a_t\\mid\\cdot),\n\\qquad\n\\Delta J_v.\n</annotation></semantics></math></p>\n<p>Total return <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>J</mi><annotation encoding=\"application/x-tex\">J</annotation></semantics></math> is secondary when downstream compensation could mask a genuine local causal effect. This intervention estimates the existing consumer’s dependence on its message. It is distinct from the achievable task-value difference between matched consumers with and without the channel, and from exact Bayes informational headroom. Report these estimands separately: a consumer can rely on redundant information.</p>\n<h3 id=\"non-target-preservation\">4.3 Non-target preservation</h3>\n<p>At the intervention time or within a preregistered proximal window, verify that non-target quantities remain approximately intact:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>u</mi></msub><mo>,</mo><mspace width=\"1.0em\"></mspace><msub><mi>S</mi><mi>u</mi></msub><mo>,</mo><mspace width=\"1.0em\"></mspace><msub><mi>m</mi><mi>u</mi></msub><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>u</mi><mo>≠</mo><mi>v</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nC_u,\n\\quad\nS_u,\n\\quad\nm_u,\n\\qquad u\\neq v.\n</annotation></semantics></math></p>\n<p>Later downstream changes caused by the intervention are legitimate causal consequences and should not be misclassified as intervention leakage.</p>\n<h3 id=\"gate-a3\">4.4 Gate A3</h3>\n<p>Pass only if:</p>\n<ol type=\"1\">\n<li>the on-support message intervention causes the predicted local downstream change;</li>\n<li>the effect exceeds a preregistered minimally meaningful threshold, not merely a significance threshold;</li>\n<li>first-order/private target execution is preserved at intervention time;</li>\n<li>non-target channels are preserved over the specified proximal window.</li>\n</ol>\n<hr />\n", "plain": "4. Gate A3 - Selective causal use\n\nDecodability is not use.\n\n4.1 On-support counterfactual scrambling\n\nReplace the actual message with a valid message associated with an alternative reachable controller state:\n\nS_(v, t) ← S′_(v, t) ∼ q(S_(v)∣C′_(v, t),ℐ_(t)),   C′_(v, t) ≠ C_(v, t).\n\nRequire C′_(v) to be reachable conditional on the same ℐ_(t), and verify replacement-message support conditional on all other inputs held fixed at the consumer, including non-target messages. Marginal familiarity of a message is insufficient. Record the eligible intervention population and use paired draws or replay with non-target state and randomness held fixed where appropriate. If no eligible alternative exists, report not applicable for that intervention; do not substitute a zero effect or count it as a pass. Avoid arbitrary zeroing unless zero is a trained, conditionally supported message state.\n\n4.2 Primary outcome\n\nMeasure the proximal decision or policy variable predicted to depend on C_(v), not only total episode return.\n\nExamples:\n\nΔπ_(v),   ΔP(a_(t)∣⋅),   ΔJ_(v).\n\nTotal return J is secondary when downstream compensation could mask a genuine local causal effect. This intervention estimates the existing consumer’s dependence on its message. It is distinct from the achievable task-value difference between matched consumers with and without the channel, and from exact Bayes informational headroom. Report these estimands separately: a consumer can rely on redundant information.\n\n4.3 Non-target preservation\n\nAt the intervention time or within a preregistered proximal window, verify that non-target quantities remain approximately intact:\n\nC_(u),  S_(u),  m_(u),   u ≠ v.\n\nLater downstream changes caused by the intervention are legitimate causal consequences and should not be misclassified as intervention leakage.\n\n4.4 Gate A3\n\nPass only if:\n\n1.  the on-support message intervention causes the predicted local downstream change;\n2.  the effect exceeds a preregistered minimally meaningful threshold, not merely a significance threshold;\n3.  first-order/private target execution is preserved at intervention time;\n4.  non-target channels are preserved over the specified proximal window.\n\n------------------------------------------------------------------------\n"}, {"id": "5-gate-a4-shortcut-sensitivity", "title": "5. Gate A4 - Shortcut sensitivity", "part": null, "html": "<h2 id=\"gate-a4---shortcut-sensitivity\">5. Gate A4 - Shortcut sensitivity</h2>\n<p>E0-A should demonstrate that the special monitoring channel is valuable <strong>because information is missing</strong>, not merely because the architecture has learned to use an arbitrary extra input.</p>\n<p>Construct legitimate environment conditions that vary the public inferability of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">h</mi><mspace width=\"0.222em\"></mspace><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">y</mi></mrow></msub><mo>&gt;</mo><mi>H</mi><msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">w</mi><mspace width=\"0.222em\"></mspace><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">y</mi></mrow></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nH(C_v\\mid\\mathcal I)_{\\mathrm{high\\ privacy}}\n&gt;\nH(C_v\\mid\\mathcal I)_{\\mathrm{low\\ privacy}}.\n</annotation></semantics></math></p>\n<p>The manipulation must reveal the task-relevant information supplied by the message, not merely an unrelated component of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math>. Reduced hiddenness alone gives only the bound</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>≤</mo><msub><mi>m</mi><mi>v</mi></msub><mo>≤</mo><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n0\\le m_v\\le H(C_v\\mid\\mathcal I),\n</annotation></semantics></math></p>\n<p>not a general monotonicity law for message information or benefit. For independent fair bits <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>A</mi><mo>,</mo><mi>B</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">C=(A,B)</annotation></semantics></math>, message <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mo>=</mo><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">S=A</annotation></semantics></math>, and a task requiring <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>A</mi><annotation encoding=\"application/x-tex\">A</annotation></semantics></math>, revealing <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> reduces hiddenness from two bits to one while message information stays at one bit and optimal accuracy gain stays at 50 percentage points. Exact estimation exposes this counterexample; it does not repair the prediction.</p>\n<p>Preregister a task-specific observability manipulation and establish its predicted effect using the exact reference before testing the learned system. Name three separate estimands: incremental information <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math>; matched achievable message benefit (with exact Bayes headroom reported separately); and the existing consumer’s proximal dependence under A3. Do not use corruption sensitivity as a substitute for informational benefit.</p>\n<p>Full observability remains a valid endpoint for exact information and public-only performance. The alternative-state intervention stops where its conditional-support requirement fails; mark that endpoint <strong>not applicable</strong> for the intervention rather than failed or zero. Define the eligible range before confirmatory evaluation and report how the eligible population changes across the sweep.</p>\n<p>Do <strong>not</strong> require <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>→</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">r_v\\to0</annotation></semantics></math> in the absence of a channel cost. Redundant coding can persist even when incremental information vanishes.</p>\n<p>If an explicit message cost is imposed, then efficient learning additionally predicts:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>↓</mo><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v\\downarrow.\n</annotation></semantics></math></p>\n<p>The pattern</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>≈</mo><mn>0</mn><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>r</mi><mi>v</mi></msub><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\nm_v\\approx0,\\qquad r_v&gt;0\n</annotation></semantics></math></p>\n<p>should be recorded as possible redundant coding, inefficient optimization, or target-metric mismatch rather than defined away.</p>\n<h3 id=\"gate-a4\">Gate A4</h3>\n<p>Pass only if incremental information and matched achievable message benefit decline by the preregistered meaningful amounts under the validated task-relevant observability manipulation. Report confidence intervals and approximation uncertainty; any ratio criterion must be preregistered and never evaluated using bare ratios of point estimates. Report A3 consumer dependence separately over its eligible support range. Failed support or unresolved measurement uncertainty cannot be silently converted into a passing result.</p>\n<hr />\n", "plain": "5. Gate A4 - Shortcut sensitivity\n\nE0-A should demonstrate that the special monitoring channel is valuable because information is missing, not merely because the architecture has learned to use an arbitrary extra input.\n\nConstruct legitimate environment conditions that vary the public inferability of C_(v):\n\nH(C_(v)∣ℐ)_(high privacy) > H(C_(v)∣ℐ)_(low privacy).\n\nThe manipulation must reveal the task-relevant information supplied by the message, not merely an unrelated component of C_(v). Reduced hiddenness alone gives only the bound\n\n0 ≤ m_(v) ≤ H(C_(v)∣ℐ),\n\nnot a general monotonicity law for message information or benefit. For independent fair bits C = (A,B), message S = A, and a task requiring A, revealing B reduces hiddenness from two bits to one while message information stays at one bit and optimal accuracy gain stays at 50 percentage points. Exact estimation exposes this counterexample; it does not repair the prediction.\n\nPreregister a task-specific observability manipulation and establish its predicted effect using the exact reference before testing the learned system. Name three separate estimands: incremental information m_(v); matched achievable message benefit (with exact Bayes headroom reported separately); and the existing consumer’s proximal dependence under A3. Do not use corruption sensitivity as a substitute for informational benefit.\n\nFull observability remains a valid endpoint for exact information and public-only performance. The alternative-state intervention stops where its conditional-support requirement fails; mark that endpoint not applicable for the intervention rather than failed or zero. Define the eligible range before confirmatory evaluation and report how the eligible population changes across the sweep.\n\nDo not require r_(v) → 0 in the absence of a channel cost. Redundant coding can persist even when incremental information vanishes.\n\nIf an explicit message cost is imposed, then efficient learning additionally predicts:\n\nr_(v) ↓ .\n\nThe pattern\n\nm_(v) ≈ 0,   r_(v) > 0\n\nshould be recorded as possible redundant coding, inefficient optimization, or target-metric mismatch rather than defined away.\n\nGate A4\n\nPass only if incremental information and matched achievable message benefit decline by the preregistered meaningful amounts under the validated task-relevant observability manipulation. Report confidence intervals and approximation uncertainty; any ratio criterion must be preregistered and never evaluated using bare ratios of point estimates. Report A3 consumer dependence separately over its eligible support range. Failed support or unresolved measurement uncertainty cannot be silently converted into a passing result.\n\n------------------------------------------------------------------------\n"}, {"id": "5a-non-gating-diagnostic-cross-source-leakage-must-be-measured-conditionally", "title": "5A. Non-gating diagnostic - cross-source leakage must be measured conditionally", "part": null, "html": "<h2 id=\"a.-non-gating-diagnostic---cross-source-leakage-must-be-measured-conditionally\">5A. Non-gating diagnostic - cross-source leakage must be measured conditionally</h2>\n<p><strong>[R3 · correction, August 2026 review pass — preventive]</strong></p>\n<p>No cross-source independence check appears in the protocol above. Earlier working sketches used an unconditional mutual information <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(S_u;S_v)</annotation></semantics></math> as a “cheating” diagnostic, and any future implementation is likely to reach for the same quantity. It is the wrong one, and the error is silent.</p>\n<p>Sources that share public context will exhibit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">I(S_u;S_v)&gt;0</annotation></semantics></math> <strong>legitimately</strong>, because both messages are conditioned on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ℐ</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathcal I_t</annotation></semantics></math>. An unconditional test therefore flags correct architectures as leaking. The right quantity conditions on the public information the consumer already holds:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\nI(S_u;S_v\\mid\\mathcal I_t),\n</annotation></semantics></math></p>\n<p>and for <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mo>&gt;</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">K&gt;2</annotation></semantics></math> sources, the total correlation given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mi>C</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mn>1</mn></msub><mo>,</mo><mi>…</mi><mo>,</mo><msub><mi>S</mi><mi>K</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><munder><mo>∑</mo><mi>v</mi></munder><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mn>1</mn></msub><mo>,</mo><mi>…</mi><mo>,</mo><msub><mi>S</mi><mi>K</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nTC(S_1,\\dots,S_K\\mid\\mathcal I)\n=\n\\sum_{v}H(S_v\\mid\\mathcal I)-H(S_1,\\dots,S_K\\mid\\mathcal I).\n</annotation></semantics></math></p>\n<p>Non-zero conditional dependence is still not automatically a fault: encoders may legitimately coordinate under a shared budget.</p>\n<p><strong>[Revised after release-candidate review.]</strong> An earlier version named the fault condition as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">I(C_u;S_v\\mid\\mathcal I)&gt;0</annotation></semantics></math>. That is still too strong. If the sources are conditionally dependent,</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>u</mi></msub><mo>⊥̸</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\nC_u\\not\\perp C_v\\mid\\mathcal I,\n</annotation></semantics></math></p>\n<p>then <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>u</mi></msub><mo>→</mo><msub><mi>C</mi><mi>v</mi></msub><mo>→</mo><msub><mi>S</mi><mi>v</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_u\\rightarrow C_v\\rightarrow S_v</annotation></semantics></math> forms a chain given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math>, so <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">S_v</annotation></semantics></math> carries information about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>u</mi></msub><annotation encoding=\"application/x-tex\">C_u</annotation></semantics></math> <strong>indirectly and legitimately</strong>, even though encoder <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>v</mi><annotation encoding=\"application/x-tex\">v</annotation></semantics></math> never saw <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>u</mi></msub><annotation encoding=\"application/x-tex\">C_u</annotation></semantics></math>. By data processing, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≤</mo><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(C_u;S_v\\mid\\mathcal I)\\le I(C_u;C_v\\mid\\mathcal I)</annotation></semantics></math>, which is positive whenever the sources are dependent. Flagging that as leakage would condemn a correct architecture.</p>\n<p>The diagnostic that isolates unauthorised access conditions on the source the encoder is entitled to see:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mrow><mspace width=\"0.167em\"></mspace><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>u</mi><mo>≠</mo><mi>v</mi><mi>.</mi><mspace width=\"0.167em\"></mspace></mrow></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{\\,I(C_u;S_v\\mid C_v,\\mathcal I),\\qquad u\\neq v.\\,}\n</annotation></semantics></math></p>\n<p>Under the intended factorised architecture <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S</mi><mi>v</mi></msub><mo>∼</mo><msub><mi>q</mi><mi>v</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">S_v\\sim q_v(S_v\\mid C_v,\\mathcal I)</annotation></semantics></math>, this quantity vanishes exactly, absent shared private randomness or another forbidden path. Non-zero values indicate that encoder <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>v</mi><annotation encoding=\"application/x-tex\">v</annotation></semantics></math> has access it should not have — which is the quantity that would break the per-source attribution on which Gate A3, Gate A4 and hypothesis H3 all depend.</p>\n<p>Report <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(C_u;C_v\\mid\\mathcal I)</annotation></semantics></math> alongside it. Source dependence sets how much legitimate cross-decodability to expect, and without it the conditional test has no reference scale.</p>\n<p>Finally, prefer architecture to inference. The access restriction should be <strong>enforced in code</strong> — encoder <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>v</mi><annotation encoding=\"application/x-tex\">v</annotation></semantics></math> is wired to receive only <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math> — and these information quantities used as <strong>manipulation checks on that wiring</strong>, not as a method for inferring architecture from mutual information alone.</p>\n", "plain": "5A. Non-gating diagnostic - cross-source leakage must be measured conditionally\n\n[R3 · correction, August 2026 review pass — preventive]\n\nNo cross-source independence check appears in the protocol above. Earlier working sketches used an unconditional mutual information I(S_(u);S_(v)) as a “cheating” diagnostic, and any future implementation is likely to reach for the same quantity. It is the wrong one, and the error is silent.\n\nSources that share public context will exhibit I(S_(u);S_(v)) > 0 legitimately, because both messages are conditioned on ℐ_(t). An unconditional test therefore flags correct architectures as leaking. The right quantity conditions on the public information the consumer already holds:\n\nI(S_(u);S_(v)∣ℐ_(t)),\n\nand for K > 2 sources, the total correlation given ℐ:\n\nTC(S₁,…,S_(K)∣ℐ) = ∑_(v)H(S_(v)∣ℐ) − H(S₁,…,S_(K)∣ℐ).\n\nNon-zero conditional dependence is still not automatically a fault: encoders may legitimately coordinate under a shared budget.\n\n[Revised after release-candidate review.] An earlier version named the fault condition as I(C_(u);S_(v)∣ℐ) > 0. That is still too strong. If the sources are conditionally dependent,\n\nC_(u) ⊥̸ C_(v) ∣ ℐ,\n\nthen C_(u) → C_(v) → S_(v) forms a chain given ℐ, so S_(v) carries information about C_(u) indirectly and legitimately, even though encoder v never saw C_(u). By data processing, I(C_(u);S_(v)∣ℐ) ≤ I(C_(u);C_(v)∣ℐ), which is positive whenever the sources are dependent. Flagging that as leakage would condemn a correct architecture.\n\nThe diagnostic that isolates unauthorised access conditions on the source the encoder is entitled to see:\n\n$$\n\\boxed{\\,I(C_u;S_v\\mid C_v,\\mathcal I),\\qquad u\\neq v.\\,}\n$$\n\nUnder the intended factorised architecture S_(v) ∼ q_(v)(S_(v)∣C_(v),ℐ), this quantity vanishes exactly, absent shared private randomness or another forbidden path. Non-zero values indicate that encoder v has access it should not have — which is the quantity that would break the per-source attribution on which Gate A3, Gate A4 and hypothesis H3 all depend.\n\nReport I(C_(u);C_(v)∣ℐ) alongside it. Source dependence sets how much legitimate cross-decodability to expect, and without it the conditional test has no reference scale.\n\nFinally, prefer architecture to inference. The access restriction should be enforced in code — encoder v is wired to receive only C_(v) and ℐ — and these information quantities used as manipulation checks on that wiring, not as a method for inferring architecture from mutual information alone.\n"}, {"id": "6-e0-a-pass-fail-rule", "title": "6. E0-A pass/fail rule", "part": null, "html": "<h2 id=\"e0-a-passfail-rule\">6. E0-A pass/fail rule</h2>\n<p>E0-A licenses E1 scarcity only when all four gates pass across independent seeds. The cross-source leakage diagnostic in §5A is recommended and reportable when relevant, but it does <strong>not</strong> constitute a fifth gate:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Gate</th>\n<th>Required evidence</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>A1 - Residual hiddenness + headroom</strong></td>\n<td>public information leaves non-trivial uncertainty and direct-read information can improve relevant behavior</td>\n</tr>\n<tr class=\"even\">\n<td><strong>A2 - Incremental transmission</strong></td>\n<td>non-binding channel transmits additional target information and avoids collapse</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>A3 - Selective causal use</strong></td>\n<td>on-support message intervention produces the predicted local downstream effect with proximal non-target preservation</td>\n</tr>\n<tr class=\"even\">\n<td><strong>A4 - Shortcut sensitivity</strong></td>\n<td>a validated task-relevant observability manipulation reduces incremental information and matched achievable message benefit; consumer dependence and support eligibility are reported separately</td>\n</tr>\n</tbody>\n</table>\n<p>Report <strong>pass, fail, or inconclusive</strong> for each gate under a preregistered seed/precision rule. <strong>Not applicable</strong> labels a particular unsupported intervention, not successful gate evidence. E1 is licensed only when A1-A4 pass; a false positive on A1/A2 alone is not a demonstrated false pass of E0-A. If a gate fails or remains inconclusive, do not proceed as if the construct were intact. Re-engineer the task, simplify the channel, or revise the claim.</p>\n<hr />\n", "plain": "6. E0-A pass/fail rule\n\nE0-A licenses E1 scarcity only when all four gates pass across independent seeds. The cross-source leakage diagnostic in §5A is recommended and reportable when relevant, but it does not constitute a fifth gate:\n\n  ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Gate                                  Required evidence\n  ------------------------------------- --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  A1 - Residual hiddenness + headroom   public information leaves non-trivial uncertainty and direct-read information can improve relevant behavior\n\n  A2 - Incremental transmission         non-binding channel transmits additional target information and avoids collapse\n\n  A3 - Selective causal use             on-support message intervention produces the predicted local downstream effect with proximal non-target preservation\n\n  A4 - Shortcut sensitivity             a validated task-relevant observability manipulation reduces incremental information and matched achievable message benefit; consumer dependence and support eligibility are reported separately\n  ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nReport pass, fail, or inconclusive for each gate under a preregistered seed/precision rule. Not applicable labels a particular unsupported intervention, not successful gate evidence. E1 is licensed only when A1-A4 pass; a false positive on A1/A2 alone is not a demonstrated false pass of E0-A. If a gate fails or remains inconclusive, do not proceed as if the construct were intact. Re-engineer the task, simplify the channel, or revise the claim.\n\n------------------------------------------------------------------------\n"}, {"id": "7-scope-of-e0-b", "title": "7. Scope of E0-B", "part": "PART II - E0-B: PROVISIONAL METAREPRESENTATIONAL DISCRIMINATION", "html": "<h2 id=\"scope-of-e0-b\">7. Scope of E0-B</h2>\n<p>E0-B is deliberately less mature than E0-A.</p>\n<p>Its purpose is not to settle the philosophy of metarepresentation. It asks whether a synthetic experiment can distinguish a candidate <strong>property/process metarepresentation</strong> from simpler alternatives under explicitly stated operational criteria.</p>\n<p><strong>[Second external review pass — design commitment executed.]</strong> E0-B is not run under a single chosen definition. The three criteria of Document I §2.3 disagree in principle, so the protocol is <strong>definition-indexed</strong>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mn>0</mn><mtext mathvariant=\"normal\">-</mtext><msup><mi>B</mi><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">a</mi></mrow></msup><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>E</mi><mn>0</mn><mtext mathvariant=\"normal\">-</mtext><msup><mi>B</mi><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">R</mi></mrow></msup><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>E</mi><mn>0</mn><mtext mathvariant=\"normal\">-</mtext><msup><mi>B</mi><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi></mrow></msup><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\nE0\\text{-}B^{\\mathrm{Shea}}, \\qquad E0\\text{-}B^{\\mathrm{RR}}, \\qquad E0\\text{-}B^{\\mathrm{Process}},\n</annotation></semantics></math></p>\n<p>run over the same architectures, preregistered manipulations and evidence tiers. A system may satisfy one operationalization and fail another. That outcome is not experimental failure. If the criteria repeatedly carve systems differently, the warranted conclusion is that <strong>“metarepresentation” does not yet behave as one empirically unified construct</strong>, and the programme should then speak specifically of representational-property monitoring, process representation, or representational redescription — whichever actually survived — rather than of metarepresentation simpliciter.</p>\n<p>Before confirmatory use, each index requires a distinct executable predicate, named counterexamples and controls showing which architectures can satisfy one index while failing another. The shared discriminators below are necessary design scaffolding, not three completed definitions.</p>\n<p>For <strong>Shea</strong>, specify the representational property entering the candidate’s correctness conditions and a consumer that uses it as such. For <strong>RR</strong>, test a preregistered gain in accessibility to a bounded consumer, with explicit first-order redescription, consumer-role and matched feature-transformation controls; accessibility gain alone is ordinary feature engineering as well. For <strong>Process</strong>, require evidence about the generating mapping beyond a scalar reliability cue, using held-out process interventions and matched simpler process-state monitors. These are operational commitments to refine against Proust, Shea, Cleeremans/SOMA and process-metarepresentation work, not claims to exhaust those accounts.</p>\n<p>Specify exactly which inputs, history, parameters, training data and computational capacity B0/B1 receive. A bounded shortcut predictor is not equivalent to conditioning on complete first-order activity. If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math> is a deterministic redescription of that activity, it adds no Shannon information beyond its complete inputs; it may nevertheless improve bounded-consumer accessibility. Report that accessibility separately from absolute conditional information.</p>\n<hr />\n", "plain": "7. Scope of E0-B\n\nE0-B is deliberately less mature than E0-A.\n\nIts purpose is not to settle the philosophy of metarepresentation. It asks whether a synthetic experiment can distinguish a candidate property/process metarepresentation from simpler alternatives under explicitly stated operational criteria.\n\n[Second external review pass — design commitment executed.] E0-B is not run under a single chosen definition. The three criteria of Document I §2.3 disagree in principle, so the protocol is definition-indexed:\n\nE0-B^(Shea),   E0-B^(RR),   E0-B^(Process),\n\nrun over the same architectures, preregistered manipulations and evidence tiers. A system may satisfy one operationalization and fail another. That outcome is not experimental failure. If the criteria repeatedly carve systems differently, the warranted conclusion is that “metarepresentation” does not yet behave as one empirically unified construct, and the programme should then speak specifically of representational-property monitoring, process representation, or representational redescription — whichever actually survived — rather than of metarepresentation simpliciter.\n\nBefore confirmatory use, each index requires a distinct executable predicate, named counterexamples and controls showing which architectures can satisfy one index while failing another. The shared discriminators below are necessary design scaffolding, not three completed definitions.\n\nFor Shea, specify the representational property entering the candidate’s correctness conditions and a consumer that uses it as such. For RR, test a preregistered gain in accessibility to a bounded consumer, with explicit first-order redescription, consumer-role and matched feature-transformation controls; accessibility gain alone is ordinary feature engineering as well. For Process, require evidence about the generating mapping beyond a scalar reliability cue, using held-out process interventions and matched simpler process-state monitors. These are operational commitments to refine against Proust, Shea, Cleeremans/SOMA and process-metarepresentation work, not claims to exhaust those accounts.\n\nSpecify exactly which inputs, history, parameters, training data and computational capacity B0/B1 receive. A bounded shortcut predictor is not equivalent to conditioning on complete first-order activity. If M is a deterministic redescription of that activity, it adds no Shannon information beyond its complete inputs; it may nevertheless improve bounded-consumer accessibility. Report that accessibility separately from absolute conditional information.\n\n------------------------------------------------------------------------\n"}, {"id": "8-minimal-architecture", "title": "8. Minimal architecture", "part": null, "html": "<h2 id=\"minimal-architecture\">8. Minimal architecture</h2>\n<p>Let an external latent state <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>X</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">X_t</annotation></semantics></math> generate observation <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>O</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">O_t</annotation></semantics></math>. A first-order system produces:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mi>t</mi></msub><mo>=</mo><msub><mi>F</mi><msub><mi>η</mi><mi>t</mi></msub></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>O</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\nR_t=F_{\\eta_t}(O_t),\n</annotation></semantics></math></p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math> controls a hidden property of the representational process, for example:</p>\n<ul>\n<li>noise/reliability regime;</li>\n<li>systematic bias;</li>\n<li>source type;</li>\n<li>gain/transformation rule;</li>\n<li>mapping family.</li>\n</ul>\n<p>Construct at least three comparison systems:</p>\n<h3 id=\"b0---first-orderpublic-shortcut\">B0 - First-order/public shortcut</h3>\n<p>Predicts the task target or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math> from public context, observation, or ordinary downstream activity without an explicit model of a representational property/process.</p>\n<h3 id=\"b1---internal-state-monitor\">B1 - Internal-state monitor</h3>\n<p>Represents a private controller/process state <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">C_t</annotation></semantics></math>, but is not required to represent a property of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>R</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">R_t</annotation></semantics></math> or the process <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>F</mi><msub><mi>η</mi><mi>t</mi></msub></msub><annotation encoding=\"application/x-tex\">F_{\\eta_t}</annotation></semantics></math>.</p>\n<h3 id=\"b2---candidate-propertyprocess-metarepresentation\">B2 - Candidate property/process metarepresentation</h3>\n<p>Produces a state <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">M_t</annotation></semantics></math> whose task-relevant target is explicitly:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>R</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\n\\phi(R_t)\n</annotation></semantics></math></p>\n<p>or</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>η</mi><mi>t</mi></msub><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\eta_t,\n</annotation></semantics></math></p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>R</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\phi(R_t)</annotation></semantics></math> may be reliability, source, correctness probability, or another preregistered representational property.</p>\n<hr />\n", "plain": "8. Minimal architecture\n\nLet an external latent state X_(t) generate observation O_(t). A first-order system produces:\n\nR_(t) = F_(η_(t))(O_(t)),\n\nwhere η_(t) controls a hidden property of the representational process, for example:\n\n-   noise/reliability regime;\n-   systematic bias;\n-   source type;\n-   gain/transformation rule;\n-   mapping family.\n\nConstruct at least three comparison systems:\n\nB0 - First-order/public shortcut\n\nPredicts the task target or η_(t) from public context, observation, or ordinary downstream activity without an explicit model of a representational property/process.\n\nB1 - Internal-state monitor\n\nRepresents a private controller/process state C_(t), but is not required to represent a property of R_(t) or the process F_(η_(t)).\n\nB2 - Candidate property/process metarepresentation\n\nProduces a state M_(t) whose task-relevant target is explicitly:\n\nϕ(R_(t))\n\nor\n\nη_(t),\n\nwhere ϕ(R_(t)) may be reliability, source, correctness probability, or another preregistered representational property.\n\n------------------------------------------------------------------------\n"}, {"id": "9-minimum-discriminators", "title": "9. Minimum discriminators", "part": null, "html": "<h2 id=\"minimum-discriminators\">9. Minimum discriminators</h2>\n<p>E0-B should not pass merely because <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">M_t</annotation></semantics></math> decodes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math>.</p>\n<p>At minimum, the design should include matched conditions that:</p>\n<ol type=\"1\">\n<li>hold external target <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>X</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">X_t</annotation></semantics></math> fixed while <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math> changes;</li>\n<li>hold first-order choice/output fixed while reliability/source/process regime changes where feasible;</li>\n<li>include cases in which <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">M_t</annotation></semantics></math> can misrepresent its target;</li>\n<li>compare against a public-context shortcut with matched capacity;</li>\n<li>perturb the target property/process and test whether <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">M_t</annotation></semantics></math> changes as predicted;</li>\n<li>perturb <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">M_t</annotation></semantics></math> while preserving the first-order representation and test whether its intended consumer changes appropriately.</li>\n</ol>\n<p>A provisional evidence hierarchy is:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">decodable</mtext><mspace width=\"0.278em\"></mspace><mo>&lt;</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">conditionally specific</mtext><mspace width=\"0.278em\"></mspace><mo>&lt;</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">misrepresentable</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mo>&lt;</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">target-dependent</mtext><mspace width=\"0.278em\"></mspace><mo>&lt;</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">causally used</mtext><mi>.</mi></mtd></mtr></mtable><annotation encoding=\"application/x-tex\">\n\\begin{array}{c}\n\\text{decodable}\\;&lt;\\;\\text{conditionally specific}\\;&lt;\\;\\text{misrepresentable}\\\\[3pt]\n&lt;\\;\\text{target-dependent}\\;&lt;\\;\\text{causally used}.\n\\end{array}\n</annotation></semantics></math></p>\n<hr />\n", "plain": "9. Minimum discriminators\n\nE0-B should not pass merely because M_(t) decodes η_(t).\n\nAt minimum, the design should include matched conditions that:\n\n1.  hold external target X_(t) fixed while η_(t) changes;\n2.  hold first-order choice/output fixed while reliability/source/process regime changes where feasible;\n3.  include cases in which M_(t) can misrepresent its target;\n4.  compare against a public-context shortcut with matched capacity;\n5.  perturb the target property/process and test whether M_(t) changes as predicted;\n6.  perturb M_(t) while preserving the first-order representation and test whether its intended consumer changes appropriately.\n\nA provisional evidence hierarchy is:\n\n$$\n\\begin{array}{c}\n\\text{decodable}\\;<\\;\\text{conditionally specific}\\;<\\;\\text{misrepresentable}\\\\[3pt]\n<\\;\\text{target-dependent}\\;<\\;\\text{causally used}.\n\\end{array}\n$$\n\n------------------------------------------------------------------------\n"}, {"id": "10-provisional-e0-b-pass-criterion", "title": "10. Provisional E0-B pass criterion", "part": null, "html": "<h2 id=\"provisional-e0-b-pass-criterion\">10. Provisional E0-B pass criterion</h2>\n<p>E0-B passes <strong>for the selected operational definition only</strong> if the candidate B2 architecture:</p>\n<ol type=\"1\">\n<li>satisfies the preregistered index-specific specificity or bounded-accessibility predicate, with explicit B0/B1 inputs and capacity controls; information and accessibility are reported as different estimands;</li>\n<li>can dissociate from the first-order output and can misrepresent its meta-target;</li>\n<li>responds selectively to intervention on the target representational property/process;</li>\n<li>causally affects the intended downstream consumer when manipulated while first-order representation is preserved;</li>\n<li>outperforms simpler B0/B1 explanations under held-out interventions, not merely under in-distribution decoding.</li>\n</ol>\n<p>After index-specific rules are fixed and validated, report a vector of pass/fail/inconclusive results rather than a single verdict. An unspecified or unvalidated index is not confirmatory-ready; do not manufacture a verdict from the shared checklist. A reproducible split outcome is a substantive finding about the selected operationalizations, per §7.</p>\n<p>If these conditions cannot be met under any index, the programme should not use the phrase <strong>strict metarepresentation</strong> for that system.</p>\n<p>E0-B does <strong>not</strong> establish that this operationalization exhausts the concept of metarepresentation.</p>\n<hr />\n", "plain": "10. Provisional E0-B pass criterion\n\nE0-B passes for the selected operational definition only if the candidate B2 architecture:\n\n1.  satisfies the preregistered index-specific specificity or bounded-accessibility predicate, with explicit B0/B1 inputs and capacity controls; information and accessibility are reported as different estimands;\n2.  can dissociate from the first-order output and can misrepresent its meta-target;\n3.  responds selectively to intervention on the target representational property/process;\n4.  causally affects the intended downstream consumer when manipulated while first-order representation is preserved;\n5.  outperforms simpler B0/B1 explanations under held-out interventions, not merely under in-distribution decoding.\n\nAfter index-specific rules are fixed and validated, report a vector of pass/fail/inconclusive results rather than a single verdict. An unspecified or unvalidated index is not confirmatory-ready; do not manufacture a verdict from the shared checklist. A reproducible split outcome is a substantive finding about the selected operationalizations, per §7.\n\nIf these conditions cannot be met under any index, the programme should not use the phrase strict metarepresentation for that system.\n\nE0-B does not establish that this operationalization exhausts the concept of metarepresentation.\n\n------------------------------------------------------------------------\n"}, {"id": "11-assumptions", "title": "11. Assumptions", "part": "PART III - ASSUMPTIONS AND LIMITATIONS", "html": "<h2 id=\"assumptions\">11. Assumptions</h2>\n<ol type=\"1\">\n<li><strong>Ground truth is available by construction.</strong> The synthetic environment exposes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">C_t</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>R</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">R_t</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math>, and intervention targets. The initial reference must additionally support tractable exact conditional probabilities; access to realized states alone does not provide this.</li>\n<li><strong>Candidate variables are supplied by the experimenter.</strong> E0 tests representation and use of known targets; it does not test spontaneous discovery of an internal ontology.</li>\n<li><strong>Measurement validation precedes calibration.</strong> Exact-reference estimator and complete-evaluator checks precede pilot threshold selection, which precedes independent confirmation. Held-out calibration and matched decoder classes alone are insufficient.</li>\n<li><strong>On-support interventions can be designed without destroying unrelated computations.</strong> This must be empirically verified rather than assumed.</li>\n<li><strong>Task value is a legitimate local criterion.</strong> Causal use is defined relative to the tested task and consumer; absence of use in one task does not prove universal absence of function.</li>\n<li><strong>Representational properties/processes are operationally specified before data inspection.</strong> E0-B cannot infer a meta-target after the fact from whichever latent dimension decodes best.</li>\n</ol>\n<hr />\n", "plain": "11. Assumptions\n\n1.  Ground truth is available by construction. The synthetic environment exposes C_(t), R_(t), η_(t), and intervention targets. The initial reference must additionally support tractable exact conditional probabilities; access to realized states alone does not provide this.\n2.  Candidate variables are supplied by the experimenter. E0 tests representation and use of known targets; it does not test spontaneous discovery of an internal ontology.\n3.  Measurement validation precedes calibration. Exact-reference estimator and complete-evaluator checks precede pilot threshold selection, which precedes independent confirmation. Held-out calibration and matched decoder classes alone are insufficient.\n4.  On-support interventions can be designed without destroying unrelated computations. This must be empirically verified rather than assumed.\n5.  Task value is a legitimate local criterion. Causal use is defined relative to the tested task and consumer; absence of use in one task does not prove universal absence of function.\n6.  Representational properties/processes are operationally specified before data inspection. E0-B cannot infer a meta-target after the fact from whichever latent dimension decodes best.\n\n------------------------------------------------------------------------\n"}, {"id": "12-limitations", "title": "12. Limitations", "part": null, "html": "<h2 id=\"limitations\">12. Limitations</h2>\n<h3 id=\"e0-a-validates-monitoring-not-metarepresentation\">12.1 E0-A validates monitoring, not metarepresentation</h3>\n<p>A perfectly successful E0-A system may still be only a sophisticated internal telemetry channel.</p>\n<h3 id=\"e0-b-is-definition-relative\">12.2 E0-B is definition-relative</h3>\n<p>Metarepresentation is contested. E0-B can validate one operational criterion against specified alternatives; it cannot settle all philosophical or cognitive-scientific definitions.</p>\n<h3 id=\"conditional-information-estimation-is-model-dependent\">12.3 Conditional-information estimation is model-dependent</h3>\n<p>Cross-validated log-loss differences approximate conditional information only relative to the decoder class and data regime. Poor auxiliary predictors can create misleading residual uncertainty or information estimates.</p>\n<h3 id=\"synthetic-modularity-is-an-experimental-scaffold\">12.4 Synthetic modularity is an experimental scaffold</h3>\n<p>Clean private states, encoders, and intervention points are engineered conveniences. They should not be read as claims about anatomical modules or a literal neural information seam.</p>\n<h3 id=\"causal-use-is-consumer-relative\">12.5 Causal use is consumer-relative</h3>\n<p>A message may be unused by the tested coordinator yet useful elsewhere. E0 establishes only the causal relation explicitly tested.</p>\n<h3 id=\"redundant-coding-is-possible\">12.6 Redundant coding is possible</h3>\n<p><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>→</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">m_v\\to0</annotation></semantics></math> does not imply <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>→</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">r_v\\to0</annotation></semantics></math>. Efficient rate reduction requires an actual cost or opportunity pressure.</p>\n<h3 id=\"local-validity-does-not-establish-ecology\">12.7 Local validity does not establish ecology</h3>\n<p>Even successful E0-A and E0-B experiments validate only local constructs. Ecology-level claims require reproducible interactions among multiple independently validated systems across tasks or architectures.</p>\n<hr />\n", "plain": "12. Limitations\n\n12.1 E0-A validates monitoring, not metarepresentation\n\nA perfectly successful E0-A system may still be only a sophisticated internal telemetry channel.\n\n12.2 E0-B is definition-relative\n\nMetarepresentation is contested. E0-B can validate one operational criterion against specified alternatives; it cannot settle all philosophical or cognitive-scientific definitions.\n\n12.3 Conditional-information estimation is model-dependent\n\nCross-validated log-loss differences approximate conditional information only relative to the decoder class and data regime. Poor auxiliary predictors can create misleading residual uncertainty or information estimates.\n\n12.4 Synthetic modularity is an experimental scaffold\n\nClean private states, encoders, and intervention points are engineered conveniences. They should not be read as claims about anatomical modules or a literal neural information seam.\n\n12.5 Causal use is consumer-relative\n\nA message may be unused by the tested coordinator yet useful elsewhere. E0 establishes only the causal relation explicitly tested.\n\n12.6 Redundant coding is possible\n\nm_(v) → 0 does not imply r_(v) → 0. Efficient rate reduction requires an actual cost or opportunity pressure.\n\n12.7 Local validity does not establish ecology\n\nEven successful E0-A and E0-B experiments validate only local constructs. Ecology-level claims require reproducible interactions among multiple independently validated systems across tasks or architectures.\n\n------------------------------------------------------------------------\n"}, {"id": "13-pipeline-after-e0", "title": "13. Pipeline after E0", "part": null, "html": "<h2 id=\"pipeline-after-e0\">13. Pipeline after E0</h2>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">E0-A: monitoring substrate valid</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mo>⇓</mo></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">E1: multi-source scarcity / competition</mtext></mtd></mtr></mtable></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{\n\\begin{array}{c}\n\\text{E0-A: monitoring substrate valid}\n\\\\[4pt]\n\\Downarrow\n\\\\[4pt]\n\\text{E1: multi-source scarcity / competition}\n\\end{array}}\n</annotation></semantics></math></p>\n<p>and separately:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">E0-B: strict-meta discriminator valid</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mo>⇓</mo></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">E2: metarepresentation under scarcity</mtext></mtd></mtr></mtable></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{\n\\begin{array}{c}\n\\text{E0-B: strict-meta discriminator valid}\n\\\\[4pt]\n\\Downarrow\n\\\\[4pt]\n\\text{E2: metarepresentation under scarcity}\n\\end{array}}\n</annotation></semantics></math></p>\n<p>Passing E0-A does not imply E0-B. Passing either does not imply ecology.</p>\n<hr />\n<blockquote>\n<p><strong>E0 exists to prevent later sophistication from compensating for a bad construct. If the substrate cannot survive these tests, stop before building the ecology around it.</strong></p>\n</blockquote>\n<hr />\n", "plain": "13. Pipeline after E0\n\n$$\n\\boxed{\n\\begin{array}{c}\n\\text{E0-A: monitoring substrate valid}\n\\\\[4pt]\n\\Downarrow\n\\\\[4pt]\n\\text{E1: multi-source scarcity / competition}\n\\end{array}}\n$$\n\nand separately:\n\n$$\n\\boxed{\n\\begin{array}{c}\n\\text{E0-B: strict-meta discriminator valid}\n\\\\[4pt]\n\\Downarrow\n\\\\[4pt]\n\\text{E2: metarepresentation under scarcity}\n\\end{array}}\n$$\n\nPassing E0-A does not imply E0-B. Passing either does not imply ecology.\n\n------------------------------------------------------------------------\n\n  E0 exists to prevent later sophistication from compensating for a bad construct. If the substrate cannot survive these tests, stop before building the ecology around it.\n\n------------------------------------------------------------------------\n"}, {"id": "references", "title": "References", "part": null, "html": "<h2 id=\"references\">References</h2>\n<ol type=\"1\">\n<li>Proust, J. (2003). Does metacognition necessarily involve metarepresentation? <em>Behavioral and Brain Sciences, 26</em>(3), 352. https://doi.org/10.1017/S0140525X0336008X</li>\n<li>Shea, N. (2014). Reward prediction error signals are meta-representational. <em>Noûs, 48</em>(2), 314-341. https://doi.org/10.1111/j.1468-0068.2012.00863.x</li>\n<li>Cleeremans, A. (2011). The Radical Plasticity Thesis: How the brain learns to be conscious. <em>Frontiers in Psychology, 2</em>, 86. https://doi.org/10.3389/fpsyg.2011.00086</li>\n<li>Cleeremans, A., et al. (2020). Learning to be conscious. <em>Trends in Cognitive Sciences, 24</em>(2), 112-123. https://doi.org/10.1016/j.tics.2019.11.011</li>\n<li>Cleeremans, A., Timmermans, B., &amp; Pasquali, A. (2007). Consciousness and metarepresentation: A computational sketch. <em>Neural Networks, 20</em>, 1032-1039. PMID: 17904799.</li>\n<li>Kanai, R., Takatsuki, R., &amp; Fujisawa, I. (2025). Meta-representations as representations of processes. <em>Neuroscience of Consciousness, 2025</em>(1), niaf038. https://doi.org/10.1093/nc/niaf038</li>\n</ol>\n", "plain": "References\n\n1.  Proust, J. (2003). Does metacognition necessarily involve metarepresentation? Behavioral and Brain Sciences, 26(3), 352. https://doi.org/10.1017/S0140525X0336008X\n2.  Shea, N. (2014). Reward prediction error signals are meta-representational. Noûs, 48(2), 314-341. https://doi.org/10.1111/j.1468-0068.2012.00863.x\n3.  Cleeremans, A. (2011). The Radical Plasticity Thesis: How the brain learns to be conscious. Frontiers in Psychology, 2, 86. https://doi.org/10.3389/fpsyg.2011.00086\n4.  Cleeremans, A., et al. (2020). Learning to be conscious. Trends in Cognitive Sciences, 24(2), 112-123. https://doi.org/10.1016/j.tics.2019.11.011\n5.  Cleeremans, A., Timmermans, B., & Pasquali, A. (2007). Consciousness and metarepresentation: A computational sketch. Neural Networks, 20, 1032-1039. PMID: 17904799.\n6.  Kanai, R., Takatsuki, R., & Fujisawa, I. (2025). Meta-representations as representations of processes. Neuroscience of Consciousness, 2025(1), niaf038. https://doi.org/10.1093/nc/niaf038\n"}], "sourceMd": "source/04_E0_Protocol.md", "sourcePdf": "source/04_E0_Protocol.pdf"}], "dummies": [{"id": "begin-here", "title": "Begin here", "html": "<h1 id=\"sīdus-in-one-sentence\">Sīdus in one sentence</h1>\n<p><strong>Sīdus asks whether a mind—or an artificial system—has limited resources for knowing what is happening inside itself, and whether there are predictable rules governing what it monitors, how accurately it monitors it, and how those internal monitoring systems interact.</strong></p>\n<p>Imagine a huge company with dozens of departments. Each department has internal information the CEO cannot directly see. The company can afford only a few status reports at once. Which departments should r
