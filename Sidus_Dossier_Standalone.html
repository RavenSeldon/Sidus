 0, ∑_(v)r_(v) ≤ C)ℬ(r).\n\nDo not interpret this as a claim that the learned agent explicitly solves the argmax.\n\n------------------------------------------------------------------------\n"}, {"id": "5-confirmatory-hypotheses", "title": "5. Confirmatory hypotheses", "part": null, "html": "<h2 id=\"confirmatory-hypotheses\">5. Confirmatory hypotheses</h2>\n<h3 id=\"h1---binding-scarcity-produces-a-real-trade-off\">H1 - Binding scarcity produces a real trade-off</h3>\n<p>As <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub><annotation encoding=\"application/x-tex\">C_{\\mathrm{meta}}</annotation></semantics></math> is swept from non-binding to binding capacity, increasing rate to one source should reduce feasible rate available to others and alter performance in predictable ways.</p>\n<p><strong>Against H1:</strong> nominally lower capacity leaves every source fully informative, or no cross-source displacement occurs despite validated rate control.</p>\n<h3 id=\"h2---dynamic-control-value-predicts-allocation-better-than-trivial-baselines\">H2 - Dynamic control value predicts allocation better than trivial baselines</h3>\n<p>A joint resource model using measured benefit should predict held-out learned allocations better than:</p>\n<ul>\n<li>uniform allocation;</li>\n<li>source cardinality/entropy alone;</li>\n<li>ordinary inferability alone;</li>\n<li>isolated causal value alone;</li>\n<li>fixed source identity;</li>\n<li>encoder-head identity;</li>\n<li><strong>myopic value of computation (myopic VOC)</strong> — define eligible increments of monitoring communication and select the increment with greatest <strong>one-step expected net improvement</strong> in downstream decision quality, accounting for communication cost and the option to stop. Specify increment size, information updates and budget feasibility. Rate proportional to gross one-step value is a separate heuristic, not the canonical meta-greedy policy (Russell &amp; Wefald 1991; Hay et al. 2012; Callaway et al. 2018).</li>\n</ul>\n<p><strong>[Design addition, August 2026 — revised after release-candidate review]</strong> Uniform allocation is a null; entropy-only, inferability-only and isolated-causal-value are <strong>simpler structured models</strong>, not nulls, and an earlier version wrongly lumped all five together. Myopic VOC is added because it is the closest competitor drawn from an established formalism, and because H4’s topology hypothesis <strong>overlaps conceptually</strong> with value of computation — graph position is not identical to VOC, but the two are close enough that a topology result could be a VOC result in different notation. The comparator is specifically one-step value and is named as such: <strong>myopic VOC</strong>, one approximation within the metalevel-MDP framework, not VOC in general.</p>\n<p><strong>Against H2:</strong> the richer resource model does not improve out-of-sample prediction over these baselines. <strong>If it fails specifically against myopic VOC</strong>, the honest reading is that a joint, budget-constrained resource surface adds nothing beyond myopic per-source value of computation. That is a clean, publishable negative result and it should be pre-registered as one.</p>\n<h3 id=\"h3---messages-are-causally-used\">H3 - Messages are causally used</h3>\n<p>Selective corruption/replacement of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">S_v</annotation></semantics></math> should impair the downstream behavior for which information about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math> is useful, while preserving non-target messages and remaining near trained support.</p>\n<p><strong>Against H3:</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math> is decodable from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">S_v</annotation></semantics></math> but removing/corrupting <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">S_v</annotation></semantics></math> has no relevant behavioral effect.</p>\n<h3 id=\"h4---topology-is-a-candidate-secondary-predictor\">H4 - Topology is a candidate secondary predictor</h3>\n<p>If technically feasible, vary or measure downstream reach/persistence and test whether these properties improve prediction beyond direct causal value and inferability.</p>\n<p>This is secondary. It should not endanger completion of H1-H3.</p>\n<hr />\n", "plain": "5. Confirmatory hypotheses\n\nH1 - Binding scarcity produces a real trade-off\n\nAs C_(meta) is swept from non-binding to binding capacity, increasing rate to one source should reduce feasible rate available to others and alter performance in predictable ways.\n\nAgainst H1: nominally lower capacity leaves every source fully informative, or no cross-source displacement occurs despite validated rate control.\n\nH2 - Dynamic control value predicts allocation better than trivial baselines\n\nA joint resource model using measured benefit should predict held-out learned allocations better than:\n\n-   uniform allocation;\n-   source cardinality/entropy alone;\n-   ordinary inferability alone;\n-   isolated causal value alone;\n-   fixed source identity;\n-   encoder-head identity;\n-   myopic value of computation (myopic VOC) — define eligible increments of monitoring communication and select the increment with greatest one-step expected net improvement in downstream decision quality, accounting for communication cost and the option to stop. Specify increment size, information updates and budget feasibility. Rate proportional to gross one-step value is a separate heuristic, not the canonical meta-greedy policy (Russell & Wefald 1991; Hay et al. 2012; Callaway et al. 2018).\n\n[Design addition, August 2026 — revised after release-candidate review] Uniform allocation is a null; entropy-only, inferability-only and isolated-causal-value are simpler structured models, not nulls, and an earlier version wrongly lumped all five together. Myopic VOC is added because it is the closest competitor drawn from an established formalism, and because H4’s topology hypothesis overlaps conceptually with value of computation — graph position is not identical to VOC, but the two are close enough that a topology result could be a VOC result in different notation. The comparator is specifically one-step value and is named as such: myopic VOC, one approximation within the metalevel-MDP framework, not VOC in general.\n\nAgainst H2: the richer resource model does not improve out-of-sample prediction over these baselines. If it fails specifically against myopic VOC, the honest reading is that a joint, budget-constrained resource surface adds nothing beyond myopic per-source value of computation. That is a clean, publishable negative result and it should be pre-registered as one.\n\nH3 - Messages are causally used\n\nSelective corruption/replacement of S_(v) should impair the downstream behavior for which information about C_(v) is useful, while preserving non-target messages and remaining near trained support.\n\nAgainst H3: C_(v) is decodable from S_(v) but removing/corrupting S_(v) has no relevant behavioral effect.\n\nH4 - Topology is a candidate secondary predictor\n\nIf technically feasible, vary or measure downstream reach/persistence and test whether these properties improve prediction beyond direct causal value and inferability.\n\nThis is secondary. It should not endanger completion of H1-H3.\n\n------------------------------------------------------------------------\n"}, {"id": "6-the-controls-that-are-not-optional", "title": "6. The controls that are not optional", "part": null, "html": "<h2 id=\"the-controls-that-are-not-optional\">6. The controls that are not optional</h2>\n<ol type=\"1\">\n<li><strong>Direct-read oracle.</strong> Give the coordinator direct access to selected private states to estimate the ceiling and verify that hidden-state information can help.</li>\n<li><strong>No-seam/full-read control.</strong> Confirm that the communication problem is generated by restricted access rather than the task alone.</li>\n<li><strong>Non-binding capacity condition.</strong> All candidate heads must be capable of becoming informative before scarcity is imposed.</li>\n<li><strong>Head permutation across seeds.</strong> Source identity must not be confounded with a privileged encoder index.</li>\n<li><strong>Scarcity ramp with a real constraint.</strong> Avoid treating a fixed penalty coefficient as equivalent to a known shared budget.</li>\n<li><strong>Allocation plateau.</strong> Measure confirmatory rates only after budget, return and rate trajectories stabilize by a preregistered rule.</li>\n<li><strong>From-scratch diagnostic for selected conditions.</strong> If ramped and from-scratch training disagree, report optimization hysteresis.</li>\n<li><strong>Held-out environments/contingencies.</strong> The allocation model should predict more than the exact configurations used to fit it.</li>\n</ol>\n<p>These controls are the scientific core. They are more important than decorative model complexity.</p>\n<hr />\n", "plain": "6. The controls that are not optional\n\n1.  Direct-read oracle. Give the coordinator direct access to selected private states to estimate the ceiling and verify that hidden-state information can help.\n2.  No-seam/full-read control. Confirm that the communication problem is generated by restricted access rather than the task alone.\n3.  Non-binding capacity condition. All candidate heads must be capable of becoming informative before scarcity is imposed.\n4.  Head permutation across seeds. Source identity must not be confounded with a privileged encoder index.\n5.  Scarcity ramp with a real constraint. Avoid treating a fixed penalty coefficient as equivalent to a known shared budget.\n6.  Allocation plateau. Measure confirmatory rates only after budget, return and rate trajectories stabilize by a preregistered rule.\n7.  From-scratch diagnostic for selected conditions. If ramped and from-scratch training disagree, report optimization hysteresis.\n8.  Held-out environments/contingencies. The allocation model should predict more than the exact configurations used to fit it.\n\nThese controls are the scientific core. They are more important than decorative model complexity.\n\n------------------------------------------------------------------------\n"}, {"id": "7-what-is-deliberately-excluded-from-the-core-thesis", "title": "7. What is deliberately excluded from the core thesis", "part": null, "html": "<h2 id=\"what-is-deliberately-excluded-from-the-core-thesis\">7. What is deliberately excluded from the core thesis</h2>\n<h3 id=\"no-primary-attention-residual\">No primary attention residual</h3>\n<p>The earlier Sīdus question asked whether attention received excess rate relative to a resource baseline. In the new programme, attention is one source among others. Generic residuals may be inspected, but the thesis does not depend on a special attention effect.</p>\n<h3 id=\"no-strict-metarepresentation-claim\">No strict-metarepresentation claim</h3>\n<p>The messages in this experiment are <strong>internal-state models</strong>. That terminology avoids pretending the project has already solved the contested definition of metarepresentation.</p>\n<h3 id=\"no-causal-abstraction-by-default\">No causal abstraction by default</h3>\n<p>Interchange-intervention/causal-abstraction analysis is elegant but high overhead. Use it only if a robust role-dependent effect has already been established and the high-level role claim materially matters.</p>\n<h3 id=\"no-gaussian-process-bayesian-optimization-by-default\">No Gaussian-process Bayesian optimization by default</h3>\n<p>Start with a small factorial/simplex design. Escalate to Astrocyte only if training evaluations become sufficiently expensive that active surface estimation is justified.</p>\n<h3 id=\"no-human-or-clinical-translation\">No human or clinical translation</h3>\n<p>A human study should not be added as a thesis appendix merely to make the work look neuroscientific. Biological translation becomes meaningful after construct validity and a reproducible computational phenomenon exist.</p>\n<hr />\n", "plain": "7. What is deliberately excluded from the core thesis\n\nNo primary attention residual\n\nThe earlier Sīdus question asked whether attention received excess rate relative to a resource baseline. In the new programme, attention is one source among others. Generic residuals may be inspected, but the thesis does not depend on a special attention effect.\n\nNo strict-metarepresentation claim\n\nThe messages in this experiment are internal-state models. That terminology avoids pretending the project has already solved the contested definition of metarepresentation.\n\nNo causal abstraction by default\n\nInterchange-intervention/causal-abstraction analysis is elegant but high overhead. Use it only if a robust role-dependent effect has already been established and the high-level role claim materially matters.\n\nNo Gaussian-process Bayesian optimization by default\n\nStart with a small factorial/simplex design. Escalate to Astrocyte only if training evaluations become sufficiently expensive that active surface estimation is justified.\n\nNo human or clinical translation\n\nA human study should not be added as a thesis appendix merely to make the work look neuroscientific. Biological translation becomes meaningful after construct validity and a reproducible computational phenomenon exist.\n\n------------------------------------------------------------------------\n"}, {"id": "8-one-optional-extension-choose-at-most-one", "title": "8. One optional extension - choose at most one", "part": null, "html": "<h2 id=\"one-optional-extension---choose-at-most-one\">8. One optional extension - choose at most one</h2>\n<p>If H1-H3 are completed early and cleanly, choose <strong>one</strong> extension.</p>\n<h3 id=\"option-a---strict-metarepresentation-benchmark\">Option A - strict metarepresentation benchmark</h3>\n<p>Add a source whose target is a representational property/process, such as a hidden reliability/source regime affecting a first-order perceptual representation. Test whether a meta-process model beats matched first-order/public-context alternatives.</p>\n<p><strong>Why this option is attractive:</strong> it ties the thesis more directly to the broader programme while preserving a clear computational manipulation.</p>\n<h3 id=\"option-b---recursive-allocator-monitor\">Option B - recursive allocator monitor</h3>\n<p>Add a first-order resource allocator with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi></mrow></msub><annotation encoding=\"application/x-tex\">C_{\\mathrm{base}}</annotation></semantics></math> and a separate monitoring budget <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub><annotation encoding=\"application/x-tex\">C_{\\mathrm{meta}}</annotation></semantics></math>. Compare feedback-enabled and frozen-feedback conditions.</p>\n<p><strong>Why this option is attractive:</strong> it retains the strongest S1-R idea and connects to meta-control.</p>\n<h3 id=\"option-c---causal-topology\">Option C - causal topology</h3>\n<p>Manipulate downstream reach/persistence for one source and ask whether benefit/allocation follows causal position.</p>\n<p><strong>Why this option is attractive:</strong> it tests a candidate organizing principle directly.</p>\n<p><strong>Rule:</strong> completing the core thesis beats attempting two extensions.</p>\n<hr />\n", "plain": "8. One optional extension - choose at most one\n\nIf H1-H3 are completed early and cleanly, choose one extension.\n\nOption A - strict metarepresentation benchmark\n\nAdd a source whose target is a representational property/process, such as a hidden reliability/source regime affecting a first-order perceptual representation. Test whether a meta-process model beats matched first-order/public-context alternatives.\n\nWhy this option is attractive: it ties the thesis more directly to the broader programme while preserving a clear computational manipulation.\n\nOption B - recursive allocator monitor\n\nAdd a first-order resource allocator with C_(base) and a separate monitoring budget C_(meta). Compare feedback-enabled and frozen-feedback conditions.\n\nWhy this option is attractive: it retains the strongest S1-R idea and connects to meta-control.\n\nOption C - causal topology\n\nManipulate downstream reach/persistence for one source and ask whether benefit/allocation follows causal position.\n\nWhy this option is attractive: it tests a candidate organizing principle directly.\n\nRule: completing the core thesis beats attempting two extensions.\n\n------------------------------------------------------------------------\n"}, {"id": "9-stage-gates-and-adaptable-research-schedule", "title": "9. Stage gates and adaptable research schedule", "part": null, "html": "<h2 id=\"stage-gates-and-adaptable-research-schedule\">9. Stage gates and adaptable research schedule</h2>\n<p>The schedule below illustrates an eight-to-nine-month research window. It is not a credit, degree-duration or institutional-timetable claim. Adapt the scope to the host programme’s thesis allocation and supervision; for a shorter window, retain E0-A validation and core H1-H3 while dropping extensions.</p>\n<table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 23%\" />\n<col style=\"width: 30%\" />\n<col style=\"width: 23%\" />\n<col style=\"width: 23%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Stage</th>\n<th style=\"text-align: right;\">Illustrative project window</th>\n<th>Deliverable</th>\n<th>Stop/narrow decision</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Prior art + construct freeze</td>\n<td style=\"text-align: right;\">month 1</td>\n<td>concise literature/claim register; frozen core question</td>\n<td>if E1 is already duplicated exactly, redesign before coding</td>\n</tr>\n<tr class=\"even\">\n<td>Environment + baseline</td>\n<td style=\"text-align: right;\">months 1-2</td>\n<td>compact POMDP; working local controllers; direct-read baseline</td>\n<td>if private states do not matter to performance, redesign task</td>\n</tr>\n<tr class=\"odd\">\n<td>Measurement and gate validation</td>\n<td style=\"text-align: right;\">month 2</td>\n<td>exact-reference <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>,</mo><msub><mi>m</mi><mi>v</mi></msub><mo>,</mo><msub><mi>u</mi><mi>v</mi></msub></mrow><annotation encoding=\"application/x-tex\">r_v,m_v,u_v</annotation></semantics></math> checks and complete-evaluator negative controls before pilot threshold selection</td>\n<td>if quantities or gate decisions are unreliable, simplify the simulator</td>\n</tr>\n<tr class=\"even\">\n<td>Non-binding communication</td>\n<td style=\"text-align: right;\">months 2-3</td>\n<td>all heads demonstrably informative</td>\n<td>if heads cannot learn, do not impose scarcity</td>\n</tr>\n<tr class=\"odd\">\n<td>Scarcity pilot</td>\n<td style=\"text-align: right;\">months 2-3</td>\n<td>stable rate-control manipulation and preliminary trade-offs</td>\n<td><strong>Gate:</strong> if no real trade-off, narrow/stop scarcity claim</td>\n</tr>\n<tr class=\"even\">\n<td>Freeze + preregister analysis</td>\n<td style=\"text-align: right;\">end of month 3</td>\n<td>fixed environment, manipulations, models and seed/precision plan</td>\n<td>no confirmatory tuning afterward</td>\n</tr>\n<tr class=\"odd\">\n<td>Confirmatory E1</td>\n<td style=\"text-align: right;\">months 4-6</td>\n<td>held-out allocation/return data across seeds</td>\n<td>if results are path-dependent, report that rather than hiding it</td>\n</tr>\n<tr class=\"even\">\n<td>Causal-use + topology secondary</td>\n<td style=\"text-align: right;\">months 6-7</td>\n<td>selective interventions; optional topology test</td>\n<td>drop secondary analyses if core is not complete</td>\n</tr>\n<tr class=\"odd\">\n<td>Optional single extension</td>\n<td style=\"text-align: right;\">month 7</td>\n<td>E2 <em>or</em> recursive <em>or</em> topology extension</td>\n<td>optional, never required for success</td>\n</tr>\n<tr class=\"even\">\n<td>Replication + writing</td>\n<td style=\"text-align: right;\">months 8-9</td>\n<td>thesis, code, data, negative-result ledger</td>\n<td>finish before expanding</td>\n</tr>\n</tbody>\n</table>\n<hr />\n", "plain": "9. Stage gates and adaptable research schedule\n\nThe schedule below illustrates an eight-to-nine-month research window. It is not a credit, degree-duration or institutional-timetable claim. Adapt the scope to the host programme’s thesis allocation and supervision; for a shorter window, retain E0-A validation and core H1-H3 while dropping extensions.\n\n  ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Stage                               Illustrative project window Deliverable                                                                                                            Stop/narrow decision\n  --------------------------------- ----------------------------- ---------------------------------------------------------------------------------------------------------------------- ------------------------------------------------------------------------\n  Prior art + construct freeze                            month 1 concise literature/claim register; frozen core question                                                                if E1 is already duplicated exactly, redesign before coding\n\n  Environment + baseline                               months 1-2 compact POMDP; working local controllers; direct-read baseline                                                         if private states do not matter to performance, redesign task\n\n  Measurement and gate validation                         month 2 exact-reference r_(v), m_(v), u_(v) checks and complete-evaluator negative controls before pilot threshold selection   if quantities or gate decisions are unreliable, simplify the simulator\n\n  Non-binding communication                            months 2-3 all heads demonstrably informative                                                                                     if heads cannot learn, do not impose scarcity\n\n  Scarcity pilot                                       months 2-3 stable rate-control manipulation and preliminary trade-offs                                                            Gate: if no real trade-off, narrow/stop scarcity claim\n\n  Freeze + preregister analysis                    end of month 3 fixed environment, manipulations, models and seed/precision plan                                                       no confirmatory tuning afterward\n\n  Confirmatory E1                                      months 4-6 held-out allocation/return data across seeds                                                                           if results are path-dependent, report that rather than hiding it\n\n  Causal-use + topology secondary                      months 6-7 selective interventions; optional topology test                                                                        drop secondary analyses if core is not complete\n\n  Optional single extension                               month 7 E2 or recursive or topology extension                                                                                  optional, never required for success\n\n  Replication + writing                                months 8-9 thesis, code, data, negative-result ledger                                                                             finish before expanding\n  ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\n------------------------------------------------------------------------\n"}, {"id": "10-curriculum-and-methods-alignment", "title": "10. Curriculum and methods alignment", "part": null, "html": "<h2 id=\"curriculum-and-methods-alignment\">10. Curriculum and methods alignment</h2>\n<p>Evaluate a prospective programme by access to the methods the thesis needs, rather than course titles or a particular specialisation:</p>\n<ul>\n<li><strong>Probability, statistics and Bayesian modelling:</strong> uncertainty, calibration and model comparison.</li>\n<li><strong>Machine learning and neural computation:</strong> learned encoders, consumers and representation controls.</li>\n<li><strong>Reinforcement learning and decision processes:</strong> partial observability, policies and task value.</li>\n<li><strong>Information theory and constrained optimisation:</strong> conditional information, rate surrogates and feasibility.</li>\n<li><strong>Causal inference and computational modelling:</strong> selective interventions, identifiability and competing explanations.</li>\n</ul>\n<p>Coursework, supervised reading or prior experience can supply these foundations. Information theory and experimental design must be explicitly covered even if absent from the formal curriculum. Neuromorphic systems, BCI and biological implementation are optional directions, not prerequisites for the synthetic core.</p>\n<hr />\n", "plain": "10. Curriculum and methods alignment\n\nEvaluate a prospective programme by access to the methods the thesis needs, rather than course titles or a particular specialisation:\n\n-   Probability, statistics and Bayesian modelling: uncertainty, calibration and model comparison.\n-   Machine learning and neural computation: learned encoders, consumers and representation controls.\n-   Reinforcement learning and decision processes: partial observability, policies and task value.\n-   Information theory and constrained optimisation: conditional information, rate surrogates and feasibility.\n-   Causal inference and computational modelling: selective interventions, identifiability and competing explanations.\n\nCoursework, supervised reading or prior experience can supply these foundations. Information theory and experimental design must be explicitly covered even if absent from the formal curriculum. Neuromorphic systems, BCI and biological implementation are optional directions, not prerequisites for the synthetic core.\n\n------------------------------------------------------------------------\n"}, {"id": "11-preparation-and-prerequisite-gaps", "title": "11. Preparation and prerequisite gaps", "part": null, "html": "<h2 id=\"preparation-and-prerequisite-gaps\">11. Preparation and prerequisite gaps</h2>\n<p>Assess preparation individually, whether entry is direct or involves a bridging programme. Relevant foundations are programming, calculus, linear algebra, probability and statistics, followed by machine learning, reinforcement learning and computational cognition.</p>\n<p>The dependency sequence is:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">probability and programming</mtext><mo>→</mo><mtext mathvariant=\"normal\">information theory and optimisation</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mo>→</mo><mtext mathvariant=\"normal\">RL/POMDPs and probabilistic modelling</mtext><mo>→</mo><mtext mathvariant=\"normal\">causal experimental design</mtext><mi>.</mi></mtd></mtr></mtable><annotation encoding=\"application/x-tex\">\n\\begin{array}{c}\n\\text{probability and programming}\\rightarrow\\text{information theory and optimisation}\\\\[3pt]\n\\rightarrow\\text{RL/POMDPs and probabilistic modelling}\\rightarrow\\text{causal experimental design}.\n\\end{array}\n</annotation></semantics></math></p>\n<p>Use small implementations to identify gaps before expanding the research environment. A particular admissions pathway or named preparatory course is not a scientific assumption of the thesis.</p>\n<hr />\n", "plain": "11. Preparation and prerequisite gaps\n\nAssess preparation individually, whether entry is direct or involves a bridging programme. Relevant foundations are programming, calculus, linear algebra, probability and statistics, followed by machine learning, reinforcement learning and computational cognition.\n\nThe dependency sequence is:\n\n$$\n\\begin{array}{c}\n\\text{probability and programming}\\rightarrow\\text{information theory and optimisation}\\\\[3pt]\n\\rightarrow\\text{RL/POMDPs and probabilistic modelling}\\rightarrow\\text{causal experimental design}.\n\\end{array}\n$$\n\nUse small implementations to identify gaps before expanding the research environment. A particular admissions pathway or named preparatory course is not a scientific assumption of the thesis.\n\n------------------------------------------------------------------------\n"}, {"id": "12-research-group-and-supervisor-fit", "title": "12. Research-group and supervisor fit", "part": null, "html": "<h2 id=\"research-group-and-supervisor-fit\">12. Research-group and supervisor fit</h2>\n<h3 id=\"implementation-support\">Implementation support</h3>\n<p>Look for experience with learned agents, probabilistic models, representation learning or computational neuroscience, plus sufficient compute and time for independent runs and intervention checks. Complete simulator access is essential during the synthetic phase; a biological dataset is not required.</p>\n<h3 id=\"formal-and-adversarial-support\">Formal and adversarial support</h3>\n<p>Look for supervision that can challenge the construct, assess identifiability and computational tractability, and demand comparisons with established communication, control and metareasoning models. Computational modelling should force theoretical commitments to become testable; relevant methodological precedents include Guest &amp; Martin and van Rooij &amp; Baggio. [1,2]</p>\n<p>One supervisor or a complementary supervisory team may provide this combination. Confirm actual interest and availability rather than inferring them from a lab label. The project fits a host through its methods and question, not through an institutional affiliation.</p>\n<hr />\n", "plain": "12. Research-group and supervisor fit\n\nImplementation support\n\nLook for experience with learned agents, probabilistic models, representation learning or computational neuroscience, plus sufficient compute and time for independent runs and intervention checks. Complete simulator access is essential during the synthetic phase; a biological dataset is not required.\n\nFormal and adversarial support\n\nLook for supervision that can challenge the construct, assess identifiability and computational tractability, and demand comparisons with established communication, control and metareasoning models. Computational modelling should force theoretical commitments to become testable; relevant methodological precedents include Guest & Martin and van Rooij & Baggio. [1,2]\n\nOne supervisor or a complementary supervisory team may provide this combination. Confirm actual interest and availability rather than inferring them from a lab label. The project fits a host through its methods and question, not through an institutional affiliation.\n\n------------------------------------------------------------------------\n"}, {"id": "13-what-to-bring-to-a-prospective-supervisor", "title": "13. What to bring to a prospective supervisor", "part": null, "html": "<h2 id=\"what-to-bring-to-a-prospective-supervisor\">13. What to bring to a prospective supervisor</h2>\n<p>Bring a <strong>two-page study</strong>, not the whole Sīdus history.</p>\n<p>The supervisor-facing package should contain:</p>\n<ol type=\"1\">\n<li>one paragraph of prior art;</li>\n<li>one computational question;</li>\n<li>one architecture diagram;</li>\n<li>H1-H3;</li>\n<li>the direct-read/no-seam/scarcity controls;</li>\n<li>the estimands <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>,</mo><msub><mi>m</mi><mi>v</mi></msub><mo>,</mo><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">r_v,m_v,\\mathcal B(\\mathbf r)</annotation></semantics></math>;</li>\n<li>the primary comparison models;</li>\n<li>one paragraph of kill criteria;</li>\n<li>a compute pilot plan.</li>\n</ol>\n<p>Questions worth asking:</p>\n<ul>\n<li>Is the shared-rate competition experiment already present in a literature we have missed?</li>\n<li>Is the proposed information seam a useful abstraction for this lab, or does it bake in too much modularity?</li>\n<li>What simpler baseline would you demand before accepting the joint resource model?</li>\n<li>Would you consider the artificial-agent result cognitively explanatory, or only an engineering demonstration?</li>\n<li>Which part should be removed to fit a Master’s timeline?</li>\n<li>Which lab infrastructure or existing environment could make the test cheaper and more biologically meaningful?</li>\n</ul>\n<hr />\n", "plain": "13. What to bring to a prospective supervisor\n\nBring a two-page study, not the whole Sīdus history.\n\nThe supervisor-facing package should contain:\n\n1.  one paragraph of prior art;\n2.  one computational question;\n3.  one architecture diagram;\n4.  H1-H3;\n5.  the direct-read/no-seam/scarcity controls;\n6.  the estimands r_(v), m_(v), ℬ(r);\n7.  the primary comparison models;\n8.  one paragraph of kill criteria;\n9.  a compute pilot plan.\n\nQuestions worth asking:\n\n-   Is the shared-rate competition experiment already present in a literature we have missed?\n-   Is the proposed information seam a useful abstraction for this lab, or does it bake in too much modularity?\n-   What simpler baseline would you demand before accepting the joint resource model?\n-   Would you consider the artificial-agent result cognitively explanatory, or only an engineering demonstration?\n-   Which part should be removed to fit a Master’s timeline?\n-   Which lab infrastructure or existing environment could make the test cheaper and more biologically meaningful?\n\n------------------------------------------------------------------------\n"}, {"id": "14-what-not-to-say-in-a-master-s-proposal", "title": "14. What not to say in a Master's proposal", "part": null, "html": "<h2 id=\"what-not-to-say-in-a-masters-proposal\">14. What not to say in a Master’s proposal</h2>\n<p>Do not say:</p>\n<ul>\n<li>“I am developing a theory of metarepresentational ecology.”</li>\n<li>“The brain has a global metarepresentational budget.”</li>\n<li>“This model explains consciousness.”</li>\n<li>“Attention is uniquely worth monitoring.”</li>\n<li>“The model discovers its own self.”</li>\n<li>“The glyphs represent deep computational principles.”</li>\n</ul>\n<p>Say:</p>\n<blockquote>\n<p><strong>I want to test whether a binding information-rate constraint produces predictable competition among models of private internal control states in a modular learning agent, and whether the resulting messages are causally used. This is one candidate mechanism that could later inform a broader construct-first account of internal monitoring.</strong></p>\n</blockquote>\n<p>That is enough.</p>\n<hr />\n", "plain": "14. What not to say in a Master’s proposal\n\nDo not say:\n\n-   “I am developing a theory of metarepresentational ecology.”\n-   “The brain has a global metarepresentational budget.”\n-   “This model explains consciousness.”\n-   “Attention is uniquely worth monitoring.”\n-   “The model discovers its own self.”\n-   “The glyphs represent deep computational principles.”\n\nSay:\n\n  I want to test whether a binding information-rate constraint produces predictable competition among models of private internal control states in a modular learning agent, and whether the resulting messages are causally used. This is one candidate mechanism that could later inform a broader construct-first account of internal monitoring.\n\nThat is enough.\n\n------------------------------------------------------------------------\n"}, {"id": "15-success-conditions", "title": "15. Success conditions", "part": null, "html": "<h2 id=\"success-conditions\">15. Success conditions</h2>\n<p>The Master’s is successful if any one of the following is established cleanly:</p>\n<ul>\n<li>a real shared rate constraint produces stable, reproducible allocation trade-offs;</li>\n<li>a joint benefit model predicts learned allocation out of sample;</li>\n<li>a simpler model explains everything and the larger allocation story is unnecessary;</li>\n<li>rate allocation is strongly path-dependent, showing that the apparent “law” is an optimization history;</li>\n<li>transmitted internal-state information is decodable but behaviorally unused;</li>\n<li>the information seam proves unnecessary in the tested task;</li>\n<li>a controlled topology manipulation changes monitoring value;</li>\n<li>the experiment falsifies a central assumption and thereby prevents the larger programme from building on it.</li>\n</ul>\n<p>The worst outcome is not a null result.</p>\n<p>The worst outcome is an ambiguous system with too many moving parts to know what failed.</p>\n<hr />\n", "plain": "15. Success conditions\n\nThe Master’s is successful if any one of the following is established cleanly:\n\n-   a real shared rate constraint produces stable, reproducible allocation trade-offs;\n-   a joint benefit model predicts learned allocation out of sample;\n-   a simpler model explains everything and the larger allocation story is unnecessary;\n-   rate allocation is strongly path-dependent, showing that the apparent “law” is an optimization history;\n-   transmitted internal-state information is decodable but behaviorally unused;\n-   the information seam proves unnecessary in the tested task;\n-   a controlled topology manipulation changes monitoring value;\n-   the experiment falsifies a central assumption and thereby prevents the larger programme from building on it.\n\nThe worst outcome is not a null result.\n\nThe worst outcome is an ambiguous system with too many moving parts to know what failed.\n\n------------------------------------------------------------------------\n"}, {"id": "16-the-tractable-horizon", "title": "16. The tractable horizon", "part": null, "html": "<h2 id=\"the-tractable-horizon\">16. The tractable horizon</h2>\n<p>The Master’s should end with one of two conclusions.</p>\n<h3 id=\"positive\">Positive</h3>\n<blockquote>\n<p><strong>Under controlled partial access and a binding information-rate constraint, learned internal-state monitoring exhibits a reproducible allocation principle that survives simpler baselines and causal-use tests. This justifies testing whether the same principle applies to stricter metarepresentations or other architectures.</strong></p>\n</blockquote>\n<h3 id=\"negative\">Negative</h3>\n<blockquote>\n<p><strong>The tested scarcity formulation does not produce a stable/generalizable allocation principle, or its effects reduce to simpler inferability, implementation or optimization factors. The broader programme should not treat scarcity as an organizing law without a different empirical basis.</strong></p>\n</blockquote>\n<p>Both conclusions move the programme forward.</p>\n<p>A one-paper thesis that kills a grander idea remains a successful scientific outcome.</p>\n<hr />\n<h1 id=\"references\">References</h1>\n<ol type=\"1\">\n<li>Guest, O., &amp; Martin, A. E. (2021). How computational modeling can force theory building in psychological science. <em>Perspectives on Psychological Science, 16</em>(4), 789-802. https://doi.org/10.1177/1745691620970585</li>\n<li>van Rooij, I., &amp; Baggio, G. (2021). Theory before the test: How to build high-verisimilitude explanatory theories in psychological science. <em>Perspectives on Psychological Science, 16</em>(4), 682-697. https://doi.org/10.1177/1745691620970604</li>\n<li>Russell, S., &amp; Wefald, E. (1991). Principles of metareasoning. <em>Artificial Intelligence, 49</em>(1-3), 361-395. https://doi.org/10.1016/0004-3702(91)90015-C</li>\n<li>Hay, N., Russell, S., Tolpin, D., &amp; Shimony, S. E. (2012). Selecting computations: Theory and applications. <em>Proceedings of UAI 2012</em>, 346-355. https://arxiv.org/abs/1408.2048</li>\n<li>Callaway, F., Gul, S., Krueger, P., Griffiths, T. L., &amp; Lieder, F. (2018). Learning to select computations. <em>Proceedings of UAI 2018</em>. https://auai.org/uai2018/proceedings/papers/269.pdf</li>\n</ol>\n", "plain": "16. The tractable horizon\n\nThe Master’s should end with one of two conclusions.\n\nPositive\n\n  Under controlled partial access and a binding information-rate constraint, learned internal-state monitoring exhibits a reproducible allocation principle that survives simpler baselines and causal-use tests. This justifies testing whether the same principle applies to stricter metarepresentations or other architectures.\n\nNegative\n\n  The tested scarcity formulation does not produce a stable/generalizable allocation principle, or its effects reduce to simpler inferability, implementation or optimization factors. The broader programme should not treat scarcity as an organizing law without a different empirical basis.\n\nBoth conclusions move the programme forward.\n\nA one-paper thesis that kills a grander idea remains a successful scientific outcome.\n\n------------------------------------------------------------------------\n\nReferences\n\n1.  Guest, O., & Martin, A. E. (2021). How computational modeling can force theory building in psychological science. Perspectives on Psychological Science, 16(4), 789-802. https://doi.org/10.1177/1745691620970585\n2.  van Rooij, I., & Baggio, G. (2021). Theory before the test: How to build high-verisimilitude explanatory theories in psychological science. Perspectives on Psychological Science, 16(4), 682-697. https://doi.org/10.1177/1745691620970604\n3.  Russell, S., & Wefald, E. (1991). Principles of metareasoning. Artificial Intelligence, 49(1-3), 361-395. https://doi.org/10.1016/0004-3702(91)90015-C\n4.  Hay, N., Russell, S., Tolpin, D., & Shimony, S. E. (2012). Selecting computations: Theory and applications. Proceedings of UAI 2012, 346-355. https://arxiv.org/abs/1408.2048\n5.  Callaway, F., Gul, S., Krueger, P., Griffiths, T. L., & Lieder, F. (2018). Learning to select computations. Proceedings of UAI 2018. https://auai.org/uai2018/proceedings/papers/269.pdf\n"}], "sourceMd": "source/03_Tractable_Horizon.md", "sourcePdf": "source/03_Tractable_Horizon.pdf"}, {"roman": "IV", "short": "E0 Protocol", "title": "IV. E0 Construct-Validity Protocol", "sections": [{"id": "frontpiece", "title": "Opening", "part": null, "html": "<h1 id=\"sīdus-towards-metarepresentational-ecology\">Sīdus: Towards Metarepresentational Ecology</h1>\n<h2 id=\"iv.-e0-construct-validity-protocol\">IV. E0 Construct-Validity Protocol</h2>\n<h3 id=\"two-stage-mock-up-for-validating-internal-state-monitoring-before-testing-strict-metarepresentation\">Two-stage mock-up for validating internal-state monitoring before testing strict metarepresentation</h3>\n<p><strong>Working methods companion - August 2026</strong><br />\n<strong>Status:</strong> pre-experimental protocol. E0-A is specified strongly enough to guide implementation. E0-B is deliberately provisional and should be refined against the metarepresentation literature before confirmatory use.</p>\n<blockquote>\n<p><strong>Purpose:</strong> establish construct validity before introducing shared bottlenecks, multi-source competition, causal-topology claims, recursive allocator monitoring, or any ecology-level inference.</p>\n</blockquote>\n<hr />\n", "plain": "Sīdus: Towards Metarepresentational Ecology\n\nIV. E0 Construct-Validity Protocol\n\nTwo-stage mock-up for validating internal-state monitoring before testing strict metarepresentation\n\nWorking methods companion - August 2026\nStatus: pre-experimental protocol. E0-A is specified strongly enough to guide implementation. E0-B is deliberately provisional and should be refined against the metarepresentation literature before confirmatory use.\n\n  Purpose: establish construct validity before introducing shared bottlenecks, multi-source competition, causal-topology claims, recursive allocator monitoring, or any ecology-level inference.\n\n------------------------------------------------------------------------\n"}, {"id": "0-scope-and-decision-rule", "title": "0. Scope and decision rule", "part": null, "html": "<h2 id=\"scope-and-decision-rule\">0. Scope and decision rule</h2>\n<p>E0 is split into two independent stages because <strong>internal-state monitoring is not automatically metarepresentation</strong>.</p>\n<ol type=\"a\">\n<li><p><strong>E0-A - Monitoring substrate validity</strong> asks whether a private internal state is genuinely hidden, incrementally represented, and causally used.</p></li>\n<li><p><strong>E0-B - Metarepresentational discrimination</strong> asks whether a candidate higher-order signal represents a property or process of a first-order representation rather than merely tracking an internal state, public context, or another feedforward transformation.</p></li>\n</ol>\n<p>The stages license different claims:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Stage passed</th>\n<th>Claim licensed</th>\n<th>Claim not licensed</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>E0-A</td>\n<td>a causally used internal-state monitoring channel exists</td>\n<td>the signal is a strict metarepresentation</td>\n</tr>\n<tr class=\"even\">\n<td>E0-B</td>\n<td>the tested architecture satisfies the selected operational criterion for property/process metarepresentation</td>\n<td>metarepresentation is a natural kind, domain-general, conscious, or ecologically organized</td>\n</tr>\n</tbody>\n</table>\n<p><strong>E1 scarcity requires E0-A.</strong> Strict-metarepresentation experiments require E0-B. The broader programme should not infer metarepresentational ecology from E0-A alone.</p>\n<p><strong>Units.</strong> All rates, entropies and information quantities in this protocol are in <strong>bits</strong> (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mo>log</mo><mn>2</mn></msub><annotation encoding=\"application/x-tex\">\\log_2</annotation></semantics></math>), per the standing conventions of Document I, §11A. Any implementation quantity produced in nats is converted at the point of reporting, not at the point of reading.</p>\n<hr />\n", "plain": "0. Scope and decision rule\n\nE0 is split into two independent stages because internal-state monitoring is not automatically metarepresentation.\n\na)  E0-A - Monitoring substrate validity asks whether a private internal state is genuinely hidden, incrementally represented, and causally used.\n\nb)  E0-B - Metarepresentational discrimination asks whether a candidate higher-order signal represents a property or process of a first-order representation rather than merely tracking an internal state, public context, or another feedforward transformation.\n\nThe stages license different claims:\n\n  -----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Stage passed            Claim licensed                                                                                                 Claim not licensed\n  ----------------------- -------------------------------------------------------------------------------------------------------------- --------------------------------------------------------------------------------------------\n  E0-A                    a causally used internal-state monitoring channel exists                                                       the signal is a strict metarepresentation\n\n  E0-B                    the tested architecture satisfies the selected operational criterion for property/process metarepresentation   metarepresentation is a natural kind, domain-general, conscious, or ecologically organized\n  -----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nE1 scarcity requires E0-A. Strict-metarepresentation experiments require E0-B. The broader programme should not infer metarepresentational ecology from E0-A alone.\n\nUnits. All rates, entropies and information quantities in this protocol are in bits (log₂), per the standing conventions of Document I, §11A. Any implementation quantity produced in nats is converted at the point of reporting, not at the point of reading.\n\n------------------------------------------------------------------------\n"}, {"id": "1-core-architecture", "title": "1. Core architecture", "part": "PART I - E0-A: MONITORING SUBSTRATE VALIDITY", "html": "<h2 id=\"core-architecture\">1. Core architecture</h2>\n<p>Let the coordinator have ordinary public information</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℐ</mi><mi>t</mi></msub><mo>=</mo><mo stretchy=\"false\" form=\"prefix\">{</mo><msub><mi>o</mi><mrow><mo>≤</mo><mi>t</mi></mrow></msub><mo>,</mo><msub><mi>a</mi><mrow><mo>&lt;</mo><mi>t</mi></mrow></msub><mo>,</mo><msubsup><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow><mi>U</mi></msubsup><mo stretchy=\"false\" form=\"postfix\">}</mo><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\mathcal I_t = \\{o_{\\le t}, a_{&lt;t}, h^{U}_{t-1}\\},\n</annotation></semantics></math></p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>o</mi><mrow><mo>≤</mo><mi>t</mi></mrow></msub><annotation encoding=\"application/x-tex\">o_{\\le t}</annotation></semantics></math> is observation history, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>a</mi><mrow><mo>&lt;</mo><mi>t</mi></mrow></msub><annotation encoding=\"application/x-tex\">a_{&lt;t}</annotation></semantics></math> is action history, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msubsup><mi>h</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow><mi>U</mi></msubsup><annotation encoding=\"application/x-tex\">h^{U}_{t-1}</annotation></semantics></math> is the coordinator’s recurrent state before the special monitoring message arrives.</p>\n<p>A specialist process has a private internal state</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∈</mo><msub><mi>𝒞</mi><mi>v</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nC_{v,t}\\in\\mathcal C_v.\n</annotation></semantics></math></p>\n<p>A source-specific encoder produces an internal-state message</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>=</mo><msub><mi>E</mi><mi>v</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>,</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nS_{v,t}=E_v(C_{v,t},\\mathcal I_t).\n</annotation></semantics></math></p>\n<p>The coordinator/consumer <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U</mi><annotation encoding=\"application/x-tex\">U</annotation></semantics></math> receives <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><annotation encoding=\"application/x-tex\">S_{v,t}</annotation></semantics></math> in addition to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ℐ</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathcal I_t</annotation></semantics></math>.</p>\n<p>The intended causal chain is:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℐ</mi><mi>t</mi></msub><mspace width=\"1.0em\"></mspace><mo stretchy=\"false\" form=\"postfix\">‖</mo><mspace width=\"1.0em\"></mspace><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>→</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>→</mo><mi>U</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathcal I_t \\quad\\Vert\\quad C_{v,t} \\rightarrow S_{v,t} \\rightarrow U.\n</annotation></semantics></math></p>\n<p>E0-A asks three distinct questions:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mrow><mtext mathvariant=\"normal\">hiddenness</mtext><mo>≠</mo><mtext mathvariant=\"normal\">informativeness</mtext><mo>≠</mo><mtext mathvariant=\"normal\">causal use</mtext><mi>.</mi></mrow></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{\\text{hiddenness} \\neq \\text{informativeness} \\neq \\text{causal use}.}\n</annotation></semantics></math></p>\n<hr />\n", "plain": "1. Core architecture\n\nLet the coordinator have ordinary public information\n\nℐ_(t) = {o_( ≤ t), a_( < t), h_(t − 1)^(U)},\n\nwhere o_( ≤ t) is observation history, a_( < t) is action history, and h_(t − 1)^(U) is the coordinator’s recurrent state before the special monitoring message arrives.\n\nA specialist process has a private internal state\n\nC_(v, t) ∈ 𝒞_(v).\n\nA source-specific encoder produces an internal-state message\n\nS_(v, t) = E_(v)(C_(v, t),ℐ_(t)).\n\nThe coordinator/consumer U receives S_(v, t) in addition to ℐ_(t).\n\nThe intended causal chain is:\n\nℐ_(t)  ‖  C_(v, t) → S_(v, t) → U.\n\nE0-A asks three distinct questions:\n\n$$\n\\boxed{\\text{hiddenness} \\neq \\text{informativeness} \\neq \\text{causal use}.}\n$$\n\n------------------------------------------------------------------------\n"}, {"id": "2-gate-a1-residual-hiddenness-and-potential-value", "title": "2. Gate A1 - Residual hiddenness and potential value", "part": null, "html": "<h2 id=\"gate-a1---residual-hiddenness-and-potential-value\">2. Gate A1 - Residual hiddenness and potential value</h2>\n<h3 id=\"residual-hiddenness\">2.1 Residual hiddenness</h3>\n<p>Define residual uncertainty:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mo>=</mo><mfrac><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nu_v=\n\\frac{H(C_{v,t}\\mid\\mathcal I_t)}{H(C_{v,t})},\n\\qquad H(C_{v,t})&gt;0.\n</annotation></semantics></math></p>\n<p>The purpose is not to require independence between <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math> and public history. It is to verify that a non-trivial informational problem remains after ordinary public information is used.</p>\n<h3 id=\"exact-reference-and-practical-estimator\">2.2 Exact reference and practical estimator</h3>\n<p><strong>Exact reference first.</strong> The initial E0-A simulator must permit exact enumeration or exact filtering of the joint distribution, including the coordinator’s pre-message information state. Observing realized ground-truth states does not by itself make their conditional distributions tractable. Compute <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">H(C_v\\mid\\mathcal I)</annotation></semantics></math> and the Bayes public-only/direct-read task values exactly in this reference environment. These quantities anchor A1; gains over a bounded public-only consumer are reported separately as computational accessibility, not evidence of hidden information.</p>\n<p>For later environments where exact conditionals are unavailable, validate the measurement procedure against the exact reference before using it to support gates. Fit a calibrated held-out predictor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mn>0</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>c</mi><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\hat p_0(c\\mid\\mathcal I_t)</annotation></semantics></math> and estimate predictive cross-entropy:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mrow><mi>C</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover><mn>0</mn></msub><mo>=</mo><msub><mi>𝔼</mi><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mo>−</mo><msub><mo>log</mo><mn>2</mn></msub><msub><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mn>0</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\widehat{CE}_0\n=\n\\mathbb E_{\\mathrm{test}}\n[-\\log_2 \\hat p_0(C_{v,t}\\mid\\mathcal I_t)].\n</annotation></semantics></math></p>\n<p>Population cross-entropy equals conditional entropy plus non-negative decoder approximation error; a finite held-out average is itself uncertain. Positive cross-entropy therefore supplies no lower bound proving hiddenness. Report approximation and sampling error separately. If these cannot be bounded adequately for the gate decision, report <strong>inconclusive</strong> rather than pass.</p>\n<h3 id=\"direct-read-headroom\">2.3 Direct-read headroom</h3>\n<p>Residual hiddenness alone is insufficient. Give the coordinator direct access to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><annotation encoding=\"application/x-tex\">C_{v,t}</annotation></semantics></math> in an oracle condition and measure the gain over public information alone:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mi>J</mi><mrow><mrow><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi></mrow><mo>,</mo><mi>v</mi></mrow></msub><mo>=</mo><mi>J</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo>,</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>J</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\Delta J_{\\mathrm{oracle},v}\n=\nJ(\\mathcal I_t,C_{v,t})-J(\\mathcal I_t).\n</annotation></semantics></math></p>\n<p>A source can be hidden yet irrelevant. E0-A therefore requires both:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\nH(C_v\\mid\\mathcal I)&gt;0\n</annotation></semantics></math></p>\n<p>and a preregistered minimally meaningful oracle benefit.</p>\n<h3 id=\"gate-a1\">2.4 Gate A1</h3>\n<p>Pass only if:</p>\n<ol type=\"1\">\n<li>residual hiddenness is reliably non-zero under the intended high-privacy condition;</li>\n<li>the direct-read oracle shows that information about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math> can matter to the task;</li>\n<li>public shortcut performance is quantified, not assumed absent.</li>\n</ol>\n<p><strong>Thresholds such as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mo>≥</mo><mn>0.25</mn></mrow><annotation encoding=\"application/x-tex\">u_v\\ge0.25</annotation></semantics></math> should not be fixed by aesthetics.</strong> First validate the estimators and complete gate evaluator against exact ground truth, including negative controls; only then calibrate pilot thresholds from task headroom and freeze them before independent confirmatory runs. A pilot with an inadequate decoder can bake its bias into the threshold; freezing does not remove that bias.</p>\n<hr />\n", "plain": "2. Gate A1 - Residual hiddenness and potential value\n\n2.1 Residual hiddenness\n\nDefine residual uncertainty:\n\n$$\nu_v=\n\\frac{H(C_{v,t}\\mid\\mathcal I_t)}{H(C_{v,t})},\n\\qquad H(C_{v,t})>0.\n$$\n\nThe purpose is not to require independence between C_(v) and public history. It is to verify that a non-trivial informational problem remains after ordinary public information is used.\n\n2.2 Exact reference and practical estimator\n\nExact reference first. The initial E0-A simulator must permit exact enumeration or exact filtering of the joint distribution, including the coordinator’s pre-message information state. Observing realized ground-truth states does not by itself make their conditional distributions tractable. Compute H(C_(v)∣ℐ) and the Bayes public-only/direct-read task values exactly in this reference environment. These quantities anchor A1; gains over a bounded public-only consumer are reported separately as computational accessibility, not evidence of hidden information.\n\nFor later environments where exact conditionals are unavailable, validate the measurement procedure against the exact reference before using it to support gates. Fit a calibrated held-out predictor p̂₀(c∣ℐ_(t)) and estimate predictive cross-entropy:\n\n$$\n\\widehat{CE}_0\n=\n\\mathbb E_{\\mathrm{test}}\n[-\\log_2 \\hat p_0(C_{v,t}\\mid\\mathcal I_t)].\n$$\n\nPopulation cross-entropy equals conditional entropy plus non-negative decoder approximation error; a finite held-out average is itself uncertain. Positive cross-entropy therefore supplies no lower bound proving hiddenness. Report approximation and sampling error separately. If these cannot be bounded adequately for the gate decision, report inconclusive rather than pass.\n\n2.3 Direct-read headroom\n\nResidual hiddenness alone is insufficient. Give the coordinator direct access to C_(v, t) in an oracle condition and measure the gain over public information alone:\n\nΔJ_(oracle, v) = J(ℐ_(t),C_(v, t)) − J(ℐ_(t)).\n\nA source can be hidden yet irrelevant. E0-A therefore requires both:\n\nH(C_(v)∣ℐ) > 0\n\nand a preregistered minimally meaningful oracle benefit.\n\n2.4 Gate A1\n\nPass only if:\n\n1.  residual hiddenness is reliably non-zero under the intended high-privacy condition;\n2.  the direct-read oracle shows that information about C_(v) can matter to the task;\n3.  public shortcut performance is quantified, not assumed absent.\n\nThresholds such as u_(v) ≥ 0.25 should not be fixed by aesthetics. First validate the estimators and complete gate evaluator against exact ground truth, including negative controls; only then calibrate pilot thresholds from task headroom and freeze them before independent confirmatory runs. A pilot with an inadequate decoder can bake its bias into the threshold; freezing does not remove that bias.\n\n------------------------------------------------------------------------\n"}, {"id": "3-gate-a2-incremental-transmission", "title": "3. Gate A2 - Incremental transmission", "part": null, "html": "<h2 id=\"gate-a2---incremental-transmission\">3. Gate A2 - Incremental transmission</h2>\n<h3 id=\"target-quantity\">3.1 Target quantity</h3>\n<p>Define the incremental information delivered by the monitoring message:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>=</mo><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>;</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nm_v\n=\nI(C_{v,t};S_{v,t}\\mid\\mathcal I_t).\n</annotation></semantics></math></p>\n<p>Equivalently,</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>=</mo><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo>,</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nm_v\n=\nH(C_{v,t}\\mid\\mathcal I_t)\n-\nH(C_{v,t}\\mid\\mathcal I_t,S_{v,t}).\n</annotation></semantics></math></p>\n<h3 id=\"practical-log-loss-estimator\">3.2 Practical log-loss estimator</h3>\n<p>Fit two matched auxiliary predictors on held-out data:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mn>0</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>c</mi><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mn>1</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>c</mi><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo>,</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\hat p_0(c\\mid\\mathcal I_t),\n\\qquad\n\\hat p_1(c\\mid\\mathcal I_t,S_{v,t}).\n</annotation></semantics></math></p>\n<p>Then estimate:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>m</mi><mo accent=\"true\">̂</mo></mover><mi>v</mi></msub><mo>=</mo><msub><mover><mrow><mi>C</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover><mn>0</mn></msub><mo>−</mo><msub><mover><mrow><mi>C</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover><mn>1</mn></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\hat m_v\n=\n\\widehat{CE}_0-\n\\widehat{CE}_1.\n</annotation></semantics></math></p>\n<p>Use exact <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math> as the initial simulator’s reference. The log-loss difference is a decoder-dependent proxy, not automatically conditional mutual information. At population level,</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><msub><mi>E</mi><mn>0</mn></msub><mo>−</mo><mi>C</mi><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><msub><mi>m</mi><mi>v</mi></msub><mo>+</mo><msub><mi>ϵ</mi><mn>0</mn></msub><mo>−</mo><msub><mi>ϵ</mi><mn>1</mn></msub><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\nCE_0-CE_1=m_v+\\epsilon_0-\\epsilon_1,\n</annotation></semantics></math></p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ϵ</mi><mi>i</mi></msub><mo>≥</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\epsilon_i\\ge0</annotation></semantics></math> is decoder <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>’s expected conditional KL approximation error. Matching classes and nested features does not equalize those errors. For public fair bits <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>,</mo><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">A,B</annotation></semantics></math>, target <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><mo>=</mo><mi>A</mi><mo>⊕</mo><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">C=A\\oplus B</annotation></semantics></math>, and message <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mo>=</mo><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">S=C</annotation></semantics></math>, exact hiddenness and incremental information are zero, yet linear logistic decoders can report nearly one apparent bit because the added message makes XOR linearly readable. This can falsely support both A1 and A2; it does not establish a false pass of all four gates, since a correct A3 support check rejects the alternative-state construction.</p>\n<p>Validate the proxy against exact values across known-positive, public-shortcut and collapsed-channel controls, and report approximation error, calibration and cross-validation uncertainty before threshold selection. The complete evaluator must also reject informative-but-unused and forbidden-access controls and distinguish redundant consumer reliance from informational benefit.</p>\n<h3 id=\"rate-spent\">3.3 Rate spent</h3>\n<p>For a variational channel,</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"false\" form=\"postfix\">‖</mo><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v=\n\\mathbb E\n\\left[\nD_{KL}\n\\left(\nq(S_v\\mid C_v,\\mathcal I)\n\\Vert\np(S_v\\mid\\mathcal I)\n\\right)\n\\right].\n</annotation></semantics></math></p>\n<p>Under the intended variational construction,</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≤</mo><msub><mi>r</mi><mi>v</mi></msub><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\nI(C_v;S_v\\mid\\mathcal I)\\le r_v,\n</annotation></semantics></math></p>\n<p>but finite-sample estimates need not obey the inequality exactly.</p>\n<p>The central distinction remains:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>≠</mo><msub><mi>m</mi><mi>v</mi></msub><mi>.</mi></mrow></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{r_v\\neq m_v.}\n</annotation></semantics></math></p>\n<p>A channel may consume rate while adding little useful information.</p>\n<h3 id=\"a-decomposition-of-the-rateinformation-gap\">3.3a Decomposition of the rate–information gap</h3>\n<p><strong>[R2 · correction, August 2026 review pass]</strong></p>\n<p>The inequality <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>≤</mo><msub><mi>r</mi><mi>v</mi></msub></mrow><annotation encoding=\"application/x-tex\">m_v\\le r_v</annotation></semantics></math> was previously asserted as a property of “the intended variational construction.” It is in fact an identity plus a non-negative term, and writing it out converts a qualitative diagnostic into two estimable numbers.</p>\n<p>For any <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>q</mi><annotation encoding=\"application/x-tex\">q</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>,</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtable><mtr><mtd columnalign=\"right\" style=\"text-align: right\"><msub><mi>𝔼</mi><mi>q</mi></msub><mspace width=\"-0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mspace width=\"-0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mo stretchy=\"false\" form=\"postfix\">‖</mo><mspace width=\"0.167em\"></mspace><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mtd><mtd columnalign=\"left\" style=\"text-align: left\"><mo>=</mo><munder><munder><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mo accent=\"true\">⏟</mo></munder><msub><mi>m</mi><mi>v</mi></msub></munder></mtd></mtr><mtr><mtd columnalign=\"right\" style=\"text-align: right\"></mtd><mtd columnalign=\"left\" style=\"text-align: left\"><mspace width=\"1.0em\"></mspace><mo>+</mo><munder><munder><mrow><msub><mi>𝔼</mi><mi>ℐ</mi></msub><mspace width=\"0.167em\"></mspace><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mspace width=\"-0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mo stretchy=\"false\" form=\"postfix\">‖</mo><mspace width=\"0.167em\"></mspace><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mo accent=\"true\">⏟</mo></munder><mrow><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mspace width=\"0.278em\"></mspace><mo>≥</mo><mspace width=\"0.278em\"></mspace><mn>0</mn></mrow></munder><mi>.</mi></mtd></mtr></mtable><annotation encoding=\"application/x-tex\">\n\\begin{aligned}\n\\mathbb E_q\\!\\left[D_{KL}\\!\\left(q(S_v\\mid C_v,\\mathcal I)\\,\\Vert\\,p(S_v\\mid\\mathcal I)\\right)\\right]\n&amp;=\\underbrace{I(C_v;S_v\\mid\\mathcal I)}_{m_v}\\\\[0.5em]\n&amp;\\quad+\\underbrace{\\mathbb E_{\\mathcal I}\\,D_{KL}\\!\\left(q(S_v\\mid\\mathcal I)\\,\\Vert\\,p(S_v\\mid\\mathcal I)\\right)}_{\\Delta_v^{\\mathrm{prior}}\\;\\ge\\;0}.\n\\end{aligned}\n</annotation></semantics></math></p>\n<p>So</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mrow><mspace width=\"0.167em\"></mspace><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><msub><mi>m</mi><mi>v</mi></msub><mo>+</mo><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mo>,</mo><mspace width=\"2.0em\"></mspace><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant
