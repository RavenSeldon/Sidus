a genuinely multiterminal lossless E1 special case, the relevant object is the full Slepian–Wolf rate region (conditional on ℐ when that information is shared), not a collection of independent per-source conditional entropies. Under lossy coding the operative rate depends on the distortion criterion, and the Wyner–Ziv rate-distortion function involves a minimisation over an auxiliary variable subject to a distortion constraint when side information is decoder-only (Wyner & Ziv 1976). So\n\n$$\nu_v=\\frac{H(C_v\\mid\\mathcal I)}{H(C_v)}\n$$\n\nis a well-motivated dimensionless normalised residual-uncertainty measure. In the single-source lossless limit it can be interpreted as the minimum conditional rate normalised by H(C_(v)); it is not itself a coding rate. It is not “the Wyner–Ziv rate,” and the earlier claim that it was is withdrawn.\n\nHow much is actually solved. Less than the earlier version implied. The general multiterminal lossy source-coding problem has been open for decades. Solved cases relevant here are narrow and specific:\n\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Case                                                                                        Status                            Source\n  ------------------------------------------------------------------------------------------- --------------------------------- ------------------------------------------------------\n  Distributed lossless coding of correlated sources                                           solved rate region                Slepian & Wolf (1973)\n\n  Single-source lossy coding with correlated side information available only at the decoder   solved rate-distortion function   Wyner & Ziv (1976)\n\n  Scalar quadratic-Gaussian CEO                                                               solved                            Oohama (1998); Prabhakaran, Tse & Ramchandran (2004)\n\n  Two-encoder quadratic-Gaussian                                                              solved                            Wagner, Tavildar & Viswanath (2008)\n\n  Vector Gaussian CEO, quadratic distortion                                                   outer bound generally not tight   Ekrem & Ulukus (2014)\n\n  General multiterminal lossy                                                                 open                              —\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nWhat this changes, and what it does not. It removes a false comfort: E1 does not inherit an analytic solution. It sits adjacent to an open problem class, which is a more defensible position than the one previously claimed, and it makes the calibration requirement sharper rather than weaker. The validation target must be a deliberately constructed solved special case — a scalar quadratic-Gaussian configuration whose optimum is known — used to check that the learned allocation recovers a known answer where one exists. A pipeline that cannot do that has not earned interpretation where no answer is known.\n\nThe surviving candidate contribution [N?] is narrow: allocation over non-Gaussian, low-cardinality, agent-generated control states, with expected return as the distortion measure, where the encoders are learned rather than designed. Per C5 below, this remains a candidate contribution rather than a novelty claim until its own prior-art row has been systematically searched.\n"}, {"id": "9-methodological-constraints-for-the-new-programme", "title": "9. Methodological constraints for the new programme", "part": null, "html": "<h2 id=\"methodological-constraints-for-the-new-programme\">9. Methodological constraints for the new programme</h2>\n<p>The strongest constraints from the old master are retained but rewritten around constructs rather than consciousness.</p>\n<h3 id=\"c1---declare-the-construct-and-target\">C1 - Declare the construct and target</h3>\n<p>Every study states:</p>\n<ol type=\"1\">\n<li>what is being represented or monitored;</li>\n<li>whether the target is an ordinary internal state, a first-order representation, or a representational process;</li>\n<li>which operational definition of metarepresentation is being tested;</li>\n<li>what observable pattern would distinguish it from a simpler first-order transformation.</li>\n</ol>\n<h3 id=\"c2---keep-levels-and-timescales-separate\">C2 - Keep levels and timescales separate</h3>\n<p>Fast activation states, learned parameters, process descriptions, capacities, graph topology and representational geometry do not share one time index merely because they can all be written as vectors.</p>\n<h3 id=\"c3---local-models-under-identifiability\">C3 - Local models under identifiability</h3>\n<p>A study names at least one competing model that predicts a different intervention effect. If two models imply indistinguishable observations under the available interventions, the study does not adjudicate them.</p>\n<h3 id=\"c4---causal-use-over-decodability\">C4 - Causal use over decodability</h3>\n<p>A representation that is readable but behaviorally unused does not earn the claimed control function.</p>\n<h3 id=\"c5---deposited-novelty\">C5 - Deposited novelty</h3>\n<p>No claim is called new because it was independently derived. Potential novelty remains <strong>[N?]</strong> until the relevant prior-art row is systematically searched.</p>\n<h3 id=\"c6---method-proportional-to-evidence\">C6 - Method proportional to evidence</h3>\n<p>The methodological overhead cannot outrun the existence of the phenomenon. Simple pilots precede GP surrogate modelling, causal abstraction, large sweeps or human translation. A sophisticated estimator does not rescue a nonexistent effect.</p>\n<hr />\n", "plain": "9. Methodological constraints for the new programme\n\nThe strongest constraints from the old master are retained but rewritten around constructs rather than consciousness.\n\nC1 - Declare the construct and target\n\nEvery study states:\n\n1.  what is being represented or monitored;\n2.  whether the target is an ordinary internal state, a first-order representation, or a representational process;\n3.  which operational definition of metarepresentation is being tested;\n4.  what observable pattern would distinguish it from a simpler first-order transformation.\n\nC2 - Keep levels and timescales separate\n\nFast activation states, learned parameters, process descriptions, capacities, graph topology and representational geometry do not share one time index merely because they can all be written as vectors.\n\nC3 - Local models under identifiability\n\nA study names at least one competing model that predicts a different intervention effect. If two models imply indistinguishable observations under the available interventions, the study does not adjudicate them.\n\nC4 - Causal use over decodability\n\nA representation that is readable but behaviorally unused does not earn the claimed control function.\n\nC5 - Deposited novelty\n\nNo claim is called new because it was independently derived. Potential novelty remains [N?] until the relevant prior-art row is systematically searched.\n\nC6 - Method proportional to evidence\n\nThe methodological overhead cannot outrun the existence of the phenomenon. Simple pilots precede GP surrogate modelling, causal abstraction, large sweeps or human translation. A sophisticated estimator does not rescue a nonexistent effect.\n\n------------------------------------------------------------------------\n"}, {"id": "10-doerig-retained-as-adversarial-pressure-not-ontology", "title": "10. Doerig retained as adversarial pressure, not ontology", "part": null, "html": "<h2 id=\"doerig-retained-as-adversarial-pressure-not-ontology\">10. Doerig retained as adversarial pressure, not ontology</h2>\n<p>The programme borrows the empirical spirit of Doerig’s hard criteria without pretending that consciousness-specific problems remain unchanged after phenomenality is removed.</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Doerig-style pressure</th>\n<th>Construct-first analogue</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>functionally equivalent alternatives</td>\n<td>create matched systems where simple first-order transformations and genuine candidate meta-processes make different intervention predictions</td>\n</tr>\n<tr class=\"even\">\n<td>unfolding / internal-organization concern</td>\n<td>require internal topology to generate causally testable consequences, not merely different diagrams</td>\n</tr>\n<tr class=\"odd\">\n<td>small-network problem</td>\n<td>prevent the definition of metarepresentation from becoming so permissive that every multilayer transformation qualifies</td>\n</tr>\n<tr class=\"even\">\n<td>other-systems problem</td>\n<td>state what should generalize across architectures, species or task domains before looking at results</td>\n</tr>\n<tr class=\"odd\">\n<td>falsifiability</td>\n<td>preregister what would count against each local hypothesis</td>\n</tr>\n</tbody>\n</table>\n<p>Doerig is therefore an <strong>empirical acid test</strong>. It is not the metaphysical spine of the programme.</p>\n<hr />\n", "plain": "10. Doerig retained as adversarial pressure, not ontology\n\nThe programme borrows the empirical spirit of Doerig’s hard criteria without pretending that consciousness-specific problems remain unchanged after phenomenality is removed.\n\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Doerig-style pressure                       Construct-first analogue\n  ------------------------------------------- ----------------------------------------------------------------------------------------------------------------------------------------------\n  functionally equivalent alternatives        create matched systems where simple first-order transformations and genuine candidate meta-processes make different intervention predictions\n\n  unfolding / internal-organization concern   require internal topology to generate causally testable consequences, not merely different diagrams\n\n  small-network problem                       prevent the definition of metarepresentation from becoming so permissive that every multilayer transformation qualifies\n\n  other-systems problem                       state what should generalize across architectures, species or task domains before looking at results\n\n  falsifiability                              preregister what would count against each local hypothesis\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nDoerig is therefore an empirical acid test. It is not the metaphysical spine of the programme.\n\n------------------------------------------------------------------------\n"}, {"id": "11-what-is-currently-established-suggested-and-open", "title": "11. What is currently established, suggested, and open", "part": null, "html": "<h2 id=\"what-is-currently-established-suggested-and-open\">11. What is currently established, suggested, and open</h2>\n<h3 id=\"established-or-strongly-literature-supported\">Established or strongly literature-supported</h3>\n<ul>\n<li>Cognitive systems exhibit metacognitive monitoring and control.</li>\n<li>Confidence and uncertainty can be computationally and neurally dissociated from first-order performance.</li>\n<li>Metacognition shows mixtures of shared and domain-specific organization.</li>\n<li>Meta-control monitors and regulates lower-level control processes.</li>\n<li>Limited computational resources and resource allocation are established modelling problems.</li>\n<li>Distributed modules can communicate through restricted channels in engineered neural architectures.</li>\n<li>Rate-distortion and distributed source coding provide mature mathematical machinery.</li>\n<li>Causal abstraction offers formal methods for testing high-level role claims in artificial systems.</li>\n</ul>\n<h3 id=\"suggested-but-not-established-as-one-framework\">Suggested but not established as one framework</h3>\n<ul>\n<li>Internal monitoring systems may interact through shared constraints.</li>\n<li>Some relations may be better described as an ecology than as isolated modules.</li>\n<li>Causal topology may predict which internal processes are worth modelling.</li>\n<li>Cross-domain confidence may provide a common currency while retaining domain-specific sensitivity.</li>\n<li>Recursive monitoring of control may improve future control under specific conditions.</li>\n</ul>\n<h3 id=\"open\">Open</h3>\n<ul>\n<li>Whether strict metarepresentations, under a defensible definition, are widespread in biological cognition.</li>\n<li>Whether there is any shared metarepresentational resource budget in brains.</li>\n<li>Whether one or several resource currencies govern internal monitoring.</li>\n<li>Whether ecology-level relational laws generalize across tasks and architectures.</li>\n<li>Whether higher-order representational order has any privileged relation to control or learning.</li>\n<li>Whether process metarepresentations have identifiable neural implementations.</li>\n<li>Whether this programme adds predictive value beyond existing metacognition, meta-control, resource-rational and modular-computation literatures.</li>\n<li>Any constitutive relationship to phenomenality.</li>\n</ul>\n<hr />\n", "plain": "11. What is currently established, suggested, and open\n\nEstablished or strongly literature-supported\n\n-   Cognitive systems exhibit metacognitive monitoring and control.\n-   Confidence and uncertainty can be computationally and neurally dissociated from first-order performance.\n-   Metacognition shows mixtures of shared and domain-specific organization.\n-   Meta-control monitors and regulates lower-level control processes.\n-   Limited computational resources and resource allocation are established modelling problems.\n-   Distributed modules can communicate through restricted channels in engineered neural architectures.\n-   Rate-distortion and distributed source coding provide mature mathematical machinery.\n-   Causal abstraction offers formal methods for testing high-level role claims in artificial systems.\n\nSuggested but not established as one framework\n\n-   Internal monitoring systems may interact through shared constraints.\n-   Some relations may be better described as an ecology than as isolated modules.\n-   Causal topology may predict which internal processes are worth modelling.\n-   Cross-domain confidence may provide a common currency while retaining domain-specific sensitivity.\n-   Recursive monitoring of control may improve future control under specific conditions.\n\nOpen\n\n-   Whether strict metarepresentations, under a defensible definition, are widespread in biological cognition.\n-   Whether there is any shared metarepresentational resource budget in brains.\n-   Whether one or several resource currencies govern internal monitoring.\n-   Whether ecology-level relational laws generalize across tasks and architectures.\n-   Whether higher-order representational order has any privileged relation to control or learning.\n-   Whether process metarepresentations have identifiable neural implementations.\n-   Whether this programme adds predictive value beyond existing metacognition, meta-control, resource-rational and modular-computation literatures.\n-   Any constitutive relationship to phenomenality.\n\n------------------------------------------------------------------------\n"}, {"id": "11a-correction-register-external-review-pass-august-2026", "title": "11A. Correction register - external review pass, August 2026", "part": null, "html": "<h2 id=\"a.-correction-register---external-review-pass-august-2026\">11A. Correction register - external review pass, August 2026</h2>\n<p>This register lives inside Document I rather than in a separate file, because the Tractable Horizon rule permits revision under external criticism but not the proliferation of companion documents. Nothing here is a new idea; every entry is a repair to something already written.</p>\n<h3 id=\"corrections-adopted\">Corrections adopted</h3>\n<p>Rows marked ⚑ were themselves corrected in the release-candidate pass. The original wording is retained so the record shows what was claimed and when, but no ⚑ row should be read as the package’s current position without reading the retraction section that follows.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>ID</th>\n<th>Correction</th>\n<th>Lands in</th>\n<th>What it repairs</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>R1</strong> ⚑</td>\n<td><em>Superseded in part — see “Corrections to the corrections” below.</em> As first written: the rate formalism is the <strong>CEO problem with decoder side information</strong> (Wyner–Ziv). <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>u</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">u_v</annotation></semantics></math> is the theoretically indicated quantity, not an ad hoc covariate; the Gaussian case supplies a derived benchmark independent of the training procedure.</td>\n<td>Doc I §8.1</td>\n<td>An unnamed frame that concealed which parts of the problem are already solved</td>\n</tr>\n<tr class=\"even\">\n<td><strong>R2</strong> ⚑</td>\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><msub><mi>m</mi><mi>v</mi></msub><mo>+</mo><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup></mrow><annotation encoding=\"application/x-tex\">r_v=m_v+\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math> is an <strong>identity</strong>, not an assumption — <em>as first written the mismatch term lacked its expectation over <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math>; corrected below.</em> The redundant-coding signature decomposes into prior mismatch plus excess rate, both estimable.</td>\n<td>Doc IV §3.3a; Doc III §4.5</td>\n<td>An asserted inequality, and a diagnostic that could not be measured</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>R3</strong> ⚑</td>\n<td>Cross-source leakage must be measured <strong>conditionally</strong> on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math>. Unconditional <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(S_u;S_v)</annotation></semantics></math> flags correct architectures as cheating. The fault condition was first given as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(C_u;S_v\\mid\\mathcal I)</annotation></semantics></math> — ⚑ <em>superseded; the correct diagnostic conditions on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">C_v</annotation></semantics></math> as well, see below.</em></td>\n<td>Doc IV §5A</td>\n<td>A preventive fix: the error is not yet in the protocol, and would have entered at implementation</td>\n</tr>\n<tr class=\"even\">\n<td><strong>R4</strong></td>\n<td>Five uncited adjacent literatures, each positioned in one paragraph: MARL communication, information-theoretic bounded rationality, rational inattention, VoI sensor scheduling, value of computation.</td>\n<td>Doc II, Part 0</td>\n<td>Constraint C5 executed on the metacognition side and not on the information-theory side</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"design-additions\">Design additions</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Addition</th>\n<th>Lands in</th>\n<th>Why</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Dual-arm constraint implementation</strong> — variational surrogate <em>and</em> total-alphabet-cardinality with a learned split, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mo>∑</mo><mi>v</mi></msub><msub><mo>log</mo><mn>2</mn></msub><mo stretchy=\"false\" form=\"postfix\">|</mo><msub><mi>𝒵</mi><mi>v</mi></msub><mo stretchy=\"false\" form=\"postfix\">|</mo><mo>≤</mo><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">\\sum_v\\log_2\\vert\\mathcal Z_v\\vert\\le C_{\\mathrm{meta}}</annotation></semantics></math>. First proposed with rank-order invariance across arms as a confirmatory prediction — ⚑ <em>superseded; the arms price different currencies, see below.</em></td>\n<td>Doc II §10</td>\n<td>A KL-surrogate budget is soft; a naive hard channel destroys the factorisation that makes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>r</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">r_v</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math> and targeted intervention identifiable. The split-alphabet construction is hard, shared and factorised at once</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Value of computation added to the H2 baseline set.</strong></td>\n<td>Doc III §5; Doc II §10</td>\n<td>Uniform allocation is the null; entropy-only, inferability-only and isolated-causal-value are simpler structured competitors. Myopic VOC is the closest comparator drawn from an established metareasoning formalism.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"corrections-considered-and-declined\">Corrections considered and declined</h3>\n<p>Recording rejected advice with reasons is part of the same discipline as recording accepted advice.</p>\n<p><strong>Declined: “the normative benchmark is trivially matched — optimizer matches optimizer.”</strong> This was correct against the <em>earlier</em> Sīdus, whose confirmatory estimand was the deviation of observed allocation from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>arg</mo><mo>max</mo><mi>ℬ</mi></mrow><annotation encoding=\"application/x-tex\">\\arg\\max\\mathcal B</annotation></semantics></math> computed under the same training procedure — making the null the procedure’s own first-order condition. It is <strong>stale against the present package</strong>. H2 is now an <strong>out-of-sample predictive comparison</strong> of a joint resource model against named baselines on held-out environments, not an argmax-matching test. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathbf r^*(C)</annotation></semantics></math> is retained only as a benchmark under anti-slop rule 5. The criticism should not be re-imported.</p>\n<p><strong>Declined as stated: “enforce the budget at the channel level instead of the variational surrogate.”</strong> The diagnosis is right and the prescription is not. Per-source codebooks give every source its own hard cap and abolish competition; a single shared codebook abolishes source-factorisation and with it Gates A3 and A4 and hypothesis H3. The <strong>initial</strong> repair was the split-alphabet construction; the release-candidate review then demoted that arm to optional currency-sensitivity work because KL rate and alphabet capacity price different resources. The current core is Arm S with realised constraint-violation and surrogate-tightness diagnostics. See Doc II §10.</p>\n<p><strong>Noted, not adopted: letter-graded summary assessment.</strong> Grades that do not propagate from findings are decoration. The external review awarded high marks for falsifiability in the same document in which it argued the primary comparison might be tautological; the two cannot both stand. This package reports gates and kill criteria instead, which either fire or do not.</p>\n<h3 id=\"corrections-to-the-corrections---release-candidate-review\">Corrections to the corrections - release-candidate review</h3>\n<p>The August 2026 additions were themselves reviewed against the prior package. Six blocking issues were found and repaired. All six are recorded here. Three were mathematical, and a register that only records what other people got wrong is not a register.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Issue</th>\n<th>What was wrong</th>\n<th>Repair</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>R1 over-identified</strong></td>\n<td>E1 was identified <em>with</em> the CEO problem in its Wyner–Ziv variant. CEO is a <strong>remote-source</strong> problem — several encoders observing corrupted views of one common latent. E1 has distinct sources. Separately, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">H(C_v\\mid\\mathcal I)</annotation></semantics></math> is the Slepian–Wolf lossless quantity, not the Wyner–Ziv rate, which minimises over an auxiliary variable under a distortion constraint. And the “known analytically” claim was too broad: the general multiterminal lossy problem is open.</td>\n<td>Doc I §8.1 rewritten as <em>closest analogues and solved special cases</em>, with a status table. The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>u</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">u_v</annotation></semantics></math> claim is withdrawn and restated as a dimensionless normalised residual-uncertainty measure; in the single-source lossless limit it equals the minimum conditional rate divided by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">H(C_v)</annotation></semantics></math>. The default E1 architecture is also corrected from decoder-only to common side information because <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">q(S_v\\mid C_v,\\mathcal I)</annotation></semantics></math> gives <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math> to the encoder.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Missing expectation</strong></td>\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><msub><mi>m</mi><mi>v</mi></msub><mo>+</mo><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup></mrow><annotation encoding=\"application/x-tex\">r_v=m_v+\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math> was written with a bare <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"false\" form=\"postfix\">‖</mo><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">D_{KL}(q(S_v\\mid\\mathcal I)\\Vert p(S_v\\mid\\mathcal I))</annotation></semantics></math>. That is a function of the random variable <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math>, not a scalar. Stated as an identity, it must be exact.</td>\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mo>:=</mo><msub><mi>𝔼</mi><mi>ℐ</mi></msub><mspace width=\"0.167em\"></mspace><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mo>⋅</mo><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}:=\\mathbb E_{\\mathcal I}\\,D_{KL}(\\cdot)</annotation></semantics></math> in Doc IV §3.3a and Doc III §4.5.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Leakage criterion too strong</strong></td>\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">I(C_u;S_v\\mid\\mathcal I)&gt;0</annotation></semantics></math> was named as the fault. But <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>u</mi></msub><mo>→</mo><msub><mi>C</mi><mi>v</mi></msub><mo>→</mo><msub><mi>S</mi><mi>v</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_u\\rightarrow C_v\\rightarrow S_v</annotation></semantics></math> is a legitimate chain: dependent sources make this positive under a <em>correct</em> factorised architecture.</td>\n<td>Fault condition is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(C_u;S_v\\mid C_v,\\mathcal I)</annotation></semantics></math>, which vanishes exactly under the intended factorisation. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>u</mi></msub><mo>;</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(C_u;C_v\\mid\\mathcal I)</annotation></semantics></math> reported for scale. Doc IV §5A.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>VOC mischaracterised</strong></td>\n<td>VOC was called “myopic and per-item.” Rational metareasoning is a metalevel MDP; the myopic policy is one approximation within it. Exact metalevel policies are intractable in general — which applies symmetrically to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathbf r^*(C)</annotation></semantics></math>.</td>\n<td>Baseline specified as <strong>myopic VOC</strong>. Contrast rewritten. Doc II P5, Doc III H2.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Invariance claim unjustified</strong></td>\n<td>Rank-order invariance across the variational and alphabet arms was made confirmatory. But <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>≠</mo><msub><mo>log</mo><mn>2</mn></msub><mo stretchy=\"false\" form=\"postfix\">|</mo><mi>𝒵</mi><mo stretchy=\"false\" form=\"postfix\">|</mo></mrow><annotation encoding=\"application/x-tex\">\\mathbb E[D_{KL}]\\neq\\log_2\\vert\\mathcal Z\\vert</annotation></semantics></math>: they price different resources, so divergence may mean allocation depends on <em>which resource is scarce</em> rather than on the optimiser.</td>\n<td>Arm S is core E1 with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math> reported as the tightness diagnostic; the alphabet arm is demoted to an optional currency-sensitivity experiment after a phenomenon exists, per anti-slop rule 8. Doc II §10.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Reference integrity</strong></td>\n<td>Roughly eighteen works were cited in the new Part 0 and §8.1 without reference entries.</td>\n<td>Entries added to Documents I, II and III.</td>\n</tr>\n</tbody>\n</table>\n<p>Two of these were errors introduced by the correction pass rather than inherited from the original package. That is the expected failure mode of a fast repair round, and it is the reason the gate exists.</p>\n<h3 id=\"second-external-review-pass\">Second external review pass</h3>\n<p>Four repairs from a further external review. All land in Documents II and IV unless noted; they are recorded here because the register, not a changelog, is where repairs live.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>ID</th>\n<th>Correction</th>\n<th>Lands in</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>R5</strong></td>\n<td>E0-B is now <strong>definition-indexed</strong> (Shea / redescription / process); a split outcome across indices is a finding about construct unity, not a failure</td>\n<td>Doc IV §7, §10</td>\n</tr>\n<tr class=\"even\">\n<td><strong>R6</strong></td>\n<td>Neuroscience-side prior art still missing after R4: expected precision / precision weighting, attention-as-resource, and the slots-versus-resources debate</td>\n<td>Doc II, P6</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>R7</strong></td>\n<td>Gate A4 required preregistered thresholds with reported intervals; bare ratios of point estimates disallowed</td>\n<td>Doc IV §5</td>\n</tr>\n<tr class=\"even\">\n<td><strong>R8</strong></td>\n<td>Reference repair (Geiger et al. 2021 is NeurIPS 2021, not arXiv-only); the bits convention restated where the estimators live</td>\n<td>Doc I refs; Doc IV §0</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"implementation-validity-and-portability-review---september-2026\">Implementation-validity and portability review - September 2026</h3>\n<p>These bounded repairs implement the accepted audit and its qualifications; they do not reopen the programme’s conceptual scope.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>ID</th>\n<th>Correction</th>\n<th>Lands in</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>R9</strong></td>\n<td>Decoder approximation error can manufacture A1 hiddenness and A2 transmission even with matched classes and nested features. Exact-reference estimator and full-evaluator validation precede pilot thresholds. This alone does not demonstrate a false pass of all E0-A gates.</td>\n<td>Doc IV §§2-3, §6, §11; standing conventions</td>\n</tr>\n<tr class=\"even\">\n<td><strong>R10</strong></td>\n<td>Declining hiddenness is only a declining upper bound on message information. A4 requires a validated manipulation of task-relevant message information and an explicit matched-benefit estimand. Exact estimation alone does not repair the prediction.</td>\n<td>Doc IV §5</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>R11</strong></td>\n<td>Check intervention support conditional on fixed consumer inputs. Separate consumer dependence from achievable benefit. Retain full observability for information/performance; label unavailable alternative-state interventions not applicable.</td>\n<td>Doc IV §§4-6</td>\n</tr>\n<tr class=\"even\">\n<td><strong>R12</strong></td>\n<td>E0-B indices require distinct executable criteria before confirmation. RR accessibility is a bounded-consumer estimand, with redescription and feature-transformation controls, not additional Shannon information beyond complete inputs.</td>\n<td>Doc I §4; Doc IV §§7, 10</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>R13</strong></td>\n<td>Myopic VOC selects the greatest one-step net value, including cost and stopping; proportional allocation is a separate heuristic. E1 requires E0-A; strict-meta work requires the relevant E0-B index. Methods validation does not close C5 novelty review.</td>\n<td>Doc II §§10, 20-21; Doc III §5</td>\n</tr>\n<tr class=\"even\">\n<td><strong>R14</strong></td>\n<td>The tractable thesis is portable across relevant AI/cognitive-science programmes. Replace institution-specific admissions, curriculum, personnel and credit assumptions with skills, supervision and project-scope requirements.</td>\n<td>Doc III; website companions</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"standing-conventions\">Standing conventions</h3>\n<ul>\n<li><strong>Units.</strong> All rates, entropies and informations are in <strong>bits</strong> (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mo>log</mo><mn>2</mn></msub><annotation encoding=\"application/x-tex\">\\log_2</annotation></semantics></math>) throughout the package. Any code, threshold or figure reported in nats must be converted at the point of reporting, not at the point of reading.</li>\n<li><strong>Estimator classes.</strong> Where an information quantity is estimated as a difference of two fitted log-losses, the two predictors must be of the <strong>same class and nested feature sets</strong>, and the plug-in bias reported. A difference of upper bounds is not itself a bound and can go negative. Matching classes and nested features is necessary for a controlled comparison but insufficient for information identification. Validate against a tractable exact reference before pilot threshold selection; quantify approximation and sampling uncertainty separately.</li>\n</ul>\n<hr />\n", "plain": "11A. Correction register - external review pass, August 2026\n\nThis register lives inside Document I rather than in a separate file, because the Tractable Horizon rule permits revision under external criticism but not the proliferation of companion documents. Nothing here is a new idea; every entry is a repair to something already written.\n\nCorrections adopted\n\nRows marked ⚑ were themselves corrected in the release-candidate pass. The original wording is retained so the record shows what was claimed and when, but no ⚑ row should be read as the package’s current position without reading the retraction section that follows.\n\n  -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  ID                Correction                                                                                                                                                                                                                                                                                                                          Lands in                     What it repairs\n  ----------------- ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- ---------------------------- --------------------------------------------------------------------------------------------------\n  R1 ⚑              Superseded in part — see “Corrections to the corrections” below. As first written: the rate formalism is the CEO problem with decoder side information (Wyner–Ziv). u_(v) is the theoretically indicated quantity, not an ad hoc covariate; the Gaussian case supplies a derived benchmark independent of the training procedure.   Doc I §8.1                   An unnamed frame that concealed which parts of the problem are already solved\n\n  R2 ⚑              r_(v) = m_(v) + Δ_(v)^(prior) is an identity, not an assumption — as first written the mismatch term lacked its expectation over ℐ; corrected below. The redundant-coding signature decomposes into prior mismatch plus excess rate, both estimable.                                                                                Doc IV §3.3a; Doc III §4.5   An asserted inequality, and a diagnostic that could not be measured\n\n  R3 ⚑              Cross-source leakage must be measured conditionally on ℐ. Unconditional I(S_(u);S_(v)) flags correct architectures as cheating. The fault condition was first given as I(C_(u);S_(v)∣ℐ) — ⚑ superseded; the correct diagnostic conditions on C_(v) as well, see below.                                                              Doc IV §5A                   A preventive fix: the error is not yet in the protocol, and would have entered at implementation\n\n  R4                Five uncited adjacent literatures, each positioned in one paragraph: MARL communication, information-theoretic bounded rationality, rational inattention, VoI sensor scheduling, value of computation.                                                                                                                              Doc II, Part 0               Constraint C5 executed on the metacognition side and not on the information-theory side\n  -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nDesign additions\n\n  --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Addition                                                                                                                                                                                                                                                                                          Lands in                 Why\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- ------------------------ -----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Dual-arm constraint implementation — variational surrogate and total-alphabet-cardinality with a learned split, ∑_(v)log₂|𝒵_(v)| ≤ C_(meta). First proposed with rank-order invariance across arms as a confirmatory prediction — ⚑ superseded; the arms price different currencies, see below.   Doc II §10               A KL-surrogate budget is soft; a naive hard channel destroys the factorisation that makes r_(v), m_(v) and targeted intervention identifiable. The split-alphabet construction is hard, shared and factorised at once\n\n  Value of computation added to the H2 baseline set.                                                                                                                                                                                                                                                Doc III §5; Doc II §10   Uniform allocation is the null; entropy-only, inferability-only and isolated-causal-value are simpler structured competitors. Myopic VOC is the closest comparator drawn from an established metareasoning formalism.\n  --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nCorrections considered and declined\n\nRecording rejected advice with reasons is part of the same discipline as recording accepted advice.\n\nDeclined: “the normative benchmark is trivially matched — optimizer matches optimizer.” This was correct against the earlier Sīdus, whose confirmatory estimand was the deviation of observed allocation from arg max ℬ computed under the same training procedure — making the null the procedure’s own first-order condition. It is stale against the present package. H2 is now an out-of-sample predictive comparison of a joint resource model against named baselines on held-out environments, not an argmax-matching test. r^(*)(C) is retained only as a benchmark under anti-slop rule 5. The criticism should not be re-imported.\n\nDeclined as stated: “enforce the budget at the channel level instead of the variational surrogate.” The diagnosis is right and the prescription is not. Per-source codebooks give every source its own hard cap and abolish competition; a single shared codebook abolishes source-factorisation and with it Gates A3 and A4 and hypothesis H3. The initial repair was the split-alphabet construction; the release-candidate review then demoted that arm to optional currency-sensitivity work because KL rate and alphabet capacity price different resources. The current core is Arm S with realised constraint-violation and surrogate-tightness diagnostics. See Doc II §10.\n\nNoted, not adopted: letter-graded summary assessment. Grades that do not propagate from findings are decoration. The external review awarded high marks for falsifiability in the same document in which it argued the primary comparison might be tautological; the two cannot both stand. This package reports gates and kill criteria instead, which either fire or do not.\n\nCorrections to the corrections - release-candidate review\n\nThe August 2026 additions were themselves reviewed against the prior package. Six blocking issues were found and repaired. All six are recorded here. Three were mathematical, and a register that only records what other people got wrong is not a register.\n\n  --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Issue                          What was wrong                                                                                                                                                                                                                                                                                                                                                                                                                                                   Repair\n  ------------------------------ ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  R1 over-identified             E1 was identified with the CEO problem in its Wyner–Ziv variant. CEO is a remote-source problem — several encoders observing corrupted views of one common latent. E1 has distinct sources. Separately, H(C_(v)∣ℐ) is the Slepian–Wolf lossless quantity, not the Wyner–Ziv rate, which minimises over an auxiliary variable under a distortion constraint. And the “known analytically” claim was too broad: the general multiterminal lossy problem is open.   Doc I §8.1 rewritten as closest analogues and solved special cases, with a status table. The u_(v) claim is withdrawn and restated as a dimensionless normalised residual-uncertainty measure; in the single-source lossless limit it equals the minimum conditional rate divided by H(C_(v)). The default E1 architecture is also corrected from decoder-only to common side information because q(S_(v)∣C_(v),ℐ) gives ℐ to the encoder.\n\n  Missing expectation            r_(v) = m_(v) + Δ_(v)^(prior) was written with a bare D_(KL)(q(S_(v)∣ℐ)‖p(S_(v)∣ℐ)). That is a function of the random variable ℐ, not a scalar. Stated as an identity, it must be exact.                                                                                                                                                                                                                                                                         Δ_(v)^(prior) := 𝔼_(ℐ) D_(KL)(⋅) in Doc IV §3.3a and Doc III §4.5.\n\n  Leakage criterion too strong   I(C_(u);S_(v)∣ℐ) > 0 was named as the fault. But C_(u) → C_(v) → S_(v) is a legitimate chain: dependent sources make this positive under a correct factorised architecture.                                                                                                                                                                                                                                                                                      Fault condition is I(C_(u);S_(v)∣C_(v),ℐ), which vanishes exactly under the intended factorisation. I(C_(u);C_(v)∣ℐ) reported for scale. Doc IV §5A.\n\n  VOC mischaracterised           VOC was called “myopic and per-item.” Rational metareasoning is a metalevel MDP; the myopic policy is one approximation within it. Exact metalevel policies are intractable in general — which applies symmetrically to r^(*)(C).                                                                                                                                                                                                                                Baseline specified as myopic VOC. Contrast rewritten. Doc II P5, Doc III H2.\n\n  Invariance claim unjustified   Rank-order invariance across the variational and alphabet arms was made confirmatory. But 𝔼[D_(KL)] ≠ log₂|𝒵|: they price different resources, so divergence may mean allocation depends on which resource is scarce rather than on the optimiser.                                                                                                                                                                                                               Arm S is core E1 with Δ_(v)^(prior) reported as the tightness diagnostic; the alphabet arm is demoted to an optional currency-sensitivity experiment after a phenomenon exists, per anti-slop rule 8. Doc II §10.\n\n  Reference integrity            Roughly eighteen works were cited in the new Part 0 and §8.1 without reference entries.                                                                                                                                                                                                                                                                                                                                                                          Entries added to Documents I, II and III.\n  --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nTwo of these were errors introduced by the correction pass rather than inherited from the original package. That is the expected failure mode of a fast repair round, and it is the reason the gate exists.\n\nSecond external review pass\n\nFour repairs from a further external review. All land in Documents II and IV unless noted; they are recorded here because the register, not a changelog, is where repairs live.\n\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  ID                      Correction                                                                                                                                                   Lands in\n  ----------------------- ------------------------------------------------------------------------------------------------------------------------------------------------------------ -----------------------\n  R5                      E0-B is now definition-indexed (Shea / redescription / process); a split outcome across indices is a finding about construct unity, not a failure            Doc IV §7, §10\n\n  R6                      Neuroscience-side prior art still missing after R4: expected precision / precision weighting, attention-as-resource, and the slots-versus-resources debate   Doc II, P6\n\n  R7                      Gate A4 required preregistered thresholds with reported intervals; bare ratios of point estimates disallowed                                                 Doc IV §5\n\n  R8                      Reference repair (Geiger et al. 2021 is NeurIPS 2021, not arXiv-only); the bits convention restated where the estimators live                                Doc I refs; Doc IV §0\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nImplementation-validity and portability review - September 2026\n\nThese bounded repairs implement the accepted audit and its qualifications; they do not reopen the programme’s conceptual scope.\n\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  ID                      Correction                                                                                                                                                                                                                                                                       Lands in\n  ----------------------- -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- ---------------------------------------------\n  R9                      Decoder approximation error can manufacture A1 hiddenness and A2 transmission even with matched classes and nested features. Exact-reference estimator and full-evaluator validation precede pilot thresholds. This alone does not demonstrate a false pass of all E0-A gates.   Doc IV §§2-3, §6, §11; standing conventions\n\n  R10                     Declining hiddenness is only a declining upper bound on message information. A4 requires a validated manipulation of task-relevant message information and an explicit matched-benefit estimand. Exact estimation alone does not repair the prediction.                          Doc IV §5\n\n  R11                     Check intervention support conditional on fixed consumer inputs. Separate consumer dependence from achievable benefit. Retain full observability for information/performance; label unavailable alternative-state interventions not applicable.                                  Doc IV §§4-6\n\n  R12                     E0-B indices require distinct executable criteria before confirmation. RR accessibility is a bounded-consumer estimand, with redescription and feature-transformation controls, not additional Shannon information beyond complete inputs.                                       Doc I §4; Doc IV §§7, 10\n\n  R13                     Myopic VOC selects the greatest one-step net value, including cost and stopping; proportional allocation is a separate heuristic. E1 requires E0-A; strict-meta work requires the relevant E0-B index. Methods validation does not close C5 novelty review.                      Doc II §§10, 20-21; Doc III §5\n\n  R14                     The tractable thesis is portable across relevant AI/cognitive-science programmes. Replace institution-specific admissions, curriculum, personnel and credit assumptions with skills, supervision and project-scope requirements.                                                 Doc III; website companions\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nStanding conventions\n\n-   Units. All rates, entropies and informations are in bits (log₂) throughout the package. Any code, threshold or figure reported in nats must be converted at the point of reporting, not at the point of reading.\n-   Estimator classes. Where an information quantity is estimated as a difference of two fitted log-losses, the two predictors must be of the same class and nested feature sets, and the plug-in bias reported. A difference of upper bounds is not itself a bound and can go negative. Matching classes and nested features is necessary for a controlled comparison but insufficient for information identification. Validate against a tractable exact reference before pilot threshold selection; quantify approximation and sampling uncertainty separately.\n\n------------------------------------------------------------------------\n"}, {"id": "12-anti-slop-rules", "title": "12. Anti-slop rules", "part": null, "html": "<h2 id=\"anti-slop-rules\">12. Anti-slop rules</h2>\n<ol type=\"1\">\n<li><strong>Ecology is not a synonym for complexity.</strong> If the programme cannot identify interactions with predictive consequences, drop the word.</li>\n<li><strong>Metarepresentation is not a synonym for internal information.</strong> Every membership claim must name the representational property/process that is represented.</li>\n<li><strong>No global graph by declaration.</strong> Validate local edges first; reconstruct larger organization only afterward.</li>\n<li><strong>No global resource pool by metaphor.</strong> A shared budget exists only when experimentally manipulated or independently measured.</li>\n<li><strong>No optimality inflation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathbf r^*(C)</annotation></semantics></math> is an experimental benchmark unless organisms are independently shown to approximate it.</li>\n<li><strong>No attention privilege.</strong> Attention is one candidate control process among others unless data make it exceptional.</li>\n<li><strong>No phenomenality laundering.</strong> “Higher-order,” “self-model,” “global,” and “integrated” are not synonyms for conscious.</li>\n<li><strong>No machinery before phenomenon.</strong> Bayesian optimization, interchange interventions and complex hierarchical statistics are conditional tools.</li>\n<li><strong>Negative results simplify the programme.</strong> They do not demand another layer of explanation by default.</li>\n<li><strong>A one-paper thesis that kills a grander idea is a successful scientific outcome.</strong></li>\n</ol>\n<hr />\n", "plain": "12. Anti-slop rules\n\n1.  Ecology is not a synonym for complexity. If the programme cannot identify interactions with predictive consequences, drop the word.\n2.  Metarepresentation is not a synonym for internal information. Every membership claim must name the representational property/process that is represented.\n3.  No global graph by declaration. Validate local edges first; reconstruct larger organization only afterward.\n4.  No global resource pool by metaphor. A shared budget exists only when experimentally manipulated or independently measured.\n5.  No optimality inflation. r^(*)(C) is an experimental benchmark unless organisms are independently shown to approximate it.\n6.  No attention privilege. Attention is one candidate control process among others unless data make it exceptional.\n7.  No phenomenality laundering. “Higher-order,” “self-model,” “global,” and “integrated” are not synonyms for conscious.\n8.  No machinery before phenomenon. Bayesian optimization, interchange interventions and complex hierarchical statistics are conditional tools.\n9.  Negative results simplify the programme. They do not demand another layer of explanation by default.\n10. A one-paper thesis that kills a grander idea is a successful scientific outcome.\n\n------------------------------------------------------------------------\n"}, {"id": "13-the-four-maxims-as-research-conduct", "title": "13. The four maxims as research conduct", "part": null, "html": "<h2 id=\"the-four-maxims-as-research-conduct\">13. The four maxims as research conduct</h2>\n<h3 id=\"truth-maximally-sought\">Truth, maximally sought</h3>\n<p>The programme is designed to lose claims. Prior art, simpler explanations, failed manipulation checks and null results reduce the ontology rather than provoke ad hoc rescue.</p>\n<h3 id=\"ambition-tempered-by-humility\">Ambition tempered by humility</h3>\n<p>The long-range ambition is to understand how cognitive systems model their own organization. The near-term obligation is to establish one causal relation at a time.</p>\n<h3 id=\"beauty-tempered-by-goodness\">Beauty tempered by goodness</h3>\n<p>The project may use a coherent visual identity and memorable language, but formal submission defaults to standard notation. Elegance is valuable when it increases understanding; otherwise it yields to clarity and empirical utility.</p>\n<h3 id=\"honesty-above-all-else\">Honesty above all else</h3>\n<p>Every document distinguishes literature-supported premise, derived design choice, open hypothesis and unverified novelty. Every experiment reports manipulation failure, optimization path dependence and model non-identifiability as substantive outcomes.</p>\n<hr />\n", "plain": "13. The four maxims as research conduct\n\nTruth, maximally sought\n\nThe programme is designed to lose claims. Prior art, simpler explanations, failed manipulation checks and null results reduce the ontology rather than provoke ad hoc rescue.\n\nAmbition tempered by humility\n\nThe long-range ambition is to understand how cognitive systems model their own organization. The near-term obligation is to establish one causal relation at a time.\n\nBeauty tempered by goodness\n\nThe project may use a coherent visual identity and memorable language, but formal submission defaults to standard notation. Elegance is valuable when it increases understanding; otherwise it yields to clarity and empirical utility.\n\nHonesty above all else\n\nEvery document distinguishes literature-supported premise, derived design choice, open hypothesis and unverified novelty. Every experiment reports manipulation failure, optimization path dependence and model non-identifiability as substantive outcomes.\n\n------------------------------------------------------------------------\n"}, {"id": "14-working-conclusion", "title": "14. Working conclusion", "part": null, "html": "<h2 id=\"working-conclusion\">14. Working conclusion</h2>\n<p>The first principle is not that cognition <em>is</em> a metarepresentational ecology.</p>\n<p>It is weaker:</p>\n<blockquote>\n<p><strong>Cognition contains multiple internal monitoring and self-modeling processes. Some plausibly meet stricter criteria for metarepresentation. Their interactions are empirically understudied enough that scarcity, causal topology, recursive control, fidelity, complementarity and temporal structure can be tested as candidate organizing principles.</strong></p>\n</blockquote>\n<p>If those principles fail to generalize, there may be no useful ecology-level theory. If they survive across distinct systems, an ecology may gradually be inferred rather than declared.</p>\n<p>That is the standard this package adopts.</p>\n<hr />\n<h1 id=\"references\">References</h1>\n<ol type=\"1\">\n<li><p>Doerig, A., Schurger, A., &amp; Herzog, M. H. (2020). Hard criteria for empirical theories of consciousness. <em>Cognitive Neuroscience</em>. https://doi.org/10.1080/17588928.2020.1772214</p></li>\n<li><p>Fahrenfort, J. J., &amp; van Gaal, S. (2020). Criteria for empirical theories of consciousness should focus on the explanatory power of mechanisms, not on functional equivalence. <em>Cognitive Neuroscience</em>. https://doi.org/10.1080/17588928.2020.1838470</p></li>\n<li><p>Fazekas, P., Cleeremans, A., &amp; Overgaard, M. (2024). A construct-first approach to consciousness science. <em>Neuroscience &amp; Biobehavioral Reviews, 156</em>, 105480. https://doi.org/10.1016/j.neubiorev.2023.105480</p></li>\n<li><p>Fleming, S. M., Dolan, R. J., &amp; Frith, C. D. (2012). Metacognition: computation, biology and function. <em>Philosophical Transactions of the Royal Society B, 367</em>, 1280-1286. https://doi.org/10.1098/rstb.2012.0021</p></li>\n<li><p>Fleming, S. M. (2024). Metacognition and confidence: A review and synthesis. <em>Annual Review of Psychology, 75</em>, 241-268. https://doi.org/10.1146/annurev-psych-022423-032425</p></li>\n<li><p>Morales, J., Lau, H., &amp; Fleming, S. M. (2018). Domain-general and domain-specific patterns of activity supporting metacognition in human prefrontal cortex. <em>Journal of Neuroscience, 38</em>, 3534-3546. https://doi.org/10.1523/JNEUROSCI.2360-17.2018</p></li>\n<li><p>Mazancieux, A., Pereira, M., Faivre, N., Mamassian, P., Moulin, C. J. A., &amp; Souchay, C. (2023). Towards a common conceptual space for metacognition in perception and memory. <em>Nature Reviews Psychology, 2</em>, 751-766. https://doi.org/10.1038/s44159-023-00245-1</p></li>\n<li><p>Baer, C., Ghetti, S., &amp; Odic, D. (2026). Domain generality is an emergent, not inherent, property of metacognition. <em>Nature Human Behaviour, 10</em>, 1316-1326. https://doi.org/10.1038/s41562-026-02443-2</p></li>\n<li><p>Proust, J. (2003). Does metacognition necessarily involve metarepresentation? <em>Behavioral and Brain Sciences, 26</em>(3), 352. https://doi.org/10.1017/S0140525X0336008X</p></li>\n<li><p>Shea, N. (2014). Reward prediction error signals are meta-representational. <em>Noûs, 48</em>(2), 314-341. https://doi.org/10.1111/j.1468-0068.2012.00863.x</p></li>\n<li><p>Cleeremans, A. (2011). The Radical Plasticity Thesis: How the brain learns to be conscious. <em>Frontiers in Psychology, 2</em>, 86. https://doi.org/10.3389/fpsyg.2011.00086</p></li>\n<li><p>Cleeremans, A., et al. (2020). Learning to be conscious. <em>Trends in Cognitive Sciences, 24</em>(2), 112-123. https://doi.org/10.1016/j.tics.2019.11.011</p></li>\n<li><p>Cleeremans, A., Timmermans, B., &amp; Pasquali, A. (2007). Consciousness and metarepresentation: A computational sketch. <em>Neural Networks, 20</em>, 1032-1039. PMID: 17904799.</p></li>\n<li><p>Kanai, R., Takatsuki, R., &amp; Fujisawa, I. (2025). Meta-representations as representations of processes. <em>Neuroscience of Consciousness, 2025</em>(1), niaf038. https://doi.org/10.1093/nc/niaf038</p></li>\n<li><p>Eppinger, B., Goschke, T., &amp; Musslick, S. (2021). Meta-control: From psychology to computational neuroscience. <em>Cognitive, Affective, &amp; Behavioral Neuroscience, 21</em>, 447-452. https://doi.org/10.3758/s13415-021-00919-4</p></li>\n<li><p>Bénon, J., et al. (2024). The online metacognitive control of decisions. <em>Communications Psychology, 2</em>, 23. https://doi.org/10.1038/s44271-024-00071-y</p></li>\n<li><p>Bayne, T., Hohwy, J., &amp; Owen, A. M. (2016). Are there levels of consciousness? <em>Trends in Cognitive Sciences, 20</em>(6), 405-413. https://doi.org/10.1016/j.tics.2016.03.009</p></li>\n<li><p>Lieder, F., &amp; Griffiths, T. L. (2020). Resource-rational analysis: Understanding human cognition as the optimal use of limited computational resources. <em>Behavioral and Brain Sciences, 43</em>, e1. https://doi.org/10.1017/S0140525X1900061X</p></li>\n<li><p>Shenhav, A., Botvinick, M. M., &amp; Cohen, J. D. (2013). The expected value of control: An integrative theory of anterior cingulate cortex function. <em>Neuron, 79</em>(2), 217-240. https://doi.org/10.1016/j.neuron.2013.07.007</p></li>\n<li><p>Berger, T., Zhang, Z., &amp; Viswanathan, H. (1996). The CEO problem [multiterminal source coding]. <em>IEEE Transactions on Information Theory, 42</em>(3), 887-902. https://doi.org/10.1109/18.490552</p></li>\n<li><p>Geiger, A., Lu, H., Icard, T., &amp; Potts, C. (2021). Causal abstractions of neural networks. <em>Advances in Neural Information Processing Systems, 34</em>, 9574-9586. arXiv:2106.02997.</p></li>\n<li><p>Geiger, A., et al. (2022). Inducing causal structure for interpretable neural networks. <em>ICML 2022</em>. https://proceedings.mlr.press/v162/geiger22a.html</p></li>\n<li><p>Geiger, A., et al. (2025). Causal abstraction: A theoretical foundation for mechanistic interpretability. <em>Journal of Machine Learning Research, 26</em>(83), 1-64. https://www.jmlr.org/papers/v26/23-0058.html</p></li>\n<li><p>Rahnev, D. (2020). Resource-rational analysis versus resource-rational humans. <em>Behavioral and Brain Sciences, 43</em>, e19. https://doi.org/10.1017/S0140525X19001699</p></li>\n<li><p>Slepian, D., &amp; Wolf, J. K. (1973). Noiseless coding of correlated information sources. <em>IEEE Transactions on Information Theory, 19</em>(4), 471-480. https://doi.org/10.1109/TIT.1973.1055037</p></li>\n<li><p>Wyner, A. D., &amp; Ziv, J. (1976). The rate-distortion function for source coding with side information at the decoder. <em>IEEE Transactions on Information Theory, 22</em>(1), 1-10. https://doi.org/10.1109/TIT.1976.1055508</p></li>\n<li><p>Oohama, Y. (1998). The rate-distortion function for the quadratic Gaussian CEO problem. <em>IEEE Transactions on Information Theory, 44</em>(3), 1057-1070. https://doi.org/10.1109/18.669162</p></li>\n<li><p>Prabhakaran, V., Tse, D., &amp; Ramchandran, K. (2004). Rate region of the quadratic Gaussian CEO problem. <em>Proceedings of the IEEE International Symposium on Information Theory (ISIT)</em>, 119.</p></li>\n<li><p>Wagner, A. B., Tavildar, S., &amp; Viswanath, P. (2008). Rate region of the quadratic Gaussian two-encoder source-coding problem. <em>IEEE Transactions on Information Theory, 54</em>(5), 1938-1961. https://doi.org/10.1109/TIT.2008.920343</p></li>\n<li><p>Ekrem, E., &amp; Ulukus, S. (2014). An outer bound for the vector Gaussian CEO problem. <em>IEEE Transactions on Information Theory, 60</em>(11), 6870-6887. https://doi.org/10.1109/TIT.2014.2353811</p></li>\n</ol>\n", "plain": "14. Working conclusion\n\nThe first principle is not that cognition is a metarepresentational ecology.\n\nIt is weaker:\n\n  Cognition contains multiple internal monitoring and self-modeling processes. Some plausibly meet stricter criteria for metarepresentation. Their interactions are empirically understudied enough that scarcity, causal topology, recursive control, fidelity, complementarity and temporal structure can be tested as candidate organizing principles.\n\nIf those principles fail to generalize, there may be no useful ecology-level theory. If they survive across distinct systems, an ecology may gradually be inferred rather than declared.\n\nThat is the s 352. https://doi.org/10.1017/S0140525X0336008X\n\n10. Shea, N. (2014). Reward prediction error signals are meta-representational. Noûs, 48(2), 314-341. https://doi.org/10.1111/j.1468-0068.2012.00863.x\n\n11. Cleeremans, A. (2011). The Radical Plasticity Thesis: How the brain learns to be conscious. Frontiers in Psychology, 2, 86. https://doi.org/10.3389/fpsyg.2011.00086\n\n12. Cleeremans, A., et al. (2020). Learning to be conscious. Trends in Cognitive Sciences, 24(2), 112-123. https://doi.org/10.1016/j.tics.2019.11.011\n\n13. Cleeremans, A., Timmermans, B., & Pasquali, A. (2007). Consciousness and metarepresentation: A computational sketch. Neural Networks, 20, 1032-1039. PMID: 17904799.\n\n14. Kanai, R., Takatsuki, R., & Fujisawa, I. (2025). Meta-representations as representations of processes. Neuroscience of Consciousness, 2025(1), niaf038. https://doi.org/10.1093/nc/niaf038\n\n15. Eppinger, B., Goschke, T., & Musslick, S. (2021). Meta-control: From psychology to computational neuroscience. Cognitive, Affective, & Behavioral Neuroscience, 21, 447-452. https://doi.org/10.3758/s13415-021-00919-4\n\n16. Bénon, J., et al. (2024). The online metacognitive control of decisions. Communications Psychology, 2, 23. https://doi.org/10.1038/s44271-024-00071-y\n\n17. Bayne, T., Hohwy, J., & Owen, A. M. (2016). Are there levels of consciousness? Trends in Cognitive Sciences, 20(6), 405-413. https://doi.org/10.1016/j.tics.2016.03.009\n\n18. Lieder, F., & Griffiths, T. L. (2020). Resource-rational analysis: Understanding human cognition as the optimal use of limited computational resources. Behavioral and Brain Sciences, 43, e1. https://doi.org/10.1017/S0140525X1900061X\n\n19. Shenhav, A., Botvinick, M. M., & Cohen, J. D. (2013). The expected value of control: An integrative theory of anterior cingulate cortex function. Neuron, 79(2), 217-240. https://doi.org/10.1016/j.neuron.2013.07.007\n\n20. Berger, T., Zhang, Z., & Viswanathan, H. (1996). The CEO problem [multiterminal sour
