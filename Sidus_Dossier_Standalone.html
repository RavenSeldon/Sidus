ce coding]. IEEE Transactions on Information Theory, 42(3), 887-902. https://doi.org/10.1109/18.490552\n\n21. Geiger, A., Lu, H., Icard, T., & Potts, C. (2021). Causal abstractions of neural networks. Advances in Neural Information Processing Systems, 34, 9574-9586. arXiv:2106.02997.\n\n22. Geiger, A., et al. (2022). Inducing causal structure for interpretable neural networks. ICML 2022. https://proceedings.mlr.press/v162/geiger22a.html\n\n23. Geiger, A., et al. (2025). Causal abstraction: A theoretical foundation for mechanistic interpretability. Journal of Machine Learning Research, 26(83), 1-64. https://www.jmlr.org/papers/v26/23-0058.html\n\n24. Rahnev, D. (2020). Resource-rational analysis versus resource-rational humans. Behavioral and Brain Sciences, 43, e19. https://doi.org/10.1017/S0140525X19001699\n\n25. Slepian, D., & Wolf, J. K. (1973). Noiseless coding of correlated information sources. IEEE Transactions on Information Theory, 19(4), 471-480. https://doi.org/10.1109/TIT.1973.1055037\n\n26. Wyner, A. D., & Ziv, J. (1976). The rate-distortion function for source coding with side information at the decoder. IEEE Transactions on Information Theory, 22(1), 1-10. https://doi.org/10.1109/TIT.1976.1055508\n\n27. Oohama, Y. (1998). The rate-distortion function for the quadratic Gaussian CEO problem. IEEE Transactions on Information Theory, 44(3), 1057-1070. https://doi.org/10.1109/18.669162\n\n28. Prabhakaran, V., Tse, D., & Ramchandran, K. (2004). Rate region of the quadratic Gaussian CEO problem. Proceedings of the IEEE International Symposium on Information Theory (ISIT), 119.\n\n29. Wagner, A. B., Tavildar, S., & Viswanath, P. (2008). Rate region of the quadratic Gaussian two-encoder source-coding problem. IEEE Transactions on Information Theory, 54(5), 1938-1961. https://doi.org/10.1109/TIT.2008.920343\n\n30. Ekrem, E., & Ulukus, S. (2014). An outer bound for the vector Gaussian CEO problem. IEEE Transactions on Information Theory, 60(11), 6870-6887. https://doi.org/10.1109/TIT.2014.2353811\n"}], "sourceMd": "source/01_Foundations.md", "sourcePdf": "source/01_Foundations.pdf"}, {"roman": "II", "short": "Research Programme", "title": "II. Research Programme: Local Laws, Experiments, and Falsification", "sections": [{"id": "frontpiece", "title": "Opening", "part": null, "html": "<h1 id=\"sīdus-towards-metarepresentational-ecology\">Sīdus: Towards Metarepresentational Ecology</h1>\n<h2 id=\"ii.-research-programme-local-laws-experiments-and-falsification\">II. Research Programme: Local Laws, Experiments, and Falsification</h2>\n<p><strong>Working research programme - August 2026</strong><br />\n<strong>Status:</strong> defeasible programme; falsifiable local models. This document does not assert that a metarepresentational ecology exists.</p>\n<blockquote>\n<p><strong>Truth, maximally sought. Ambition tempered by humility. Beauty tempered by goodness. Honesty above all else.</strong></p>\n</blockquote>\n<hr />\n", "plain": "Sīdus: Towards Metarepresentational Ecology\n\nII. Research Programme: Local Laws, Experiments, and Falsification\n\nWorking research programme - August 2026\nStatus: defeasible programme; falsifiable local models. This document does not assert that a metarepresentational ecology exists.\n\n  Truth, maximally sought. Ambition tempered by humility. Beauty tempered by goodness. Honesty above all else.\n\n------------------------------------------------------------------------\n"}, {"id": "0-programme-rule", "title": "0. Programme rule", "part": null, "html": "<h2 id=\"programme-rule\">0. Programme rule</h2>\n<p>The programme is not allowed to infer a global ecology from vocabulary.</p>\n<p>It proceeds in the opposite direction:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">define a construct</mtext><mspace width=\"0.278em\"></mspace><mo>→</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">build a discriminating experiment</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mo>→</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">validate a local relation</mtext><mspace width=\"0.278em\"></mspace><mo>→</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">replicate/generalize</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mo>→</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">only then infer larger organization</mtext></mtd></mtr></mtable></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{\n\\begin{array}{c}\n\\text{define a construct}\\;\\rightarrow\\;\\text{build a discriminating experiment}\\\\[3pt]\n\\rightarrow\\;\\text{validate a local relation}\\;\\rightarrow\\;\\text{replicate/generalize}\\\\[3pt]\n\\rightarrow\\;\\text{only then infer larger organization}\n\\end{array}\n}\n</annotation></semantics></math></p>\n<p>The central working hypothesis is deliberately weak:</p>\n<blockquote>\n<p><strong>Some internal monitoring systems may stand in structured, causally important relations to one another. Those relations can be tested one at a time. If sufficiently general regularities emerge, an ecology-level description may become warranted.</strong></p>\n</blockquote>\n<p>Sīdus is the name of the programme while this is the most viable empirical direction. It is not a commitment to preserve any particular legacy construct, experiment, notation, or attention-centric hypothesis.</p>\n<hr />\n", "plain": "0. Programme rule\n\nThe programme is not allowed to infer a global ecology from vocabulary.\n\nIt proceeds in the opposite direction:\n\n$$\n\\boxed{\n\\begin{array}{c}\n\\text{define a construct}\\;\\rightarrow\\;\\text{build a discriminating experiment}\\\\[3pt]\n\\rightarrow\\;\\text{validate a local relation}\\;\\rightarrow\\;\\text{replicate/generalize}\\\\[3pt]\n\\rightarrow\\;\\text{only then infer larger organization}\n\\end{array}\n}\n$$\n\nThe central working hypothesis is deliberately weak:\n\n  Some internal monitoring systems may stand in structured, causally important relations to one another. Those relations can be tested one at a time. If sufficiently general regularities emerge, an ecology-level description may become warranted.\n\nSīdus is the name of the programme while this is the most viable empirical direction. It is not a commitment to preserve any particular legacy construct, experiment, notation, or attention-centric hypothesis.\n\n------------------------------------------------------------------------\n"}, {"id": "1-what-is-inherited-from-the-earlier-s-dus-package", "title": "1. What is inherited from the earlier Sīdus package", "part": null, "html": "<h2 id=\"what-is-inherited-from-the-earlier-sīdus-package\">1. What is inherited from the earlier Sīdus package</h2>\n<h3 id=\"retained\">Retained</h3>\n<p>The previous package did several things well enough to keep:</p>\n<ol type=\"1\">\n<li><strong>Local identifiability over global latent architecture.</strong> The old unconstrained interaction matrix was correctly retired.</li>\n<li><strong>Capacity-only claims.</strong> No result about internal monitoring licenses a phenomenality claim.</li>\n<li><strong>The information seam as an experimental scaffold.</strong> Restricted access can create an identifiable communication problem without being asserted as literal neuroanatomy.</li>\n<li><strong>Rate spent versus information delivered.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>≠</mo><msub><mi>m</mi><mi>v</mi></msub></mrow><annotation encoding=\"application/x-tex\">r_v\\neq m_v</annotation></semantics></math> remains a load-bearing distinction.</li>\n<li><strong>Joint benefit surfaces.</strong> Complementarity and substitution should be measured rather than assumed away.</li>\n<li><strong>Causal use.</strong> Decodability is insufficient.</li>\n<li><strong>Optimization validity.</strong> Posterior/channel collapse and training history can masquerade as scientific allocation preferences.</li>\n<li><strong>Role/implementation separation.</strong> Functional claims should survive implementation controls where technically feasible.</li>\n<li><strong>Stage gates and kill criteria.</strong> Expensive methods and broader claims are conditional on simpler pilots.</li>\n</ol>\n<h3 id=\"demoted-or-revised\">Demoted or revised</h3>\n<ol type=\"1\">\n<li><strong>Attention privilege.</strong> Attention becomes one candidate control process, not the privileged residual target of the programme.</li>\n<li><strong>The old definition of metarepresentation.</strong> A message about an internal controller is now called an <em>internal-state model</em> unless stricter representational criteria are independently satisfied.</li>\n<li><strong>One global coordinator.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Π</mi><annotation encoding=\"application/x-tex\">\\Pi</annotation></semantics></math> is a tractable experimental consumer, not a theory of cognitive headquarters.</li>\n<li><strong>One global resource currency.</strong> A single rate budget is a controlled experimental manipulation, not a claim about one biological pool.</li>\n<li><strong>Astrocyte as default method.</strong> Gaussian-process Bayesian optimization is optional infrastructure, not a prerequisite for the first experiment.</li>\n<li><strong>Doerig as the programme’s ontology.</strong> Doerig-style adversarial pressure is retained; consciousness-specific inferential criteria are not imported where phenomenality is no longer the explanandum.</li>\n</ol>\n<hr />\n", "plain": "1. What is inherited from the earlier Sīdus package\n\nRetained\n\nThe previous package did several things well enough to keep:\n\n1.  Local identifiability over global latent architecture. The old unconstrained interaction matrix was correctly retired.\n2.  Capacity-only claims. No result about internal monitoring licenses a phenomenality claim.\n3.  The information seam as an experimental scaffold. Restricted access can create an identifiable communication problem without being asserted as literal neuroanatomy.\n4.  Rate spent versus information delivered. r_(v) ≠ m_(v) remains a load-bearing distinction.\n5.  Joint benefit surfaces. Complementarity and substitution should be measured rather than assumed away.\n6.  Causal use. Decodability is insufficient.\n7.  Optimization validity. Posterior/channel collapse and training history can masquerade as scientific allocation preferences.\n8.  Role/implementation separation. Functional claims should survive implementation controls where technically feasible.\n9.  Stage gates and kill criteria. Expensive methods and broader claims are conditional on simpler pilots.\n\nDemoted or revised\n\n1.  Attention privilege. Attention becomes one candidate control process, not the privileged residual target of the programme.\n2.  The old definition of metarepresentation. A message about an internal controller is now called an internal-state model unless stricter representational criteria are independently satisfied.\n3.  One global coordinator. Π is a tractable experimental consumer, not a theory of cognitive headquarters.\n4.  One global resource currency. A single rate budget is a controlled experimental manipulation, not a claim about one biological pool.\n5.  Astrocyte as default method. Gaussian-process Bayesian optimization is optional infrastructure, not a prerequisite for the first experiment.\n6.  Doerig as the programme’s ontology. Doerig-style adversarial pressure is retained; consciousness-specific inferential criteria are not imported where phenomenality is no longer the explanandum.\n\n------------------------------------------------------------------------\n"}, {"id": "2-what-would-count-as-an-ecology-level-result", "title": "2. What would count as an ecology-level result?", "part": null, "html": "<h2 id=\"what-would-count-as-an-ecology-level-result\">2. What would count as an ecology-level result?</h2>\n<p>A single second-order signal does not make an ecology. Neither do three modules drawn in a diagram.</p>\n<p>An ecology-level result requires at least one <strong>relational regularity</strong> that predicts how one internal model changes the value, fidelity, use, or resource allocation of another across more than one condition.</p>\n<p>Candidate relation classes are:</p>\n<ul>\n<li><strong>competition</strong> - models trade off under a demonstrably shared constraint;</li>\n<li><strong>complementarity</strong> - one model increases the marginal utility of another;</li>\n<li><strong>substitution</strong> - one model reduces the marginal utility of another;</li>\n<li><strong>causal-topological dependence</strong> - monitoring value tracks causal role/position rather than implementation identity;</li>\n<li><strong>recursive regulation</strong> - a model of a control process changes subsequent control;</li>\n<li><strong>fidelity dependence</strong> - downstream use scales with calibrated accuracy, not merely decodability;</li>\n<li><strong>temporal niche</strong> - optimal/useful monitoring differs systematically with volatility, persistence, lag, or control horizon.</li>\n</ul>\n<p>The programme does not assume all seven exist.</p>\n<hr />\n", "plain": "2. What would count as an ecology-level result?\n\nA single second-order signal does not make an ecology. Neither do three modules drawn in a diagram.\n\nAn ecology-level result requires at least one relational regularity that predicts how one internal model changes the value, fidelity, use, or resource allocation of another across more than one condition.\n\nCandidate relation classes are:\n\n-   competition - models trade off under a demonstrably shared constraint;\n-   complementarity - one model increases the marginal utility of another;\n-   substitution - one model reduces the marginal utility of another;\n-   causal-topological dependence - monitoring value tracks causal role/position rather than implementation identity;\n-   recursive regulation - a model of a control process changes subsequent control;\n-   fidelity dependence - downstream use scales with calibrated accuracy, not merely decodability;\n-   temporal niche - optimal/useful monitoring differs systematically with volatility, persistence, lag, or control horizon.\n\nThe programme does not assume all seven exist.\n\n------------------------------------------------------------------------\n"}, {"id": "p1-emergent-communication-in-multi-agent-rl-under-bandwidth-constraints", "title": "P1. Emergent communication in multi-agent RL under bandwidth constraints", "part": "PART 0 - POSITIONING AGAINST ADJACENT LITERATURES", "html": "<p><strong>[R4 · correction, August 2026 review pass]</strong></p>\n<p>Constraint C5 of Document I requires that no novelty claim survive an unsearched prior-art row. That constraint was executed thoroughly on the metacognition and consciousness-methodology side and <strong>not</strong> on the information-theory, control, and reinforcement-learning side. Five literatures substantially overlap E1, E3 and E4 and were absent from earlier drafts. Each is given a paragraph here stating what it established and where this programme actually differs. Where the difference is thin, that is said. A sixth family — the nearest neurocomputational neighbours — was still missing after that pass and is added as P6 in the second external review pass.</p>\n<h2 id=\"p1.-emergent-communication-in-multi-agent-rl-under-bandwidth-constraints\">P1. Emergent communication in multi-agent RL under bandwidth constraints</h2>\n<p>Learned communication protocols over limited channels are an established subfield. DIAL and RIAL (Foerster et al. 2016) learn discrete and differentiable protocols end to end; SchedNet (Kim et al. 2019) learns <em>which</em> agents may transmit over a contested channel by learned importance weights; IMAC (Wang et al. 2020) derives a mutual-information upper bound as an explicit bandwidth constraint and learns low-entropy messages; VBC (Zhang et al. 2019) prunes communication by variance. E1 — learned agents allocating a shared information rate across sources, with messages tested for causal use — is structurally close to this work, and the resemblance should be stated before a reviewer states it. Three differences are defensible. The sources are <strong>internal control states of a single agent</strong> rather than other agents’ observations of external world state, so encoder and consumer share a body and a reward. The <strong>scientific object is the allocation law measured against an empirically estimated benefit surface</strong>, rather than task return maximised by any protocol that works. And <strong>causal-use validation is a gate rather than a diagnostic</strong>: a decodable but behaviourally inert channel fails E0-A outright. Honesty about the first difference: a single agent with private modules and a shared reward is formally close to a cooperative multi-agent system, and the architectural distinction alone will not carry the positioning. The scientific one will.</p>\n", "plain": "[R4 · correction, August 2026 review pass]\n\nConstraint C5 of Document I requires that no novelty claim survive an unsearched prior-art row. That constraint was executed thoroughly on the metacognition and consciousness-methodology side and not on the information-theory, control, and reinforcement-learning side. Five literatures substantially overlap E1, E3 and E4 and were absent from earlier drafts. Each is given a paragraph here stating what it established and where this programme actually differs. Where the difference is thin, that is said. A sixth family — the nearest neurocomputational neighbours — was still missing after that pass and is added as P6 in the second external review pass.\n\nP1. Emergent communication in multi-agent RL under bandwidth constraints\n\nLearned communication protocols over limited channels are an established subfield. DIAL and RIAL (Foerster et al. 2016) learn discrete and differentiable protocols end to end; SchedNet (Kim et al. 2019) learns which agents may transmit over a contested channel by learned importance weights; IMAC (Wang et al. 2020) derives a mutual-information upper bound as an explicit bandwidth constraint and learns low-entropy messages; VBC (Zhang et al. 2019) prunes communication by variance. E1 — learned agents allocating a shared information rate across sources, with messages tested for causal use — is structurally close to this work, and the resemblance should be stated before a reviewer states it. Three differences are defensible. The sources are internal control states of a single agent rather than other agents’ observations of external world state, so encoder and consumer share a body and a reward. The scientific object is the allocation law measured against an empirically estimated benefit surface, rather than task return maximised by any protocol that works. And causal-use validation is a gate rather than a diagnostic: a decodable but behaviourally inert channel fails E0-A outright. Honesty about the first difference: a single agent with private modules and a shared reward is formally close to a cooperative multi-agent system, and the architectural distinction alone will not carry the positioning. The scientific one will.\n"}, {"id": "p2-information-theoretic-bounded-rationality", "title": "P2. Information-theoretic bounded rationality", "part": null, "html": "<h2 id=\"p2.-information-theoretic-bounded-rationality\">P2. Information-theoretic bounded rationality</h2>\n<p>Ortega and Braun’s free-energy formulation, and Genewein et al. (2015) on hierarchical decision-making under an information-processing cost, establish the trade-off between expected utility and rate as an optimality principle, with antecedents in Tishby and Polani (2011) and in linearly-solvable control. The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> versus <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m</mi><annotation encoding=\"application/x-tex\">m</annotation></semantics></math> distinction and the KL rate cost used throughout this package live <strong>inside</strong> this tradition and are inherited from it, not derived here; they should be cited accordingly. The difference is one of direction. That literature specifies the trade-off normatively and derives optimal policies from it. E1 applies the constraint to self-monitoring specifically and <strong>measures</strong> the benefit surface empirically rather than assuming a parametric form for it — which is what permits interaction, non-concavity, and failure of separability to appear as findings rather than as violated assumptions.</p>\n", "plain": "P2. Information-theoretic bounded rationality\n\nOrtega and Braun’s free-energy formulation, and Genewein et al. (2015) on hierarchical decision-making under an information-processing cost, establish the trade-off between expected utility and rate as an optimality principle, with antecedents in Tishby and Polani (2011) and in linearly-solvable control. The r versus m distinction and the KL rate cost used throughout this package live inside this tradition and are inherited from it, not derived here; they should be cited accordingly. The difference is one of direction. That literature specifies the trade-off normatively and derives optimal policies from it. E1 applies the constraint to self-monitoring specifically and measures the benefit surface empirically rather than assuming a parametric form for it — which is what permits interaction, non-concavity, and failure of separability to appear as findings rather than as violated assumptions.\n"}, {"id": "p3-rational-inattention", "title": "P3. Rational inattention", "part": null, "html": "<h2 id=\"p3.-rational-inattention\">P3. Rational inattention</h2>\n<p>Sims (2003) formalised capacity-constrained attention allocation under a Shannon cost; Caplin and Dean (2015) supplied revealed-preference tests for costly information acquisition. H1 is, in structure, a rational-inattention hypothesis pointed inward, and this is the collision most likely to be recognised by a cognitive scientist rather than only by a machine-learning reviewer. Two differences. Rational inattention constrains the acquisition of <strong>external</strong> state; here the constrained resource is applied to states the agent itself generates, where the benefit accrues to control of control rather than to decision accuracy. More importantly: rational inattention <strong>assumes the optimum is attained</strong> and derives behaviour from that premise. This programme treats attainment as the empirical question. The real content of H1 and H2 is not whether a capacity-constrained optimum exists — it does — but whether a learning system operating under realistic optimisation pathologies finds it, and what it does instead when it does not.</p>\n", "plain": "P3. Rational inattention\n\nSims (2003) formalised capacity-constrained attention allocation under a Shannon cost; Caplin and Dean (2015) supplied revealed-preference tests for costly information acquisition. H1 is, in structure, a rational-inattention hypothesis pointed inward, and this is the collision most likely to be recognised by a cognitive scientist rather than only by a machine-learning reviewer. Two differences. Rational inattention constrains the acquisition of external state; here the constrained resource is applied to states the agent itself generates, where the benefit accrues to control of control rather than to decision accuracy. More importantly: rational inattention assumes the optimum is attained and derives behaviour from that premise. This programme treats attainment as the empirical question. The real content of H1 and H2 is not whether a capacity-constrained optimum exists — it does — but whether a learning system operating under realistic optimisation pathologies finds it, and what it does instead when it does not.\n"}, {"id": "p4-value-of-information-sensor-scheduling-and-networked-control", "title": "P4. Value-of-information sensor scheduling and networked control", "part": null, "html": "<h2 id=\"p4.-value-of-information-sensor-scheduling-and-networked-control\">P4. Value-of-information sensor scheduling and networked control</h2>\n<p>“Which sensor’s state is worth transmitting under a communication constraint” has been formalised for decades. Imer and Başar (2005), Lipsa and Martins (2011), and Gao, Akyol and Başar (2018) treat remote estimation in which communication is limited or explicitly priced; Gao et al. directly distinguish soft transmission costs from a hard limit on transmission opportunities. Sequential rate-distortion work by Tanaka et al. (2017), and later finite-rate sequential source coding by Stavrou, Skoglund and Tanaka (2022), formalises closely related rate–distortion and encoder-design problems for dynamical systems. <strong>Some E1 specialisations are formally very close to this problem class</strong>, and pretending otherwise would be indefensible; the package does not claim a general isomorphism without an explicit mapping of state, information pattern, objective and constraint. The differences are that the intended sources are non-Gaussian and low-cardinality internal control states, the distortion analogue is expected return rather than quadratic estimation error, and the encoders are <strong>learned rather than designed</strong>. The right posture toward this literature is not defensive. Per Document I §8.1, a deliberately constructed solved linear-Gaussian case is not a competitor but a <strong>validation target</strong>: a learned allocation that cannot recover a known optimum where one exists has not earned interpretation where none does.</p>\n", "plain": "P4. Value-of-information sensor scheduling and networked control\n\n“Which sensor’s state is worth transmitting under a communication constraint” has been formalised for decades. Imer and Başar (2005), Lipsa and Martins (2011), and Gao, Akyol and Başar (2018) treat remote estimation in which communication is limited or explicitly priced; Gao et al. directly distinguish soft transmission costs from a hard limit on transmission opportunities. Sequential rate-distortion work by Tanaka et al. (2017), and later finite-rate sequential source coding by Stavrou, Skoglund and Tanaka (2022), formalises closely related rate–distortion and encoder-design problems for dynamical systems. Some E1 specialisations are formally very close to this problem class, and pretending otherwise would be indefensible; the package does not claim a general isomorphism without an explicit mapping of state, information pattern, objective and constraint. The differences are that the intended sources are non-Gaussian and low-cardinality internal control states, the distortion analogue is expected return rather than quadratic estimation error, and the encoders are learned rather than designed. The right posture toward this literature is not defensive. Per Document I §8.1, a deliberately constructed solved linear-Gaussian case is not a competitor but a validation target: a learned allocation that cannot recover a known optimum where one exists has not earned interpretation where none does.\n"}, {"id": "p5-rational-metareasoning-and-value-of-computation", "title": "P5. Rational metareasoning and value of computation", "part": null, "html": "<h2 id=\"p5.-rational-metareasoning-and-value-of-computation\">P5. Rational metareasoning and value of computation</h2>\n<p>Russell and Wefald (1991) and Hay, Russell, Tolpin and Shimony (2012) price a computation by its expected effect on the decision it informs. The hypothesis that monitoring value tracks causal position and downstream reach — <strong>H2</strong> in this document, <strong>H4</strong> in the Master’s scoping document — overlaps conceptually with value of computation, and the overlap must be stated. Graph position and value of computation are not identical, but they are close enough that a topology result could be a VOC result wearing different notation.</p>\n<p><strong>[Revised after release-candidate review.]</strong> An earlier version of this paragraph described VOC as “myopic and per-item” and contrasted that with a joint, constrained Sīdus problem. That characterisation was wrong. Rational metareasoning is formulated as a <strong>metalevel MDP</strong>; the myopic or meta-greedy policy is one <em>approximation</em> within that framework, not its definition, and Hay et al. explicitly analyse the relation between myopic and optimal metalevel policies. Exact metalevel policies are intractable in general, which is why myopic approximations are used in practice — a fact that applies symmetrically to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathbf r^*(C)</annotation></semantics></math> and is already covered by anti-slop rule 5.</p>\n<p>The honest differences are narrower. VOC prices <strong>computations against a decision</strong>; the allocation problem prices <strong>channels against each other</strong> under a binding shared budget, where sources may be complementary or substitutable. Neither is tractable in general; both enter as benchmarks rather than as claims about what any system computes. For the separable, non-interacting case they converge, which is why a <strong>specified myopic-VOC baseline</strong> belongs in the comparison set rather than in a related-work paragraph. If the joint resource surface fails to improve out-of-sample prediction over myopic VOC, the experiment provides <strong>no incremental predictive evidence</strong> for the interaction structure this programme is built to detect beyond that simpler benchmark.</p>\n", "plain": "P5. Rational metareasoning and value of computation\n\nRussell and Wefald (1991) and Hay, Russell, Tolpin and Shimony (2012) price a computation by its expected effect on the decision it informs. The hypothesis that monitoring value tracks causal position and downstream reach — H2 in this document, H4 in the Master’s scoping document — overlaps conceptually with value of computation, and the overlap must be stated. Graph position and value of computation are not identical, but they are close enough that a topology result could be a VOC result wearing different notation.\n\n[Revised after release-candidate review.] An earlier version of this paragraph described VOC as “myopic and per-item” and contrasted that with a joint, constrained Sīdus problem. That characterisation was wrong. Rational metareasoning is formulated as a metalevel MDP; the myopic or meta-greedy policy is one approximation within that framework, not its definition, and Hay et al. explicitly analyse the relation between myopic and optimal metalevel policies. Exact metalevel policies are intractable in general, which is why myopic approximations are used in practice — a fact that applies symmetrically to r^(*)(C) and is already covered by anti-slop rule 5.\n\nThe honest differences are narrower. VOC prices computations against a decision; the allocation problem prices channels against each other under a binding shared budget, where sources may be complementary or substitutable. Neither is tractable in general; both enter as benchmarks rather than as claims about what any system computes. For the separable, non-interacting case they converge, which is why a specified myopic-VOC baseline belongs in the comparison set rather than in a related-work paragraph. If the joint resource surface fails to improve out-of-sample prediction over myopic VOC, the experiment provides no incremental predictive evidence for the interaction structure this programme is built to detect beyond that simpler benchmark.\n"}, {"id": "p6-precision-weighting-attention-as-resource-and-working-memory-limits", "title": "P6. Precision weighting, attention-as-resource, and working-memory limits", "part": null, "html": "<h2 id=\"p6.-precision-weighting-attention-as-resource-and-working-memory-limits\">P6. Precision weighting, attention-as-resource, and working-memory limits</h2>\n<p><strong>[Second external review pass — neuroscience-side C5.]</strong> The nearest neurocomputational neighbours are not source-coding problems at all, and they constrain a different part of the programme. Expected-precision accounts of attention (Feldman &amp; Friston 2010) treat attention as the optimisation of precision estimates that weight first-order sensory evidence — formally, E2’s consumer using <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">M_v</annotation></semantics></math> to weight first-order representations <em>is</em> precision weighting, and any neuroscience-facing reading of E2 must say so. Attention-as-resource (Kahneman 1973) is the classical ancestor of every shared-budget intuition in this package. The working-memory slots-versus-resources debate (Ma, Husain &amp; Bays 2014) shows that even for the best-studied candidate “shared pool” in cognition, the existence of a single common currency is contested rather than established. None of this changes the synthetic thesis, which makes no biological budget claim. It becomes load-bearing at E6, where these literatures — not the source-coding apparatus — set the standard of evidence for any human translation.</p>\n", "plain": "P6. Precision weighting, attention-as-resource, and working-memory limits\n\n[Second external review pass — neuroscience-side C5.] The nearest neurocomputational neighbours are not source-coding problems at all, and they constrain a different part of the programme. Expected-precision accounts of attention (Feldman & Friston 2010) treat attention as the optimisation of precision estimates that weight first-order sensory evidence — formally, E2’s consumer using M_(v) to weight first-order representations is precision weighting, and any neuroscience-facing reading of E2 must say so. Attention-as-resource (Kahneman 1973) is the classical ancestor of every shared-budget intuition in this package. The working-memory slots-versus-resources debate (Ma, Husain & Bays 2014) shows that even for the best-studied candidate “shared pool” in cognition, the existence of a single common currency is contested rather than established. None of this changes the synthetic thesis, which makes no biological budget claim. It becomes load-bearing at E6, where these literatures — not the source-coding apparatus — set the standard of evidence for any human translation.\n"}, {"id": "what-the-six-leave-standing", "title": "What the six leave standing", "part": null, "html": "<h2 id=\"what-the-six-leave-standing\">What the six leave standing</h2>\n<p>Nothing in the formalism. The rate machinery, the shared-budget structure, the utility-versus-rate trade-off, and the marginal-value logic are all inherited. What survives is narrower and should be stated in exactly these terms:</p>\n<blockquote>\n<p>The application of an established rate-allocation apparatus to <strong>internal monitoring targets specifically</strong>, with <strong>construct validity gated before</strong> any allocation claim (E0), and with <strong>causal use required rather than decodability</strong>.</p>\n</blockquote>\n<p>That is an application-level and methodological contribution. It is smaller than “a new theory of bounded self-monitoring” and it is the size that the evidence can currently carry.</p>\n<hr />\n", "plain": "What the six leave standing\n\nNothing in the formalism. The rate machinery, the shared-budget structure, the utility-versus-rate trade-off, and the marginal-value logic are all inherited. What survives is narrower and should be stated in exactly these terms:\n\n  The application of an established rate-allocation apparatus to internal monitoring targets specifically, with construct validity gated before any allocation claim (E0), and with causal use required rather than decodability.\n\nThat is an application-level and methodological contribution. It is smaller than “a new theory of bounded self-monitoring” and it is the size that the evidence can currently carry.\n\n------------------------------------------------------------------------\n"}, {"id": "3-h1-scarcity-and-competition", "title": "3. H1 - Scarcity and competition", "part": "PART I - HYPOTHESIS FAMILIES", "html": "<h2 id=\"h1---scarcity-and-competition\">3. H1 - Scarcity and competition</h2>\n<h3 id=\"hypothesis\">Hypothesis</h3>\n<p>When multiple internal targets are locally available but their models must pass through a genuinely binding shared communication constraint, learned systems will allocate unequal rate according to the marginal control value of exposing each target.</p>\n<p>The safest empirical object is the joint benefit surface:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><mn>𝟎</mn><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\mathcal B(\\mathbf r)=\\mathbb E[J\\mid\\mathbf r]-\\mathbb E[J\\mid\\mathbf 0],\n</annotation></semantics></math></p>\n<p>with normative benchmark</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>arg</mo><munder><mo>max</mo><mrow><mi>𝐫</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mspace width=\"0.278em\"></mspace><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><mi>C</mi></mrow></munder><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathbf r^*(C)=\n\\arg\\max_{\\mathbf r\\ge0,\\;\\sum_vr_v\\le C}\n\\mathcal B(\\mathbf r).\n</annotation></semantics></math></p>\n<p>This is not a claim that organisms compute the argmax. It is a benchmark against which learned allocation can be compared.</p>\n<h3 id=\"competing-explanations\">Competing explanations</h3>\n<ul>\n<li>source entropy alone;</li>\n<li>ordinary inferability from public information;</li>\n<li>fixed head/implementation bias;</li>\n<li>training-order/path dependence;</li>\n<li>no shared resource at all;</li>\n<li>a simpler architecture in which every source is transmitted independently.</li>\n</ul>\n<h3 id=\"falsifying-narrowing-outcomes\">Falsifying / narrowing outcomes</h3>\n<p>H1 is weakened or rejected in a given architecture if:</p>\n<ul>\n<li>reducing nominal capacity does not create measurable cross-source trade-offs;</li>\n<li>allocation differences vanish after ordinary inferability is controlled;</li>\n<li>rates are dominated by head identity or initialization;</li>\n<li>learned allocations do not generalize to held-out task conditions better than simpler predictors;</li>\n<li>transmitted state information is behaviorally unused.</li>\n</ul>\n<hr />\n", "plain": "3. H1 - Scarcity and competition\n\nHypothesis\n\nWhen multiple internal targets are locally available but their models must pass through a genuinely binding shared communication constraint, learned systems will allocate unequal rate according to the marginal control value of exposing each target.\n\nThe safest empirical object is the joint benefit surface:\n\nℬ(r) = 𝔼[J∣r] − 𝔼[J∣0],\n\nwith normative benchmark\n\nr^(*)(C) = arg max_(r ≥ 0, ∑_(v)r_(v) ≤ C)ℬ(r).\n\nThis is not a claim that organisms compute the argmax. It is a benchmark against which learned allocation can be compared.\n\nCompeting explanations\n\n-   source entropy alone;\n-   ordinary inferability from public information;\n-   fixed head/implementation bias;\n-   training-order/path dependence;\n-   no shared resource at all;\n-   a simpler architecture in which every source is transmitted independently.\n\nFalsifying / narrowing outcomes\n\nH1 is weakened or rejected in a given architecture if:\n\n-   reducing nominal capacity does not create measurable cross-source trade-offs;\n-   allocation differences vanish after ordinary inferability is controlled;\n-   rates are dominated by head identity or initialization;\n-   learned allocations do not generalize to held-out task conditions better than simpler predictors;\n-   transmitted state information is behaviorally unused.\n\n------------------------------------------------------------------------\n"}, {"id": "4-h2-causal-topology-predicts-monitoring-value", "title": "4. H2 - Causal topology predicts monitoring value", "part": null, "html": "<h2 id=\"h2---causal-topology-predicts-monitoring-value\">4. H2 - Causal topology predicts monitoring value</h2>\n<h3 id=\"hypothesis\">Hypothesis</h3>\n<p>The value of monitoring an internal target depends partly on its causal position in the system. Holding obvious statistical properties as controlled as practical, states with greater downstream reach, bottleneck position, persistence, or influence over other computations should exhibit systematically different benefit-rate curves.</p>\n<p>This reframes the old Sīdus topology model from a nuisance control into a candidate explanatory principle.</p>\n<h3 id=\"minimal-test\">Minimal test</h3>\n<p>Create matched modules from the same implementation family but vary one high-level causal property, such as how many downstream decisions depend on the state. Measure:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mi>v</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>J</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>J</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><mn>0</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\nB_v(r)=J(r_v=r)-J(r_v=0)\n</annotation></semantics></math></p>\n<p>and ask whether topology predicts the curve out of sample.</p>\n<h3 id=\"stronger-test\">Stronger test</h3>\n<p>If simple manipulations establish an effect, use causal-role permutation. Only then consider causal-abstraction/interchange validation to verify that a proposed high-level role is actually realized by the low-level module.</p>\n<h3 id=\"failure-condition\">Failure condition</h3>\n<p>If topology metrics add no predictive value beyond entropy, inferability, and direct control relevance, do not elevate topology into an organizing principle.</p>\n<hr />\n", "plain": "4. H2 - Causal topology predicts monitoring value\n\nHypothesis\n\nThe value of monitoring an internal target depends partly on its causal position in the system. Holding obvious statistical properties as controlled as practical, states with greater downstream reach, bottleneck position, persistence, or influence over other computations should exhibit systematically different benefit-rate curves.\n\nThis reframes the old Sīdus topology model from a nuisance control into a candidate explanatory principle.\n\nMinimal test\n\nCreate matched modules from the same implementation family but vary one high-level causal property, such as how many downstream decisions depend on the state. Measure:\n\nB_(v)(r) = J(r_(v)=r) − J(r_(v)=0)\n\nand ask whether topology predicts the curve out of sample.\n\nStronger test\n\nIf simple manipulations establish an effect, use causal-role permutation. Only then consider causal-abstraction/interchange validation to verify that a proposed high-level role is actually realized by the low-level module.\n\nFailure condition\n\nIf topology metrics add no predictive value beyond entropy, inferability, and direct control relevance, do not elevate topology into an organizing principle.\n\n------------------------------------------------------------------------\n"}, {"id": "5-h3-recursive-monitoring-can-improve-control-of-control", "title": "5. H3 - Recursive monitoring can improve control of control", "part": null, "html": "<h2 id=\"h3---recursive-monitoring-can-improve-control-of-control\">5. H3 - Recursive monitoring can improve control of control</h2>\n<h3 id=\"hypothesis\">Hypothesis</h3>\n<p>Monitoring the <em>realized state</em> of a control or resource-allocation process can have future control value when commands are imperfect, the realized state persists or lags, and future actions can compensate.</p>\n<p>Use two distinct resource levels:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>a</mi><mrow><mi>i</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>≤</mo><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">\n\\sum_i a_{i,t}\\le C_{\\mathrm{base}}\n</annotation></semantics></math></p>\n<p>for first-order world-facing allocation, and</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>+</mo><msub><mi>r</mi><mi>A</mi></msub><mo>≤</mo><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">\n\\sum_v r_v + r_A\\le C_{\\mathrm{meta}}\n</annotation></semantics></math></p>\n<p>for internal-state modelling.</p>\n<p>The recursion is temporal:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">allocate</mtext><mo>→</mo><mtext mathvariant=\"normal\">observe realized allocation</mtext><mo>→</mo><mtext mathvariant=\"normal\">use the model</mtext><mo>→</mo><mtext mathvariant=\"normal\">allocate better later</mtext><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\text{allocate}\n\\rightarrow\n\\text{observe realized allocation}\n\\rightarrow\n\\text{use the model}\n\\rightarrow\n\\text{allocate better later}.\n</annotation></semantics></math></p>\n<h3 id=\"primary-estimand\">Primary estimand</h3>\n<p>Let</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>B</mi><mi>A</mi><mi>H</mi></msubsup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><msub><mi>J</mi><mi>H</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mi>A</mi></msub><mo>=</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><msub><mi>J</mi><mi>H</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mi>A</mi></msub><mo>=</mo><mn>0</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\nB_A^H(r)=J_H(r_A=r)-J_H(r_A=0)\n</annotation></semantics></math></p>\n<p>be finite-horizon benefit. Separate current interpretive value from future feedback value with a matched contrast:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>Γ</mi><mi>A</mi><mi>H</mi></msubsup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><msubsup><mi>B</mi><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">k</mi></mrow><mo>,</mo><mi>H</mi></mrow></msubsup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><msubsup><mi>B</mi><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">z</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi></mrow><mo>,</mo><mi>H</mi></mrow></msubsup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\Gamma_A^H(r)\n=\nB_A^{\\mathrm{feedback},H}(r)\n-\nB_A^{\\mathrm{frozen},H}(r).\n</annotation></semantics></math></p>\n<p>The frozen condition makes the same current allocator information available but prevents it from influencing future allocation commands.</p>\n<h3 id=\"predictions\">Predictions</h3>\n<p><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msubsup><mi>Γ</mi><mi>A</mi><mi>H</mi></msubsup><annotation encoding=\"application/x-tex\">\\Gamma_A^H</annotation></semantics></math> should increase when:</p>\n<ul>\n<li>command-to-realized allocation is noisy or lagged;</li>\n<li>the realized allocation changes downstream signal reliability;</li>\n<li>allocation has temporal persistence;</li>\n<li>the horizon permits corrective reallocation.</li>\n</ul>\n<p>It should collapse when:</p>\n<ul>\n<li>realized allocation is directly observable without the special channel;</li>\n<li>commands determine allocation perfectly and immediately;</li>\n<li>allocation has no behavioral consequences;</li>\n<li>feedback is impossible;</li>\n<li>the horizon is too short.</li>\n</ul>\n<h3 id=\"prior-art-discipline\">Prior-art discipline</h3>\n<p>This experiment lives next to meta-control, rational metareasoning, active information gathering, and oMCD. Its novelty is <strong>open</strong>, not presumed.</p>\n<hr />\n", "plain": "5. H3 - Recursive monitoring can improve control of control\n\nHypothesis\n\nMonitoring the realized state of a control or resource-allocation process can have future control value when commands are imperfect, the realized state persists or lags, and future actions can compensate.\n\nUse two distinct resource levels:\n\n∑_(i)a_(i, t) ≤ C_(base)\n\nfor first-order world-facing allocation, and\n\n∑_(v)r_(v) + r_(A) ≤ C_(meta)\n\nfor internal-state modelling.\n\nThe recursion is temporal:\n\nallocate → observe realized allocation → use the model → allocate better later.\n\nPrimary estimand\n\nLet\n\nB_(A)^(H)(r) = J_(H)(r_(A)=r) − J_(H)(r_(A)=0)\n\nbe finite-horizon benefit. Separate current interpretive value from future feedback value with a matched contrast:\n\nΓ_(A)^(H)(r) = B_(A)^(feedback, H)(r) − B_(A)^(frozen, H)(r).\n\nThe frozen condition makes the same current allocator information available but prevents it from influencing future allocation commands.\n\nPredictions\n\nΓ_(A)^(H) should increase when:\n\n-   command-to-realized allocation is noisy or lagged;\n-   the realized allocation changes downstream signal reliability;\n-   allocation has temporal persistence;\n-   the horizon permits corrective reallocation.\n\nIt should collapse when:\n\n-   realized allocation is directly observable without the special channel;\n-   commands determine allocation perfectly and immediately;\n-   allocation has no behavioral consequences;\n-   feedback is impossible;\n-   the horizon is too short.\n\nPrior-art discipline\n\nThis experiment lives next to meta-control, rational metareasoning, active information gathering, and oMCD. Its novelty is open, not presumed.\n\n------------------------------------------------------------------------\n"}, {"id": "6-h4-faithful-self-models-are-more-than-decodable-echoes", "title": "6. H4 - Faithful self-models are more than decodable echoes", "part": null, "html": "<h2 id=\"h4---faithful-self-models-are-more-than-decodable-echoes\">6. H4 - Faithful self-models are more than decodable echoes</h2>\n<h3 id=\"hypothesis\">Hypothesis</h3>\n<p>A candidate internal model earns a functional claim only when its information is sufficiently calibrated for its consumer and selectively perturbing it changes the downstream computation predicted by its content.</p>\n<p>A useful evidence sequence is:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">decodable</mtext><mspace width=\"0.278em\"></mspace><mo>&lt;</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">conditionally specific</mtext><mspace width=\"0.278em\"></mspace><mo>&lt;</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">misrepresentable</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mo>&lt;</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">causally target-dependent</mtext><mspace width=\"0.278em\"></mspace><mo>&lt;</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">causally used</mtext><mi>.</mi></mtd></mtr></mtable><annotation encoding=\"application/x-tex\">\n\\begin{array}{c}\n\\text{decodable}\\;&lt;\\;\\text{conditionally specific}\\;&lt;\\;\\text{misrepresentable}\\\\[3pt]\n&lt;\\;\\text{causally target-dependent}\\;&lt;\\;\\text{causally used}.\n\\end{array}\n</annotation></semantics></math></p>\n<h3 id=\"failure-condition\">Failure condition</h3>\n<p>If a candidate signal decodes the target but perturbing it leaves the putative consumer unchanged, call it redundant or unused under the tested conditions. Do not rescue the claim by redefining its function.</p>\n<hr />\n", "plain": "6. H4 - Faithful self-models are more than decodable echoes\n\nHypothesis\n\nA candidate internal model earns a functional claim only when its information is sufficiently calibrated for its consumer and selectively perturbing it changes the downstream computation predicted by its content.\n\nA useful evidence sequence is:\n\n$$\n\\begin{array}{c}\n\\text{decodable}\\;<\\;\\text{conditionally specific}\\;<\\;\\text{misrepresentable}\\\\[3pt]\n<\\;\\text{causally target-dependent}\\;<\\;\\text{causally used}.\n\\end{array}\n$$\n\nFailure condition\n\nIf a candidate signal decodes the target but perturbing it leaves the putative consumer unchanged, call it redundant or unused under the tested conditions. Do not rescue the claim by redefining its function.\n\n------------------------------------------------------------------------\n"}, {"id": "7-h5-complementarity-and-substitution", "title": "7. H5 - Complementarity and substitution", "part": null, "html": "<h2 id=\"h5---complementarity-and-substitution\">7. H5 - Complementarity and substitution</h2>\n<h3 id=\"hypothesis\">Hypothesis</h3>\n<p>The value of one internal model depends on what other models are available.</p>\n<p>For a smooth estimated benefit surface, local cross-curvature can be used as a <em>diagnostic</em>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Γ</mi><mrow><mi>u</mi><mi>v</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mfrac><mrow><msup><mi>∂</mi><mn>2</mn></msup><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mrow><mi>∂</mi><msub><mi>r</mi><mi>u</mi></msub><mi>∂</mi><msub><mi>r</mi><mi>v</mi></msub></mrow></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\Gamma_{uv}(\\mathbf r)\n=\n\\frac{\\partial^2\\mathcal B(\\mathbf r)}{\\partial r_u\\partial r_v}.\n</annotation></semantics></math></p>\n<p>Positive values suggest local complementarity; negative values suggest substitution. The derivative is not an ontological quantity and should not be interpreted without uncertainty.</p>\n<h3 id=\"more-robust-empirical-alternative\">More robust empirical alternative</h3>\n<p>Use factorial allocation contrasts or held-out predictive comparisons between:</p>\n<ul>\n<li>additive model <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mo>∑</mo><mi>v</mi></msub><msub><mi>B</mi><mi>v</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\sum_vB_v(r_v)</annotation></semantics></math>;</li>\n<li>pairwise-interaction model;</li>\n<li>full joint surface.</li>\n</ul>\n<p>The simplest model that predicts held-out returns adequately wins.</p>\n<hr />\n", "plain": "7. H5 - Complementarity and substitution\n\nHypothesis\n\nThe value of one internal model depends on what other models are available.\n\nFor a smooth estimated benefit surface, local cross-curvature can be used as a diagnostic:\n\n$$\n\\Gamma_{uv}(\\mathbf r)\n=\n\\frac{\\partial^2\\mathcal B(\\mathbf r)}{\\partial r_u\\partial r_v}.\n$$\n\nPositive values suggest local complementarity; negative values suggest substitution. The derivative is not an ontological quantity and should not be interpreted without uncertainty.\n\nMore robust empirical alternative\n\nUse factorial allocation contrasts or held-out predictive comparisons between:\n\n-   additive model ∑_(v)B_(v)(r_(v));\n-   pairwise-interaction model;\n-   full joint surface.\n\nThe simplest model that predicts held-out returns adequately wins.\n\n------------------------------------------------------------------------\n"}, {"id": "8-h6-temporal-niche", "title": "8. H6 - Temporal niche", "part": null, "html": "<h2 id=\"h6---temporal-niche\">8. H6 - Temporal niche</h2>\n<h3 id=\"hypothesis\">Hypothesis</h3>\n<p>Monitoring policies depend systematically on the timescale of the target and the horizon over which its state matters.</p>\n<p>Candidate parameters include:</p>\n<ul>\n<li>target volatility;</li>\n<li>temporal autocorrelation;</li>\n<li>command/actuator lag;</li>\n<li>persistence of errors;</li>\n<li>duration of downstream consequences;</li>\n<li>cost of delayed correction.</li>\n</ul>\n<h3 id=\"prediction\">Prediction</h3>\n<p>Fast, volatile targets should favor frequent low-latency updating when they remain control-relevant; slowly drifting but consequential targets may favor lower-frequency, higher-fidelity summaries. The exact pattern is an empirical question.</p>\n<h3 id=\"failure-condition\">Failure condition</h3>\n<p>If timescale manipulations do not improve predictions of monitoring policy beyond static control value, temporal niche remains unnecessary.</p>\n<hr />\n", "plain": "8. H6 - Temporal niche\n\nHypothesis\n\nMonitoring policies depend systematically on the timescale of the target and the horizon over which its state matters.\n\nCandidate parameters include:\n\n-   target volatility;\n-   temporal autocorrelation;\n-   command/actuator lag;\n-   persistence of errors;\n-   duration of downstream consequences;\n-   cost of delayed correction.\n\nPrediction\n\nFast, volatile targets should favor frequent low-latency updating when they remain control-relevant; slowly drifting but consequential targets may favor lower-frequency, higher-fidelity summaries. The exact pattern is an empirical question.\n\nFailure condition\n\nIf timescale manipulations do not improve predictions of monitoring policy beyond static control value, temporal niche remains unnecessary.\n\n------------------------------------------------------------------------\n"}, {"id": "9-e0-construct-benchmark-what-actually-counts-as-meta", "title": "9. E0 - Construct benchmark: what actually counts as meta?", "part": "PART II - EXPERIMENTAL PROGRAMME", "html": "<h2 id=\"e0---construct-benchmark-what-actually-counts-as-meta\">9. E0 - Construct benchmark: what actually counts as meta?</h2>\n<p>This is the first new experiment required by the reframing. It prevents the programme from building an ecology out of an undefined construct.</p>\n<h3 id=\"goal\">Goal</h3>\n<p>Create synthetic systems with known computational relationships and test whether proposed measurements distinguish:</p>\n<ol type=\"1\">\n<li><strong>ordinary first-order transformation</strong>;</li>\n<li><strong>internal-state model</strong>;</li>\n<li><strong>content/property metarepresentation</strong>;</li>\n<li><strong>process metarepresentation</strong>.</li>\n</ol>\n<h3 id=\"minimal-architecture\">Minimal architecture</h3>\n<p>Let an external latent state <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>X</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">X_t</annotation></semantics></math> generate observation <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>O</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">O_t</annotation></semantics></math>. A first-order system produces</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mi>t</mi></msub><mo>=</mo><msub><mi>F</mi><msub><mi>η</mi><mi>t</mi></msub></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>O</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\nR_t=F_{\\eta_t}(O_t),\n</annotation></semantics></math></p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math> controls a hidden property of the representational process: noise, bias, gain, source type, or mapping rule.</p>\n<p>Create four candidate downstream systems:</p>\n<p><strong>A. First-order echo</strong><br />\nReceives <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>R</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">R_t</annotation></semantics></math> and transforms it for the task. It has no separate target representing a property of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>R</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">R_t</annotation></semantics></math>.</p>\n<p><strong>B. Internal-state monitor</strong><br />\nReceives a hidden controller/process state <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">C_t</annotation></semantics></math> and reports its value.</p>\n<p><strong>C. Property metarepresentation candidate</strong><br />\nMust infer <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>R</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\phi(R_t)</annotation></semantics></math>, such as the likely correctness, source, or reliability of the current first-order representation.</p>\n<p><strong>D. Process metarepresentation candidate</strong><br />\nMust infer <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math> or a compact property of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>F</mi><msub><mi>η</mi><mi>t</mi></msub></msub><annotation encoding=\"application/x-tex\">F_{\\eta_t}</annotation></semantics></math>, and use that model to predict how first-order representations will change under controlled counterfactual inputs.</p>\n<h3 id=\"critical-matched-controls\">Critical matched controls</h3>\n<ul>\n<li>hold external <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>X</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">X_t</annotation></semantics></math> constant while changing <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math>;</li>\n<li>hold first-order choice/output constant while changing reliability;</li>\n<li>create cases where confidence/source/process inference is wrong;</li>\n<li>perturb the candidate meta-state while preserving first-order <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>R</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">R_t</annotation></semantics></math>;</li>\n<li>compare against a shortcut model that predicts <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\eta_t</annotation></semantics></math> from public context without reading the first-order process.</li>\n</ul>\n<h3 id=\"main-question\">Main question</h3>\n<p>Which evidence tiers from Foundations actually discriminate the four architectures?</p>\n<h3 id=\"success\">Success</h3>\n<p>E0 succeeds if at least one operational test distinguishes a genuine property/process-monitoring architecture from first-order and internal-state controls under held-out interventions.</p>\n<h3 id=\"failure\">Failure</h3>\n<p>If proposed criteria cannot distinguish the architectures without appealing to their labels or implementation history, the programme does <strong>not</strong> yet possess an empirically useful construct of metarepresentation. Stop and refine the construct before scaling.</p>\n<hr />\n", "plain": "9. E0 - Construct benchmark: what actually counts as meta?\n\nThis is the first new experiment required by the reframing. It prevents the programme from building an ecology out of an undefined construct.\n\nGoal\n\nCreate synthetic systems with known computational relationships and test whether proposed measurements distinguish:\n\n1.  ordinary first-order transformation;\n2.  internal-state model;\n3.  content/property metarepresentation;\n4.  process metarepresentation.\n\nMinimal architecture\n\nLet an external latent state X_(t) generate observation O_(t). A first-order system produces\n\nR_(t) = F_(η_(t))(O_(t)),\n\nwhere η_(t) controls a hidden property of the representational process: noise, bias, gain, source type, or mapping rule.\n\nCreate four candidate downstream systems:\n\nA. First-order echo\nReceives R_(t) and transforms it for the task. It has no separate target representing a property of R_(t).\n\nB. Internal-state monitor\nReceives a hidden controller/process state C_(t) and reports its value.\n\nC. Property metarepresentation candidate\nMust infer ϕ(R_(t)), such as the likely correctness, source, or reliability of the current first-order representation.\n\nD. Process metarepresentation candidate\nMust infer η_(t) or a compact property of F_(η_(t)), and use that model to predict how first-order representations will change under controlled counterfactual inputs.\n\nCritical matched controls\n\n-   hold external X_(t) constant while changing η_(t);\n-   hold first-order choice/output constant while changing reliability;\n-   create cases where confidence/source/process inference is wrong;\n-   perturb the candidate meta-state while preserving first-order R_(t);\n-   compare against a shortcut model that predicts η_(t) from public context without reading the first-order process.\n\nMain question\n\nWhich evidence tiers from Foundations actually discriminate the four architectures?\n\nSuccess\n\nE0 succeeds if at least one operational test distinguishes a genuine property/process-monitoring architecture from first-order and internal-state controls under held-out interventions.\n\nFailure\n\nIf proposed criteria cannot distinguish the architectures without appealing to their labels or implementation history, the programme does not yet possess an empirically useful construct of metarepresentation. Stop and refine the construct before scaling.\n\n------------------------------------------------------------------------\n"}, {"id": "10-e1-scarcity-terrarium-bounded-internal-state-monitoring", "title": "10. E1 - Scarcity terrarium: bounded internal-state monitoring", "part": null, "html": "<h2 id=\"e1---scarcity-terrarium-bounded-internal-state-monitoring\">10. E1 - Scarcity terrarium: bounded internal-state monitoring</h2>\n<p>This is the direct descendant of the strongest old Sīdus experiment, but it no longer pretends all messages are strict metarepresentations.</p>\n<h3 id=\"question\">Question</h3>\n<blockquote>\n<p><strong>When several private internal control/process states are useful to a coordinating agent but can only be exposed through a binding shared information-rate channel, what predicts the learned allocation of monitoring capacity?</strong></p>\n</blockquote>\n<h3 id=\"environment\">Environment</h3>\n<p>Use a compact POMDP with at least three low-cardinality private internal states, for example:</p>\n<ul>\n<li>sensory-selection state;</li>\n<li>working-memory update state;</li>\n<li>action-routing/effector state.</li>\n</ul>\n<p>The consumer receives ordinary public information <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ℐ</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathcal I_t</annotation></semantics></math> but no direct read of these private states.</p>\n<p>Each source has a symmetric encoder:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>→</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>→</mo><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">\nC_{v,t}\\rightarrow S_{v,t}\\rightarrow U\n</annotation></semantics></math></p>\n<p>with a single rate constraint:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\sum_v r_v\\le C_{\\mathrm{meta}}.\n</annotation></semantics></math></p>\n<h3 id=\"required-measures\">Required measures</h3>\n<p>For each source:</p>\n<ul>\n<li>conditional uncertainty <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">H(C_v\\mid\\mathcal I)</annotation></semantics></math>;</li>\n<li>state entropy/cardinality;</li>\n<li>causal return sensitivity;</li>\n<li>isolated learnability;</li>\n<li>distortion-rate / benefit-rate curve;</li>\n<li>temporal persistence/update frequency;</li>\n<li>basic causal-topological measures;</li>\n<li>rate spent <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>r</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">r_v</annotation></semantics></math>;</li>\n<li>incremental information delivered <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math>;</li>\n<li>targeted-channel causal-use effect.</li>\n</ul>\n<h3 id=\"required-controls\">Required controls</h3>\n<ul>\n<li>direct-read oracle;</li>\n<li>no-seam/full-read control;</li>\n<li>non-binding budget control;</li>\n<li>source/head permutation across seeds;</li>\n<li>warm-up before scarcity;</li>\n<li>gradual constrained scarcity ramp;</li>\n<li>selected from-scratch scarcity runs;</li>\n<li>held-out task conditions.</li>\n</ul>\n<h3 id=\"constraint-implementation-arm-s-core-alphabet-arm-optional\">Constraint implementation: Arm S core, alphabet arm optional</h3>\n<p><strong>[Design addition, August 2026 — demoted after release-candidate review]</strong></p>\n<p>An earlier version of this section proposed a hard alphabet-cardinality budget as a mandatory second arm and made <strong>rank-order invariance across arms</strong> a confirmatory prediction. Both claims were too strong and are withdrawn. What follows is the corrected position.</p>\n<p><strong>Arm S is the core experiment.</strong> Primal-dual or augmented-Lagrangian training formulates <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mo>∑</mo><mi>v</mi></msub><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">\\sum_v r_v\\le C_{\\mathrm{meta}}</annotation></semantics></math> as a constrained optimisation problem rather than merely attaching a fixed penalty coefficient. In a non-convex learned system, however, <strong>feasibility is an empirical property of the trained solution</strong>, not something the optimiser name guarantees. Realised constraint violation must therefore be reported and preregistered feasibility tolerances met before the run is interpreted as genuinely budget-constrained. The second epistemic question is whether the variational surrogate corresponds tightly enough to the intended information currency — and correction R2 makes that looseness measurable:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><msub><mi>m</mi><mi>v</mi></msub><mo>+</mo><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mo>,</mo><mspace width=\"2.0em\"></mspace><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mo>=</mo><msub><mi>𝔼</mi><mi>ℐ</mi></msub><mspace width=\"0.167em\"></mspace><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mspace width=\"-0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mo stretchy=\"false\" form=\"postfix\">‖</mo><mspace width=\"0.167em\"></mspace><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v=m_v+\\Delta_v^{\\mathrm{prior}},\n\\qquad\n\\Delta_v^{\\mathrm{prior}}=\\mathbb E_{\\mathcal I}\\,D_{KL}\\!\\left(q(S_v\\mid\\mathcal I)\\,\\Vert\\,p(S_v\\mid\\mathcal I)\\right).\n</annotation></semantics></math></p>\n<p>Arm S therefore requires two things to be reported alongside every allocation: realised constraint violation, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math> per source as a tightness diagnostic. Those reports are what license the surrogate as a rate meter; a second arm is not needed for that purpose.</p>\n<p><strong>Why the invariance test does not work.</strong> A KL budget and an alphabet budget are different resource currencies:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mspace width=\"0.278em\"></mspace><mo>≠</mo><mspace width=\"0.278em\"></mspace><msub><mo>log</mo><mn>2</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">|</mo><mi>𝒵</mi><mo stretchy=\"true\" form=\"postfix\">|</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathbb E[D_{KL}]\\;\\neq\\;\\log_2|\\mathcal Z|.\n</annotation></semantics></math></p>\n<p>One constrains expected informational departure from a prior; the other constrains maximum representational capacity. A source may be granted a large alphabet and use it sparsely; another may use a small alphabet efficiently. Different allocation rankings can therefore arise <strong>under perfect optimisation and an unchanged task</strong>. So</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mtext mathvariant=\"normal\">ranking</mtext><mi>S</mi></msub><mo>≠</mo><msub><mtext mathvariant=\"normal\">ranking</mtext><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">\n\\text{ranking}_S\\neq\\text{ranking}_H\n</annotation></semantics></math></p>\n<p>does not license the conclusion that the allocation law is optimiser-dependent. The more likely reading is that allocation depends on <strong>which resource is scarce</strong>, which is interesting and is not what an invariance test claims to measure.</p>\n<p><strong>The alphabet arm as optional robustness.</strong> If a stable allocation phenomenon is established in Arm S, a hard-capacity arm becomes worth running as a <strong>currency-sensitivity</strong> experiment: does the ordering change when the scarce resource is capacity rather than expected information cost? Run that way, a divergence is a finding about currency dependence rather than a failed invariance check.</p>\n<p>If it is run, the construction matters. Per-source codebooks give each source its own hard cap and abolish competition; a single shared codebook abolishes source-factorisation and with it the per-source identifiability of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>r</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">r_v</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math> and targeted intervention, taking Gates A3 and A4 and H3 with it. The constru
