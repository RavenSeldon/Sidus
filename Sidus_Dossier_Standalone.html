::selection{background:var(--gold);color:#111}a{color:inherit}button,input{font:inherit}
.topbar{height:var(--top);position:fixed;z-index:40;left:0;right:0;top:0;background:rgba(7,7,6,.93);backdrop-filter:blur(18px);border-bottom:1px solid var(--line2);display:flex;align-items:center;padding:0 28px 0 31px}.brand{display:flex;align-items:baseline;gap:15px;text-decoration:none;min-width:var(--rail)}.brand-word{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.15em;color:var(--paper)}.brand-sub{font-family:var(--sans);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.topnav{margin-left:auto;display:flex;align-items:center;gap:25px}.topnav a{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--muted);position:relative}.topnav a:hover,.topnav a.active{color:var(--gold2)}.topnav a.active:after{content:"";position:absolute;left:0;right:0;bottom:-12px;border-bottom:1px solid var(--gold)}.icon-btn,.mobile-menu{border:0;background:transparent;color:var(--gold2);cursor:pointer}.icon-btn{font-size:24px}.mobile-menu{display:none;font-size:22px}
.rail{position:fixed;z-index:30;top:var(--top);left:0;bottom:0;width:var(--rail);border-right:1px solid var(--line2);background:rgba(7,7,6,.78);backdrop-filter:blur(10px);padding:33px 26px 26px 31px;display:flex;flex-direction:column}.seal{font-family:var(--serif);font-size:24px;letter-spacing:.18em;color:var(--gold);white-space:nowrap}.seal span{margin:0 8px}.rail-rule{width:68px;height:1px;background:var(--gold);margin:19px 0 24px;position:relative}.rail-rule:before,.rail-rule:after{content:"";position:absolute;top:-3px;width:7px;height:7px;border:1px solid var(--gold);border-radius:50%;background:var(--bg)}.rail-rule:before{left:0}.rail-rule:after{right:0}.rail nav{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent;padding-right:6px}.rail-group{font-family:var(--sans);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:19px 0 8px}.rail a{display:block;text-decoration:none;color:var(--muted);font-family:var(--sans);font-size:11px;line-height:1.35;padding:7px 0;border-left:1px solid transparent;padding-left:10px}.rail a:hover,.rail a.active{color:var(--gold2);border-left-color:var(--gold)}.rail-footer{margin-top:auto;font-family:var(--sans);font-size:9px;letter-spacing:.18em;color:var(--dim);line-height:1.7}.rail-footer b{font-weight:500;color:var(--gold);display:block}

<script>
window.SIDUS_DATA={"docs": [{"roman": "I", "short": "Foundations", "title": "I. Foundations: Constructs, Boundaries, and Empirical Warrant", "sections": [{"id": "frontpiece", "title": "Opening", "part": null, "html": "<h1 id=\"sīdus-towards-metarepresentational-ecology\">Sīdus: Towards Metarepresentational Ecology</h1>\n<h2 id=\"i.-foundations-constructs-boundaries-and-empirical-warrant\">I. Foundations: Constructs, Boundaries, and Empirical Warrant</h2>\n<p><strong>Working research document - August 2026</strong><br />\n<strong>Status:</strong> construct-first foundation. This document proposes no theory of consciousness and does not assert that a unified metarepresentational ecology exists.</p>\n<blockquote>\n<p><strong>Truth, maximally sought. Ambition tempered by humility. Beauty tempered by goodness. Honesty above all else.</strong></p>\n</blockquote>\n<hr />\n", "plain": "Sīdus: Towards Metarepresentational Ecology\n\nI. Foundations: Constructs, Boundaries, and Empirical Warrant\n\nWorking research document - August 2026\nStatus: construct-first foundation. This document proposes no theory of consciousness and does not assert that a unified metarepresentational ecology exists.\n\n  Truth, maximally sought. Ambition tempered by humility. Beauty tempered by goodness. Honesty above all else.\n\n------------------------------------------------------------------------\n"}, {"id": "0-the-claim-in-its-strongest-defensible-form", "title": "0. The claim in its strongest defensible form", "part": null, "html": "<h2 id=\"the-claim-in-its-strongest-defensible-form\">0. The claim in its strongest defensible form</h2>\n<p>Cognition contains multiple systems that <strong>monitor, estimate, model, or regulate internal states and processes</strong>. Metacognitive confidence, source monitoring, error monitoring, cognitive control, meta-control, and self-modeling are established research domains. Some internal models may satisfy stronger criteria for <strong>metarepresentation</strong>; others may not. Evidence from metacognition already suggests a mixture of domain-specific and shared organization rather than a single universal monitor. The existence of these mechanisms does <strong>not</strong> yet establish that they form one coherent ecology, share one resource pool, obey one allocation law, or have any constitutive relation to phenomenal consciousness.</p>\n<p>The programme therefore asks a narrower question:</p>\n<blockquote>\n<p><strong>Do internal monitoring and metarepresentational systems exhibit reproducible relational principles - such as scarcity, causal-topological dependence, recursive control, fidelity constraints, complementarity or substitution - that generalize beyond a single task or architecture?</strong></p>\n</blockquote>\n<p>The word <strong>ecology</strong> is a hypothesis about organization, not an accomplished result. It earns scientific content only if multiple locally validated mechanisms interact in regular ways that support prediction, intervention, and generalization.</p>\n<hr />\n", "plain": "0. The claim in its strongest defensible form\n\nCognition contains multiple systems that monitor, estimate, model, or regulate internal states and processes. Metacognitive confidence, source monitoring, error monitoring, cognitive control, meta-control, and self-modeling are established research domains. Some internal models may satisfy stronger criteria for metarepresentation; others may not. Evidence from metacognition already suggests a mixture of domain-specific and shared organization rather than a single universal monitor. The existence of these mechanisms does not yet establish that they form one coherent ecology, share one resource pool, obey one allocation law, or have any constitutive relation to phenomenal consciousness.\n\nThe programme therefore asks a narrower question:\n\n  Do internal monitoring and metarepresentational systems exhibit reproducible relational principles - such as scarcity, causal-topological dependence, recursive control, fidelity constraints, complementarity or substitution - that generalize beyond a single task or architecture?\n\nThe word ecology is a hypothesis about organization, not an accomplished result. It earns scientific content only if multiple locally validated mechanisms interact in regular ways that support prediction, intervention, and generalization.\n\n------------------------------------------------------------------------\n"}, {"id": "1-why-move-upstream-from-consciousness", "title": "1. Why move upstream from consciousness?", "part": null, "html": "<h2 id=\"why-move-upstream-from-consciousness\">1. Why move upstream from consciousness?</h2>\n<p>The immediate motivation is methodological, not metaphysical. Consciousness science has accumulated sophisticated theories but still faces difficult disputes about how behavioural and neural measurements license claims about phenomenality. Doerig, Schurger and Herzog proposed stringent empirical criteria partly to prevent theories from insulating themselves against functionally equivalent alternatives. Their criteria have themselves been criticized for placing too much weight on functional equivalence rather than mechanistic explanation. The useful lesson is therefore not that one checklist solves consciousness science, but that a scientific construct must expose the conditions under which it would lose to a simpler or mechanistically different account. [1,2]</p>\n<p>A closely aligned methodological precedent is the <strong>construct-first approach</strong> of Fazekas, Cleeremans and Overgaard. Instead of beginning with entire theories of consciousness, they recommend decomposing theories into central constructs - including metarepresentation, recurrent processing and global workspace - and investigating their lower-level mechanisms, compatibility and combinations. [3]</p>\n<p>This package takes that move further for one construct family. It deliberately suspends the question:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtext mathvariant=\"normal\">Which mechanism constitutes phenomenality?</mtext><annotation encoding=\"application/x-tex\">\n\\text{Which mechanism constitutes phenomenality?}\n</annotation></semantics></math></p>\n<p>and instead asks:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">What internal models exist, what are they about,</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">who generates them, who uses them, and how do they interact?</mtext></mtd></mtr></mtable><annotation encoding=\"application/x-tex\">\n\\begin{array}{c}\n\\text{What internal models exist, what are they about,}\\\\[3pt]\n\\text{who generates them, who uses them, and how do they interact?}\n\\end{array}\n</annotation></semantics></math></p>\n<p>If the answers later constrain consciousness theories, that is downstream. The programme remains successful if phenomenality is never explained.</p>\n<hr />\n", "plain": "1. Why move upstream from consciousness?\n\nThe immediate motivation is methodological, not metaphysical. Consciousness science has accumulated sophisticated theories but still faces difficult disputes about how behavioural and neural measurements license claims about phenomenality. Doerig, Schurger and Herzog proposed stringent empirical criteria partly to prevent theories from insulating themselves against functionally equivalent alternatives. Their criteria have themselves been criticized for placing too much weight on functional equivalence rather than mechanistic explanation. The useful lesson is therefore not that one checklist solves consciousness science, but that a scientific construct must expose the conditions under which it would lose to a simpler or mechanistically different account. [1,2]\n\nA closely aligned methodological precedent is the construct-first approach of Fazekas, Cleeremans and Overgaard. Instead of beginning with entire theories of consciousness, they recommend decomposing theories into central constructs - including metarepresentation, recurrent processing and global workspace - and investigating their lower-level mechanisms, compatibility and combinations. [3]\n\nThis package takes that move further for one construct family. It deliberately suspends the question:\n\nWhich mechanism constitutes phenomenality?\n\nand instead asks:\n\n$$\n\\begin{array}{c}\n\\text{What internal models exist, what are they about,}\\\\[3pt]\n\\text{who generates them, who uses them, and how do they interact?}\n\\end{array}\n$$\n\nIf the answers later constrain consciousness theories, that is downstream. The programme remains successful if phenomenality is never explained.\n\n------------------------------------------------------------------------\n"}, {"id": "2-what-the-literature-permits-us-to-take-seriously", "title": "2. What the literature permits us to take seriously", "part": null, "html": "<h2 id=\"what-the-literature-permits-us-to-take-seriously\">2. What the literature permits us to take seriously</h2>\n<h3 id=\"internal-monitoring-and-metacognition-are-real-empirical-targets\">2.1 Internal monitoring and metacognition are real empirical targets</h3>\n<p>Metacognition is routinely studied as the monitoring and control of cognitive processes. Computational and neurobiological work distinguishes first-order task performance from second-order evaluations such as confidence, and identifies both common and domain-specific neural contributions. [4-7]</p>\n<p>This does <strong>not</strong> establish one metacognitive system. A major review of perception and memory found no evidence for the strongest form of domain-general metacognition, while still identifying common computational ingredients. [7] A 2026 developmental study found that confidence bias is shared across memory and perception while sensitivity and efficiency remain domain-specific; the ability to compare confidence across domains emerges developmentally. [8] That is exactly the kind of mixed architecture that makes an ecological hypothesis plausible without making it inevitable.</p>\n<h3 id=\"monitoring-need-not-equal-metarepresentation\">2.2 Monitoring need not equal metarepresentation</h3>\n<p>Proust’s process-reflexive account is an important boundary condition. A task-specific system can monitor its own feedback using quantitative cues without representing those cues <em>as mental representations</em>. Metacognition therefore does not automatically entail metarepresentation. [9]</p>\n<p>This means the programme must resist three invalid inferences:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">internal signal</mtext><mo>⇏</mo><mtext mathvariant=\"normal\">metarepresentation</mtext><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\text{internal signal} \\not\\Rightarrow \\text{metarepresentation},\n</annotation></semantics></math></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">monitoring</mtext><mo>⇏</mo><mtext mathvariant=\"normal\">metarepresentation</mtext><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\text{monitoring} \\not\\Rightarrow \\text{metarepresentation},\n</annotation></semantics></math></p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">second neural layer</mtext><mo>⇏</mo><mtext mathvariant=\"normal\">metarepresentation</mtext><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\text{second neural layer} \\not\\Rightarrow \\text{metarepresentation}.\n</annotation></semantics></math></p>\n<h3 id=\"there-are-serious-competing-definitions-of-metarepresentation\">2.3 There are serious, competing definitions of metarepresentation</h3>\n<p>The term is not settled enough to be used as if it named an obvious natural kind.</p>\n<p><strong>Content-based criterion.</strong> Shea argues that a metarepresentation must concern a <em>representational property</em> of another representation. Merely tracking the vehicle state of another neural population is insufficient; some property such as its content, correctness, truth condition, or likely error must figure in the meta-state’s correctness conditions. Shea uses this criterion to argue that reward prediction error signals can have low-level, non-conceptual metarepresentational content. [10]</p>\n<p><strong>Representational-redescription criterion.</strong> Cleeremans’ Radical Plasticity Thesis and later Self-Organizing Metarepresentational Account (SOMA) emphasize learning to redescribe first-order activity. Higher-order systems learn properties and relations of first-order representations and make knowledge that is merely <em>in</em> the system increasingly available <em>to</em> the system. [11-13]</p>\n<p><strong>Process-representation criterion.</strong> Kanai, Takatsuki and Fujisawa sharpen the computational problem in 2025. If every mapping <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>→</mo><mi>y</mi><mo>→</mo><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">x\\to y\\to z</annotation></semantics></math> makes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z</mi><annotation encoding=\"application/x-tex\">z</annotation></semantics></math> a metarepresentation of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math>, then metarepresentation becomes trivial and ubiquitous. They propose instead that a metarepresentation can represent the <strong>process that transforms input into a first-order representation</strong>, and demonstrate a proof-of-concept in artificial neural networks. [14]</p>\n<p>These views overlap but are not equivalent. The programme therefore does <strong>not</strong> legislate one philosophical definition as fact. It uses a graded operational taxonomy and asks which definitions support reproducible causal and computational distinctions.</p>\n<hr />\n", "plain": "2. What the literature permits us to take seriously\n\n2.1 Internal monitoring and metacognition are real empirical targets\n\nMetacognition is routinely studied as the monitoring and control of cognitive processes. Computational and neurobiological work distinguishes first-order task performance from second-order evaluations such as confidence, and identifies both common and domain-specific neural contributions. [4-7]\n\nThis does not establish one metacognitive system. A major review of perception and memory found no evidence for the strongest form of domain-general metacognition, while still identifying common computational ingredients. [7] A 2026 developmental study found that confidence bias is shared across memory and perception while sensitivity and efficiency remain domain-specific; the ability to compare confidence across domains emerges developmentally. [8] That is exactly the kind of mixed architecture that makes an ecological hypothesis plausible without making it inevitable.\n\n2.2 Monitoring need not equal metarepresentation\n\nProust’s process-reflexive account is an important boundary condition. A task-specific system can monitor its own feedback using quantitative cues without representing those cues as mental representations. Metacognition therefore does not automatically entail metarepresentation. [9]\n\nThis means the programme must resist three invalid inferences:\n\ninternal signal ⇏ metarepresentation,\n\nmonitoring ⇏ metarepresentation,\n\nsecond neural layer ⇏ metarepresentation.\n\n2.3 There are serious, competing definitions of metarepresentation\n\nThe term is not settled enough to be used as if it named an obvious natural kind.\n\nContent-based criterion. Shea argues that a metarepresentation must concern a representational property of another representation. Merely tracking the vehicle state of another neural population is insufficient; some property such as its content, correctness, truth condition, or likely error must figure in the meta-state’s correctness conditions. Shea uses this criterion to argue that reward prediction error signals can have low-level, non-conceptual metarepresentational content. [10]\n\nRepresentational-redescription criterion. Cleeremans’ Radical Plasticity Thesis and later Self-Organizing Metarepresentational Account (SOMA) emphasize learning to redescribe first-order activity. Higher-order systems learn properties and relations of first-order representations and make knowledge that is merely in the system increasingly available to the system. [11-13]\n\nProcess-representation criterion. Kanai, Takatsuki and Fujisawa sharpen the computational problem in 2025. If every mapping x → y → z makes z a metarepresentation of y, then metarepresentation becomes trivial and ubiquitous. They propose instead that a metarepresentation can represent the process that transforms input into a first-order representation, and demonstrate a proof-of-concept in artificial neural networks. [14]\n\nThese views overlap but are not equivalent. The programme therefore does not legislate one philosophical definition as fact. It uses a graded operational taxonomy and asks which definitions support reproducible causal and computational distinctions.\n\n------------------------------------------------------------------------\n"}, {"id": "3-construct-lexicon", "title": "3. Construct lexicon", "part": null, "html": "<h2 id=\"construct-lexicon\">3. Construct lexicon</h2>\n<p>The programme begins with typed objects rather than one undifferentiated latent space.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Symbol / term</th>\n<th>Working meaning</th>\n<th>What it is not</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>X</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">X_t</annotation></semantics></math></td>\n<td>external or bodily state relevant to a system</td>\n<td>not necessarily represented faithfully</td>\n</tr>\n<tr class=\"even\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>R</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">R_t</annotation></semantics></math></td>\n<td>first-order representation of some target <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>X</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">X_t</annotation></semantics></math></td>\n<td>not automatically conscious</td>\n</tr>\n<tr class=\"odd\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">C_t</annotation></semantics></math></td>\n<td>internal control/process state, e.g. a gate, allocator, gain regime</td>\n<td>not necessarily a representation</td>\n</tr>\n<tr class=\"even\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">S_t</annotation></semantics></math></td>\n<td>internal-state model: a state carrying information about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">C_t</annotation></semantics></math> or another internal variable</td>\n<td>not automatically a strict metarepresentation</td>\n</tr>\n<tr class=\"odd\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></td>\n<td>a computational/representational process, e.g. mapping <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>↦</mo><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">X\\mapsto R</annotation></semantics></math></td>\n<td>not a single activation state</td>\n</tr>\n<tr class=\"even\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">M_t</annotation></semantics></math></td>\n<td>candidate metarepresentation: a state about a representational property or process of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R</mi><annotation encoding=\"application/x-tex\">R</annotation></semantics></math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></td>\n<td>not defined merely by being one layer downstream</td>\n</tr>\n<tr class=\"odd\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>G</mi><annotation encoding=\"application/x-tex\">G</annotation></semantics></math></td>\n<td>generator/monitor that constructs <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S</mi><annotation encoding=\"application/x-tex\">S</annotation></semantics></math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></td>\n<td>not assumed to be one anatomical area</td>\n</tr>\n<tr class=\"even\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U</mi><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></td>\n<td>consumer that uses <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S</mi><annotation encoding=\"application/x-tex\">S</annotation></semantics></math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math> for inference, control, report or learning</td>\n<td>not necessarily a global workspace</td>\n</tr>\n<tr class=\"odd\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>T</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">T_v</annotation></semantics></math></td>\n<td>generic target variable in the abstract rate formalism; may denote an internal control state or a representational property/process depending on the experiment</td>\n<td>not a separate ontological category beyond the typed targets above</td>\n</tr>\n<tr class=\"even\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Z</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">Z_v</annotation></semantics></math></td>\n<td>generic transmitted code/message about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>T</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">T_v</annotation></semantics></math> in the abstract rate formalism</td>\n<td>not a commitment to a particular coding architecture or message alphabet</td>\n</tr>\n<tr class=\"odd\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></td>\n<td>resource/rate spent transmitting or maintaining a model</td>\n<td>not identical to information successfully conveyed</td>\n</tr>\n<tr class=\"even\">\n<td><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m</mi><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></td>\n<td>incremental information made available about the target</td>\n<td>not identical to channel cost</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"internal-state-model-versus-strict-metarepresentation\">3.1 Internal-state model versus strict metarepresentation</h3>\n<p>The earlier Sīdus package called a compressed message about an attention, memory or action-routing controller a metarepresentation. That is defensible under a <strong>minimal functional self-monitoring</strong> usage, but too permissive for a programme that wants metarepresentation itself to carry explanatory weight.</p>\n<p>We therefore separate:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>t</mi></msub><mover><mo>→</mo><mi>G</mi></mover><msub><mi>S</mi><mi>t</mi></msub></mrow><annotation encoding=\"application/x-tex\">\nC_t \\xrightarrow{G} S_t\n</annotation></semantics></math></p>\n<p>from:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mi>t</mi></msub><mrow><mspace width=\"0.333em\"></mspace><mtext mathvariant=\"normal\"> or </mtext><mspace width=\"0.333em\"></mspace></mrow><mi>F</mi><mover><mo>→</mo><mi>G</mi></mover><msub><mi>M</mi><mi>t</mi></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nR_t \\text{ or } F \\xrightarrow{G} M_t.\n</annotation></semantics></math></p>\n<p>A message such as</p>\n<blockquote>\n<p>“the sensory-selection controller currently prioritizes the left”</p>\n</blockquote>\n<p>is an <strong>internal-state model</strong> unless the target controller state is independently shown to be representational in the relevant sense.</p>\n<p>A message such as</p>\n<blockquote>\n<p>“the current visual representation is likely to be unreliable”</p>\n</blockquote>\n<p>or</p>\n<blockquote>\n<p>“the mapping currently generating this visual representation has a high-noise / biased transformation regime”</p>\n</blockquote>\n<p>is a stronger candidate metarepresentation because its target is a representational property or representational process.</p>\n<h3 id=\"metacognition\">3.2 Metacognition</h3>\n<p>Metacognition is treated as a functional family involving evaluation or control of cognition. It may be implemented by strict metarepresentations, process-reflexive cues, domain-specific monitors, domain-general confidence metrics, or mixtures of these. The programme must not define metacognition and metarepresentation as synonyms.</p>\n<h3 id=\"meta-control\">3.3 Meta-control</h3>\n<p>Meta-control concerns monitoring and regulating control strategies or parameters themselves. Contemporary reviews define it as mechanisms that monitor controlled processing and adjust underlying control parameters in response to goals and constraints. [15] The online metacognitive control of decisions (oMCD) provides a concrete computational example in which confidence and effort are used to regulate further decision processing. [16]</p>\n<p>Meta-control is therefore established neighbouring territory for any recursive Sīdus experiment.</p>\n<hr />\n", "plain": "3. Construct lexicon\n\nThe programme begins with typed objects rather than one undifferentiated latent space.\n\n  --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Symbol / term           Working meaning                                                                                                                                                   What it is not\n  ----------------------- ----------------------------------------------------------------------------------------------------------------------------------------------------------------- --------------------------------------------------------------------------\n  X_(t)                   external or bodily state relevant to a system                                                                                                                     not necessarily represented faithfully\n\n  R_(t)                   first-order representation of some target X_(t)                                                                                                                   not automatically conscious\n\n  C_(t)                   internal control/process state, e.g. a gate, allocator, gain regime                                                                                               not necessarily a representation\n\n  S_(t)                   internal-state model: a state carrying information about C_(t) or another internal variable                                                                       not automatically a strict metarepresentation\n\n  F                       a computational/representational process, e.g. mapping X ↦ R                                                                                                      not a single activation state\n\n  M_(t)                   candidate metarepresentation: a state about a representational property or process of R or F                                                                      not defined merely by being one layer downstream\n\n  G                       generator/monitor that constructs S or M                                                                                                                          not assumed to be one anatomical area\n\n  U                       consumer that uses S or M for inference, control, report or learning                                                                                              not necessarily a global workspace\n\n  T_(v)                   generic target variable in the abstract rate formalism; may denote an internal control state or a representational property/process depending on the experiment   not a separate ontological category beyond the typed targets above\n\n  Z_(v)                   generic transmitted code/message about T_(v) in the abstract rate formalism                                                                                       not a commitment to a particular coding architecture or message alphabet\n\n  r                       resource/rate spent transmitting or maintaining a model                                                                                                           not identical to information successfully conveyed\n\n  m                       incremental information made available about the target                                                                                                           not identical to channel cost\n  --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\n3.1 Internal-state model versus strict metarepresentation\n\nThe earlier Sīdus package called a compressed message about an attention, memory or action-routing controller a metarepresentation. That is defensible under a minimal functional self-monitoring usage, but too permissive for a programme that wants metarepresentation itself to carry explanatory weight.\n\nWe therefore separate:\n\n$$\nC_t \\xrightarrow{G} S_t\n$$\n\nfrom:\n\n$$\nR_t \\text{ or } F \\xrightarrow{G} M_t.\n$$\n\nA message such as\n\n  “the sensory-selection controller currently prioritizes the left”\n\nis an internal-state model unless the target controller state is independently shown to be representational in the relevant sense.\n\nA message such as\n\n  “the current visual representation is likely to be unreliable”\n\nor\n\n  “the mapping currently generating this visual representation has a high-noise / biased transformation regime”\n\nis a stronger candidate metarepresentation because its target is a representational property or representational process.\n\n3.2 Metacognition\n\nMetacognition is treated as a functional family involving evaluation or control of cognition. It may be implemented by strict metarepresentations, process-reflexive cues, domain-specific monitors, domain-general confidence metrics, or mixtures of these. The programme must not define metacognition and metarepresentation as synonyms.\n\n3.3 Meta-control\n\nMeta-control concerns monitoring and regulating control strategies or parameters themselves. Contemporary reviews define it as mechanisms that monitor controlled processing and adjust underlying control parameters in response to goals and constraints. [15] The online metacognitive control of decisions (oMCD) provides a concrete computational example in which confidence and effort are used to regulate further decision processing. [16]\n\nMeta-control is therefore established neighbouring territory for any recursive Sīdus experiment.\n\n------------------------------------------------------------------------\n"}, {"id": "4-a-graded-empirical-membership-test", "title": "4. A graded empirical membership test", "part": null, "html": "<h2 id=\"a-graded-empirical-membership-test\">4. A graded empirical membership test</h2>\n<p>Because the ontology is contested, this package uses <strong>evidence tiers</strong> rather than declaring a universal essence of metarepresentation.</p>\n<h3 id=\"tier-0---correlation-decodability\">Tier 0 - correlation / decodability</h3>\n<p>A candidate signal <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math> covaries with an internal target <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>T</mi><annotation encoding=\"application/x-tex\">T</annotation></semantics></math>, or a probe can decode <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>T</mi><annotation encoding=\"application/x-tex\">T</annotation></semantics></math> from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math>.</p>\n<p>This is weak evidence only.</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>Z</mi><mo>;</mo><mi>T</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\nI(Z;T)&gt;0\n</annotation></semantics></math></p>\n<p>can arise because both variables share a common external cause.</p>\n<h3 id=\"tier-1---conditional-representational-specificity\">Tier 1 - conditional representational specificity</h3>\n<p>The candidate carries information about an internal representational property after relevant external and publicly available information is controlled:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>M</mi><mo>;</mo><mi>ϕ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>R</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>∣</mo><mi>X</mi><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\nI(M;\\phi(R)\\mid X,\\mathcal I)&gt;0,\n</annotation></semantics></math></p>\n<p>where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>R</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\phi(R)</annotation></semantics></math> is a representational property such as source, accuracy, uncertainty, content relation, calibration, or process regime.</p>\n<p>This is an informational specificity criterion, not a universal prerequisite for every redescription account. For a bounded-consumer RR operationalization, preregister accessibility and consumer-role tests separately from absolute information; do not demand new Shannon information beyond a deterministic redescription’s complete inputs. See Document IV §7.</p>\n<h3 id=\"tier-2---decoupling-and-misrepresentation\">Tier 2 - decoupling and misrepresentation</h3>\n<p>The candidate can be wrong about its target. A confidence estimate can be high when the first-order representation is wrong; a source monitor can misattribute memory as perception; a process model can infer the wrong transformation regime.</p>\n<p>Misrepresentation matters because a signal that can never dissociate from its target may be a copy or common downstream consequence rather than a model.</p>\n<h3 id=\"tier-3---causal-dependence\">Tier 3 - causal dependence</h3>\n<p>Intervene on the target representational property or process while controlling competing causes:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>do</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>ϕ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>R</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>a</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>⇒</mo><mi>M</mi><mrow><mspace width=\"0.333em\"></mspace><mtext mathvariant=\"normal\"> changes as predicted</mtext></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\operatorname{do}(\\phi(R)=a) \\Rightarrow M\\text{ changes as predicted}.\n</annotation></semantics></math></p>\n<h3 id=\"tier-4---causal-use\">Tier 4 - causal use</h3>\n<p>Intervene selectively on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math> while preserving the first-order representation and non-target signals. A downstream consumer should change behaviour in the direction predicted by the claimed meta-level content.</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>do</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>M</mi><mo>=</mo><mi>m</mi><mi>′</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>⇒</mo><mi>U</mi><mrow><mspace width=\"0.333em\"></mspace><mtext mathvariant=\"normal\"> changes</mtext></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\operatorname{do}(M=m&#39;) \\Rightarrow U\\text{ changes},\n</annotation></semantics></math></p>\n<p>while <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R</mi><annotation encoding=\"application/x-tex\">R</annotation></semantics></math> remains approximately intact.</p>\n<p><strong>Decodability is not use.</strong> This principle is inherited from the strongest part of the earlier Sīdus package.</p>\n<h3 id=\"tier-5---generalization-role-dependence\">Tier 5 - generalization / role dependence</h3>\n<p>The relation survives changes in superficial implementation, environment and task, or follows a validated causal role under controlled role permutation. This is the point at which the programme begins to earn a law-like claim rather than a task-specific circuit description.</p>\n<hr />\n", "plain": "4. A graded empirical membership test\n\nBecause the ontology is contested, this package uses evidence tiers rather than declaring a universal essence of metarepresentation.\n\nTier 0 - correlation / decodability\n\nA candidate signal Z covaries with an internal target T, or a probe can decode T from Z.\n\nThis is weak evidence only.\n\nI(Z;T) > 0\n\ncan arise because both variables share a common external cause.\n\nTier 1 - conditional representational specificity\n\nThe candidate carries information about an internal representational property after relevant external and publicly available information is controlled:\n\nI(M;ϕ(R)∣X,ℐ) > 0,\n\nwhere ϕ(R) is a representational property such as source, accuracy, uncertainty, content relation, calibration, or process regime.\n\nThis is an informational specificity criterion, not a universal prerequisite for every redescription account. For a bounded-consumer RR operationalization, preregister accessibility and consumer-role tests separately from absolute information; do not demand new Shannon information beyond a deterministic redescription’s complete inputs. See Document IV §7.\n\nTier 2 - decoupling and misrepresentation\n\nThe candidate can be wrong about its target. A confidence estimate can be high when the first-order representation is wrong; a source monitor can misattribute memory as perception; a process model can infer the wrong transformation regime.\n\nMisrepresentation matters because a signal that can never dissociate from its target may be a copy or common downstream consequence rather than a model.\n\nTier 3 - causal dependence\n\nIntervene on the target representational property or process while controlling competing causes:\n\ndo (ϕ(R)=a) ⇒ M changes as predicted.\n\nTier 4 - causal use\n\nIntervene selectively on M while preserving the first-order representation and non-target signals. A downstream consumer should change behaviour in the direction predicted by the claimed meta-level content.\n\ndo (M=m′) ⇒ U changes,\n\nwhile R remains approximately intact.\n\nDecodability is not use. This principle is inherited from the strongest part of the earlier Sīdus package.\n\nTier 5 - generalization / role dependence\n\nThe relation survives changes in superficial implementation, environment and task, or follows a validated causal role under controlled role permutation. This is the point at which the programme begins to earn a law-like claim rather than a task-specific circuit description.\n\n------------------------------------------------------------------------\n"}, {"id": "5-what-ecology-means-here", "title": "5. What \"ecology\" means here", "part": null, "html": "<h2 id=\"what-ecology-means-here\">5. What “ecology” means here</h2>\n<p>The term is useful only if it imposes burdens that “collection of mechanisms” would not.</p>\n<p>A provisional ecological object is a <strong>dynamic typed relational graph</strong>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mi>t</mi></msub><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>𝒩</mi><mi>t</mi></msub><mo>,</mo><msub><mi>ℛ</mi><mi>t</mi></msub><mo>,</mo><msub><mi>𝐂</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\mathcal E_t=(\\mathcal N_t,\\mathcal R_t,\\mathbf C_t),\n</annotation></semantics></math></p>\n<p>where:</p>\n<ul>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>𝒩</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathcal N_t</annotation></semantics></math> contains typed targets, representations, internal-state models, metarepresentations, generators and consumers;</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ℛ</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathcal R_t</annotation></semantics></math> contains empirically validated relation types;</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>𝐂</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathbf C_t</annotation></semantics></math> contains resource constraints that may limit communication, memory, computation, energy, time or plasticity.</li>\n</ul>\n<p>The graph is <strong>not written down in advance</strong>. It is reconstructed only from locally validated edges.</p>\n<p>Candidate relation types include:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Relation</th>\n<th>Meaning</th>\n<th>Example empirical signature</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>represents / monitors</td>\n<td>one state carries specific information about an internal target</td>\n<td>conditional prediction + intervention</td>\n</tr>\n<tr class=\"even\">\n<td>controls</td>\n<td>a model alters a downstream policy or process</td>\n<td>selective perturbation changes behaviour</td>\n</tr>\n<tr class=\"odd\">\n<td>predicts</td>\n<td>one model forecasts another state/process</td>\n<td>out-of-sample prediction</td>\n</tr>\n<tr class=\"even\">\n<td>competes</td>\n<td>two models draw on a shared limited resource</td>\n<td>increasing one degrades the other under fixed capacity</td>\n</tr>\n<tr class=\"odd\">\n<td>complements</td>\n<td>one model raises the marginal utility of another</td>\n<td>positive interaction in joint benefit surface</td>\n</tr>\n<tr class=\"even\">\n<td>substitutes</td>\n<td>one model lowers the marginal utility of another</td>\n<td>negative interaction in joint benefit surface</td>\n</tr>\n<tr class=\"odd\">\n<td>recursively regulates</td>\n<td>a model of control changes future control</td>\n<td>feedback condition outperforms matched frozen-feedback condition</td>\n</tr>\n<tr class=\"even\">\n<td>persists / integrates across time</td>\n<td>value depends on temporal horizon or lag</td>\n<td>interaction with horizon, autocorrelation or delayed control</td>\n</tr>\n</tbody>\n</table>\n<p>An ecology is established only if some of these relations generalize beyond one engineered task.</p>\n<hr />\n", "plain": "5. What “ecology” means here\n\nThe term is useful only if it imposes burdens that “collection of mechanisms” would not.\n\nA provisional ecological object is a dynamic typed relational graph:\n\nℰ_(t) = (𝒩_(t),ℛ_(t),C_(t)),\n\nwhere:\n\n-   𝒩_(t) contains typed targets, representations, internal-state models, metarepresentations, generators and consumers;\n-   ℛ_(t) contains empirically validated relation types;\n-   C_(t) contains resource constraints that may limit communication, memory, computation, energy, time or plasticity.\n\nThe graph is not written down in advance. It is reconstructed only from locally validated edges.\n\nCandidate relation types include:\n\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Relation                            Meaning                                                           Example empirical signature\n  ----------------------------------- ----------------------------------------------------------------- ------------------------------------------------------------------\n  represents / monitors               one state carries specific information about an internal target   conditional prediction + intervention\n\n  controls                            a model alters a downstream policy or process                     selective perturbation changes behaviour\n\n  predicts                            one model forecasts another state/process                         out-of-sample prediction\n\n  competes                            two models draw on a shared limited resource                      increasing one degrades the other under fixed capacity\n\n  complements                         one model raises the marginal utility of another                  positive interaction in joint benefit surface\n\n  substitutes                         one model lowers the marginal utility of another                  negative interaction in joint benefit surface\n\n  recursively regulates               a model of control changes future control                         feedback condition outperforms matched frozen-feedback condition\n\n  persists / integrates across time   value depends on temporal horizon or lag                          interaction with horizon, autocorrelation or delayed control\n  ------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\nAn ecology is established only if some of these relations generalize beyond one engineered task.\n\n------------------------------------------------------------------------\n"}, {"id": "6-order-topology-and-geometry-must-remain-separate", "title": "6. Order, topology and geometry must remain separate", "part": null, "html": "<h2 id=\"order-topology-and-geometry-must-remain-separate\">6. Order, topology and geometry must remain separate</h2>\n<p>The earlier conversation repeatedly risked collapsing distinct mathematical ideas.</p>\n<h3 id=\"representational-order\">Representational order</h3>\n<p>A representation may be first-order, second-order, or recursively higher-order in virtue of what it is about. This is a <strong>logical/relational order</strong>, not a quantity of consciousness.</p>\n<h3 id=\"graph-topology\">Graph topology</h3>\n<p>A model may occupy a causal bottleneck, have many downstream dependents, or connect otherwise separated subsystems. This is a property of a <strong>network of causal relations</strong>.</p>\n<h3 id=\"representational-geometry\">Representational geometry</h3>\n<p>A population or latent representation may occupy a multidimensional embedding whose distances encode similarity or other structure. This is <strong>state-space geometry</strong>.</p>\n<p>These concepts can interact, but they are not interchangeable.</p>\n<p>This is fully compatible with Bayne, Hohwy and Owen’s rejection of a single scalar “level of consciousness”. Their argument targets global ordinal rankings of consciousness while allowing multidimensional profiles and ordering along particular dimensions. [17] Nothing in that argument prohibits relational order, graph topology, or representational geometry in a non-phenomenal theory.</p>\n<p>The programme therefore rejects language such as “higher levels of the ecology” unless the order relation is explicitly defined.</p>\n<hr />\n", "plain": "6. Order, topology and geometry must remain separate\n\nThe earlier conversation repeatedly risked collapsing distinct mathematical ideas.\n\nRepresentational order\n\nA representation may be first-order, second-order, or recursively higher-order in virtue of what it is about. This is a logical/relational order, not a quantity of consciousness.\n\nGraph topology\n\nA model may occupy a causal bottleneck, have many downstream dependents, or connect otherwise separated subsystems. This is a property of a network of causal relations.\n\nRepresentational geometry\n\nA population or latent representation may occupy a multidimensional embedding whose distances encode similarity or other structure. This is state-space geometry.\n\nThese concepts can interact, but they are not interchangeable.\n\nThis is fully compatible with Bayne, Hohwy and Owen’s rejection of a single scalar “level of consciousness”. Their argument targets global ordinal rankings of consciousness while allowing multidimensional profiles and ordering along particular dimensions. [17] Nothing in that argument prohibits relational order, graph topology, or representational geometry in a non-phenomenal theory.\n\nThe programme therefore rejects language such as “higher levels of the ecology” unless the order relation is explicitly defined.\n\n------------------------------------------------------------------------\n"}, {"id": "7-first-candidate-organizing-principles", "title": "7. First candidate organizing principles", "part": null, "html": "<h2 id=\"first-candidate-organizing-principles\">7. First candidate organizing principles</h2>\n<p>These are <strong>hypothesis families</strong>, not laws.</p>\n<h3 id=\"scarcity\">7.1 Scarcity</h3>\n<p>Internal models can be costly to transmit, maintain or make globally usable. Resource-rational analysis already studies cognition as adaptation under limited computational resources, and Expected Value of Control formalizes allocation of control according to payoff and effort. [18,19] Information theory provides mature machinery for rate-distortion and distributed coding, including the CEO problem in which multiple encoders send compressed observations of a common source to a central estimator under rate constraints. [20]</p>\n<p>The open question is not whether scarcity exists in cognition. It is whether <strong>specific internal monitoring systems compete in reproducible ways for a shared resource</strong>, and whether the allocation can be predicted from measurable properties of the monitored targets.</p>\n<h3 id=\"causal-topology\">7.2 Causal topology</h3>\n<p>The value of monitoring a state may depend not only on uncertainty but on its causal position. A state that changes the interpretation or reliability of many downstream signals may be disproportionately worth monitoring. This predicts that downstream reach, bottleneck position, persistence and number of dependents can explain monitoring value.</p>\n<p>Causal abstraction and interchange interventions provide tools for testing whether a low-level implementation really realizes a hypothesized high-level causal role. [21-23]</p>\n<h3 id=\"recursive-control\">7.3 Recursive control</h3>\n<p>A system may benefit from modelling the state of a controller or allocator because knowledge of realized control can improve future commands. This overlaps strongly with meta-control, rational metareasoning and oMCD; novelty cannot be assumed. The tractable hypothesis is whether a <em>specific</em> monitoring relation adds future-control value once immediate interpretive value is controlled.</p>\n<h3 id=\"fidelity-and-misrepresentation\">7.4 Fidelity and misrepresentation</h3>\n<p>A self-model is useful only to the extent that it tracks the relevant target at the resolution required by its consumer. High decodability does not guarantee calibrated, causally used or decision-relevant representation. Metacognitive research already documents systematic divergence between first-order performance and confidence. [4,5]</p>\n<h3 id=\"complementarity-and-substitution\">7.5 Complementarity and substitution</h3>\n<p>Two internal models may be jointly more useful than expected from their isolated effects, or one may make another redundant. This is why the earlier Sīdus shift from additive source curves to a joint benefit surface should be preserved.</p>\n<h3 id=\"temporal-niche\">7.6 Temporal niche</h3>\n<p>Targets with different update rates, persistence and future consequences may require different monitoring policies. Fast volatile processes may need high-frequency low-fidelity monitoring; slow persistent processes may justify lower-frequency richer summaries. This is a candidate law, not an established result.</p>\n<hr />\n", "plain": "7. First candidate organizing principles\n\nThese are hypothesis families, not laws.\n\n7.1 Scarcity\n\nInternal models can be costly to transmit, maintain or make globally usable. Resource-rational analysis already studies cognition as adaptation under limited computational resources, and Expected Value of Control formalizes allocation of control according to payoff and effort. [18,19] Information theory provides mature machinery for rate-distortion and distributed coding, including the CEO problem in which multiple encoders send compressed observations of a common source to a central estimator under rate constraints. [20]\n\nThe open question is not whether scarcity exists in cognition. It is whether specific internal monitoring systems compete in reproducible ways for a shared resource, and whether the allocation can be predicted from measurable properties of the monitored targets.\n\n7.2 Causal topology\n\nThe value of monitoring a state may depend not only on uncertainty but on its causal position. A state that changes the interpretation or reliability of many downstream signals may be disproportionately worth monitoring. This predicts that downstream reach, bottleneck position, persistence and number of dependents can explain monitoring value.\n\nCausal abstraction and interchange interventions provide tools for testing whether a low-level implementation really realizes a hypothesized high-level causal role. [21-23]\n\n7.3 Recursive control\n\nA system may benefit from modelling the state of a controller or allocator because knowledge of realized control can improve future commands. This overlaps strongly with meta-control, rational metareasoning and oMCD; novelty cannot be assumed. The tractable hypothesis is whether a specific monitoring relation adds future-control value once immediate interpretive value is controlled.\n\n7.4 Fidelity and misrepresentation\n\nA self-model is useful only to the extent that it tracks the relevant target at the resolution required by its consumer. High decodability does not guarantee calibrated, causally used or decision-relevant representation. Metacognitive research already documents systematic divergence between first-order performance and confidence. [4,5]\n\n7.5 Complementarity and substitution\n\nTwo internal models may be jointly more useful than expected from their isolated effects, or one may make another redundant. This is why the earlier Sīdus shift from additive source curves to a joint benefit surface should be preserved.\n\n7.6 Temporal niche\n\nTargets with different update rates, persistence and future consequences may require different monitoring policies. Fast volatile processes may need high-frequency low-fidelity monitoring; slow persistent processes may justify lower-frequency richer summaries. This is a candidate law, not an established result.\n\n------------------------------------------------------------------------\n"}, {"id": "8-the-resource-formalism-retained-from-s-dus", "title": "8. The resource formalism retained from Sīdus", "part": null, "html": "<h2 id=\"the-resource-formalism-retained-from-sīdus\">8. The resource formalism retained from Sīdus</h2>\n<p>The old Sīdus experiment contributed a useful distinction that survives the reframing.</p>\n<p>For source <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>v</mi><annotation encoding=\"application/x-tex\">v</annotation></semantics></math>, define a variational rate cost:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>Z</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>T</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"false\" form=\"postfix\">‖</mo><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>Z</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v=\n\\mathbb E\\left[\nD_{KL}\\left(q(Z_v\\mid T_v,\\mathcal I)\\Vert p(Z_v\\mid\\mathcal I)\\right)\n\\right].\n</annotation></semantics></math></p>\n<p>When sources share a budget,</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><mi>C</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\sum_v r_v\\le C.\n</annotation></semantics></math></p>\n<p>Separately define incremental information delivered about the target:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>=</mo><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>T</mi><mi>v</mi></msub><mo>;</mo><msub><mi>Z</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nm_v=I(T_v;Z_v\\mid\\mathcal I).\n</annotation></semantics></math></p>\n<p>The key distinction remains:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>≠</mo><msub><mi>m</mi><mi>v</mi></msub><mi>.</mi></mrow></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{r_v\\neq m_v.}\n</annotation></semantics></math></p>\n<p>A system can spend substantial capacity while conveying little useful information. The KL quantity is a variational rate surrogate, not exact mutual information. The target <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>T</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">T_v</annotation></semantics></math> may be an internal control state in a self-monitoring experiment or a representational property/process in a stricter metarepresentational experiment.</p>\n<p>A joint benefit surface remains the safest normative object:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>G</mi><mo>∣</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>G</mi><mo>∣</mo><mn>𝟎</mn><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\mathcal B(\\mathbf r)=\\mathbb E[G\\mid\\mathbf r]-\\mathbb E[G\\mid\\mathbf 0],\n</annotation></semantics></math></p>\n<p>with the experimental optimum</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>arg</mo><munder><mo>max</mo><mrow><mi>𝐫</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mspace width=\"0.278em\"></mspace><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><mi>C</mi></mrow></munder><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathbf r^*(C)=\\arg\\max_{\\mathbf r\\ge0,\\;\\sum_vr_v\\le C}\\mathcal B(\\mathbf r).\n</annotation></semantics></math></p>\n<p>This is an <strong>experimenter’s benchmark</strong>, not a claim that biological agents solve a global optimization problem. Critiques of resource-rational analysis correctly warn against sliding from a normative modelling device to the substantive claim that humans are resource-optimal. [24]</p>\n<hr />\n<h3 id=\"closest-classical-analogues-and-which-special-cases-are-actually-solved\">8.1 Closest classical analogues, and which special cases are actually solved</h3>\n<p><strong>[R1 · correction, August 2026 — revised after release-candidate review]</strong></p>\n<p>The rate formalism above was previously presented as generic bottleneck machinery. It has older relatives, and naming them separates what is solved from what is open. An earlier version of this section identified E1 <em>with</em> the CEO problem in its Wyner–Ziv variant. That identification was wrong in two specific ways, and the corrected version is stated here.</p>\n<p><strong>Where E1 actually sits.</strong> The consumer receives ordinary public information <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ℐ</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathcal I_t</annotation></semantics></math> before any monitoring message arrives, and the specified source encoder is itself of the form <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><msub><mi>C</mi><mi>v</mi></msub><mo>,</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">q(S_v\\mid C_v,\\mathcal I)</annotation></semantics></math>. In the default E1 architecture, then, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math> is <strong>common side information available to both encoder and consumer</strong>, not decoder-only side information. Several encoders, each with private access to one source in addition to that common information, transmit under a shared sum-rate constraint to a single consumer. That places E1 in the family</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mtext mathvariant=\"normal\">multiterminal / distributed lossy source coding with side information</mtext></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mo>+</mo><mspace width=\"0.278em\"></mspace><mtext mathvariant=\"normal\">networked estimation and control</mtext></mtd></mtr></mtable><annotation encoding=\"application/x-tex\">\n\\begin{array}{c}\n\\text{multiterminal / distributed lossy source coding with side information}\\\\[3pt]\n+\\;\\text{networked estimation and control}\n\\end{array}\n</annotation></semantics></math></p>\n<p>with CEO-, Slepian–Wolf- and Wyner–Ziv-like <em>constructed special cases</em>, rather than being identical to any one of them. Wyner–Ziv is relevant only when a special case with side information unavailable to the encoder is deliberately constructed.</p>\n<p><strong>Why not the CEO problem.</strong> The classical CEO problem is a <strong>remote-source</strong> problem: several agents observe independently corrupted versions of one common hidden source and transmit to a central estimator (Berger, Zhang &amp; Viswanathan 1996). E1 begins with several potentially <strong>distinct</strong> controller states <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mn>1</mn></msub><mo>,</mo><mi>…</mi><mo>,</mo><msub><mi>C</mi><mi>K</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_1,\\dots,C_K</annotation></semantics></math>, which need not be noisy views of a single latent variable. Particular E1 configurations can be constructed to instantiate a CEO structure; the general architecture does not.</p>\n<p><strong>What <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>u</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">u_v</annotation></semantics></math> is, and what it is not.</strong> In the <strong>single-source lossless</strong> case, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">H(C_v\\mid\\mathcal I)</annotation></semantics></math> is the natural conditional-entropy rate benchmark. Slepian–Wolf supplies the corresponding distributed lossless benchmark when correlated sources are separately encoded and jointly decoded (Slepian &amp; Wolf 1973). In a genuinely multiterminal lossless E1 special case, the relevant object is the full Slepian–Wolf rate region (conditional on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ℐ</mi><annotation encoding=\"application/x-tex\">\\mathcal I</annotation></semantics></math> when that information is shared), not a collection of independent per-source conditional entropies. Under <strong>lossy</strong> coding the operative rate depends on the distortion criterion, and the Wyner–Ziv rate-distortion function involves a minimisation over an auxiliary variable subject to a distortion constraint when side information is decoder-only (Wyner &amp; Ziv 1976). So</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mo>=</mo><mfrac><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\nu_v=\\frac{H(C_v\\mid\\mathcal I)}{H(C_v)}\n</annotation></semantics></math></p>\n<p>is a well-motivated <strong>dimensionless normalised residual-uncertainty measure</strong>. In the single-source lossless limit it can be interpreted as the minimum conditional rate <strong>normalised by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">H(C_v)</annotation></semantics></math></strong>; it is not itself a coding rate. It is not “the Wyner–Ziv rate,” and the earlier claim that it was is withdrawn.</p>\n<p><strong>How much is actually solved.</strong> Less than the earlier version implied. The general multiterminal lossy source-coding problem has been open for decades. Solved cases relevant here are narrow and specific:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Case</th>\n<th>Status</th>\n<th>Source</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Distributed <strong>lossless</strong> coding of correlated sources</td>\n<td>solved rate region</td>\n<td>Slepian &amp; Wolf (1973)</td>\n</tr>\n<tr class=\"even\">\n<td>Single-source <strong>lossy</strong> coding with correlated side information available only at the decoder</td>\n<td>solved rate-distortion function</td>\n<td>Wyner &amp; Ziv (1976)</td>\n</tr>\n<tr class=\"odd\">\n<td>Scalar quadratic-Gaussian CEO</td>\n<td>solved</td>\n<td>Oohama (1998); Prabhakaran, Tse &amp; Ramchandran (2004)</td>\n</tr>\n<tr class=\"even\">\n<td>Two-encoder quadratic-Gaussian</td>\n<td>solved</td>\n<td>Wagner, Tavildar &amp; Viswanath (2008)</td>\n</tr>\n<tr class=\"odd\">\n<td>Vector Gaussian CEO, quadratic distortion</td>\n<td>outer bound generally <strong>not</strong> tight</td>\n<td>Ekrem &amp; Ulukus (2014)</td>\n</tr>\n<tr class=\"even\">\n<td>General multiterminal lossy</td>\n<td><strong>open</strong></td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<p><strong>What this changes, and what it does not.</strong> It removes a false comfort: E1 does not inherit an analytic solution. It sits adjacent to an <strong>open</strong> problem class, which is a more defensible position than the one previously claimed, and it makes the calibration requirement sharper rather than weaker. The validation target must be a <strong>deliberately constructed solved special case</strong> — a scalar quadratic-Gaussian configuration whose optimum is known — used to check that the learned allocation recovers a known answer where one exists. A pipeline that cannot do that has not earned interpretation where no answer is known.</p>\n<p>The surviving <strong>candidate contribution [N?]</strong> is narrow: allocation over non-Gaussian, low-cardinality, agent-generated control states, with expected return as the distortion measure, where the encoders are <strong>learned rather than designed</strong>. Per C5 below, this remains a candidate contribution rather than a novelty claim until its own prior-art row has been systematically searched.</p>\n", "plain": "8. The resource formalism retained from Sīdus\n\nThe old Sīdus experiment contributed a useful distinction that survives the reframing.\n\nFor source v, define a variational rate cost:\n\nr_(v) = 𝔼[D_(KL)(q(Z_(v)∣T_(v),ℐ)‖p(Z_(v)∣ℐ))].\n\nWhen sources share a budget,\n\n∑_(v)r_(v) ≤ C.\n\nSeparately define incremental information delivered about the target:\n\nm_(v) = I(T_(v);Z_(v)∣ℐ).\n\nThe key distinction remains:\n\n$$\n\\boxed{r_v\\neq m_v.}\n$$\n\nA system can spend substantial capacity while conveying little useful information. The KL quantity is a variational rate surrogate, not exact mutual information. The target T_(v) may be an internal control state in a self-monitoring experiment or a representational property/process in a stricter metarepresentational experiment.\n\nA joint benefit surface remains the safest normative object:\n\nℬ(r) = 𝔼[G∣r] − 𝔼[G∣0],\n\nwith the experimental optimum\n\nr^(*)(C) = arg max_(r ≥ 0, ∑_(v)r_(v) ≤ C)ℬ(r).\n\nThis is an experimenter’s benchmark, not a claim that biological agents solve a global optimization problem. Critiques of resource-rational analysis correctly warn against sliding from a normative modelling device to the substantive claim that humans are resource-optimal. [24]\n\n------------------------------------------------------------------------\n\n8.1 Closest classical analogues, and which special cases are actually solved\n\n[R1 · correction, August 2026 — revised after release-candidate review]\n\nThe rate formalism above was previously presented as generic bottleneck machinery. It has older relatives, and naming them separates what is solved from what is open. An earlier version of this section identified E1 with the CEO problem in its Wyner–Ziv variant. That identification was wrong in two specific ways, and the corrected version is stated here.\n\nWhere E1 actually sits. The consumer receives ordinary public information ℐ_(t) before any monitoring message arrives, and the specified source encoder is itself of the form q(S_(v)∣C_(v),ℐ). In the default E1 architecture, then, ℐ is common side information available to both encoder and consumer, not decoder-only side information. Several encoders, each with private access to one source in addition to that common information, transmit under a shared sum-rate constraint to a single consumer. That places E1 in the family\n\n$$\n\\begin{array}{c}\n\\text{multiterminal / distributed lossy source coding with side information}\\\\[3pt]\n+\\;\\text{networked estimation and control}\n\\end{array}\n$$\n\nwith CEO-, Slepian–Wolf- and Wyner–Ziv-like constructed special cases, rather than being identical to any one of them. Wyner–Ziv is relevant only when a special case with side information unavailable to the encoder is deliberately constructed.\n\nWhy not the CEO problem. The classical CEO problem is a remote-source problem: several agents observe independently corrupted versions of one common hidden source and transmit to a central estimator (Berger, Zhang & Viswanathan 1996). E1 begins with several potentially distinct controller states C₁, …, C_(K), which need not be noisy views of a single latent variable. Particular E1 configurations can be constructed to instantiate a CEO structure; the general architecture does not.\n\nWhat u_(v) is, and what it is not. In the single-source lossless case, H(C_(v)∣ℐ) is the natural conditional-entropy rate benchmark. Slepian–Wolf supplies the corresponding distributed lossless benchmark when correlated sources are separately encoded and jointly decoded (Slepian & Wolf 1973). In
