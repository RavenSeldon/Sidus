ction that is hard, shared and factorised at once constrains <strong>total alphabet cardinality with a learned split</strong>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><munder><mo>∑</mo><mi>v</mi></munder><msub><mo>log</mo><mn>2</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">|</mo><msub><mi>𝒵</mi><mi>v</mi></msub><mo stretchy=\"true\" form=\"postfix\">|</mo></mrow><mspace width=\"0.278em\"></mspace><mo>≤</mo><mspace width=\"0.278em\"></mspace><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub><mo>,</mo></mrow><annotation encoding=\"application/x-tex\">\n\\sum_{v}\\log_2|\\mathcal Z_v|\\;\\le\\;C_{\\mathrm{meta}},\n</annotation></semantics></math></p>\n<p>with per-source cardinality drawn from a shared slot pool by a differentiable arbitration. That is the right way to build the arm. It is not a reason to build it before the phenomenon exists — anti-slop rule 8 applies to this proposal as much as to any other.</p>\n<h3 id=\"confirmatory-comparisons\">Confirmatory comparisons</h3>\n<p>At minimum compare:</p>\n<ol type=\"1\">\n<li>uniform allocation;</li>\n<li>entropy-only / inferability-only allocation;</li>\n<li>isolated causal-value predictor;</li>\n<li><strong>myopic value-of-computation prediction</strong> (Russell &amp; Wefald 1991; Hay et al. 2012) — the closest competitor drawn from an established formalism; select the eligible communication increment with greatest one-step expected net decision value, including cost and a stopping option; specify increments and budget feasibility, and keep proportional-value allocation as a separately named heuristic; see Document III, H2;</li>\n<li>joint empirical resource model;</li>\n<li>joint resource + topology features;</li>\n<li>implementation/head identity.</li>\n</ol>\n<p>Do <strong>not</strong> make attention residual <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Δ</mi><mi>A</mi></msub><annotation encoding=\"application/x-tex\">\\Delta_A</annotation></semantics></math> the centre of the thesis. Estimate generic source residuals <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Δ</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">\\Delta_v</annotation></semantics></math> if useful.</p>\n<h3 id=\"publishable-outcomes\">Publishable outcomes</h3>\n<ul>\n<li>stable scarcity law;</li>\n<li>topology improves prediction;</li>\n<li>strong source interactions invalidate additive resource models;</li>\n<li>learning repeatedly fails to discover a known normative value;</li>\n<li>allocation is path-dependent rather than law-like;</li>\n<li>no genuine trade-off exists.</li>\n</ul>\n<p>All are informative.</p>\n<hr />\n", "plain": "10. E1 - Scarcity terrarium: bounded internal-state monitoring\n\nThis is the direct descendant of the strongest old Sīdus experiment, but it no longer pretends all messages are strict metarepresentations.\n\nQuestion\n\n  When several private internal control/process states are useful to a coordinating agent but can only be exposed through a binding shared information-rate channel, what predicts the learned allocation of monitoring capacity?\n\nEnvironment\n\nUse a compact POMDP with at least three low-cardinality private internal states, for example:\n\n-   sensory-selection state;\n-   working-memory update state;\n-   action-routing/effector state.\n\nThe consumer receives ordinary public information ℐ_(t) but no direct read of these private states.\n\nEach source has a symmetric encoder:\n\nC_(v, t) → S_(v, t) → U\n\nwith a single rate constraint:\n\n∑_(v)r_(v) ≤ C_(meta).\n\nRequired measures\n\nFor each source:\n\n-   conditional uncertainty H(C_(v)∣ℐ);\n-   state entropy/cardinality;\n-   causal return sensitivity;\n-   isolated learnability;\n-   distortion-rate / benefit-rate curve;\n-   temporal persistence/update frequency;\n-   basic causal-topological measures;\n-   rate spent r_(v);\n-   incremental information delivered m_(v);\n-   targeted-channel causal-use effect.\n\nRequired controls\n\n-   direct-read oracle;\n-   no-seam/full-read control;\n-   non-binding budget control;\n-   source/head permutation across seeds;\n-   warm-up before scarcity;\n-   gradual constrained scarcity ramp;\n-   selected from-scratch scarcity runs;\n-   held-out task conditions.\n\nConstraint implementation: Arm S core, alphabet arm optional\n\n[Design addition, August 2026 — demoted after release-candidate review]\n\nAn earlier version of this section proposed a hard alphabet-cardinality budget as a mandatory second arm and made rank-order invariance across arms a confirmatory prediction. Both claims were too strong and are withdrawn. What follows is the corrected position.\n\nArm S is the core experiment. Primal-dual or augmented-Lagrangian training formulates ∑_(v)r_(v) ≤ C_(meta) as a constrained optimisation problem rather than merely attaching a fixed penalty coefficient. In a non-convex learned system, however, feasibility is an empirical property of the trained solution, not something the optimiser name guarantees. Realised constraint violation must therefore be reported and preregistered feasibility tolerances met before the run is interpreted as genuinely budget-constrained. The second epistemic question is whether the variational surrogate corresponds tightly enough to the intended information currency — and correction R2 makes that looseness measurable:\n\nr_(v) = m_(v) + Δ_(v)^(prior),   Δ_(v)^(prior) = 𝔼_(ℐ) D_(KL) (q(S_(v)∣ℐ) ‖ p(S_(v)∣ℐ)).\n\nArm S therefore requires two things to be reported alongside every allocation: realised constraint violation, and Δ_(v)^(prior) per source as a tightness diagnostic. Those reports are what license the surrogate as a rate meter; a second arm is not needed for that purpose.\n\nWhy the invariance test does not work. A KL budget and an alphabet budget are different resource currencies:\n\n𝔼[D_(KL)] ≠ log₂|𝒵|.\n\nOne constrains expected informational departure from a prior; the other constrains maximum representational capacity. A source may be granted a large alphabet and use it sparsely; another may use a small alphabet efficiently. Different allocation rankings can therefore arise under perfect optimisation and an unchanged task. So\n\nranking_(S) ≠ ranking_(H)\n\ndoes not license the conclusion that the allocation law is optimiser-dependent. The more likely reading is that allocation depends on which resource is scarce, which is interesting and is not what an invariance test claims to measure.\n\nThe alphabet arm as optional robustness. If a stable allocation phenomenon is established in Arm S, a hard-capacity arm becomes worth running as a currency-sensitivity experiment: does the ordering change when the scarce resource is capacity rather than expected information cost? Run that way, a divergence is a finding about currency dependence rather than a failed invariance check.\n\nIf it is run, the construction matters. Per-source codebooks give each source its own hard cap and abolish competition; a single shared codebook abolishes source-factorisation and with it the per-source identifiability of r_(v), m_(v) and targeted intervention, taking Gates A3 and A4 and H3 with it. The construction that is hard, shared and factorised at once constrains total alphabet cardinality with a learned split:\n\n∑_(v)log₂|𝒵_(v)| ≤ C_(meta),\n\nwith per-source cardinality drawn from a shared slot pool by a differentiable arbitration. That is the right way to build the arm. It is not a reason to build it before the phenomenon exists — anti-slop rule 8 applies to this proposal as much as to any other.\n\nConfirmatory comparisons\n\nAt minimum compare:\n\n1.  uniform allocation;\n2.  entropy-only / inferability-only allocation;\n3.  isolated causal-value predictor;\n4.  myopic value-of-computation prediction (Russell & Wefald 1991; Hay et al. 2012) — the closest competitor drawn from an established formalism; select the eligible communication increment with greatest one-step expected net decision value, including cost and a stopping option; specify increments and budget feasibility, and keep proportional-value allocation as a separately named heuristic; see Document III, H2;\n5.  joint empirical resource model;\n6.  joint resource + topology features;\n7.  implementation/head identity.\n\nDo not make attention residual Δ_(A) the centre of the thesis. Estimate generic source residuals Δ_(v) if useful.\n\nPublishable outcomes\n\n-   stable scarcity law;\n-   topology improves prediction;\n-   strong source interactions invalidate additive resource models;\n-   learning repeatedly fails to discover a known normative value;\n-   allocation is path-dependent rather than law-like;\n-   no genuine trade-off exists.\n\nAll are informative.\n\n------------------------------------------------------------------------\n"}, {"id": "11-e2-strict-metarepresentation-under-scarcity", "title": "11. E2 - Strict metarepresentation under scarcity", "part": null, "html": "<h2 id=\"e2---strict-metarepresentation-under-scarcity\">11. E2 - Strict metarepresentation under scarcity</h2>\n<p>E2 proceeds only if E0 yields a defensible operational distinction and E1 demonstrates a real shared monitoring constraint.</p>\n<h3 id=\"question\">Question</h3>\n<blockquote>\n<p><strong>When first-order representations differ in reliability, source, or generative process, does a bounded system allocate scarce rate to models of those representational properties/processes, and does the allocation improve control beyond first-order shortcuts?</strong></p>\n</blockquote>\n<h3 id=\"example\">Example</h3>\n<p>Two perceptual experts produce first-order estimates:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mrow><mn>1</mn><mo>,</mo><mi>t</mi></mrow></msub><mo>=</mo><msub><mi>F</mi><mrow><mn>1</mn><mo>,</mo><msub><mi>η</mi><mrow><mn>1</mn><mo>,</mo><mi>t</mi></mrow></msub></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>O</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>,</mo><mspace width=\"2.0em\"></mspace><msub><mi>R</mi><mrow><mn>2</mn><mo>,</mo><mi>t</mi></mrow></msub><mo>=</mo><msub><mi>F</mi><mrow><mn>2</mn><mo>,</mo><msub><mi>η</mi><mrow><mn>2</mn><mo>,</mo><mi>t</mi></mrow></msub></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>O</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nR_{1,t}=F_{1,\\eta_{1,t}}(O_t),\\qquad\nR_{2,t}=F_{2,\\eta_{2,t}}(O_t).\n</annotation></semantics></math></p>\n<p>Their hidden process regimes alter reliability. Candidate meta-generators produce:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>M</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>=</mo><msub><mi>G</mi><mi>v</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>R</mi><mrow><mi>v</mi><mo>,</mo><mo>≤</mo><mi>t</mi></mrow></msub><mo>,</mo><mtext mathvariant=\"normal\">process evidence</mtext><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\nM_{v,t}=G_v(R_{v,\\le t},\\text{process evidence})\n</annotation></semantics></math></p>\n<p>about <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>η</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><annotation encoding=\"application/x-tex\">\\eta_{v,t}</annotation></semantics></math>, source, or correctness probability.</p>\n<p>The consumer uses <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>M</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">M_v</annotation></semantics></math> to weight first-order evidence.</p>\n<h3 id=\"key-comparison\">Key comparison</h3>\n<p>Compare against:</p>\n<ul>\n<li>direct reliability cue;</li>\n<li>public-context predictor;</li>\n<li>first-order network with matched parameter count;</li>\n<li>internal-state monitor that knows a controller setting but not the representational process;</li>\n<li>meta-process model.</li>\n</ul>\n<p>E2 is where the phrase <strong>metarepresentation under scarcity</strong> becomes substantively earned rather than merely inherited.</p>\n<hr />\n", "plain": "11. E2 - Strict metarepresentation under scarcity\n\nE2 proceeds only if E0 yields a defensible operational distinction and E1 demonstrates a real shared monitoring constraint.\n\nQuestion\n\n  When first-order representations differ in reliability, source, or generative process, does a bounded system allocate scarce rate to models of those representational properties/processes, and does the allocation improve control beyond first-order shortcuts?\n\nExample\n\nTwo perceptual experts produce first-order estimates:\n\nR_(1, t) = F_(1, η_(1, t))(O_(t)),   R_(2, t) = F_(2, η_(2, t))(O_(t)).\n\nTheir hidden process regimes alter reliability. Candidate meta-generators produce:\n\nM_(v, t) = G_(v)(R_(v,  ≤ t),process evidence)\n\nabout η_(v, t), source, or correctness probability.\n\nThe consumer uses M_(v) to weight first-order evidence.\n\nKey comparison\n\nCompare against:\n\n-   direct reliability cue;\n-   public-context predictor;\n-   first-order network with matched parameter count;\n-   internal-state monitor that knows a controller setting but not the representational process;\n-   meta-process model.\n\nE2 is where the phrase metarepresentation under scarcity becomes substantively earned rather than merely inherited.\n\n------------------------------------------------------------------------\n"}, {"id": "12-e3-causal-topology-and-role-dependence", "title": "12. E3 - Causal topology and role dependence", "part": null, "html": "<h2 id=\"e3---causal-topology-and-role-dependence\">12. E3 - Causal topology and role dependence</h2>\n<p>Proceed only if E1/E2 produce a robust phenomenon.</p>\n<h3 id=\"phase-1-cheap-topology-manipulation\">Phase 1: cheap topology manipulation</h3>\n<p>Change downstream reach, bottleneck status, persistence, or branching while holding module implementation fixed where possible.</p>\n<h3 id=\"phase-2-simple-role-permutation\">Phase 2: simple role permutation</h3>\n<p>Swap functional interfaces across matched implementations. Measure whether monitoring benefit follows role or implementation.</p>\n<h3 id=\"phase-3-causal-abstraction-validation-conditional\">Phase 3: causal-abstraction validation, conditional</h3>\n<p>Only if the role claim is central and simpler validation is inadequate, construct a high-level causal model and test interchange-intervention faithfulness.</p>\n<p>A failed abstraction alignment blocks a high-level role conclusion. It does not invite a more elaborate rescue model.</p>\n<hr />\n", "plain": "12. E3 - Causal topology and role dependence\n\nProceed only if E1/E2 produce a robust phenomenon.\n\nPhase 1: cheap topology manipulation\n\nChange downstream reach, bottleneck status, persistence, or branching while holding module implementation fixed where possible.\n\nPhase 2: simple role permutation\n\nSwap functional interfaces across matched implementations. Measure whether monitoring benefit follows role or implementation.\n\nPhase 3: causal-abstraction validation, conditional\n\nOnly if the role claim is central and simpler validation is inadequate, construct a high-level causal model and test interchange-intervention faithfulness.\n\nA failed abstraction alignment blocks a high-level role conclusion. It does not invite a more elaborate rescue model.\n\n------------------------------------------------------------------------\n"}, {"id": "13-e4-recursive-allocator-monitoring", "title": "13. E4 - Recursive allocator monitoring", "part": null, "html": "<h2 id=\"e4---recursive-allocator-monitoring\">13. E4 - Recursive allocator monitoring</h2>\n<p>This retains the two-budget S1-R construction because it converts a tempting regress into a temporal causal question.</p>\n<p>Crucial terminology:</p>\n<ul>\n<li>if <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>A</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">A_t</annotation></semantics></math> is merely the realized resource-allocation/control state, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>R</mi><mi>A</mi></msub><annotation encoding=\"application/x-tex\">R_A</annotation></semantics></math> is an <strong>internal-state model</strong>;</li>\n<li>call it a strict metarepresentation only if the target is explicitly a representational property/process of the allocator.</li>\n</ul>\n<p>The primary test is feedback versus frozen feedback, not an unexplained allocator residual.</p>\n<hr />\n", "plain": "13. E4 - Recursive allocator monitoring\n\nThis retains the two-budget S1-R construction because it converts a tempting regress into a temporal causal question.\n\nCrucial terminology:\n\n-   if A_(t) is merely the realized resource-allocation/control state, R_(A) is an internal-state model;\n-   call it a strict metarepresentation only if the target is explicitly a representational property/process of the allocator.\n\nThe primary test is feedback versus frozen feedback, not an unexplained allocator residual.\n\n------------------------------------------------------------------------\n"}, {"id": "14-e5-two-validated-meta-systems-in-interaction", "title": "14. E5 - Two validated meta-systems in interaction", "part": null, "html": "<h2 id=\"e5---two-validated-meta-systems-in-interaction\">14. E5 - Two validated meta-systems in interaction</h2>\n<p>This is the first experiment that would genuinely deserve the phrase <strong>metarepresentational ecology</strong>.</p>\n<p>Use two previously validated meta-systems, for example:</p>\n<ul>\n<li>a model of perceptual reliability/source;</li>\n<li>a model of memory reliability or control allocation.</li>\n</ul>\n<p>Ask whether their joint utility is additive, complementary, substitutable, or mediated through a third control process.</p>\n<h3 id=\"minimal-criterion-for-an-ecology-level-claim\">Minimal criterion for an ecology-level claim</h3>\n<p>At least one interaction must:</p>\n<ol type=\"1\">\n<li>survive selective interventions on each component;</li>\n<li>improve held-out prediction over independent-module models;</li>\n<li>recur under a second task or architecture;</li>\n<li>not reduce to shared external input or generic confidence bias.</li>\n</ol>\n<p>Until then, use “candidate interaction” rather than “ecological law.”</p>\n<hr />\n", "plain": "14. E5 - Two validated meta-systems in interaction\n\nThis is the first experiment that would genuinely deserve the phrase metarepresentational ecology.\n\nUse two previously validated meta-systems, for example:\n\n-   a model of perceptual reliability/source;\n-   a model of memory reliability or control allocation.\n\nAsk whether their joint utility is additive, complementary, substitutable, or mediated through a third control process.\n\nMinimal criterion for an ecology-level claim\n\nAt least one interaction must:\n\n1.  survive selective interventions on each component;\n2.  improve held-out prediction over independent-module models;\n3.  recur under a second task or architecture;\n4.  not reduce to shared external input or generic confidence bias.\n\nUntil then, use “candidate interaction” rather than “ecological law.”\n\n------------------------------------------------------------------------\n"}, {"id": "15-e6-external-translations", "title": "15. E6 - External translations", "part": null, "html": "<h2 id=\"e6---external-translations\">15. E6 - External translations</h2>\n<h3 id=\"human-metacognition\">Human metacognition</h3>\n<p>Plausible targets include perception-memory confidence, source monitoring, error monitoring, and meta-control. The literature already warns against assuming strong domain generality. Human work should therefore test specific interactions and trade-offs, not merely group differences or correlations.</p>\n<h3 id=\"artificial-system-introspection\">Artificial-system introspection</h3>\n<p>The same construct discipline can test whether a model’s report about an internal state is causally faithful rather than semantically plausible. Define the internal target independently; intervene on target and report separately; vary semantic framing; preserve non-target information.</p>\n<h3 id=\"clinical-translation\">Clinical translation</h3>\n<p>This remains post-construct-validity. Hypervigilance, interoception, alexithymia or dissociation should not be redescribed as “metarepresentational ecology” unless the framework predicts a distinctive within-person interaction or trade-off that competing accounts do not.</p>\n<hr />\n", "plain": "15. E6 - External translations\n\nHuman metacognition\n\nPlausible targets include perception-memory confidence, source monitoring, error monitoring, and meta-control. The literature already warns against assuming strong domain generality. Human work should therefore test specific interactions and trade-offs, not merely group differences or correlations.\n\nArtificial-system introspection\n\nThe same construct discipline can test whether a model’s report about an internal state is causally faithful rather than semantically plausible. Define the internal target independently; intervene on target and report separately; vary semantic framing; preserve non-target information.\n\nClinical translation\n\nThis remains post-construct-validity. Hypervigilance, interoception, alexithymia or dissociation should not be redescribed as “metarepresentational ecology” unless the framework predicts a distinctive within-person interaction or trade-off that competing accounts do not.\n\n------------------------------------------------------------------------\n"}, {"id": "16-computational-tractability-map", "title": "16. Computational tractability map", "part": "PART III - WHAT CAN AND CANNOT BE COMPUTED", "html": "<h2 id=\"computational-tractability-map\">16. Computational tractability map</h2>\n<table>\n<colgroup>\n<col style=\"width: 30%\" />\n<col style=\"width: 40%\" />\n<col style=\"width: 30%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Object/question</th>\n<th style=\"text-align: right;\">Can render now?</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>private low-cardinality internal process state</td>\n<td style=\"text-align: right;\">Yes</td>\n<td>direct simulator ground truth</td>\n</tr>\n<tr class=\"even\">\n<td>internal-state model of that process</td>\n<td style=\"text-align: right;\">Yes</td>\n<td>supervised or learned encoder</td>\n</tr>\n<tr class=\"odd\">\n<td>rate spent <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>r</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">r_v</annotation></semantics></math></td>\n<td style=\"text-align: right;\">Yes</td>\n<td>variational KL control surrogate</td>\n</tr>\n<tr class=\"even\">\n<td>incremental target information <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math></td>\n<td style=\"text-align: right;\">Yes, with validation</td>\n<td>low-cardinality targets + held-out calibrated log loss</td>\n</tr>\n<tr class=\"odd\">\n<td>causal use of message</td>\n<td style=\"text-align: right;\">Yes</td>\n<td>selective message intervention, support checks</td>\n</tr>\n<tr class=\"even\">\n<td>joint benefit surface</td>\n<td style=\"text-align: right;\">Yes for small <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>K</mi><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></td>\n<td>grid/design first; surrogate only if needed</td>\n</tr>\n<tr class=\"odd\">\n<td>complementarity/substitution</td>\n<td style=\"text-align: right;\">Yes, locally</td>\n<td>factorial contrasts or uncertain surface derivatives</td>\n</tr>\n<tr class=\"even\">\n<td>hidden process/reliability regime</td>\n<td style=\"text-align: right;\">Yes</td>\n<td>known by simulator</td>\n</tr>\n<tr class=\"odd\">\n<td>process metarepresentation</td>\n<td style=\"text-align: right;\">Yes in proof-of-concept form</td>\n<td>must beat first-order/public-context controls</td>\n</tr>\n<tr class=\"even\">\n<td>topology manipulations</td>\n<td style=\"text-align: right;\">Yes in synthetic systems</td>\n<td>exact matching may be impossible</td>\n</tr>\n<tr class=\"odd\">\n<td>causal abstraction</td>\n<td style=\"text-align: right;\">Conditional</td>\n<td>high overhead; only after robust role effect</td>\n</tr>\n<tr class=\"even\">\n<td>recursive allocator feedback</td>\n<td style=\"text-align: right;\">Yes</td>\n<td>requires two budgets and temporal dynamics</td>\n</tr>\n<tr class=\"odd\">\n<td>one universal cognitive resource currency</td>\n<td style=\"text-align: right;\">No</td>\n<td>experimental single-budget model is not neural fact</td>\n</tr>\n<tr class=\"even\">\n<td>spontaneous discovery of arbitrary internal ontology</td>\n<td style=\"text-align: right;\">Not currently identifiable without strong assumptions</td>\n<td>separate long-horizon problem</td>\n</tr>\n<tr class=\"odd\">\n<td>complete brain metarepresentational ecology</td>\n<td style=\"text-align: right;\">No</td>\n<td>no current measurement/identification route</td>\n</tr>\n<tr class=\"even\">\n<td>phenomenal consciousness</td>\n<td style=\"text-align: right;\">No</td>\n<td>explicitly outside the programme</td>\n</tr>\n</tbody>\n</table>\n<hr />\n", "plain": "16. Computational tractability map\n\n  -----------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Object/question                                                                                Can render now? Notes\n  ------------------------------------------------------ ------------------------------------------------------- --------------------------------------------------------\n  private low-cardinality internal process state                                                             Yes direct simulator ground truth\n\n  internal-state model of that process                                                                       Yes supervised or learned encoder\n\n  rate spent r_(v)                                                                                           Yes variational KL control surrogate\n\n  incremental target information m_(v)                                                      Yes, with validation low-cardinality targets + held-out calibrated log loss\n\n  causal use of message                                                                                      Yes selective message intervention, support checks\n\n  joint benefit surface                                                                          Yes for small K grid/design first; surrogate only if needed\n\n  complementarity/substitution                                                                      Yes, locally factorial contrasts or uncertain surface derivatives\n\n  hidden process/reliability regime                                                                          Yes known by simulator\n\n  process metarepresentation                                                        Yes in proof-of-concept form must beat first-order/public-context controls\n\n  topology manipulations                                                                Yes in synthetic systems exact matching may be impossible\n\n  causal abstraction                                                                                 Conditional high overhead; only after robust role effect\n\n  recursive allocator feedback                                                                               Yes requires two budgets and temporal dynamics\n\n  one universal cognitive resource currency                                                                   No experimental single-budget model is not neural fact\n\n  spontaneous discovery of arbitrary internal ontology     Not currently identifiable without strong assumptions separate long-horizon problem\n\n  complete brain metarepresentational ecology                                                                 No no current measurement/identification route\n\n  phenomenal consciousness                                                                                    No explicitly outside the programme\n  -----------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\n------------------------------------------------------------------------\n"}, {"id": "17-astrocyte-optional-methods-module", "title": "17. Astrocyte: optional methods module", "part": null, "html": "<h2 id=\"astrocyte-optional-methods-module\">17. Astrocyte: optional methods module</h2>\n<p>Astrocyte remains valid <strong>only when the empirical surface is expensive enough to justify it</strong>.</p>\n<p>The scientific target is still:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>arg</mo><munder><mo>max</mo><mrow><mi>𝐫</mi><mo>∈</mo><msub><mi>𝒮</mi><mi>C</mi></msub></mrow></munder><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathbf r^*(C)=\\arg\\max_{\\mathbf r\\in\\mathcal S_C}\\mathcal B(\\mathbf r).\n</annotation></semantics></math></p>\n<p>Gaussian-process Bayesian optimization estimates that target; it does not define it.</p>\n<h3 id=\"escalation-rule\">Escalation rule</h3>\n<p>Use, in order:</p>\n<ol type=\"1\">\n<li>small factorial / simplex design;</li>\n<li>interpolation / regression with uncertainty;</li>\n<li>GP surrogate if surface smoothness is empirically defensible;</li>\n<li>noise-aware BO only when each new training configuration is genuinely expensive and active search materially reduces cost.</li>\n</ol>\n<p>Do not deploy GP curvature diagnostics or Bayesian optimization because they make the project look sophisticated.</p>\n<hr />\n", "plain": "17. Astrocyte: optional methods module\n\nAstrocyte remains valid only when the empirical surface is expensive enough to justify it.\n\nThe scientific target is still:\n\nr^(*)(C) = arg max_(r ∈ 𝒮_(C))ℬ(r).\n\nGaussian-process Bayesian optimization estimates that target; it does not define it.\n\nEscalation rule\n\nUse, in order:\n\n1.  small factorial / simplex design;\n2.  interpolation / regression with uncertainty;\n3.  GP surrogate if surface smoothness is empirically defensible;\n4.  noise-aware BO only when each new training configuration is genuinely expensive and active search materially reduces cost.\n\nDo not deploy GP curvature diagnostics or Bayesian optimization because they make the project look sophisticated.\n\n------------------------------------------------------------------------\n"}, {"id": "18-questions-that-can-actually-be-false", "title": "18. Questions that can actually be false", "part": "PART IV - FALSIFICATION AND STAGE DISCIPLINE", "html": "<h2 id=\"questions-that-can-actually-be-false\">18. Questions that can actually be false</h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Question</th>\n<th>Evidence for</th>\n<th>Evidence against</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Does a shared monitoring budget create competition?</td>\n<td>cross-source trade-offs appear only when budget binds</td>\n<td>no displacement/trade-off under validated scarcity</td>\n</tr>\n<tr class=\"even\">\n<td>Does dynamic value predict allocation?</td>\n<td>held-out rates/returns better predicted than by entropy/identity baselines</td>\n<td>no out-of-sample advantage</td>\n</tr>\n<tr class=\"odd\">\n<td>Does topology matter?</td>\n<td>controlled causal-position changes shift benefit/allocation</td>\n<td>topology adds no predictive value</td>\n</tr>\n<tr class=\"even\">\n<td>Are messages causally used?</td>\n<td>selective perturbation changes predicted behavior with first-order target intact</td>\n<td>decodable message can be removed without relevant effect</td>\n</tr>\n<tr class=\"odd\">\n<td>Is a candidate state meta rather than first-order?</td>\n<td>survives E0 conditional, decoupling and intervention controls</td>\n<td>simple first-order/public-context model explains data</td>\n</tr>\n<tr class=\"even\">\n<td>Does recursive monitoring help?</td>\n<td>feedback-vs-frozen benefit appears where lag/noise/horizon predict it</td>\n<td>no specific feedback benefit or benefit persists when feedback impossible</td>\n</tr>\n<tr class=\"odd\">\n<td>Are two meta-systems complementary/substitutable?</td>\n<td>robust interaction improves held-out prediction</td>\n<td>additive independent model suffices</td>\n</tr>\n<tr class=\"even\">\n<td>Is there an ecology-level regularity?</td>\n<td>same relational principle generalizes to second task/architecture</td>\n<td>every effect is domain/task specific</td>\n</tr>\n</tbody>\n</table>\n<hr />\n", "plain": "18. Questions that can actually be false\n\n  --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n  Question                                              Evidence for                                                                       Evidence against\n  ----------------------------------------------------- ---------------------------------------------------------------------------------- ---------------------------------------------------------------------------\n  Does a shared monitoring budget create competition?   cross-source trade-offs appear only when budget binds                              no displacement/trade-off under validated scarcity\n\n  Does dynamic value predict allocation?                held-out rates/returns better predicted than by entropy/identity baselines         no out-of-sample advantage\n\n  Does topology matter?                                 controlled causal-position changes shift benefit/allocation                        topology adds no predictive value\n\n  Are messages causally used?                           selective perturbation changes predicted behavior with first-order target intact   decodable message can be removed without relevant effect\n\n  Is a candidate state meta rather than first-order?    survives E0 conditional, decoupling and intervention controls                      simple first-order/public-context model explains data\n\n  Does recursive monitoring help?                       feedback-vs-frozen benefit appears where lag/noise/horizon predict it              no specific feedback benefit or benefit persists when feedback impossible\n\n  Are two meta-systems complementary/substitutable?     robust interaction improves held-out prediction                                    additive independent model suffices\n\n  Is there an ecology-level regularity?                 same relational principle generalizes to second task/architecture                  every effect is domain/task specific\n  --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\n------------------------------------------------------------------------\n"}, {"id": "19-global-kill-narrow-criteria", "title": "19. Global kill/narrow criteria", "part": null, "html": "<h2 id=\"global-killnarrow-criteria\">19. Global kill/narrow criteria</h2>\n<p>The programme should be narrowed or abandoned as an ecology-level project if repeated work shows that:</p>\n<ul>\n<li>strict metarepresentational constructs cannot be operationally distinguished from first-order/process-reflexive alternatives;</li>\n<li>apparent interactions vanish under conditional-information and common-cause controls;</li>\n<li>shared-resource hypotheses repeatedly fail to generate trade-offs;</li>\n<li>topological features do not generalize;</li>\n<li>candidate models are decodable but not causally used;</li>\n<li>results are dominated by optimization history or implementation identity;</li>\n<li>each domain requires an unrelated explanation and a common relational vocabulary adds no predictive compression.</li>\n</ul>\n<p>In that case the correct conclusion is not “the ecology is more complicated.”</p>\n<p>It is:</p>\n<blockquote>\n<p><strong>There may be no useful ecology-level theory. Study the domain-specific mechanisms instead.</strong></p>\n</blockquote>\n<hr />\n", "plain": "19. Global kill/narrow criteria\n\nThe programme should be narrowed or abandoned as an ecology-level project if repeated work shows that:\n\n-   strict metarepresentational constructs cannot be operationally distinguished from first-order/process-reflexive alternatives;\n-   apparent interactions vanish under conditional-information and common-cause controls;\n-   shared-resource hypotheses repeatedly fail to generate trade-offs;\n-   topological features do not generalize;\n-   candidate models are decodable but not causally used;\n-   results are dominated by optimization history or implementation identity;\n-   each domain requires an unrelated explanation and a common relational vocabulary adds no predictive compression.\n\nIn that case the correct conclusion is not “the ecology is more complicated.”\n\nIt is:\n\n  There may be no useful ecology-level theory. Study the domain-specific mechanisms instead.\n\n------------------------------------------------------------------------\n"}, {"id": "20-stage-gates", "title": "20. Stage gates", "part": null, "html": "<h2 id=\"stage-gates\">20. Stage gates</h2>\n<h3 id=\"gate-0---construct-validity\">Gate 0 - Construct validity</h3>\n<p><strong>E1 requires all E0-A gates to pass. Strict-metarepresentation experiments additionally require the relevant E0-B definition-index to pass under validated, preregistered criteria.</strong> The detailed two-stage rule is in Document IV; an E0-A monitoring result alone does not license a strict-meta claim.</p>\n<h3 id=\"gate-1---scarcity-exists\">Gate 1 - Scarcity exists</h3>\n<p><strong>Proceed beyond E1 only if the shared budget produces measurable, stable trade-offs and messages are useful.</strong></p>\n<h3 id=\"gate-2---relation-is-not-training-artifact\">Gate 2 - Relation is not training artifact</h3>\n<p><strong>Proceed to topology/recursion only if rates and causal effects survive reasonable seed/schedule/implementation controls.</strong></p>\n<h3 id=\"gate-3---local-law-exists\">Gate 3 - Local law exists</h3>\n<p><strong>Use the word “principle” only after held-out prediction and intervention succeed.</strong></p>\n<h3 id=\"gate-4---ecology-claim\">Gate 4 - Ecology claim</h3>\n<p><strong>Use the word “ecology” as an empirical result only after at least two validated monitoring/meta-systems show a reproducible interaction across more than one task or architecture.</strong></p>\n<hr />\n", "plain": "20. Stage gates\n\nGate 0 - Construct validity\n\nE1 requires all E0-A gates to pass. Strict-metarepresentation experiments additionally require the relevant E0-B definition-index to pass under validated, preregistered criteria. The detailed two-stage rule is in Document IV; an E0-A monitoring result alone does not license a strict-meta claim.\n\nGate 1 - Scarcity exists\n\nProceed beyond E1 only if the shared budget produces measurable, stable trade-offs and messages are useful.\n\nGate 2 - Relation is not training artifact\n\nProceed to topology/recursion only if rates and causal effects survive reasonable seed/schedule/implementation controls.\n\nGate 3 - Local law exists\n\nUse the word “principle” only after held-out prediction and intervention succeed.\n\nGate 4 - Ecology claim\n\nUse the word “ecology” as an empirical result only after at least two validated monitoring/meta-systems show a reproducible interaction across more than one task or architecture.\n\n------------------------------------------------------------------------\n"}, {"id": "21-immediate-sequence", "title": "21. Immediate sequence", "part": null, "html": "<h2 id=\"immediate-sequence\">21. Immediate sequence</h2>\n<p>The programme should generate code before another conceptual companion.</p>\n<ol type=\"1\">\n<li><strong>Systematic construct/prior-art review</strong>: Proust, Shea, Cleeremans/SOMA, Kanai et al., metacognition architectures, meta-control, resource-rationality, distributed communication.</li>\n<li><strong>E0 reference and evaluator</strong>: use a tractable exact-probability simulator to validate estimators and all gates, including negative controls, before calibrating pilot thresholds; only then freeze and confirm independently. E0-B comparisons remain exploratory until their distinct index-specific rules are validated.</li>\n<li><strong>E1 minimal environment</strong>: no GP, no causal abstraction, no attention residual as primary target.</li>\n<li><strong>Pilot stage gate</strong>: prove an information seam, a binding shared budget, stable informative messages, and causal use.</li>\n<li><strong>Freeze the smallest successful model.</strong> Preregister/replicate.</li>\n<li>Only then select <strong>one</strong> extension: topology, strict-meta scarcity, or recursive control.</li>\n</ol>\n<p>Not all three. A clean internal-validity audit does not establish contribution or close C5: systematic comparison with existing communication, control and metareasoning work remains an independent requirement before claiming novelty.</p>\n<hr />\n", "plain": "21. Immediate sequence\n\nThe programme should generate code before another conceptual companion.\n\n1.  Systematic construct/prior-art review: Proust, Shea, Cleeremans/SOMA, Kanai et al., metacognition architectures, meta-control, resource-rationality, distributed communication.\n2.  E0 reference and evaluator: use a tractable exact-probability simulator to validate estimators and all gates, including negative controls, before calibrating pilot thresholds; only then freeze and confirm independently. E0-B comparisons remain exploratory until their distinct index-specific rules are validated.\n3.  E1 minimal environment: no GP, no causal abstraction, no attention residual as primary target.\n4.  Pilot stage gate: prove an information seam, a binding shared budget, stable informative messages, and causal use.\n5.  Freeze the smallest successful model. Preregister/replicate.\n6.  Only then select one extension: topology, strict-meta scarcity, or recursive control.\n\nNot all three. A clean internal-validity audit does not establish contribution or close C5: systematic comparison with existing communication, control and metareasoning work remains an independent requirement before claiming novelty.\n\n------------------------------------------------------------------------\n"}, {"id": "22-what-success-would-look-like", "title": "22. What success would look like", "part": null, "html": "<h2 id=\"what-success-would-look-like\">22. What success would look like</h2>\n<p>A successful first paper need not mention consciousness or claim a new cognitive architecture.</p>\n<p>A strong result could be:</p>\n<blockquote>\n<p><strong>In a controlled modular agent, private internal process states competed for a binding information-rate channel. Learned allocation was predicted by the joint dynamic control benefit of monitoring those states, and transmitted information was causally used. A controlled change in causal position altered monitoring value in the predicted direction.</strong></p>\n</blockquote>\n<p>A stronger later result could be:</p>\n<blockquote>\n<p><strong>A separately validated metarepresentation of a first-order representational process competed with other internal models under the same constraint, and its value depended on the process’s uncertainty and causal role.</strong></p>\n</blockquote>\n<p>An ecology-level result would require more:</p>\n<blockquote>\n<p><strong>The same relational principle predicts interactions among multiple validated meta-systems across tasks or architectures.</strong></p>\n</blockquote>\n<p>The programme must earn each sentence separately.</p>\n<hr />\n<h1 id=\"references\">References</h1>\n<ol type=\"1\">\n<li><p>Fazekas, P., Cleeremans, A., &amp; Overgaard, M. (2024). A construct-first approach to consciousness science. <em>Neuroscience &amp; Biobehavioral Reviews, 156</em>, 105480. https://doi.org/10.1016/j.neubiorev.2023.105480</p></li>\n<li><p>Proust, J. (2003). Does metacognition necessarily involve metarepresentation? <em>Behavioral and Brain Sciences, 26</em>(3), 352. https://doi.org/10.1017/S0140525X0336008X</p></li>\n<li><p>Shea, N. (2014). Reward prediction error signals are meta-representational. <em>Noûs, 48</em>(2), 314-341. https://doi.org/10.1111/j.1468-0068.2012.00863.x</p></li>\n<li><p>Cleeremans, A., et al. (2020). Learning to be conscious. <em>Trends in Cognitive Sciences, 24</em>(2), 112-123. https://doi.org/10.1016/j.tics.2019.11.011</p></li>\n<li><p>Kanai, R., Takatsuki, R., &amp; Fujisawa, I. (2025). Meta-representations as representations of processes. <em>Neuroscience of Consciousness, 2025</em>(1), niaf038. https://doi.org/10.1093/nc/niaf038</p></li>\n<li><p>Fleming, S. M. (2024). Metacognition and confidence: A review and synthesis. <em>Annual Review of Psychology, 75</em>, 241-268. https://doi.org/10.1146/annurev-psych-022423-032425</p></li>\n<li><p>Mazancieux, A., et al. (2023). Towards a common conceptual space for metacognition in perception and memory. <em>Nature Reviews Psychology, 2</em>, 751-766. https://doi.org/10.1038/s44159-023-00245-1</p></li>\n<li><p>Baer, C., Ghetti, S., &amp; Odic, D. (2026). Domain generality is an emergent, not inherent, property of metacognition. <em>Nature Human Behaviour, 10</em>, 1316-1326. https://doi.org/10.1038/s41562-026-02443-2</p></li>\n<li><p>Eppinger, B., Goschke, T., &amp; Musslick, S. (2021). Meta-control: From psychology to computational neuroscience. <em>Cognitive, Affective, &amp; Behavioral Neuroscience, 21</em>, 447-452. https://doi.org/10.3758/s13415-021-00919-4</p></li>\n<li><p>Bénon, J., et al. (2024). The online metacognitive control of decisions. <em>Communications Psychology, 2</em>, 23. https://doi.org/10.1038/s44271-024-00071-y</p></li>\n<li><p>Lieder, F., &amp; Griffiths, T. L. (2020). Resource-rational analysis: Understanding human cognition as the optimal use of limited computational resources. <em>Behavioral and Brain Sciences, 43</em>, e1. https://doi.org/10.1017/S0140525X1900061X</p></li>\n<li><p>Shenhav, A., Botvinick, M. M., &amp; Cohen, J. D. (2013). The expected value of control. <em>Neuron, 79</em>(2), 217-240. https://doi.org/10.1016/j.neuron.2013.07.007</p></li>\n<li><p>Berger, T., Zhang, Z., &amp; Viswanathan, H. (1996). The CEO problem. <em>IEEE Transactions on Information Theory, 42</em>(3), 887-902. https://doi.org/10.1109/18.490552</p></li>\n<li><p>Goyal, A., et al. (2021). Coordination among neural modules through a shared global workspace. <em>ICLR 2022 / arXiv:2103.01197</em>. https://arxiv.org/abs/2103.01197</p></li>\n<li><p>Geiger, A., et al. (2025). Causal abstraction: A theoretical foundation for mechanistic interpretability. <em>Journal of Machine Learning Research, 26</em>(83), 1-64. https://www.jmlr.org/papers/v26/23-0058.html</p></li>\n<li><p>Guest, O., &amp; Martin, A. E. (2021). How computational modeling can force theory building in psychological science. <em>Perspectives on Psychological Science, 16</em>(4), 789-802. https://doi.org/10.1177/1745691620970585</p></li>\n<li><p>van Rooij, I., &amp; Baggio, G. (2021). Theory before the test: How to build high-verisimilitude explanatory theories in psychological science. <em>Perspectives on Psychological Science, 16</em>(4), 682-697. https://doi.org/10.1177/1745691620970604</p></li>\n<li><p>Foerster, J., Assael, I. A., de Freitas, N., &amp; Whiteson, S. (2016). Learning to communicate with deep multi-agent reinforcement learning. <em>NeurIPS 29</em>. https://arxiv.org/abs/1605.06676</p></li>\n<li><p>Kim, D., Moon, S., Hostallero, D., Kang, W. J., Lee, T., Son, K., &amp; Yi, Y. (2019). Learning to schedule communication in multi-agent reinforcement learning. <em>ICLR 2019</em>. https://arxiv.org/abs/1902.01554</p></li>\n<li><p>Wang, R., He, X., Yu, R., Qiu, W., An, B., &amp; Rabinovich, Z. (2020). Learning efficient multi-agent communication: An information bottleneck approach. <em>ICML 2020</em>. https://arxiv.org/abs/1911.06992</p></li>\n<li><p>Zhang, S. Q., Zhang, Q., &amp; Lin, J. (2019). Efficient communication in multi-agent reinforcement learning via variance based control. <em>NeurIPS 32</em>. https://arxiv.org/abs/1909.02682</p></li>\n<li><p>Ortega, P. A., &amp; Braun, D. A. (2013). Thermodynamics as a theory of decision-making with information-processing costs. <em>Proceedings of the Royal Society A, 469</em>(2153). https://doi.org/10.1098/rspa.2012.0683</p></li>\n<li><p>Genewein, T., Leibfried, F., Grau-Moya, J., &amp; Braun, D. A. (2015). Bounded rationality, abstraction, and hierarchical decision-making: An information-theoretic optimality principle. <em>Frontiers in Robotics and AI, 2</em>, 27. https://doi.org/10.3389/frobt.2015.00027</p></li>\n<li><p>Tishby, N., &amp; Polani, D. (2011). Information theory of decisions and actions. In <em>Perception-Action Cycle</em>. Springer.</p></li>\n<li><p>Sims, C. A. (2003). Implications of rational inattention. <em>Journal of Monetary Economics, 50</em>(3), 665-690. https://doi.org/10.1016/S0304-3932(03)00029-1</p></li>\n<li><p>Caplin, A., &amp; Dean, M. (2015). Revealed preference, rational inattention, and costly information acquisition. <em>American Economic Review, 105</em>(7), 2183-2203. https://doi.org/10.1257/aer.20140117</p></li>\n<li><p>Imer, O. C., &amp; Basar, T. (2005). Optimal estimation with limited measurements. <em>Proceedings of the 44th IEEE Conference on Decision and Control</em>, 1029-1034.</p></li>\n<li><p>Lipsa, G. M., &amp; Martins, N. C. (2011). Remote state estimation with communication costs for first-order LTI systems. <em>IEEE Transactions on Automatic Control, 56</em>(9), 2013-2025. https://doi.org/10.1109/TAC.2011.2139370</p></li>\n<li><p>Russell, S., &amp; Wefald, E. (1991). Principles of metareasoning. <em>Artificial Intelligence, 49</em>(1-3), 361-395. https://doi.org/10.1016/0004-3702(91)90015-C</p></li>\n<li><p>Hay, N., Russell, S., Tolpin, D., &amp; Shimony, S. E. (2012). Selecting computations: Theory and applications. <em>Proceedings of UAI 2012</em>, 346-355. https://arxiv.org/abs/1408.2048</p></li>\n<li><p>Slepian, D., &amp; Wolf, J. K. (1973). Noiseless coding of correlated information sources. <em>IEEE Transactions on Information Theory, 19</em>(4), 471-480. https://doi.org/10.1109/TIT.1973.1055037</p></li>\n<li><p>Wyner, A. D., &amp; Ziv, J. (1976). The rate-distortion function for source coding with side information at the decoder. <em>IEEE Transactions on Information Theory, 22</em>(1), 1-10. nt, and its value depended on the process’s uncertainty and causal role.\n\nAn ecology-level result would require more:\n\n  The same relational principle predicts interactions among multiple validated meta-systems across tasks or architectures.\n\nThe programme must earn each sentence separately.\n\n------------------------------------------------------------------------\n\nReferences\n\n1.  Fazekas, P., Cleeremans, A., & Overgaard, M. (2024). A construct-first approach to consciousness science. Neuroscience & Biobehavioral Reviews, 156, 105480. https://doi.org/10.1016/j.neubiorev.2023.105480\n\n2.  Proust, J. (2003). Does metacognition necessarily involve metarepresentation? Behavioral and Brain Sciences, 26(3), 352. https://doi.org/10.1017/S0140525X0336008X\n\n3.  Shea, N. (2014). Reward prediction error signals are meta-representational. Noûs, 48(2), 314-341. https://doi.org/10.1111/j.1468-0068.2012.00863.x\n\n4.  Cleeremans, A., et al. (2020). Learning to be conscious. Trends in Cognitive Sciences, 24(2), 112-123. https://doi.org/10.1016/j.tics.2019.11.011\n\n5.  Kanai, R., Takatsuki, R., & Fujisawa, I. (2025). Meta-representations as representations of processes. Neuroscience of Consciousness, 2025(1), niaf038. https://doi.org/10.1093/nc/niaf038\n\n6.  Fleming, S. M. (2024). Metacognition and confidence: A review and synthesis. Annual Review of Psychology, 75, 241-268. https://doi.org/10.1146/annurev-psych-022423-032425\n\n7.  Mazancieux, A., et al. (2023). Towards a common conceptual space for metacognition in perception and memory. Nature Reviews Psychology, 2, 751-766. https://doi.org/10.1038/s44159-023-00245-1\n\n8.  Baer, C., Ghetti, S., & Odic, D. (2026). Domain generality is an emergent, not inherent, property of metacognition. Nature Human Behaviour, 10, 1316-1326. https://doi.org/10.1038/s41562-026-02443-2\n\n9.  Eppinger, B., Goschke, T., & Musslick, S. (2021). Meta-control: From psychology to computational neuroscience. Cognitive, Affective, & Behav tations: Theory and applications. Proceedings of UAI 2012, 346-355. https://arxiv.org/abs/1408.2048\n\n31. Slepian, D., & Wolf, J. K. (1973). Noiseless coding of correlated information sources. IEEE Transactions on Information Theory, 19(4), 471-480. https://doi.org/10.1109/TIT.1973.1055037\n\n32. Wyner, A. D., & Ziv, J. (1976). The rate-distortion function for source coding with side information at the decoder. IEEE Transactions on Information Theory, 22(1), 1-10. https://doi.org/10.1109/TIT.1976.1055508\n\n33. Gao, X., Akyol, E., & Başar, T. (2018). Optimal communication scheduling and remote estimation over an additive noise channel. Automatica, 88, 57-69. https://doi.org/10.1016/j.automatica.2017.10.010\n\n34. Tanaka, T., Kim, K.-K. K., Parrilo, P. A., & Mitter, S. K. (2017). Semidefinite programming approach to Gaussian sequential rate-distortion trade-offs. IEEE Transactions on Automatic Control, 62(4), 1896-1910. https://doi.org/10.1109/TAC.2016.2601148\n\n35. Stavrou, P. A., Skoglund, M., & Tanaka, T. (2022). Sequential source coding for stochastic systems subject to finite rate constraints. IEEE Transactions on Automatic Control, 67(8), 3822-3835. https://doi.org/10.1109/TAC.2021.3110430\n\n36. Feldman, H., & Friston, K. J. (2010). Attention, uncertainty, and free-energy. Frontiers in Human Neuroscience, 4, 215. https://doi.org/10.3389/fnhum.2010.00215\n\n37. Kahneman, D. (1973). Attention and Effort. Prentice-Hall.\n\n38. Ma, W. J., Husain, M., & Bays, P. M. (2014). Changing concepts of working memory. Nature Neuroscience, 17(3), 347-356. https://doi.org/10.1038/nn.3655\n"}], "sourceMd": "source/02_Research_Programme.md", "sourcePdf": "source/02_Research_Programme.pdf"}, {"roman": "III", "short": "Tractable Horizon", "title": "III. Master's Research: The Tractable Horizon", "sections": [{"id": "frontpiece", "title": "Opening", "part": null, "html": "<h1 id=\"sīdus-towards-metarepresentational-ecology\">Sīdus: Towards Metarepresentational Ecology</h1>\n<h2 id=\"iii.-masters-research-the-tractable-horizon\">III. Master’s Research: The Tractable Horizon</h2>\n<p><strong>University-agnostic Master’s scoping note - revised September 2026</strong></p>\n<p><strong>Status:</strong> a Master’s-scale research plan, not the full Sīdus programme.</p>\n<blockquote>\n<p><strong>The Master’s thesis should test one candidate organizing principle. It should not attempt to establish a metarepresentational ecology.</strong></p>\n</blockquote>\n<hr />\n", "plain": "Sīdus: Towards Metarepresentational Ecology\n\nIII. Master’s Research: The Tractable Horizon\n\nUniversity-agnostic Master’s scoping note - revised September 2026\n\nStatus: a Master’s-scale research plan, not the full Sīdus programme.\n\n  The Master’s thesis should test one candidate organizing principle. It should not attempt to establish a metarepresentational ecology.\n\n------------------------------------------------------------------------\n"}, {"id": "0-programme-and-supervision-fit", "title": "0. Programme and supervision fit", "part": null, "html": "<h2 id=\"programme-and-supervision-fit\">0. Programme and supervision fit</h2>\n<p>This project can be proposed within an AI, cognitive science, computational neuroscience or related research programme that supports a substantial computational thesis. Its scientific premises do not depend on a university, named specialisation, admissions route or planned start year.</p>\n<p>The implementation requires artificial agents, partial observability, learned representations, information constraints, causal interventions and probabilistic model comparison. Suitable supervision combines experience building such systems with scrutiny of construct validity, identifiability and competing explanations.</p>\n<blockquote>\n<p><strong>Implementation fit:</strong> probabilistic machine learning, reinforcement learning and artificial cognitive systems.</p>\n<p><strong>Formal/adversarial fit:</strong> computational cognitive science, information theory, control and scientific modelling.</p>\n</blockquote>\n<p>These are selection criteria, not claims about any institution’s offerings or supervision availability. Confirm local prerequisites, thesis scope, compute access and supervisory support before committing; the core experiment remains the same.</p>\n<hr />\n", "plain": "0. Programme and supervision fit\n\nThis project can be proposed within an AI, cognitive science, computational neuroscience or related research programme that supports a substantial computational thesis. Its scientific premises do not depend on a university, named specialisation, admissions route or planned start year.\n\nThe implementation requires artificial agents, partial observability, learned representations, information constraints, causal interventions and probabilistic model comparison. Suitable supervision combines experience building such systems with scrutiny of construct validity, identifiability and competing explanations.\n\n  Implementation fit: probabilistic machine learning, reinforcement learning and artificial cognitive systems.\n\n  Formal/adversarial fit: computational cognitive science, information theory, control and scientific modelling.\n\nThese are selection criteria, not claims about any institution’s offerings or supervision availability. Confirm local prerequisites, thesis scope, compute access and supervisory support before committing; the core experiment remains the same.\n\n------------------------------------------------------------------------\n"}, {"id": "1-the-master-s-project", "title": "1. The Master's project", "part": null, "html": "<h2 id=\"the-masters-project\">1. The Master’s project</h2>\n<h3 id=\"working-title\">Working title</h3>\n<p><strong>Internal-State Monitoring Under Scarcity: Causal and Information-Theoretic Tests of Learned Resource Allocation</strong></p>\n<h3 id=\"one-sentence-question\">One-sentence question</h3>\n<blockquote>\n<p><strong>When several private internal control states are useful to a coordinating agent but can only be exposed through a genuinely binding shared information-rate channel, what predicts which states the agent learns to communicate, at what rate, and whether those messages are causally used?</strong></p>\n</blockquote>\n<p>This is the <strong>E1 Scarcity Terrarium</strong> from the research programme.</p>\n<p>It intentionally does <strong>not</strong> ask:</p>\n<ul>\n<li>whether the agent is conscious;</li>\n<li>whether all internal-state messages are strict metarepresentations;</li>\n<li>whether human cognition has one global self-monitoring budget;</li>\n<li>whether a metarepresentational ecology exists;</li>\n<li>whether attention is uniquely privileged.</li>\n</ul>\n<p>It tests one possible organizing pressure - <strong>scarcity</strong> - in a substrate where ground truth and interventions are available.</p>\n<hr />\n", "plain": "1. The Master’s project\n\nWorking title\n\nInternal-State Monitoring Under Scarcity: Causal and Information-Theoretic Tests of Learned Resource Allocation\n\nOne-sentence question\n\n  When several private internal control states are useful to a coordinating agent but can only be exposed through a genuinely binding shared information-rate channel, what predicts which states the agent learns to communicate, at what rate, and whether those messages are causally used?\n\nThis is the E1 Scarcity Terrarium from the research programme.\n\nIt intentionally does not ask:\n\n-   whether the agent is conscious;\n-   whether all internal-state messages are strict metarepresentations;\n-   whether human cognition has one global self-monitoring budget;\n-   whether a metarepresentational ecology exists;\n-   whether attention is uniquely privileged.\n\nIt tests one possible organizing pressure - scarcity - in a substrate where ground truth and interventions are available.\n\n------------------------------------------------------------------------\n"}, {"id": "2-why-this-is-the-right-tractable-horizon", "title": "2. Why this is the right tractable horizon", "part": null, "html": "<h2 id=\"why-this-is-the-right-tractable-horizon\">2. Why this is the right tractable horizon</h2>\n<p>The full programme contains at least four difficult scientific problems:</p>\n<ol type=\"1\">\n<li>defining genuine metarepresentation rather than generic internal monitoring;</li>\n<li>discovering whether monitoring systems share resources;</li>\n<li>identifying causal-topological relations among them;</li>\n<li>determining whether any of these principles generalize to biological cognition.</li>\n</ol>\n<p>A Master’s cannot solve all four without becoming a manifesto rather than a thesis.</p>\n<p>The chosen project has a better risk profile:</p>\n<ul>\n<li><strong>internal states are known by construction;</strong></li>\n<li><strong>privacy/access can be controlled;</strong></li>\n<li><strong>scarcity can be manipulated rather than inferred;</strong></li>\n<li><strong>rate and incremental information can be estimated;</strong></li>\n<li><strong>messages can be selectively perturbed;</strong></li>\n<li><strong>negative results remain interpretable;</strong></li>\n<li><strong>no phenomenality measurement problem is imported.</strong></li>\n</ul>\n<p>The thesis is therefore useful even if the larger ecology hypothesis is wrong.</p>\n<hr />\n", "plain": "2. Why this is the right tractable horizon\n\nThe full programme contains at least four difficult scientific problems:\n\n1.  defining genuine metarepresentation rather than generic internal monitoring;\n2.  discovering whether monitoring systems share resources;\n3.  identifying causal-topological relations among them;\n4.  determining whether any of these principles generalize to biological cognition.\n\nA Master’s cannot solve all four without becoming a manifesto rather than a thesis.\n\nThe chosen project has a better risk profile:\n\n-   internal states are known by construction;\n-   privacy/access can be controlled;\n-   scarcity can be manipulated rather than inferred;\n-   rate and incremental information can be estimated;\n-   messages can be selectively perturbed;\n-   negative results remain interpretable;\n-   no phenomenality measurement problem is imported.\n\nThe thesis is therefore useful even if the larger ecology hypothesis is wrong.\n\n------------------------------------------------------------------------\n"}, {"id": "3-thesis-architecture", "title": "3. Thesis architecture", "part": null, "html": "<h2 id=\"thesis-architecture\">3. Thesis architecture</h2>\n<p>Use a compact partially observed control environment with at least three low-cardinality private states:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mrow><mn>1</mn><mo>,</mo><mi>t</mi></mrow></msub><mo>,</mo><msub><mi>C</mi><mrow><mn>2</mn><mo>,</mo><mi>t</mi></mrow></msub><mo>,</mo><msub><mi>C</mi><mrow><mn>3</mn><mo>,</mo><mi>t</mi></mrow></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nC_{1,t},C_{2,t},C_{3,t}.\n</annotation></semantics></math></p>\n<p>Candidate functions can include:</p>\n<ul>\n<li>sensory selection / fidelity allocation;</li>\n<li>working-memory update/protection;</li>\n<li>action routing or effector selection.</li>\n</ul>\n<p>Each state is generated within a local controller. A coordinating policy <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U</mi><annotation encoding=\"application/x-tex\">U</annotation></semantics></math> receives ordinary information <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ℐ</mi><mi>t</mi></msub><annotation encoding=\"application/x-tex\">\\mathcal I_t</annotation></semantics></math> but cannot directly inspect the private states.</p>\n<p>A source-specific encoder may send a compressed internal-state message:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>→</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>→</mo><mi>U</mi><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nC_{v,t}\\rightarrow S_{v,t}\\rightarrow U.\n</annotation></semantics></math></p>\n<p>All sources share a total information-rate constraint:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><munderover><mo>∑</mo><mrow><mi>v</mi><mo>=</mo><mn>1</mn></mrow><mi>K</mi></munderover><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><msub><mi>C</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi></mrow></msub><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\sum_{v=1}^{K} r_v\\le C_{\\mathrm{meta}}.\n</annotation></semantics></math></p>\n<p>The experimenter supplies the candidate source set; the learned agent determines how much rate each source receives. This is <strong>endogenous allocation</strong>, not spontaneous ontology discovery.</p>\n<hr />\n", "plain": "3. Thesis architecture\n\nUse a compact partially observed control environment with at least three low-cardinality private states:\n\nC_(1, t), C_(2, t), C_(3, t).\n\nCandidate functions can include:\n\n-   sensory selection / fidelity allocation;\n-   working-memory update/protection;\n-   action routing or effector selection.\n\nEach state is generated within a local controller. A coordinating policy U receives ordinary information ℐ_(t) but cannot directly inspect the private states.\n\nA source-specific encoder may send a compressed internal-state message:\n\nC_(v, t) → S_(v, t) → U.\n\nAll sources share a total information-rate constraint:\n\n$$\n\\sum_{v=1}^{K} r_v\\le C_{\\mathrm{meta}}.\n$$\n\nThe experimenter supplies the candidate source set; the learned agent determines how much rate each source receives. This is endogenous allocation, not spontaneous ontology discovery.\n\n------------------------------------------------------------------------\n"}, {"id": "4-core-quantities", "title": "4. Core quantities", "part": null, "html": "<h2 id=\"core-quantities\">4. Core quantities</h2>\n<h3 id=\"residual-uncertainty\">4.1 Residual uncertainty</h3>\n<p>Before receiving the special message, how hidden is the state from ordinary coordinator information?</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>t</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mrow><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></mfrac><mo>,</mo><mspace width=\"2.0em\"></mspace><mi>H</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>&gt;</mo><mn>0</mn><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nu_v(t)=\n\\frac{H(C_{v,t}\\mid\\mathcal I_t)}{H(C_{v,t})},\n\\qquad H(C_{v,t})&gt;0.\n</annotation></semantics></math></p>\n<p>If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>u</mi><mi>v</mi></msub><mo>≈</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">u_v\\approx0</annotation></semantics></math>, the special message has little informational problem to solve.</p>\n<h3 id=\"causal-control-relevance\">4.2 Causal control relevance</h3>\n<p>For small valid state corruption probability <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>δ</mi><annotation encoding=\"application/x-tex\">\\delta</annotation></semantics></math>:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>c</mi><mi>v</mi></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>δ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><msub><mi>p</mi><mi>v</mi></msub><mo>=</mo><mn>0</mn><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><msub><mi>p</mi><mi>v</mi></msub><mo>=</mo><mi>δ</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mrow><mi>δ</mi></mfrac><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nc_v(\\delta)=\n\\frac{\\mathbb E[J\\mid p_v=0]-\\mathbb E[J\\mid p_v=\\delta]}{\\delta}.\n</annotation></semantics></math></p>\n<p>Use reachable/on-support alternative states rather than arbitrary invalid corruptions.</p>\n<h3 id=\"learnability\">4.3 Learnability</h3>\n<p>Estimate how quickly the source can be learned under a dedicated, non-scarce channel. Keep this outside the competitive bottleneck so allocation does not contaminate the covariate used to explain allocation.</p>\n<h3 id=\"compressibility\">4.4 Compressibility</h3>\n<p>Estimate an empirical distortion-rate or benefit-rate curve for each source. Easy to learn and easy to compress are distinct.</p>\n<h3 id=\"rate-spent\">4.5 Rate spent</h3>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>,</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"false\" form=\"postfix\">‖</mo><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nr_v=\n\\mathbb E\\left[\nD_{KL}\\left(q(S_{v,t}\\mid C_{v,t},\\mathcal I_t)\n\\Vert\np(S_{v,t}\\mid\\mathcal I_t)\\right)\n\\right].\n</annotation></semantics></math></p>\n<p>Treat this as a variational rate-control surrogate.</p>\n<p><strong>[R2 · correction, revised]</strong> The rate–information gap is an identity, not an assumption: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>=</mo><msub><mi>m</mi><mi>v</mi></msub><mo>+</mo><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup></mrow><annotation encoding=\"application/x-tex\">r_v=m_v+\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math>, where the mismatch term is an <strong>expectation over the conditioning variable</strong>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><mo>=</mo><msub><mi>𝔼</mi><mi>ℐ</mi></msub><mspace width=\"0.167em\"></mspace><msub><mi>D</mi><mrow><mi>K</mi><mi>L</mi></mrow></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"false\" form=\"postfix\">‖</mo><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>S</mi><mi>v</mi></msub><mo>∣</mo><mi>ℐ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≥</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}=\\mathbb E_{\\mathcal I}\\,D_{KL}(q(S_v\\mid\\mathcal I)\\Vert p(S_v\\mid\\mathcal I))\\ge0</annotation></semantics></math>. Report <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msubsup><mi>Δ</mi><mi>v</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi></mrow></msubsup><annotation encoding=\"application/x-tex\">\\Delta_v^{\\mathrm{prior}}</annotation></semantics></math> as a measured quantity alongside <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>r</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">r_v</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>m</mi><mi>v</mi></msub><annotation encoding=\"application/x-tex\">m_v</annotation></semantics></math>. See Document IV, §3.3a.</p>\n<h3 id=\"information-delivered\">4.6 Information delivered</h3>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>v</mi></msub><mo>=</mo><mi>I</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>C</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>;</mo><msub><mi>S</mi><mrow><mi>v</mi><mo>,</mo><mi>t</mi></mrow></msub><mo>∣</mo><msub><mi>ℐ</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\nm_v=I(C_{v,t};S_{v,t}\\mid\\mathcal I_t).\n</annotation></semantics></math></p>\n<p>The central distinction remains:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><menclose notation=\"box\"><mrow><msub><mi>r</mi><mi>v</mi></msub><mo>≠</mo><msub><mi>m</mi><mi>v</mi></msub><mi>.</mi></mrow></menclose><annotation encoding=\"application/x-tex\">\n\\boxed{r_v\\neq m_v.}\n</annotation></semantics></math></p>\n<h3 id=\"joint-benefit-surface\">4.7 Joint benefit surface</h3>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>−</mo><mi>𝔼</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mi>J</mi><mo>∣</mo><mn>𝟎</mn><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathcal B(\\mathbf r)\n=\n\\mathbb E[J\\mid\\mathbf r]-\\mathbb E[J\\mid\\mathbf 0].\n</annotation></semantics></math></p>\n<p>The normative experimental benchmark is:</p>\n<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>𝐫</mi><mo>*</mo></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>arg</mo><munder><mo>max</mo><mrow><mi>𝐫</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mspace width=\"0.278em\"></mspace><munder><mo>∑</mo><mi>v</mi></munder><msub><mi>r</mi><mi>v</mi></msub><mo>≤</mo><mi>C</mi></mrow></munder><mi>ℬ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>𝐫</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>.</mi></mrow><annotation encoding=\"application/x-tex\">\n\\mathbf r^*(C)\n=\n\\arg\\max_{\\mathbf r\\ge0,\\;\\sum_vr_v\\le C}\n\\mathcal B(\\mathbf r).\n</annotation></semantics></math></p>\n<p>Do not interpret this as a claim that the learned agent explicitly solves the argmax.</p>\n<hr />\n", "plain": "4. Core quantities\n\n4.1 Residual uncertainty\n\nBefore receiving the special message, how hidden is the state from ordinary coordinator information?\n\n$$\nu_v(t)=\n\\frac{H(C_{v,t}\\mid\\mathcal I_t)}{H(C_{v,t})},\n\\qquad H(C_{v,t})>0.\n$$\n\nIf u_(v) ≈ 0, the special message has little informational problem to solve.\n\n4.2 Causal control relevance\n\nFor small valid state corruption probability δ:\n\n$$\nc_v(\\delta)=\n\\frac{\\mathbb E[J\\mid p_v=0]-\\mathbb E[J\\mid p_v=\\delta]}{\\delta}.\n$$\n\nUse reachable/on-support alternative states rather than arbitrary invalid corruptions.\n\n4.3 Learnability\n\nEstimate how quickly the source can be learned under a dedicated, non-scarce channel. Keep this outside the competitive bottleneck so allocation does not contaminate the covariate used to explain allocation.\n\n4.4 Compressibility\n\nEstimate an empirical distortion-rate or benefit-rate curve for each source. Easy to learn and easy to compress are distinct.\n\n4.5 Rate spent\n\nr_(v) = 𝔼[D_(KL)(q(S_(v, t)∣C_(v, t),ℐ_(t))‖p(S_(v, t)∣ℐ_(t)))].\n\nTreat this as a variational rate-control surrogate.\n\n[R2 · correction, revised] The rate–information gap is an identity, not an assumption: r_(v) = m_(v) + Δ_(v)^(prior), where the mismatch term is an expectation over the conditioning variable, Δ_(v)^(prior) = 𝔼_(ℐ) D_(KL)(q(S_(v)∣ℐ)‖p(S_(v)∣ℐ)) ≥ 0. Report Δ_(v)^(prior) as a measured quantity alongside r_(v) and m_(v). See Document IV, §3.3a.\n\n4.6 Information delivered\n\nm_(v) = I(C_(v, t);S_(v, t)∣ℐ_(t)).\n\nThe central distinction remains:\n\n$$\n\\boxed{r_v\\neq m_v.}\n$$\n\n4.7 Joint benefit surface\n\nℬ(r) = 𝔼[J∣r] − 𝔼[J∣0].\n\nThe normative experimental benchmark is:\n\nr^(*)(C) = arg max_(r ≥
